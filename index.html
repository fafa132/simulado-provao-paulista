cil","nota":"","obs":""},{"id":"2023d2-20","n":20,"area":"Matemática","disc":"Matemática","assunto":"Geometria plana – área do hexágono regular","titulo":"Teia de aranha hexagonal: número de amarrações para 2,55 cm²","gab":"E","base":null,"imgs":[{"src":"img/2023d2/q20_1.webp","w":783,"h":1428}],"alt":{"A":"60.","B":"70.","C":"45.","D":"84.","E":"54."},"res":"Ideia-chave: cada volta de 6 amarrações forma um hexágono regular, e a área da teia é a área do hexágono mais externo.\n1) A figura tem 6 raios com ângulos iguais: 360°/6 = 60°. Cada amarração liga pontos de dois raios vizinhos à mesma distância r do centro. Ela forma com o centro um triângulo isósceles com 60° no vértice, ou seja, um triângulo equilátero. Então o lado do hexágono é igual a r.\n2) Área do hexágono de lado r:\nA = 6 × (r²√3/4) = (3√3/2) r² = 1,5 × 1,7 × r² = 2,55 r².\n3) Converta a área: 2,55 cm² = 2,55 × 100 mm² = 255 mm².\n4) 2,55 r² = 255 → r² = 100 → r = 10 mm.\n5) As voltas ficam a 2, 3, 4, ..., 10 mm do centro: são 10 − 2 + 1 = 9 hexágonos.\n6) Total: 9 × 6 = 54 amarrações.\nResposta: alternativa E.","pq":{"A":"60 = 10 × 6 aparece se você confundir r = 10 mm com 10 voltas, como se elas começassem a 1 mm do centro. A primeira volta está a 2 mm, então são só 9 voltas (2, 3, ..., 10).","B":"Cada volta completa tem exatamente 6 amarrações, uma entre cada par de raios vizinhos. Por isso o total precisa ser múltiplo de 6, e 70 não é.","C":"45 = 9 × 5 aparece se você acertar as 9 voltas mas contar só 5 amarrações por volta. São 6 raios, logo 6 amarrações por volta, e 45 nem é múltiplo de 6.","D":"84 = 14 × 6 seriam 14 voltas, de 2 a 15 mm. Nesse caso a área seria 2,55 × 15² = 573,75 mm² ≈ 5,74 cm², mais que o dobro dos 2,55 cm² pedidos.","E":"Correta. A área de 255 mm² = 2,55 r² dá r = 10 mm. As voltas de 2 a 10 mm são 9 hexágonos, e 9 × 6 = 54 amarrações."},"dica":"Hexágono regular = 6 triângulos equiláteros (área 3√3 × L²/2). Lembre que 1 cm² = 100 mm² e que de 2 a 10 há 10 − 2 + 1 = 9 termos.","dif":"difícil","nota":"","obs":""},{"id":"2023d2-21","n":21,"area":"Ciências Humanas","disc":"Geografia","assunto":"Cartografia e geotecnologias – imagens de satélite","titulo":"FakeGeo: imagens de satélite falsas geradas por Inteligência Artificial","gab":"C","base":null,"imgs":[{"src":"img/2023d2/q21_1.webp","w":781,"h":1044}],"alt":{"A":"disseminam a geolocalização dos elementos naturais que são preservados pela ação antrópica.","B":"impulsionam a criatividade das sociedades para cartografar uma bacia hidrográfica de um país em um outro local.","C":"propagam dados falsos com modificações das formas do relevo, do curso do rio ou mesmo construções urbanas.","D":"instrumentalizam a liberdade dos usuários para que possam representar o espaço geográfico, segundo suas próprias opiniões.","E":"difundem informações imprecisas sobre os elementos da natureza para representar a homogeneidade dos lugares."},"res":"Ideia-chave: o texto apresenta a FakeGeo como um **problema**. Segundo ele, a FakeGeo consiste na \"geração de imagens falsas de satélites por Inteligência Artificial, que alteram os elementos físicos e humanos que compõem uma determinada paisagem\".\nA alternativa C traduz exatamente isso. \"Dados falsos\" corresponde às imagens falsas, e os exemplos cobrem os dois tipos de elemento citados: o relevo e o curso do rio são elementos físicos; as construções urbanas são elementos humanos.\nA preocupação se justifica porque imagens de satélite costumam ser tratadas como registro confiável da realidade, usadas em mapas, planejamento e notícias. Uma paisagem adulterada engana quem depende dessas informações.\nAs demais alternativas tratam a falsificação como algo positivo (criatividade, liberdade), inventam uma finalidade que o texto não traz ou deixam de fora os elementos humanos.","pq":{"A":"Não fala de falsificação. \"Disseminar a geolocalização\" de áreas preservadas seria divulgar informação verdadeira, e o texto nem menciona elementos \"preservados pela ação antrópica\".","B":"Transforma o problema em vantagem (\"impulsionam a criatividade\"). Mostrar a bacia hidrográfica de um país em outro lugar é justamente a falsificação que preocupa os pesquisadores.","C":"Correta. Resume o texto: são dados falsos que alteram elementos físicos (relevo, rio) e humanos (construções urbanas) da paisagem.","D":"Apresenta a falsificação como exercício de \"liberdade\" e de \"opinião\". Uma imagem de satélite deveria registrar a realidade, não opiniões, e o texto chama a FakeGeo de \"problema\".","E":"Acerta em \"informações imprecisas\", mas fala só dos \"elementos da natureza\", e o texto inclui também os elementos humanos. Além disso, inventa uma finalidade (\"representar a homogeneidade dos lugares\") que não aparece no texto."},"dica":"Em questões de texto curto, a alternativa certa costuma parafrasear o próprio texto. Desconfie das que transformam um \"problema\" em vantagem.","dif":"fácil","nota":"","obs":""},{"id":"2023d2-22","n":22,"area":"Ciências Humanas","disc":"Geografia","assunto":"Biomas brasileiros – cobertura vegetal de São Paulo","titulo":"Gráfico da cobertura vegetal de SP (1971–2020): identificar os biomas 1 e 2","gab":"B","base":null,"imgs":[{"src":"img/2023d2/q22_1.webp","w":783,"h":1194}],"alt":{"A":"às Pradarias e à Mata Atlântica.","B":"ao Cerrado e à Mata Atlântica.","C":"ao Cerrado e às Pradarias.","D":"às Restingas e à Floresta Tropical.","E":"às Pradarias e à Mata das Araucárias."},"res":"Ideia-chave: os dois biomas do estado de São Paulo são a Mata Atlântica, que cobria a maior parte do território, e o Cerrado, presente em manchas no interior. Basta associar cada linha a um deles pelo tamanho e pela tendência.\nLinha 2 (contínua): tem a maior área. Cai um pouco até 1990/92 (3.045.189 ha) e depois cresce, passando de 3.311.010 ha (1971/73) para 5.431.220 ha (2020). Isso combina com a Mata Atlântica, maior bioma do estado, que vem tendo áreas regeneradas e protegidas.\nLinha 1 (pontilhada): área bem menor e queda forte. Passa de 1.082.640 ha para 202.056 ha em 2000, uma perda de cerca de 80%, e depois sobe pouco (239.312 ha em 2020). É o retrato do Cerrado paulista, em grande parte convertido em lavouras (como a cana-de-açúcar), pastagens e silvicultura.\nAs outras opções citam formações que não ocorrem em São Paulo (Pradarias), um termo genérico (Floresta Tropical) ou ecossistemas que fazem parte do domínio da Mata Atlântica (Restingas, Mata das Araucárias).\nResposta: B.","pq":{"A":"Acerta a linha 2, mas erra a linha 1. Pradarias (os campos do Pampa) são típicas do extremo sul do Brasil, não de São Paulo. A linha 1 é o Cerrado.","B":"Correta. A linha 1 mostra o forte desmatamento do Cerrado paulista. A linha 2 mostra a maior cobertura do estado e a recuperação da Mata Atlântica.","C":"Acerta a linha 1, mas erra a linha 2. Pradarias não são um bioma de São Paulo e não poderiam somar mais de 5 milhões de hectares no estado.","D":"Restingas ocupam só uma faixa estreita do litoral e fazem parte do domínio da Mata Atlântica, não são um dos dois biomas do estado. \"Floresta Tropical\" é um termo genérico, não o nome do bioma.","E":"Não há Pradarias em São Paulo. A Mata das Araucárias aparece no estado só em manchas restritas, como em Campos do Jordão, na Serra da Mantiqueira, e não chegaria a 5,4 milhões de ha."},"dica":"Os biomas de SP são a Mata Atlântica (a maior, hoje em recuperação) e o Cerrado (menor e muito desmatado pela expansão agropecuária no interior).","dif":"média","nota":"","obs":""},{"id":"2023d2-23","n":23,"area":"Ciências Humanas","disc":"Geografia","assunto":"Meio técnico-científico-informacional e sociedade do conhecimento","titulo":"ChatGPT e a sociedade do conhecimento: meio técnico-científico-informacional","gab":"D","base":null,"imgs":[{"src":"img/2023d2/q23_1.webp","w":781,"h":1220}],"alt":{"A":"da desorganização espacial, que ocorre desde a Revolução Industrial, que provocou a diminuição dos processos de produção e circulação de mercadorias.","B":"da garantia da plena igualdade de acesso aos bens e serviços tecnológicos, que culminou com investimentos em pesquisa, ciência e inovação em escala mundial.","C":"das transformações causadas pela inteligência artificial, que ocorre desde a primeira Revolução Industrial, que provocou a compressão da relação espaço-tempo.","D":"da transição da sociedade industrial para a sociedade do conhecimento, que ocorre desde a década de 1970, que impactou na evolução do meio técnico científico informacional.","E":"das mudanças decorrentes no meio técnico, que implicaram na valorização do conhecimento tecnológico e desvalorização do conhecimento científico."},"res":"Ideia-chave: o texto trata de uma tecnologia de inteligência artificial (o ChatGPT, citado no título da fonte) que \"abre uma fronteira de novas aplicações\" e permite que pessoas \"conversem com computadores e outros dispositivos eletrônicos como se estivessem falando com humanos\". Isso é produto da sociedade da informação, ou do conhecimento.\nA partir da década de 1970, com a Terceira Revolução Industrial (técnico-científica), a microeletrônica, a informática e as telecomunicações passaram a mover a economia. Informação e conhecimento tornaram-se fatores centrais de produção.\nO geógrafo Milton Santos chamou o espaço resultante desse processo de **meio técnico-científico-informacional**: um território em que ciência, técnica e informação estão incorporadas. A IA conversacional é um desdobramento recente desse processo, e por isso a alternativa D é a que melhor explica a condição atual.\nAs demais alternativas erram a cronologia (IA desde a 1ª Revolução Industrial), invertem fatos (diminuição da produção, desvalorização da ciência) ou idealizam a realidade (plena igualdade de acesso).","pq":{"A":"A Revolução Industrial **aumentou** a produção e a circulação de mercadorias, não as diminuiu. \"Desorganização espacial\" também não explica a tecnologia descrita no texto.","B":"Não existe \"plena igualdade de acesso\" à tecnologia: há desigualdade digital entre países e grupos sociais. A alternativa ainda inverte a lógica, como se a igualdade tivesse gerado os investimentos em pesquisa.","C":"É um anacronismo. A primeira Revolução Industrial (século XVIII) foi movida a carvão e máquina a vapor. A inteligência artificial é muito posterior e depende da informática.","D":"Correta. A passagem para a sociedade do conhecimento, a partir dos anos 1970, e a consolidação do meio técnico-científico-informacional explicam tecnologias como o ChatGPT.","E":"No meio técnico-científico-informacional, ciência e técnica andam juntas. O ChatGPT é fruto de pesquisa científica, então não há \"desvalorização do conhecimento científico\"."},"dica":"Informática, telecomunicações e ciência aplicada à produção formam o meio técnico-científico-informacional (Milton Santos), ligado à Terceira Revolução Industrial a partir dos anos 1970.","dif":"média","nota":"","obs":""},{"id":"2023d2-24","n":24,"area":"Ciências Humanas","disc":"Geografia","assunto":"Globalização – redes de empresas transnacionais e futebol","titulo":"City Football Group: rede global de clubes e globalização do futebol","gab":"E","base":null,"imgs":[{"src":"img/2023d2/q24_1.webp","w":783,"h":1914}],"alt":{"A":"valoriza a produção e a distribuição da riqueza gerada por grupos financeiros nos espaços nacionais, que permitem a participação democrática dos torcedores nas decisões esportivas dos clubes.","B":"assegura a apropriação igualitária do espaço esportivo mundial ao ser administrado por corporações transnacionais, que passam a atuar na defesa do interesse coletivo e na promoção de políticas públicas nos países onde operam.","C":"proporciona grandes operações de créditos nos países em desenvolvimento ao atuar no sistema financeiro mundial, que contribuem para valorizar os clubes menores e fortalecer a circulação de atletas dentro do mesmo continente.","D":"impulsiona o desenvolvimento dos países de industrialização tardia ao incluir grupos financeiros e investidores individuais nas operações das bolsas de valores, que possibilita atrair créditos internacionais aos clubes.","E":"assume uma nova forma de organização ao ser operado por grupos financeiros e indivíduos, que compram clubes e estabelecem estratégias de gestão centralizadas a partir de uma rede internacional de investimentos."},"res":"Ideia-chave: o mapa mostra uma **rede** de clubes nas Américas, Europa, Ásia e Oceania, todos administrados por uma única empresa, o City Football Group. É o futebol organizado como negócio global.\nA rede começa com o Manchester City (2008) e se expande sem parar: Estados Unidos (2013), Japão e Austrália (2014), Espanha (2017), Índia e China (2019), Uruguai, França e Bélgica (2020), Bolívia (2021), Itália (2022) e Brasil (2023). Países ricos e países em desenvolvimento ficam ligados à mesma estrutura de comando.\nIsso é globalização: o capital financeiro atravessa fronteiras, compra ativos (os clubes) e os administra em rede, com estratégias definidas pelo grupo controlador. É o que afirma a alternativa E, quando diz que o futebol passa a ser \"operado por grupos financeiros e indivíduos, que compram clubes e estabelecem estratégias de gestão centralizadas a partir de uma rede internacional de investimentos\".\nAs demais alternativas idealizam a globalização (democracia, igualdade, interesse coletivo) ou atribuem a ela efeitos que o mapa não mostra.","pq":{"A":"Quando um grupo financeiro compra um clube, as decisões se concentram no controlador. Isso reduz a influência dos torcedores, em vez de criar \"participação democrática\", e o lucro vai para o grupo em vez de ser distribuído nos espaços nacionais.","B":"Corporações transnacionais buscam lucro, não a \"defesa do interesse coletivo\". \"Políticas públicas\" são papel do Estado, e uma rede comandada por um único grupo é o oposto de \"apropriação igualitária\".","C":"O mapa inclui vários países desenvolvidos (Inglaterra, Estados Unidos, Japão, Austrália, França, Itália), então não se trata de crédito para países em desenvolvimento. Além disso, a rede é intercontinental, não voltada à circulação \"dentro do mesmo continente\".","D":"Comprar um clube não \"impulsiona o desenvolvimento\" de um país, e o mapa não diz nada sobre bolsas de valores. Além disso, vários países da rede, como Inglaterra, Bélgica e França, foram pioneiros da industrialização, não de industrialização tardia.","E":"Correta. Um grupo financeiro compra clubes em vários continentes e os administra de forma centralizada, em rede, que é a lógica do capital globalizado."},"dica":"Em questões de globalização, desconfie de alternativas que prometem igualdade, democracia ou interesse coletivo. O padrão é a concentração de capital e uma gestão em rede comandada de um centro.","dif":"média","nota":"","obs":""},{"id":"2023d2-25","n":25,"area":"Ciências Humanas","disc":"Geografia","assunto":"Agropecuária, alimentação e mudanças climáticas","titulo":"Relatório do IPCC: dietas de baixa emissão e alimentos locais","gab":"E","base":null,"imgs":[{"src":"img/2023d2/q25_1.webp","w":781,"h":1513}],"alt":{"A":"a implementação de políticas agrícolas que favorecem o uso de defensivos químicos amplia as práticas de manejo voltadas à biodiversidade de espécies polinizadoras.","B":"a produção de carne bovina em áreas de pastagens reduz as emissões do gás metano associadas ao processo digestivo dos animais.","C":"a substituição de sistemas agrícolas monocultores pelo agronegócio amplia a disponibilidade de alimentos dos países subdesenvolvidos e promove a erradicação da fome.","D":"a adoção dos mecanismos de compostagem e beneficiamento de grãos reduz o desperdício de alimentos de origem agrícola comercializados no mercado nacional.","E":"o consumo de alimentos produzidos localmente e da estação reduz as emissões de combustíveis fósseis associadas ao transporte e à armazenagem refrigerada."},"res":"Ideia-chave: o trecho do IPCC liga a dieta à redução das emissões de gases de efeito estufa. O que conta é como o alimento é produzido e quanto carbono ele \"carrega\" até chegar ao prato.\n\nO relatório elogia dietas com alimentos de base vegetal e alimentos de origem animal produzidos \"de forma sustentável e com baixa emissão de gases de efeito estufa\", que ajudam na \"mitigação dos riscos das mudanças climáticas\".\n\nA alternativa E traz um argumento exatamente nessa linha. Alimentos produzidos localmente percorrem distâncias menores, então menos caminhões, navios e aviões queimam diesel e querosene. Por serem da estação, também não precisam ficar muito tempo em câmaras frigoríficas, que gastam muita energia. Queimar menos combustível fóssil significa lançar menos CO₂ na atmosfera, que é a \"baixa emissão\" defendida pelos cientistas.\n\nAs outras alternativas contradizem a ideia de sustentabilidade (agrotóxicos, pecuária bovina, monocultura) ou tratam de outro assunto (desperdício), sem relação com uma dieta de baixa emissão.","pq":{"A":"Errada. Os defensivos químicos (agrotóxicos) matam abelhas e outros polinizadores. Políticas que estimulam o seu uso reduzem a biodiversidade, em vez de ampliar práticas que a protegem.","B":"Errada. O metano vem da fermentação no sistema digestivo do boi e é liberado esteja o animal no pasto ou não. A criação em pastagens não reduz essa emissão e ainda costuma depender do desmatamento para abrir pasto.","C":"Errada. O agronegócio se baseia justamente em monoculturas, voltadas sobretudo à exportação, então \"trocar monocultura por agronegócio\" não faz sentido. Além disso, a fome é principalmente um problema de acesso e distribuição dos alimentos, e a alternativa nem fala de emissões.","D":"Errada. A compostagem trata o resíduo depois que o alimento já foi descartado, ou seja, não evita o desperdício. E o argumento fala de perdas no mercado, não da composição da dieta nem das emissões de gases de efeito estufa, que são o foco do relatório.","E":"Correta. Consumir alimentos locais e da estação diminui a queima de combustíveis fósseis no transporte e na refrigeração e, com isso, reduz as emissões. Isso reforça a defesa de uma dieta de baixa emissão."},"dica":"Em questões sobre clima e alimentação, procure a alternativa que reduz as emissões de gases de efeito estufa sem agredir o ambiente: comida local, da estação e que depende menos de transporte e refrigeração.","dif":"fácil","nota":"","obs":""},{"id":"2023d2-26","n":26,"area":"Ciências Humanas","disc":"Geografia","assunto":"Desertificação no Sahel","titulo":"Muralha Verde na África: causa e consequência","gab":"C","base":null,"imgs":[{"src":"img/2023d2/q26_1.webp","w":783,"h":1590}],"alt":{"A":"a restrição do avanço do deserto do Kalahari e a ampliação das áreas úmidas ao agronegócio nas comunidades locais.","B":"a redução do avanço do deserto do Saara e a geração de empregos no setor secundário das comunidades locais.","C":"a limitação do avanço do deserto do Saara e ampliação das áreas agricultáveis nas comunidades locais.","D":"a dilatação do avanço do Sahel e a transformação climática produzida pelo plantio de árvores nas comunidades locais.","E":"a contenção do avanço do Sahel e a reversão da fertilidade dos solos nas comunidades locais."},"res":"Ideia-chave: a Muralha Verde é uma faixa de vegetação plantada no Sahel, logo ao sul do Saara, para frear a desertificação.\n\nNo mapa, a faixa verde cruza o continente de oeste a leste, do Senegal e da Mauritânia até o Djibouti, passando por Mali, Burkina Faso, Níger, Nigéria, Chade, Sudão e Etiópia. Essa é a região do Sahel, uma área semiárida de transição entre o deserto do Saara, ao norte, e as savanas, ao sul.\n\nCausa: o Saara avança sobre o Sahel (desertificação), num processo agravado por secas, desmatamento e excesso de pastoreio. As árvores e a vegetação funcionam como barreira: seguram o solo, diminuem a erosão causada pelo vento e retêm umidade. Assim, limitam o avanço do deserto.\n\nConsequência: com o solo recuperado, aumentam as áreas que as comunidades locais, que vivem principalmente da agricultura e do pastoreio, podem cultivar.\n\nPor isso, a correta é a C: limitar o avanço do Saara e ampliar as áreas agricultáveis.","pq":{"A":"Errada. O Kalahari fica no sul da África (Botsuana e Namíbia), longe da faixa do mapa, que está ao sul do Saara. Além disso, o projeto quer recuperar terras para as comunidades locais, não criar \"áreas úmidas\" para o agronegócio.","B":"Errada. A causa está certa (o avanço do Saara), mas a consequência não. O setor secundário é a indústria, e o ganho principal da Muralha Verde está no setor primário, com a recuperação de terras para agricultura e pastoreio.","C":"Correta. A causa é conter o avanço do deserto do Saara sobre o Sahel. A consequência é a recuperação dos solos, que amplia as áreas agricultáveis das comunidades locais.","D":"Errada. O projeto quer frear a desertificação, não \"dilatar\" (aumentar) nada. O Sahel é a faixa onde a muralha é plantada, isto é, a região a ser protegida, e não o deserto que avança. E o efeito esperado é recuperar solos, não transformar o clima.","E":"Errada. É uma pegadinha de nome: o Sahel não é o deserto que avança, e sim a faixa semiárida ameaçada pelo Saara, onde a muralha é plantada. Além disso, \"reversão da fertilidade\" daria a ideia de desfazer a fertilidade, quando o objetivo é recuperá-la."},"dica":"Saara é o deserto que avança; Sahel é a faixa semiárida ao sul dele, onde fica a Muralha Verde; Kalahari é um deserto do sul da África.","dif":"fácil","nota":"","obs":""},{"id":"2023d2-27","n":27,"area":"Ciências Humanas","disc":"Geografia","assunto":"Transição demográfica e envelhecimento populacional","titulo":"Tuíte do IBGE sobre cuidadores de idosos e envelhecimento","gab":"A","base":null,"imgs":[{"src":"img/2023d2/q27_1.webp","w":781,"h":1963}],"alt":{"A":"à transformação da pirâmide etária, marcada pela redução das taxas de fecundidade e natalidade com a elevação do percentual de pessoas idosas.","B":"ao engajamento dos jovens na realização de trabalho voluntário, em virtude da estagnação da população economicamente ativa (PEA).","C":"ao processo de aceleração do crescimento vegetativo e absoluto, representado pelo aumento do envelhecimento da população.","D":"à demanda do trabalho informal doméstico, em decorrência da elevação da razão de dependência dos jovens e dos idosos.","E":"à geração da explosão demográfica, em virtude da ampliação do porcentual da faixa etária de jovens e o aumento do tempo médio de vida no país."},"res":"Ideia-chave: se mais gente cuida de idosos, é porque a população está envelhecendo, um efeito da transição demográfica.\n\nSegundo o tuíte, as pessoas de 14 anos ou mais que cuidavam de moradores de 60 anos ou mais passaram de \"4,5 milhões\" (8,8%) em 2019 para \"5,3 milhões\" (11,6%) em 2022. Se há mais pessoas cuidando de idosos em casa, é porque há mais idosos nos domicílios.\n\nPor que isso acontece? O Brasil passa por uma transição demográfica. Nas últimas décadas, a taxa de fecundidade (filhos por mulher) e a de natalidade caíram bastante, enquanto a expectativa de vida aumentou.\n\nCom isso, a base da pirâmide etária (crianças e jovens) fica mais estreita e o topo (idosos) fica mais largo. Ou seja, cresce o percentual de idosos na população.\n\nÉ exatamente o que diz a alternativa A: uma transformação da pirâmide etária, com queda da fecundidade e da natalidade e aumento do percentual de pessoas idosas.","pq":{"A":"Correta. Queda da fecundidade e da natalidade somada ao aumento da expectativa de vida dá uma pirâmide com topo mais largo. Com mais idosos, há mais pessoas cuidando deles.","B":"Errada. O tuíte fala de cuidados prestados a moradores do mesmo domicílio (cuidado familiar), não de trabalho voluntário, e não destaca os jovens. Nada no gráfico indica estagnação da PEA.","C":"Errada. O envelhecimento da população vem junto com a desaceleração do crescimento vegetativo, porque nascem menos pessoas. Não há aceleração.","D":"Errada. O cuidado do gráfico é feito por moradores da mesma casa e não é trabalho doméstico informal remunerado. Além disso, a razão de dependência dos jovens está caindo, por causa da queda da natalidade; quem cresce é a dos idosos.","E":"Errada. Explosão demográfica é um crescimento populacional acelerado, com natalidade alta e população jovem, o oposto do que ocorre no Brasil. O percentual de jovens está diminuindo; só o aumento do tempo médio de vida está certo."},"dica":"Menos nascimentos e vida mais longa resultam em envelhecimento: a pirâmide etária fica com base estreita e topo largo, e o crescimento vegetativo cai.","dif":"fácil","nota":"","obs":""},{"id":"2023d2-28","n":28,"area":"Ciências Humanas","disc":"História","assunto":"Antiguidade Tardia – fim do Império Romano do Ocidente","titulo":"Antiguidade Tardia e a queda de Roma em 476","gab":"D","base":null,"imgs":[{"src":"img/2023d2/q28_1.webp","w":783,"h":1304}],"alt":{"A":"a ruína do Império Romano, ocorrida a partir de 476 d.C, esteve associada à rápida e acentuada decadência do Império Bizantino.","B":"o Império Romano, ao longo do século V, prosseguiu na conquista de territórios e escravizados, o que gerou ameaças às suas instituições políticas.","C":"os povos bárbaros, por se encontrarem em um estágio de civilização primitivo, não tiveram papel relevante nesse processo.","D":"o período medieval foi marcado por trocas culturais entre a cultura romana e a dos chamados povos bárbaros.","E":"as migrações e invasões de povos bárbaros resultaram em um processo de trocas culturais que enfraqueceu e fez desaparecer a cultura romana."},"res":"Ideia-chave: o autor defende a noção de Antiguidade Tardia, que vê o fim do Império Romano do Ocidente como transformação e mistura, e não como ruptura total.\n\nSegundo o texto, a instalação dos bárbaros deve ser entendida \"menos em termos de fim do mundo romano do que de um rearranjo de forças\". Esse rearranjo levou à constituição de \"um mundo ainda marcado pela influência da românia, mas profundamente original\".\n\nO autor reforça a ideia ao dizer que a deposição de Rômulo Augusto, em 476, \"não pôs fim à influência que as tradições romanas exerciam sobre aquela região\".\n\nOu seja, o mundo que surgiu, o medieval, manteve heranças romanas, como o latim, o direito e o cristianismo, e as combinou com elementos dos povos germânicos. O resultado foi algo novo, nascido de trocas culturais, que é o que afirma a alternativa D.","pq":{"A":"Errada. O Império Bizantino (Império Romano do Oriente) não entrou em rápida decadência em 476: durou quase mil anos, até a tomada de Constantinopla em 1453. O que caiu em 476 foi o Império do Ocidente.","B":"Errada. No século V, o Império do Ocidente estava em crise e perdia territórios para os reinos bárbaros. A fase das grandes conquistas tinha acabado havia muito tempo, e o fim das conquistas reduziu a oferta de escravizados.","C":"Errada. É uma visão preconceituosa e contrária ao texto: a instalação dos bárbaros é justamente o centro do \"rearranjo de forças\" que formou o novo mundo ocidental.","D":"Correta. O texto mostra que a influência romana continuou e se somou a algo \"profundamente original\", fruto do encontro com os povos bárbaros. Isso são trocas culturais.","E":"Errada, e é a pegadinha da questão. Começa bem (trocas culturais), mas conclui que a cultura romana desapareceu, o oposto do texto, que afirma que 476 \"não pôs fim à influência que as tradições romanas exerciam\"."},"dica":"Antiguidade Tardia quer dizer transição, não ruptura: o mundo medieval nasce da fusão entre heranças romanas e germânicas.","dif":"média","nota":"","obs":""},{"id":"2023d2-29","n":29,"area":"Ciências Humanas","disc":"História","assunto":"Migrações internas no Brasil","titulo":"Migração para São Paulo (1940-1960) segundo Paulo Fontes","gab":"B","base":null,"imgs":[{"src":"img/2023d2/q29_1.webp","w":781,"h":1451}],"alt":{"A":"aconteceu num período de decrescente industrialização e urbanização paulistas.","B":"ocorreu baseada em decisões racionais em busca de oportunidades de trabalho e laços de apoio.","C":"se fundamentou em imagens enganosas e incentivada pela fuga da seca e dos coronéis.","D":"deu origem ao grande contingente de populações sem-teto que hoje se encontram principalmente na capital paulista.","E":"deu origem ao grande contingente de populações sem-teto que hoje se encontram principalmente na capital paulista."},"res":"Ideia-chave: o texto desmonta o estereótipo do migrante que parte às cegas e mostra uma migração planejada e apoiada em redes.\n\nO autor afirma que a imagem da migração como \"um movimento desordenado, “irracional”, feito às pressas, não corresponde à experiência de grande parte dos migrantes\". Pelo contrário, a mudança era \"meticulosamente preparada tanto no âmbito familiar quanto no da comunidade\".\n\nO que orientava a decisão? \"Informações sobre São Paulo, suas oportunidades de emprego e possibilidades de moradia\" e \"uma rede de comunicação entre os migrantes e seus locais de origem\", com cartas, fotos e cartões-postais.\n\nPortanto, a migração se baseou em decisões racionais (planejamento e informação), buscou trabalho e se apoiou em laços de família, comunidade e conterrâneos. É a alternativa B.\n\nContexto: entre 1940 e 1960, São Paulo passava por forte industrialização e urbanização, o que atraía trabalhadores, sobretudo do Nordeste.","pq":{"A":"Errada. Entre 1940 e 1960, a industrialização e a urbanização paulistas cresciam com força (era Vargas, Plano de Metas de JK, chegada da indústria automobilística). Era essa expansão que gerava as \"oportunidades de emprego\" citadas no texto.","B":"Correta. O texto descreve uma migração \"meticulosamente preparada\", guiada por informações sobre emprego e por redes de comunicação com a família e a comunidade.","C":"Errada. O texto contesta a ideia de migração “irracional” e não fala em imagens enganosas: cartas e fotos aparecem como fonte de informação. Seca e coronéis nem são mencionados, porque o foco é o planejamento, não a fuga.","D":"Errada. O texto não trata da população sem-teto atual, e ligar diretamente a migração de 1940-1960 aos sem-teto de hoje é uma generalização sem base. Aliás, o texto mostra que os migrantes buscavam informações sobre \"possibilidades de moradia\".","E":"Errada pelo mesmo motivo da D (o texto é idêntico no caderno). É uma generalização que o texto não sustenta e que reforça o estereótipo do migrante como \"problema\", justamente o que o autor critica."},"dica":"Quando o texto começa negando uma \"imagem\" ou um estereótipo, a resposta certa costuma ser a visão que o autor coloca no lugar dela.","dif":"fácil","nota":"","obs":""},{"id":"2023d2-30","n":30,"area":"Ciências Humanas","disc":"História","assunto":"Crise do Império – movimento republicano","titulo":"Convenção de Itu (1873) e o republicanismo paulista","gab":"C","base":null,"imgs":[{"src":"img/2023d2/q30_1.webp","w":783,"h":1370}],"alt":{"A":"um movimento para aqueles que queriam ser reconhecidos como republicanos para manifestarem a sua intenção de fortalecer o Império.","B":"a inauguração do Museu Republicano de Itu e o tombamento de seu acervo de documentos e cultura material.","C":"um evento que defendia uma nova composição de poder político, com a participação de republicanos, cafeicultores do Oeste paulista e profissionais liberais.","D":"uma manifestação popular nesta cidade, no interior paulista, para comemorar a sua emancipação política.","E":"um encontro entre os membros do Partido Republicano Paulista, que havia sido fundado no contexto da Constituição de 1824."},"res":"Ideia-chave: a Convenção de Itu, em 1873, marcou a fundação do Partido Republicano Paulista (PRP). Ela reuniu a elite cafeeira do Oeste paulista e profissionais liberais em defesa da República.\n\nO relato de José Vasconcellos descreve um sobrado \"completamente cheio de republicanos e de curiosos\" e um \"livro de presença para os que fossem republicanos ou quisessem batizar-se como tais\". Trata-se, portanto, de um ato político de adesão ao republicanismo.\n\nContexto: os cafeicultores do Oeste paulista tinham cada vez mais peso econômico, mas pouca influência num Império centralizado, controlado pelo imperador e pelas elites tradicionais. Por isso defendiam a República e o federalismo, que daria mais autonomia às províncias.\n\nJunto com advogados, jornalistas e outros profissionais liberais, eles propunham uma nova composição do poder político. É o que afirma a alternativa C.","pq":{"A":"Errada. Os republicanos queriam trocar a monarquia pela república, não fortalecer o Império. A alternativa contradiz o próprio sentido de \"ser republicano\".","B":"Errada. Confunde a Convenção, de 1873, com a cerimônia de 1923, citada na fonte do texto, quando foi instalado o Museu Republicano \"Convenção de Itu\" nos 50 anos do evento.","C":"Correta. A convenção reuniu republicanos, cafeicultores do Oeste paulista e profissionais liberais, que queriam mudar quem tinha o poder político, defendendo a república e o federalismo.","D":"Errada. Não foi uma festa pela emancipação da cidade, e sim uma reunião política republicana. A expressão \"festa cívica\" do relato descreve o clima do evento, não uma comemoração municipal.","E":"Errada. O PRP foi fundado justamente na Convenção de Itu, em 1873. A Constituição de 1824 foi outorgada por D. Pedro I no começo do Império, quase 50 anos antes, e não tem relação com a criação do partido."},"dica":"Convenção de Itu (1873) = fundação do PRP, unindo cafeicultores do Oeste paulista e profissionais liberais em defesa da república e do federalismo.","dif":"média","nota":"","obs":""},{"id":"2023d2-31","n":31,"area":"Ciências Humanas","disc":"História","assunto":"Independências da América espanhola – Simón Bolívar","titulo":"Simón Bolívar: projeto de unificação e uso político de sua imagem","gab":"D","base":null,"imgs":[{"src":"img/2023d2/q31_1.webp","w":781,"h":1498}],"alt":{"A":"a contínua utilização de sua imagem na política da Venezuela contemporânea acabou por acentuar sua irrelevância histórica como líder.","B":"é, por sua trajetória, um dos poucos líderes latino-americanos que não podem ser associados ao caudilhismo e ao mandonismo político.","C":"organizou o Congresso do Panamá em 1826, evento que permitiu a independência econômica das nações latino-americanas.","D":"ambicionou uma duradoura unificação do território fruto da conquista hispânica e sua figura segue sendo mobilizada por diferentes espectros políticos.","E":"o termo “bolivarianismo” passou a ser utilizado, com a ascensão de Hugo Chávez ao poder, em 1999, para indicar caminhos para a construção de um capitalismo pós-industrial no século XXI."},"res":"Ideia-chave: a alternativa correta junta duas coisas: o projeto histórico de Bolívar e o uso político da imagem dele até hoje.\n\n1) O projeto: Bolívar liderou a independência de boa parte da América do Sul e sonhava unir as antigas colônias espanholas. Ele criou a Grã-Colômbia e propôs o Congresso do Panamá, reunido em 1826, para tentar formar uma confederação hispano-americana. O plano fracassou, e a Grã-Colômbia se desfez por volta de 1830, ano da morte dele. Isso combina com a “visão heroica de um projeto histórico inacabado” citada no texto.\n\n2) O uso político: o texto diz que Bolívar “ecoa paixões e construções políticas à direita e à esquerda” e que “O culto a Bolívar ultrapassa as barreiras ideológicas”. Na Venezuela, ele aparece “ora como herdeiro da ilustração e do liberalismo, ora como um porta-voz contra o imperialismo”.\n\nPor isso a alternativa D está correta: Bolívar ambicionou unificar o território da conquista hispânica, e sua figura continua sendo usada por diferentes espectros políticos.","pq":{"A":"Inverte o texto: o uso contínuo da imagem de Bolívar mostra que ele é “uma figura emblemática”, ou seja, muito relevante. Ninguém usa um líder considerado irrelevante para legitimar regimes.","B":"O próprio texto liga o projeto bolivariano ao “autoritarismo do poder vitalício”. Bolívar defendeu uma presidência vitalícia e chegou a governar com poderes ditatoriais, traços próximos do caudilhismo. Não dá para dizer que ele está livre dessa associação.","C":"O Congresso do Panamá, proposto por Bolívar, reuniu-se em 1826, mas fracassou e não trouxe nenhuma “independência econômica”. Depois da independência política, os novos países continuaram dependentes economicamente, sobretudo da Inglaterra.","D":"Correta. Une o projeto de unificação da América hispânica, o “projeto histórico inacabado”, ao uso da figura de Bolívar “à direita e à esquerda”, como o texto afirma.","E":"O bolivarianismo de Chávez se apresentava como anti-imperialista e defendia o chamado “socialismo do século XXI”, não um capitalismo pós-industrial. A troca de “socialismo” por “capitalismo” é a pegadinha."},"dica":"Em questão com texto + conhecimento histórico, a alternativa certa costuma confirmar o texto (aqui, Bolívar usado “à direita e à esquerda”) e acrescentar um dado histórico verdadeiro (o sonho de unir a América hispânica).","dif":"média","nota":"","obs":""},{"id":"2023d2-32","n":32,"area":"Ciências Humanas","disc":"História","assunto":"Segunda Guerra Mundial – Pacto Germano-Soviético","titulo":"Charge de Illingworth: Hitler apunhala Stálin e rompe o Pacto Germano-Soviético","gab":"A","base":null,"imgs":[{"src":"img/2023d2/q32_1.webp","w":783,"h":1599}],"alt":{"A":"à parte da opinião pública europeia, expressa nos jornais da época, que encarava Hitler como uma figura política traiçoeira e violenta.","B":"ao pacto firmado entre Hitler e Lênin, que se mostrou vantajoso apenas para o lado alemão.","C":"ao rompimento da aliança entre alemães e soviéticos, no contexto da Primeira Guerra Mundial.","D":"à oscilação geopolítica no contexto da Segunda Guerra Mundial que ocasionou a invasão do território alemão por parte dos exércitos soviéticos.","E":"à quebra do pacto de não-agressão, apesar da duração prevista de 10 anos, o que levou Alemanha e União Soviética a invadirem a Polônia."},"res":"Ideia-chave: leia os símbolos da charge. Hitler abraça o líder soviético (Stálin) e, durante o abraço, crava uma faca nas costas dele. Ao lado, o papel do “Pacto Germano-Soviético” escapa da mão aberta de Hitler, como algo descartado. O balão diz: “Desculpe, camarada, mas a oportunidade pareceu TÃO boa!”.\n\nO contexto é este: em agosto de 1939, Alemanha e URSS assinaram um pacto de não agressão (Molotov-Ribbentrop). Em junho de 1941, Hitler rompeu o acordo e invadiu a União Soviética (Operação Barbarossa).\n\nA “punhalada nas costas” é a imagem clássica da traição, e a faca representa a violência. A charge é obra de um cartunista da imprensa britânica, ou seja, expressa uma opinião publicada na época. Ela mostra como parte da opinião pública europeia via Hitler: um político traiçoeiro e violento, capaz de abandonar um acordo assim que surgisse uma “oportunidade” boa.\n\nPor isso a resposta é A.","pq":{"A":"Correta. A charge, feita por um cartunista para a imprensa, mostra Hitler traindo (apunhalando pelas costas) o aliado e agindo com violência, visão compartilhada por parte da opinião pública europeia.","B":"Erro de personagem: o pacto foi assinado em 1939, com Stálin no poder; Lênin tinha morrido em 1924. Além disso, a URSS também ganhou com o acordo (por exemplo, o leste da Polônia), e a charge mostra o rompimento do pacto, não um balanço de quem lucrou.","C":"Erro de contexto: o Pacto Germano-Soviético e o seu rompimento (1939-1941) aconteceram na Segunda Guerra Mundial, não na Primeira.","D":"Inverte quem atacou quem: a quebra do pacto levou à invasão da URSS pelos alemães, como mostra Hitler esfaqueando o soviético. As tropas soviéticas só entraram na Alemanha no fim da guerra, e não por causa desse episódio.","E":"Inverte causa e efeito: Alemanha (1º de setembro de 1939) e URSS (17 de setembro de 1939) invadiram a Polônia quando o pacto estava em vigor, conforme a divisão prevista em seu protocolo secreto. A quebra do pacto, em 1941, levou à invasão alemã da URSS."},"dica":"Em charges, decodifique os símbolos (faca nas costas = traição; papel do pacto descartado = acordo rompido) e confira nomes e datas: Pacto Germano-Soviético = Hitler × Stálin, 1939; rompimento = invasão da URSS, 1941.","dif":"média","nota":"","obs":""},{"id":"2023d2-33","n":33,"area":"Ciências Humanas","disc":"História","assunto":"Escravidão no Brasil – identidade africana e tráfico","titulo":"Slenes: feitores escravizados e a identidade africana “entre dois mundos”","gab":"E","base":null,"imgs":[{"src":"img/2023d2/q33_1.webp","w":781,"h":1974}],"alt":{"A":"a presença de feitores negros indicava a total assimilação das ordens dadas pelos senhores.","B":"o tráfico perdeu força no início do século XIX, enfraquecendo os vínculos dos escravizados com sua origem africana.","C":"a experiência da diáspora forçada (ou rapto) dos africanos foi superada pela preservação da língua e cultura originais.","D":"a situação ambígua e limite em que viviam os feitores lhes deixava em posição social igual à dos escravizados.","E":"a identidade dos escravizados era construída numa situação de fronteira, entre suas origens e sua condição presente."},"res":"Ideia-chave: o texto descreve uma identidade “de fronteira”, feita da mistura entre a África de origem e a vida no cativeiro brasileiro.\n\nOs trechos que comprovam isso:\n1) O ponto de partida vale para todos os africanos: eles “viam suas ligações com seu continente de origem constantemente renovadas pelo tráfico”.\n2) O feitor ocupava uma posição ambígua: devia o cargo à confiança do senhor, mas só se mantinha se fosse visto como uma espécie de “representante” da senzala perante a Casa Grande.\n3) O autor resume: “o feitor se situava entre dois mundos”. Ele tentava ficar mais “ladino” (adaptado à língua e aos costumes dos brancos), mas o tráfico intenso o obrigava “a renovar constantemente sua africanidade”.\n4) A conclusão: “Trata-se, no entanto, de uma identidade africana que não era aquela das suas origens, nem das de qualquer outro escravo.”\n\nOu seja, a identidade não era a africana original nem a imposta pelo senhor. Era algo novo, construído no limite entre a origem e a condição presente. É exatamente o que afirma a alternativa E.","pq":{"A":"O texto diz o contrário: o feitor só mantinha a posição se fosse visto como “representante” da senzala, e feitores se destacaram “como líderes das revoltas escravas”. Não havia “total assimilação” das ordens dos senhores.","B":"Os dados do texto mostram um tráfico intenso até perto de 1850: entre 15% e 19% dos africanos tinham chegado havia menos de dois anos e meio. Por isso os vínculos eram “constantemente renovados pelo tráfico”, e não enfraquecidos.","C":"O texto nega a preservação intacta da cultura original: a identidade africana formada no Brasil “não era aquela das suas origens”. A violência da diáspora não foi “superada”; o que houve foi a criação de uma identidade nova.","D":"O feitor tinha “posições de mando sobre os outros escravos”, ou seja, estava acima deles na hierarquia. A ambiguidade dele vinha de estar entre o senhor e a senzala, não de ter a mesma posição dos demais.","E":"Correta. Resume a ideia central do texto: viver “entre dois mundos” e construir uma identidade africana nova, diferente da de origem."},"dica":"Em questões de interpretação, procure a frase de síntese do autor (aqui, “entre dois mundos” e a última frase) e desconfie de alternativas com termos absolutos como “total”, “igual” ou “superada”.","dif":"média","nota":"","obs":""},{"id":"2023d2-34","n":34,"area":"Ciências Humanas","disc":"História","assunto":"Colonialismo na África – restituição do patrimônio cultural","titulo":"Devolução de obras de arte à África como reparação colonial","gab":"D","base":null,"imgs":[{"src":"img/2023d2/q34_1.webp","w":783,"h":1501}],"alt":{"A":"uma atitude irrefletida uma vez que os povos colonizados não são os reais detentores dessas obras de arte.","B":"um reconhecimento de que europeus e africanos partilham da mesma ancestralidade cultural.","C":"uma constatação de que os objetos de arte não podem ser utilizados para narrar a história dos povos.","D":"um disputado processo pela devolução que implica na reparação por violências coloniais cometidas no passado.","E":"uma vitória do eurocentrismo definida pela devolução desses objetos de arte que estavam sob a guarda de museus europeus."},"res":"Ideia-chave: a restituição é apresentada como resultado de uma luta longa e como reparação pela violência do colonialismo.\n\nO texto mostra que foi um processo disputado: “Durante décadas, os museus e as administrações culturais europeias frustraram a luta da África pela recuperação do seu patrimônio cultural, sufocando o debate público.” Ou seja, houve resistência europeia e luta africana.\n\nO texto também mostra que se trata de reparar violências coloniais. As obras foram levadas em saques, e “Os saques de obras eram sintomas de uma sanha destruidora” da “empresa colonial enquanto máquina de destruição”. Por isso, “A restituição tem um sentido de construção de um mundo sem as amarras coloniais”.\n\nPor fim, o autor rejeita a “presunção de incapacidade” dos povos africanos para cuidar do próprio patrimônio.\n\nProcesso disputado + reparação de violências coloniais = alternativa D.","pq":{"A":"Contradiz o texto, que trata as obras como o “próprio patrimônio cultural” dos povos africanos, levado em saques. Negar que eles sejam os donos é justamente a “presunção de incapacidade” que o autor rejeita.","B":"O texto não fala em ancestralidade comum. Ao contrário, opõe a “razão eurocêntrica” às vozes africanas “amordaçadas”, numa relação de dominação colonial, e não de herança compartilhada.","C":"O texto pressupõe o oposto: os objetos são o “patrimônio cultural” dos povos, isto é, parte da sua memória e da sua história. Devolvê-los é justamente uma forma de “escutarmos as outras vozes”.","D":"Correta. O texto descreve uma luta de décadas contra a resistência dos museus europeus, e a devolução funciona como reparação pelos saques e pela destruição colonial.","E":"Inverte o sentido: o autor critica o “discurso pretensamente universal da razão eurocêntrica”. A devolução representa uma derrota desse eurocentrismo, não uma vitória dele."},"dica":"Identifique o posicionamento do autor (aqui, anticolonial) e elimine as alternativas que defendem o lado que ele critica, como o eurocentrismo e a incapacidade dos africanos.","dif":"fácil","nota":"","obs":""},{"id":"2023d2-35","n":35,"area":"Ciências Humanas","disc":"Filosofia","assunto":"Filosofia antiga – Sócrates e os sofistas","titulo":"Crítica de Sócrates aos sofistas segundo Marilena Chaui","gab":"C","base":null,"imgs":[{"src":"img/2023d2/q35_1.webp","w":781,"h":729}],"alt":{"A":"fundaram uma corrente filosófica.","B":"faziam apologia à injustiça.","C":"relativizavam o conhecimento.","D":"eram criteriosos com o saber.","E":"dominavam pouco a retórica."},"res":"Ideia-chave: para Sócrates, os sofistas não buscavam a verdade. Para eles, qualquer tese valia, desde que fosse útil para vencer o debate.\n\nO excerto mostra isso em dois trechos:\n1) “defendiam qualquer ideia, se isso fosse vantajoso”. A validade de uma ideia dependia da conveniência, não da verdade.\n2) “faziam o erro e a mentira valer tanto quanto a verdade”. Verdade, erro e mentira acabavam tendo o mesmo peso.\n\nQuando tudo vale o mesmo e depende do interesse de quem fala, o conhecimento fica relativizado: não existe uma verdade firme a ser buscada. É por isso que Sócrates diz que eles “não tinham amor pela sabedoria nem respeito pela verdade” e, portanto, não eram filósofos.\n\nResposta: C, os sofistas relativizavam o conhecimento.","pq":{"A":"Segundo o excerto, Sócrates afirma justamente que os sofistas “não eram filósofos”. Atribuir a ele a ideia de que fundaram uma corrente filosófica contradiz o texto.","B":"O excerto não fala de justiça e injustiça. A crítica de Sócrates é sobre a verdade: tratar erro e mentira como equivalentes à verdade. “Apologia à injustiça” extrapola o que está escrito.","C":"Correta. Defender “qualquer ideia” por vantagem e fazer “o erro e a mentira valer tanto quanto a verdade” é relativizar o conhecimento.","D":"É o oposto do texto: quem não tem “respeito pela verdade” e defende qualquer ideia por conveniência não é criterioso com o saber.","E":"Os sofistas eram conhecidos justamente como mestres da retórica, a arte de persuadir. Conseguir defender “qualquer ideia” exige grande domínio da argumentação. A crítica de Sócrates é ética, não de falta de técnica."},"dica":"Sofistas = retórica + relativismo (a verdade depende do interesse ou da vantagem de quem fala); Sócrates = busca de uma verdade que não depende da conveniência.","dif":"fácil","nota":"","obs":""},{"id":"2023d2-36","n":36,"area":"Ciências Humanas","disc":"Filosofia","assunto":"Filosofia medieval – Tomás de Aquino, fé e razão","titulo":"Tomás de Aquino: fé e razão como caminhos até Deus, com primazia da fé","gab":"A","base":null,"imgs":[{"src":"img/2023d2/q36_1.webp","w":781,"h":956}],"alt":{"A":"a fé e a razão existem juntas, com superioridade da fé.","B":"a razão pode nos enganar e deve ser desconsiderada.","C":"as verdades divinas são inacessíveis aos humanos.","D":"o conhecimento inato substitui o conhecimento religioso.","E":"o acesso que nos conduz à espiritualidade é único."},"res":"Ideia-chave: para Tomás de Aquino, fé e razão não brigam. As duas levam a Deus, mas a fé é o caminho mais seguro.\n\nO excerto mostra as duas partes dessa ideia:\n\n1) Fé e razão juntas: as “verdades naturais teológicas” são aquelas “a que podemos chegar tanto pela fé cristã quanto pela nossa própria razão”. E ainda: “Tomás acreditava em dois caminhos que levavam a Deus. O primeiro passava pela fé e pela revelação cristã, o segundo pela razão e os sentidos.”\n\n2) Superioridade da fé: “dos dois caminhos o mais seguro era o da fé e da revelação, pois o homem pode facilmente se enganar quando confia apenas na razão.”\n\nComo a razão é aceita, mas fica abaixo da fé, a resposta é A. Essa conciliação hierarquizada entre fé e razão é a marca da Escolástica, corrente da qual Tomás de Aquino é o principal nome.","pq":{"A":"Correta. O texto apresenta dois caminhos válidos até Deus (fé e razão) e afirma que o “mais seguro” é o da fé.","B":"O texto diz que o homem se engana “quando confia apenas na razão”, mas não manda descartá-la: a razão é um dos dois caminhos que levam a Deus. O erro está em trocar “não basta sozinha” por “deve ser desconsiderada”.","C":"Contradiz o texto: existem verdades “a que podemos chegar tanto pela fé cristã quanto pela nossa própria razão”. Portanto, as verdades divinas são acessíveis aos humanos.","D":"O texto diz que as “verdades naturais teológicas”, alcançadas pela razão “natural”, inata, existem “ao lado” das “verdades de fé”, sem substituí-las. Além disso, a prioridade é da fé, e não do conhecimento inato.","E":"O texto fala em “dois caminhos que levavam a Deus”, e não em um acesso único."},"dica":"Tomás de Aquino (Escolástica): fé e razão se complementam, mas a razão está a serviço da fé. Desconfie de alternativas que eliminam uma das duas.","dif":"fácil","nota":"","obs":""},{"id":"2023d2-37","n":37,"area":"Ciências Humanas","disc":"Filosofia","assunto":"Contratualismo – Thomas Hobbes e o Estado absoluto","titulo":"Hobbes: pacto social e soberano que concentra os poderes","gab":"E","base":null,"imgs":[{"src":"img/2023d2/q37_1.webp","w":783,"h":888}],"alt":{"A":"na democracia representativa.","B":"na monarquia parlamentarista.","C":"na república presidencialista.","D":"no socialismo democrático.","E":"na monarquia absolutista."},"res":"Ideia-chave: para Hobbes, os indivíduos fazem um pacto e transferem seu poder a um soberano, que passa a concentrá-lo e a usar a força para garantir a paz. Essa é a base teórica do absolutismo.\n\nO excerto dá as pistas:\n(1) a sociedade passou a \"gravitar em torno de uma só pessoa ou grupo\";\n(2) os membros \"acataram a utilização de força coativa para a mantença da paz e a defesa comum\";\n(3) \"o papel de concentração dos poderes outorgados pelos indivíduos coube ao soberano\";\n(4) quem entrega o poder é chamado de \"súditos\", e não de cidadãos.\n\nPoder concentrado num soberano, força para manter a ordem e indivíduos tratados como súditos descrevem um governo sem divisão de poderes e sem controle dos governados. No Leviatã, Hobbes defende essa soberania absoluta e indivisível como a única saída para escapar do estado de natureza, que ele descreve como uma guerra de todos contra todos. Ele até admite que o soberano seja uma assembleia (por isso o texto diz \"pessoa ou grupo\"), mas considerava a monarquia a melhor forma. Entre as opções, a única com poder concentrado e sem limites é a monarquia absolutista: alternativa E.","pq":{"A":"A democracia representativa supõe cidadãos que escolhem seus governantes em eleições periódicas e um poder dividido e limitado. O texto fala em concentração dos poderes no soberano e em \"súditos\", e não em cidadãos que controlam quem governa.","B":"Na monarquia parlamentarista o poder do rei é limitado por um Parlamento e por uma Constituição (o rei reina, mas não governa). Isso contraria a concentração total dos poderes no soberano que o texto descreve.","C":"A república presidencialista tem separação de poderes (Executivo, Legislativo e Judiciário) e mandatos com prazo definido. É o oposto do soberano único e concentrador do excerto.","D":"O socialismo democrático é uma corrente muito posterior a Hobbes, que combina busca de igualdade econômica com eleições e pluralismo. Nada no excerto trata de propriedade coletiva ou de participação popular no poder.","E":"Correta. O pacto transfere os poderes dos indivíduos a um soberano que os concentra e usa a força para garantir a paz, e os indivíduos tornam-se súditos: é o fundamento teórico do absolutismo."},"dica":"Hobbes (Leviatã): medo do estado de natureza → pacto → soberano com poder absoluto; não confunda com Locke (direitos naturais e limites ao poder) nem com Rousseau (vontade geral e soberania popular).","dif":"fácil","nota":"","obs":""},{"id":"2023d2-38","n":38,"area":"Ciências Humanas","disc":"Filosofia","assunto":"Foucault – microfísica do poder","titulo":"Foucault e a metáfora \"cortar a cabeça do rei\"","gab":"B","base":null,"imgs":[{"src":"img/2023d2/q38_1.webp","w":783,"h":1017}],"alt":{"A":"as monarquias absolutistas precisariam ser encerradas com a decapitação dos governantes.","B":"o Estado constitui-se como a manifestação dos poderes presentes nas relações sociais.","C":"a ausência do Estado revela-se eficaz para a boa organização política da população.","D":"a política contemporânea deve transformar-se sem perder a referência da modernidade.","E":"os estudos acerca da natureza de um governo são suficientes para a análise da ciência política."},"res":"Ideia-chave: \"cortar a cabeça do rei\" é uma METÁFORA sobre o jeito de estudar o poder, e não um convite a decapitar alguém. Foucault critica a teoria política que imagina o poder saindo de um centro único (o rei, o soberano) e descendo sobre todos.\n\nO texto mostra a mudança: no século XVI, o problema era \"como o monarca soberano poderia obter e manter seu poder\"; no século XX, \"o poder do Estado não está desconectado de nenhuma outra forma de poder na sociedade\". Por isso, os teóricos precisariam abandonar a imagem do poder concentrado no soberano e \"desenvolver uma abordagem para entender o poder que refletia essa mudança\".\n\nPara Foucault, o poder circula em rede pelas relações do dia a dia (na escola, na família, no hospital, na prisão, na fábrica), ideia conhecida como microfísica do poder. O Estado não é a fonte única de todo o poder: ele se apoia nessas relações e é uma manifestação delas. É exatamente o que diz a alternativa B.","pq":{"A":"Lê a metáfora ao pé da letra. \"Cortar a cabeça do rei\" é uma crítica teórica ao modelo de poder centrado no soberano; Foucault não propõe decapitar governantes.","B":"Correta. Se o poder do Estado está conectado a todas as outras formas de poder na sociedade, o Estado não é a origem do poder, e sim a expressão das relações de poder que atravessam a vida social.","C":"Foucault não defende a ausência do Estado (isso lembraria uma tese anarquista). O texto diz que o poder do Estado está ligado aos demais poderes da sociedade, e não que a sociedade se organizaria melhor sem ele.","D":"O texto propõe uma ruptura, e não uma continuidade: abandonar o modelo de análise centrado no soberano, herdado da teoria política do século XVI. Além disso, fala em mudar a forma de entender o poder, e não em dar uma receita para a política contemporânea.","E":"É o contrário do texto: estudar apenas a natureza do governo (o rei, o Estado) seria insuficiente, porque o poder está espalhado nas relações sociais. Foi por isso que Foucault pediu uma nova abordagem."},"dica":"Para Foucault, o poder não é uma coisa que alguém possui no topo de uma pirâmide: ele circula em rede pelas relações sociais (microfísica do poder), e o Estado é só uma das suas expressões.","dif":"média","nota":"","obs":""},{"id":"2023d2-39","n":39,"area":"Ciências Humanas","disc":"Sociologia","assunto":"Trabalho análogo à escravidão no Brasil contemporâneo","titulo":"Trabalhador baiano enganado: trabalho análogo à escravidão","gab":"E","base":null,"imgs":[{"src":"img/2023d2/q39_1.webp","w":781,"h":893}],"alt":{"A":"oportunidades concretas de ascensão social por mérito.","B":"necessidade de legislação que impeça tal acontecimento.","C":"práticas de violências diversas em ocupações legalizadas.","D":"presença pouco expressiva de abusos por xenofobia.","E":"persistência de relações de trabalho análogas à escravidão."},"res":"Ideia-chave: o relato reúne os elementos típicos do trabalho em condição análoga à de escravo, que ainda existe no Brasil.\n\nVeja as pistas no texto:\n(1) aliciamento com promessa falsa: \"Me ofereceram R$ 2.000 por mês, passagem de ida, de volta, alimentação e dormitório. Mas chegou lá, foi tudo enganoso\";\n(2) alojamento degradante e superlotado: \"um galpão com mais de 200 pessoas dentro, um quarto em frente ao outro com 9 pessoas\";\n(3) rotina de madrugada sob humilhação: \"A gente acordava 4h da manhã à base de grito, chamando a gente de demônio\";\n(4) violência física: quem não acordava rápido \"tomavam choque no pé ou murro na costela\".\n\nEngano no recrutamento, condições degradantes, humilhação e agressões caracterizam o trabalho análogo à escravidão, que o Código Penal brasileiro (art. 149) define como crime. Como a notícia é de 2023, ela mostra que essa prática persiste no país mais de um século depois da abolição formal da escravidão (1888). Por isso, a resposta é a E.","pq":{"A":"É o oposto do relato. O trabalhador saiu da Bahia em busca de emprego e caiu numa armadilha de exploração; não há nenhuma ascensão social por mérito no texto.","B":"A lei já existe: o art. 149 do Código Penal tipifica como crime reduzir alguém a condição análoga à de escravo. O que o texto revela é que a prática continua acontecendo apesar da lei, e não a falta de legislação.","C":"Há violência no relato, mas a alternativa erra ao tratar a situação como \"ocupação legalizada\": aliciamento enganoso, alojamento degradante e agressões tornam essa relação de trabalho um crime, e não um emprego regular. Além disso, \"violências diversas\" é genérico e não nomeia o fenômeno que o texto mostra.","D":"O excerto não menciona preconceito contra o trabalhador por causa da sua origem. E, mesmo que mencionasse, um relato de abusos graves não permitiria concluir que eles são \"pouco expressivos\"; a alternativa minimiza o problema em vez de identificá-lo.","E":"Correta. Promessa enganosa, alojamento degradante, humilhação e violência física configuram trabalho análogo à escravidão, que ainda persiste no Brasil."},"dica":"Engano no recrutamento + condições degradantes + violência, jornada exaustiva ou restrição de liberdade = trabalho análogo à escravidão, crime previsto no art. 149 do Código Penal que ainda aparece no noticiário.","dif":"fácil","nota":"","obs":""},{"id":"2023d2-40","n":40,"area":"Ciências Humanas","disc":"Sociologia","assunto":"Etnocentrismo x relativismo cultural","titulo":"\"Sampa\", de Caetano Veloso: Narciso e o etnocentrismo","gab":"C","base":null,"imgs":[{"src":"img/2023d2/q40_1.webp","w":783,"h":1045}],"alt":{"A":"relativista.","B":"impressionista.","C":"etnocêntrica.","D":"patrimonialista.","E":"democrática."},"res":"Ideia-chave: etnocentrismo é julgar outra cultura usando a própria como padrão, o que leva a achar \"estranho\" ou \"feio\" tudo o que é diferente.\n\nNa canção, o baiano que chega a São Paulo estranha a cidade: \"quando eu cheguei por aqui eu nada entendi\". Depois, confessa: \"Quando eu te encarei frente a frente e não vi o meu rosto / Chamei de mau gosto o que vi\". Ou seja, como a cidade não refletia sua própria identidade e seus costumes, ele a desvalorizou.\n\nO verso-chave é \"É que Narciso acha feio o que não é espelho\". No mito grego, Narciso se apaixona pela própria imagem refletida na água. A metáfora diz que quem toma a si mesmo como medida acha feio tudo o que é diferente. Esse é exatamente o mecanismo do etnocentrismo: a própria cultura vira a régua para julgar a cultura do outro.\n\nRepare que o eu lírico até reconhece o erro ao explicar o motivo do julgamento, mas a pergunta é sobre a postura relatada (chamar de mau gosto o que é diferente). Por isso, a resposta é C: postura etnocêntrica.","pq":{"A":"É o contrário. O relativismo cultural procura entender a outra cultura nos termos dela, sem hierarquizá-la; o eu lírico fez o oposto ao chamar de \"mau gosto\" o que não se parecia com ele.","B":"Pegadinha com a palavra \"impressão\" do enunciado: impressionismo é um movimento artístico (na pintura e na música), e não um conceito sociológico que descreva a postura diante de outra cultura.","C":"Correta. Julgar a cidade como \"mau gosto\" porque ela não espelha o próprio rosto (\"Narciso acha feio o que não é espelho\") é tomar a própria cultura como padrão para avaliar a do outro: etnocentrismo.","D":"Patrimonialismo é a confusão entre o público e o privado no exercício do poder (conceito de Weber, usado no Brasil por Raymundo Faoro). Não tem relação com o estranhamento cultural descrito na canção.","E":"\"Democrática\" sugeriria abertura e igualdade no convívio com a diferença. O relato mostra o contrário: a rejeição do diferente justamente porque ele não se parece com o eu lírico."},"dica":"Etnocentrismo é medir o outro pela própria régua e relativismo é entendê-lo pela régua dele; Narciso, que só acha bonito o próprio reflexo, é a imagem perfeita do etnocentrismo.","dif":"fácil","nota":"","obs":""},{"id":"2023d2-41","n":41,"area":"Ciências Humanas","disc":"Sociologia","assunto":"Durkheim – características do fato social","titulo":"Durkheim: as três características do fato social","gab":"E","base":null,"imgs":[{"src":"img/2023d2/q41_1.webp","w":781,"h":876}],"alt":{"A":"racionalidade, exterioridade e individualidade.","B":"individualidade, objetividade e coercitividade.","C":"generalidade, racionalidade e liberdade.","D":"previsibilidade, objetividade e liberdade.","E":"generalidade, exterioridade e coercitividade."},"res":"Ideia-chave: o excerto diz que a concepção de Durkheim \"baseia-se em uma teoria dos fatos sociais\". Para ele, todo fato social tem três características:\n\n(1) Generalidade: é coletivo e se repete na maioria dos membros de um grupo; não é algo de um indivíduo isolado.\n(2) Exterioridade: existe fora e antes do indivíduo. Quando nascemos, a língua, as leis, a religião e os costumes já estão prontos.\n(3) Coercitividade: impõe-se ao indivíduo e o pressiona a seguir certas regras; quem se desvia sofre sanções (punição legal, reprovação, isolamento).\n\nExemplo: as regras de vestimenta numa formatura são gerais (valem para todos), exteriores (já existiam antes de você) e coercitivas (quem vai de chinelo é repreendido).\n\nÉ por tratar os fatos sociais \"como coisas\", exteriores ao indivíduo e observáveis, que Durkheim pode propor \"uma sociologia científica e objetiva\", como diz o texto. A combinação certa é generalidade, exterioridade e coercitividade: alternativa E.","pq":{"A":"Acerta a exterioridade, mas \"racionalidade\" e \"individualidade\" não fazem parte da tríade. Individualidade, aliás, contradiz Durkheim: o fato social é coletivo.","B":"Acerta a coercitividade, mas troca generalidade por \"individualidade\" (o contrário do fato social) e exterioridade por \"objetividade\". A objetividade é uma exigência do método sociológico, e não uma característica do fato social.","C":"Só a generalidade está certa. \"Liberdade\" é o oposto da coercitividade: para Durkheim, o fato social se impõe ao indivíduo independentemente da vontade dele, e racionalidade não está na tríade.","D":"Nenhum dos três termos pertence à tríade. \"Previsibilidade\" e \"objetividade\" lembram o ideal de ciência que o texto menciona (a pegadinha), e \"liberdade\" contraria a coerção típica do fato social.","E":"Correta. Generalidade (é coletivo), exterioridade (existe fora e antes do indivíduo) e coercitividade (impõe-se a ele) são as três características do fato social em Durkheim."},"dica":"Fato social de Durkheim = G.E.C. (Geral, Exterior e Coercitivo), então desconfie de \"individualidade\" e \"liberdade\" em qualquer alternativa sobre ele.","dif":"fácil","nota":"","obs":""},{"id":"2023d2-42","n":42,"area":"Ciências Humanas","disc":"Sociologia","assunto":"Cidadania e direitos – criminalização da homofobia e da transfobia","titulo":"Homofobia criminalizada pelo STF e aumento de 54% nos registros","gab":"C","base":null,"imgs":[{"src":"img/2023d2/q42_1.webp","w":783,"h":1178}],"alt":{"A":"a legislação nacional permanece conivente com práticas discriminatórias.","B":"o judiciário brasileiro institui obstáculos legais para a efetivação da democracia.","C":"a ampliação formal da cidadania encontra barreiras significativas no cotidiano.","D":"a união de fatores sociais e políticos atenuaram as manifestações de violência.","E":"as demandas dos movimentos sociais foram supridas nos últimos anos."},"res":"Ideia-chave: compare os dois textos. O primeiro mostra um avanço NO PAPEL (no direito); o segundo mostra que, NA PRÁTICA, a discriminação continua e até cresce.\n\nTexto 1: em junho de 2019, o STF decidiu que \"atos preconceituosos contra homossexuais e transexuais passariam a ser enquadrados no crime de racismo\". É uma ampliação formal da cidadania: pessoas LGBTQIA+ passam a ter proteção penal explícita.\n\nTexto 2: \"As ocorrências de homofobia ou transfobia passaram de 316, em 2021, para 488, em 2022\". Conferindo a conta:\n488 − 316 = 172\n172 ÷ 316 ≈ 0,54 → aumento de cerca de 54%.\n\nOu seja, mesmo depois da garantia legal, os casos registrados de discriminação continuam numerosos e aumentaram. (Parte do aumento pode refletir mais denúncias, mas, de qualquer forma, cada registro é um caso real de discriminação.) Conclusão: o direito conquistado formalmente esbarra em barreiras concretas no dia a dia, como o preconceito e a violência. É o que afirma a alternativa C.","pq":{"A":"O texto 1 mostra o contrário: atos homofóbicos e transfóbicos passaram a ser enquadrados no crime de racismo. A ordem jurídica, portanto, não é conivente; ela pune a discriminação.","B":"O Judiciário (STF) aparece ampliando direitos, e não criando obstáculos: foi uma decisão do próprio tribunal que garantiu a proteção penal.","C":"Correta. A decisão do STF amplia formalmente a cidadania, mas o aumento de 54% nos registros (de 316 para 488) mostra que a discriminação persiste no cotidiano.","D":"Os dados mostram aumento, e não atenuação: os registros subiram 54% de 2021 para 2022. A alternativa contradiz diretamente o segundo texto.","E":"O crescimento dos casos mostra que a demanda central (viver sem discriminação) não foi atendida. A decisão foi um avanço formal, não a solução do problema."},"dica":"Em questões que comparam lei ou decisão judicial com dados da realidade, procure a distância entre a cidadania formal (o direito no papel) e a cidadania efetiva (a vida real).","dif":"fácil","nota":"","obs":""}],"grupos":{}}};</script>

  const k = ev.key.toUpperCase();
  if (LET.includes(k)) { const b = $(`.bub-btn[data-l="${k}"]`); if (b) b.click(); }
  else if (ev.key === 'ArrowRight') go(S.exam.idx + 1);
  else if (ev.key === 'ArrowLeft') go(S.exam.idx - 1);
});
document.addEventListener('visibilitychange', () => { if (S.view === 'exam') saveExam(true); });
window.addEventListener('pagehide', () => { if (S.view === 'exam') saveExam(true); });

setInkOn(false);
renderHome();
})();
</script>

</body>
</html>
