mais forte, best = melhor) e marcadores de ordem (followed by = seguido por, in last place = em último lugar) para montar o ranking.","dif":"fácil","nota":"","obs":""},{"id":"2025d1-22","n":22,"area":"Linguagens","disc":"Inglês","assunto":"Interpretação de cartum (crítica social)","titulo":"Cartum: saudade de Grand Theft Auto diante das apostas online","gab":"A","base":null,"imgs":[{"src":"img/2025d1/q22_1.webp","w":781,"h":1017}],"alt":{"A":"crítica à prática de apostas online.","B":"análise positiva dos cursos em formato virtual.","C":"oposição à supervisão excessiva de pais.","D":"preocupação com a paternidade tóxica.","E":"censura aos jogos que envolvem violência."},"res":"Ideia-chave: no cartum, a crítica nasce do contraste entre a fala do adulto e o que aparece na tela do computador.\n\nO garoto Billy está diante de um computador cuja tela mostra os três rolos de um caça-níquel, sob um letreiro colorido; o som “DING DING DING” imita a máquina de apostas. Ou seja, ele está apostando online.\n\nO adulto, atrás dele, diz: “BILLY!... I MISS THE DAYS OF GRAND THEFT AUTO...” (Billy!... Sinto falta dos tempos de Grand Theft Auto...). Grand Theft Auto é um videogame conhecido pela violência e pelos crimes (o nome significa “roubo de carro”).\n\nO humor está aí: o jogo violento, que antes seria motivo de preocupação, agora parece até inofensivo perto do novo hábito do garoto. A saudade do adulto é irônica e mostra que as apostas online são vistas como um problema ainda mais grave. Por isso, o cartum faz uma crítica à prática de apostas online. Alternativa A.","pq":{"A":"Correta: o caça-níquel na tela e o “DING DING DING” mostram o garoto apostando online, e a saudade irônica do jogo violento indica que as apostas são vistas como algo ainda pior.","B":"Não há curso nem aula na tela: o que aparece é um caça-níquel, jogo de aposta. E o tom do cartum é de lamento, não de elogio.","C":"O adulto não é criticado por vigiar demais; pelo contrário, sua fala lamenta o que o garoto está fazendo. A crítica recai sobre as apostas, não sobre a supervisão dos pais.","D":"Nada no cartum mostra um adulto abusivo ou uma relação familiar nociva; ele apenas expressa desânimo. O alvo é o hábito do garoto de apostar.","E":"É a pegadinha: Grand Theft Auto é um jogo violento, mas o adulto sente falta dele. O cartum não censura o jogo violento; usa-o como comparação para mostrar que as apostas são piores."},"dica":"Em cartuns, junte a fala com os elementos visuais (palavras na tela, onomatopeias); a ironia costuma estar no contraste entre eles.","dif":"média","nota":"","obs":""},{"id":"2025d1-23","n":23,"area":"Linguagens","disc":"Inglês","assunto":"Interpretação de charge (inferência)","titulo":"Ozzy Osbourne no céu: asas de morcego ou de anjo?","gab":"C","base":null,"imgs":[{"src":"img/2025d1/q23_1.webp","w":783,"h":1357}],"alt":{"A":"foi enviado equivocadamente para o céu e terá asas de morcego.","B":"está vivo e precisa voltar voando às suas atividades na terra.","C":"receberá asas de anjo e irá para o paraíso.","D":"precisa estar alado para carregar o peso de sua guitarra.","E":"entrará no paraíso apenas após receber asas de morcego."},"res":"Ideia-chave: a inferência depende da correção feita pelo anjo na segunda fala.\n\nA cena se passa na entrada do céu: nuvens, portão aberto e um anjo com auréola falando ao telefone. Ozzy chega carregando um estojo de guitarra com as inscrições “Ozzy” e “Black Sabbath” e segurando um morcego.\n\nPrimeira fala: “HELLO? I’M SENDING MR OSBOURNE DOWN TO GET HIS WINGS FITTED...” (Alô? Estou mandando o Sr. Osbourne descer para colocarem as asas dele...).\nSegunda fala: “NO, NOT BAT WINGS... ANGEL WINGS!” (Não, não são asas de morcego... são asas de anjo!).\n\nO humor está no mal-entendido: quem está do outro lado da linha supôs que o roqueiro receberia asas de morcego, combinando com a imagem sombria do heavy metal (reforçada pelo morcego na mão dele). O anjo corrige: ele vai ganhar asas de anjo. Ou seja, Ozzy foi aceito no paraíso e receberá asas de anjo. Alternativa C.","pq":{"A":"O engano não é sobre o destino: Ozzy está mesmo no céu, e o anjo corrige justamente as asas de morcego (“NOT BAT WINGS”, não asas de morcego). A alternativa coloca o erro no lugar errado e ainda afirma o que foi negado.","B":"O enunciado diz que o quadro se refere à morte de Ozzy, e ele está na entrada do céu. “SENDING MR OSBOURNE DOWN” (mandando o Sr. Osbourne descer) só indica que ele será encaminhado para receber as asas, não que voltará vivo à Terra.","C":"Correta: a correção “NO, NOT BAT WINGS... ANGEL WINGS!” (Não, não asas de morcego... asas de anjo!) mostra que Ozzy receberá asas de anjo, ou seja, foi admitido no paraíso.","D":"Nenhuma fala relaciona as asas ao estojo da guitarra; ele aparece só para identificar o roqueiro e sua banda (as inscrições “Ozzy” e “Black Sabbath”).","E":"Contradiz a fala do anjo, que nega explicitamente as asas de morcego: “NO, NOT BAT WINGS” (não, asas de morcego não)."},"dica":"Em quadrinhos, a negação (no, not = não) costuma marcar a virada da piada; veja com atenção o que está sendo corrigido.","dif":"fácil","nota":"","obs":""},{"id":"2025d1-24","n":24,"area":"Linguagens","disc":"Inglês","assunto":"Interpretação de cartum (estereótipos de gênero)","titulo":"Gender Differences: profissões para meninos, cor de cabelo para meninas","gab":"B","base":null,"imgs":[{"src":"img/2025d1/q24_1.webp","w":782,"h":1500}],"alt":{"A":"às profissões que valorizam trabalhos em equipes mistas de meninos e meninas.","B":"às expectativas distintas que são limitantes para meninas.","C":"ao potencial de desenvolvimento educacional dos jovens em geral.","D":"à ênfase excessiva na aparência tanto para meninos como para meninas.","E":"à escolha de profissões pelo critério de remuneração futura tanto para meninos como para meninas."},"res":"Ideia-chave: as duas falas começam iguais; a crítica aparece nos exemplos diferentes dados a cada criança.\n\nPara o menino: “YOU CAN BE ANYTHING YOU WANT TO BE WHEN YOU GROW UP... AN ENGINEER, FIREFIGHTER, ASTRONAUT, PILOT...” (Você pode ser o que quiser quando crescer... engenheiro, bombeiro, astronauta, piloto...).\nPara a menina: “YOU CAN BE ANYTHING YOU WANT TO BE WHEN YOU GROW UP... A BLONDE, BRUNETTE...” (Você pode ser o que quiser quando crescer... loira, morena...).\n\nO “anything” (qualquer coisa) prometido é o mesmo, mas os exemplos revelam expectativas muito diferentes: ao menino, profissões ligadas a carreira, coragem e conhecimento; à menina, apenas a aparência (a cor do cabelo). Para ela, a promessa de liberdade fica reduzida a algo superficial. Repare também nas expressões: o menino sorri, a menina está de cara fechada.\n\nO título “GENDER DIFFERENCES” (Diferenças de gênero) reforça que o alvo é esse tratamento desigual. A crítica, portanto, é às expectativas distintas que limitam as meninas. Alternativa B.","pq":{"A":"O cartum não fala de equipes mistas nem de trabalho em grupo; meninos e meninas recebem mensagens separadas e desiguais, e é isso que se critica.","B":"Correta: o mesmo “anything” (qualquer coisa) vira profissões para o menino e cor de cabelo para a menina, revelando expectativas de gênero que limitam as meninas.","C":"A crítica não é ao potencial dos jovens em geral, e sim à diferença de tratamento entre menino e menina; o futuro do menino, aliás, é apresentado de forma ampla.","D":"A ênfase na aparência aparece só para a menina (“A BLONDE, BRUNETTE”, loira, morena); para o menino, os exemplos são profissões. O “tanto para meninos como para meninas” torna a alternativa errada.","E":"Não há menção a salário ou remuneração, e à menina nem são oferecidas profissões; o contraste é entre carreira e aparência."},"dica":"Quando duas falas começam iguais, compare o que muda depois: é ali que o autor esconde a crítica.","dif":"fácil","nota":"","obs":""},{"id":"2025d1-25","n":25,"area":"Ciências da Natureza","disc":"Física","assunto":"Cinemática – movimento uniforme e velocidade relativa","titulo":"Encontro de ciclistas no mesmo sentido: tempo de alcance","gab":"E","base":null,"imgs":[{"src":"img/2025d1/q25_1.webp","w":783,"h":1032}],"alt":{"A":"2,5 h.","B":"1,5 h.","C":"3,0 h.","D":"1,0 h.","E":"2,0 h."},"res":"Ideia-chave: como os dois ciclistas andam no mesmo sentido, o ciclista 1 se aproxima do 2 com a velocidade relativa, que é a diferença entre as velocidades.\n\nVelocidade relativa: 8 − 5 = 3 km/h.\nDistância a ser “descontada”: 6 km.\nTempo de encontro: t = 6 ÷ 3 = 2,0 h.\n\nConferência pelas funções horárias (origem na posição inicial do ciclista 1):\nS₁ = 8t e S₂ = 6 + 5t.\nEncontro: 8t = 6 + 5t → 3t = 6 → t = 2 h.\nEm 2 h, o ciclista 1 está em 8 × 2 = 16 km e o ciclista 2 em 6 + 5 × 2 = 16 km. Mesma posição: encontro confirmado.","pq":{"A":"Em 2,5 h a aproximação seria 3 × 2,5 = 7,5 km, maior que os 6 km de separação: o ciclista 1 já teria ultrapassado o 2 havia meia hora.","B":"Em 1,5 h o ciclista 1 só reduz a distância em 3 × 1,5 = 4,5 km; ainda faltariam 1,5 km para alcançar o ciclista 2.","C":"3,0 h aparece se você confundir a velocidade relativa (3 km/h) com o tempo. Em 3 h a aproximação seria de 9 km, mais do que os 6 km que os separam.","D":"Em 1,0 h o ciclista 1 chega a 8 km e o 2 chega a 6 + 5 = 11 km: ainda estão separados por 3 km.","E":"Correta: a velocidade relativa é 8 − 5 = 3 km/h, e 6 km ÷ 3 km/h = 2,0 h; nesse instante ambos estão a 16 km da posição inicial do ciclista 1."},"dica":"Móveis no mesmo sentido: use a diferença das velocidades; em sentidos opostos, use a soma.","dif":"fácil","nota":"","obs":""},{"id":"2025d1-26","n":26,"area":"Ciências da Natureza","disc":"Física","assunto":"Estática – equilíbrio de forças","titulo":"Escaladora em equilíbrio: vetores F₁, F₂ e P no centro de massa","gab":"E","base":null,"imgs":[{"src":"img/2025d1/q26_1.webp","w":781,"h":1897},{"src":"img/2025d1/q26_2.webp","w":308,"h":995}],"alt":{"A":"[esquema: F₁ chega a G vindo de baixo e da esquerda (aponta para cima e para a direita); F₂ sai de G para baixo e para a direita; P sai de G verticalmente para baixo]","B":"[esquema: F₁ sai de G para baixo e para a esquerda; F₂ sai de G para baixo e para a direita; P sai de G verticalmente para baixo]","C":"[esquema: F₁ aponta para cima e para a direita, chegando a G; F₂ aponta para cima e para a esquerda, chegando a G; P é vertical e aponta para cima, chegando a G]","D":"[esquema: F₁ sai de G para baixo e para a esquerda; F₂ sai de G para baixo e para a direita; P é vertical e aponta para cima, chegando a G]","E":"[esquema: F₁ aponta para cima e para a direita, chegando a G; F₂ aponta para cima e para a esquerda, chegando a G; P sai de G verticalmente para baixo]"},"res":"Ideia-chave: a atleta está parada, então a força resultante sobre ela é nula: F₁ + F₂ + P = 0. Os três vetores precisam se cancelar tanto na horizontal quanto na vertical.\n\nPasso 1 – o peso: P é sempre vertical e para baixo. Isso já elimina (C) e (D), que desenham P para cima.\n\nPasso 2 – a força do apoio segurado: na foto, a mão agarra o apoio que fica acima e à esquerda do corpo, com o braço esticado. O apoio puxa a atleta na direção dele, então F₂ aponta para cima e para a esquerda.\n\nPasso 3 – a força nos pés: os pés estão no apoio de baixo, à esquerda do corpo. A superfície os empurra para cima e para a direita; é essa componente para a direita que equilibra a componente para a esquerda de F₂.\n\nConferência: na horizontal, F₁ (para a direita) cancela F₂ (para a esquerda); na vertical, as componentes para cima de F₁ e de F₂, somadas, igualam P. Só o esquema (E) tem essa combinação.","pq":{"A":"F₂ foi desenhada para baixo e para a direita, como se o apoio empurrasse a mão para longe; o apoio segurado puxa a atleta em sua direção. Além disso, F₁ e F₂ teriam ambas componente horizontal para a direita, que nada cancelaria.","B":"F₁, F₂ e P têm todas componente para baixo; sem nenhuma força para cima, a resultante não pode ser nula e a atleta cairia.","C":"O peso foi desenhado para cima, mas ele é a atração gravitacional da Terra e aponta sempre verticalmente para baixo. Com os três vetores para cima, também não haveria equilíbrio.","D":"Inverte o sentido de todas as forças: o peso aparece para cima e as forças dos apoios apontam para baixo, como se a superfície puxasse os pés e o apoio empurrasse a mão.","E":"Correta: P vertical para baixo, F₂ para cima e para a esquerda (puxão em direção ao apoio segurado) e F₁ para cima e para a direita (empurrão da superfície nos pés); as componentes se cancelam e a resultante é nula."},"dica":"Corpo em repouso tem resultante nula: desenhe o peso sempre para baixo e verifique se as componentes horizontais e verticais das outras forças podem cancelá-lo.","dif":"média","nota":"","obs":""},{"id":"2025d1-27","n":27,"area":"Ciências da Natureza","disc":"Física","assunto":"Dinâmica – trabalho de uma força constante","titulo":"Trabalho da força no cortador de grama com cos α = 1/4","gab":"A","base":null,"imgs":[{"src":"img/2025d1/q27_1.webp","w":781,"h":1245}],"alt":{"A":"240 J.","B":"120 J.","C":"80 J.","D":"360 J.","E":"60 J."},"res":"Ideia-chave: o trabalho de uma força constante é W = F · d · cos α, em que α é o ângulo entre a força e o deslocamento. Só a componente da força paralela ao deslocamento realiza trabalho.\n\nO deslocamento é horizontal (para a esquerda, como indica a seta “Movimento”), e a força faz o ângulo α com a horizontal, com cos α = 1/4.\n\nComponente horizontal da força:\nFₓ = F · cos α = 60 × 1/4 = 15 N.\n\nTrabalho:\nW = Fₓ · d = 15 × 16 = 240 J.\n\nO trabalho é positivo porque a componente horizontal de F tem o mesmo sentido do movimento. A componente vertical, que empurra o cortador contra o chão, é perpendicular ao deslocamento e não realiza trabalho.","pq":{"A":"Correta: W = F · d · cos α = 60 × 16 × 1/4 = 240 J; só a componente horizontal da força (15 N) realiza trabalho ao longo dos 16 m.","B":"120 J é a metade do valor correto, como se houvesse um fator 1/2 na fórmula; não existe esse fator em W = F · d · cos α. Corresponderia a uma componente horizontal de só 7,5 N.","C":"80 J corresponderia a uma componente horizontal de 80 ÷ 16 = 5 N, mas com cos α = 1/4 essa componente vale 60 × 1/4 = 15 N.","D":"360 J exigiria uma componente horizontal de 360 ÷ 16 = 22,5 N; com F = 60 N e cos α = 1/4, a componente é só 15 N.","E":"60 J aparece se você aplicar o fator 1/4 duas vezes (60 × 16 × 1/4 × 1/4 = 60) ou tomar o próprio valor da força, 60 N, como se fosse o trabalho. O cosseno entra uma única vez: 60 × 16 × 1/4 = 240 J."},"dica":"Trabalho = força × deslocamento × cosseno do ângulo entre eles; a componente perpendicular ao movimento não realiza trabalho.","dif":"fácil","nota":"","obs":""},{"id":"2025d1-28","n":28,"area":"Ciências da Natureza","disc":"Física","assunto":"Termodinâmica – trabalho em um ciclo (diagrama P × V)","titulo":"Trabalho em ciclo termodinâmico pela área no diagrama P × V","gab":"D","base":null,"imgs":[{"src":"img/2025d1/q28_1.webp","w":783,"h":1058}],"alt":{"A":"300 J.","B":"200 J.","C":"500 J.","D":"400 J.","E":"100 J."},"res":"Ideia-chave: num ciclo, o trabalho do gás é numericamente igual à área interna da figura no diagrama P × V. Como o ciclo A → B → C → (4; 2) → A é percorrido no sentido horário (expande sob pressão alta e é comprimido sob pressão baixa), esse trabalho é positivo.\n\nA figura é um trapézio de vértices (1; 2), (3; 4), (4; 4) e (4; 2), nas unidades do gráfico. Dividindo:\nTriângulo entre AB e a reta P = 2 (de V = 1 a 3): base 2, altura 2 → área = 2 × 2 / 2 = 2.\nRetângulo de V = 3 a 4 e P = 2 a 4: 1 × 2 = 2.\nÁrea total = 4 unidades.\n\nCada unidade vale 10⁵ Pa × 10⁻³ m³ = 100 J.\nW = 4 × 100 = 400 J.\n\nConferência pela fórmula do trapézio: bases 3 (de V = 1 a 4, embaixo) e 1 (de V = 3 a 4, em cima), altura 2 → (3 + 1) × 2 / 2 = 4 unidades = 400 J.","pq":{"A":"300 J aparece se você contar só os 3 quadradinhos inteiros e desprezar os dois meios-quadradinhos cortados pela diagonal AB (ou se tratar a figura toda como um triângulo de base 3 e altura 2).","B":"200 J é só parte da área: ou apenas o triângulo sob AB (2 unidades), ou apenas o retângulo de V = 3 a V = 4, entre P = 2 e P = 4 (2 unidades). O ciclo completo engloba as duas partes.","C":"500 J surge se você contar como inteiros os dois quadradinhos cortados ao meio pela diagonal AB (3 + 2 = 5); cada um deles vale só meio quadradinho.","D":"Correta: a área interna do ciclo é de 4 unidades de 10⁵ Pa × 10⁻³ m³ = 100 J, logo W = 400 J (positivo, pois o ciclo é horário).","E":"100 J é o valor de um único quadradinho (10⁵ Pa × 10⁻³ m³); o ciclo engloba o equivalente a 4 quadradinhos."},"dica":"No diagrama P × V, o trabalho no ciclo é a área interna: positivo no sentido horário, negativo no anti-horário; não esqueça de multiplicar pelas potências de 10 dos eixos.","dif":"média","nota":"","obs":""},{"id":"2025d1-29","n":29,"area":"Ciências da Natureza","disc":"Física","assunto":"Óptica – espelhos esféricos (equação de Gauss)","titulo":"Espelho côncavo: imagem de vela a 60 cm com f = 20 cm","gab":"C","base":null,"imgs":[{"src":"img/2025d1/q29_1.webp","w":781,"h":1655},{"src":"img/2025d1/q29_2.webp","w":504,"h":1147}],"alt":{"A":"[esquema: imagem invertida, com 10 cm de altura (1 quadradinho), a 60 cm de V, além de C (na mesma posição do objeto)]","B":"[esquema: imagem invertida, com 10 cm de altura (1 quadradinho), a 10 cm de V, entre V e F]","C":"[esquema: imagem invertida, com 10 cm de altura (1 quadradinho), a 30 cm de V, entre F e C (no ponto médio entre eles)]","D":"[esquema: imagem invertida, com 20 cm de altura (mesmo tamanho do objeto), a 60 cm de V, além de C]","E":"[esquema: imagem invertida, com 20 cm de altura (mesmo tamanho do objeto), sobre o centro de curvatura C, a 40 cm de V]"},"res":"Ideia-chave: use a equação de Gauss para achar a posição da imagem e o aumento linear para achar seu tamanho e sua orientação.\n\nDados (cada quadradinho = 10 cm): p = 60 cm, f = 20 cm (logo C está a 2f = 40 cm) e o = 20 cm.\n\nPosição:\n1/f = 1/p + 1/p'\n1/20 = 1/60 + 1/p'\n1/p' = 3/60 − 1/60 = 2/60 → p' = 30 cm.\np' > 0: imagem real, na frente do espelho, a 30 cm de V, ou seja, entre F (20 cm) e C (40 cm).\n\nTamanho e orientação:\nA = −p'/p = −30/60 = −1/2\ni = A · o = −1/2 × 20 = −10 cm.\nO sinal negativo indica imagem invertida, com 10 cm de altura (1 quadradinho).\n\nConferência pela regra prática: objeto além de C gera imagem real, invertida, menor e entre F e C. É o esquema (C).","pq":{"A":"O tamanho (10 cm, invertida) está certo, mas a imagem foi colocada a 60 cm, na posição do próprio objeto; pela equação de Gauss, p' = 30 cm.","B":"A imagem está a 10 cm de V, entre V e F, mas o cálculo dá p' = 30 cm; além disso, um espelho côncavo nunca forma imagem real entre V e F.","C":"Correta: p' = 30 cm (entre F e C) e i = −10 cm, ou seja, imagem real, invertida e com metade da altura do objeto.","D":"Mostra a imagem com o mesmo tamanho do objeto (20 cm) e à mesma distância dele (60 cm); pelo cálculo, o aumento é −1/2 (imagem de 10 cm) e a imagem fica a 30 cm de V.","E":"Imagem invertida, do mesmo tamanho e sobre C é o que ocorre quando o objeto está no centro de curvatura; aqui o objeto está além de C (60 cm), então a imagem é menor e fica entre F e C."},"dica":"Espelho côncavo com objeto além de C: imagem real, invertida, menor e entre F e C; confira com 1/f = 1/p + 1/p' e A = −p'/p.","dif":"média","nota":"","obs":""},{"id":"2025d1-30","n":30,"area":"Ciências da Natureza","disc":"Física","assunto":"Ondulatória – tubos sonoros fechados","titulo":"Apito de tubo fechado de 16 cm: nota musical do som fundamental","gab":"D","base":null,"imgs":[{"src":"img/2025d1/q30_1.webp","w":781,"h":1400}],"alt":{"A":"Sol.","B":"Mi.","C":"Lá.","D":"Dó.","E":"Si."},"res":"Ideia-chave: em um tubo fechado em uma extremidade, o som fundamental tem λ = 4L; depois, basta usar f = v/λ.\n\nComprimento do tubo, lido na régua: as marcas vão de 0 a 16 cm, então L = 16 cm = 0,16 m.\n\nComprimento de onda do fundamental:\nλ = 4L = 4 × 0,16 = 0,64 m.\n\nFrequência:\nf = v/λ = 340/0,64 ≈ 531 Hz.\n\nComparando com a tabela: Dó = 523 Hz (diferença de cerca de 8 Hz) e Ré = 587 Hz (diferença de cerca de 56 Hz). O som fica mais próximo do Dó.\n\nConferência: um tubo fechado que soasse exatamente o Dó teria L = 340/(4 × 523) ≈ 0,163 m ≈ 16 cm, praticamente o tubo do garoto.","pq":{"A":"Sol (784 Hz) exigiria um tubo fechado de L = 340/(4 × 784) ≈ 10,8 cm, bem menor que os 16 cm medidos na régua.","B":"Mi (659 Hz) corresponderia a L = 340/(4 × 659) ≈ 12,9 cm; com 16 cm, a frequência fica em torno de 531 Hz, mais grave que o Mi.","C":"Lá (880 Hz) exigiria L = 340/(4 × 880) ≈ 9,7 cm; o tubo de 16 cm é longo demais para essa nota.","D":"Correta: λ = 4 × 0,16 = 0,64 m e f = 340/0,64 ≈ 531 Hz, valor mais próximo dos 523 Hz do Dó.","E":"Si aparece se você usar a relação do tubo aberto (λ = 2L = 0,32 m), que dá f ≈ 1 062 Hz, cujo valor mais próximo na tabela é 988 Hz; mas o apito tem uma extremidade tampada, então λ = 4L."},"dica":"Tubo fechado: no fundamental λ = 4L, logo f = v/4L; tubo aberto: λ = 2L, logo f = v/2L.","dif":"média","nota":"","obs":""},{"id":"2025d1-31","n":31,"area":"Ciências da Natureza","disc":"Física","assunto":"Eletrostática – eletrização por contato","titulo":"Eletrização por contato com esferas 2 e 4 ligadas por fio","gab":"B","base":null,"imgs":[{"src":"img/2025d1/q31_1.webp","w":783,"h":1713}],"alt":{"A":"180 µC.","B":"100 µC.","C":"60 µC.","D":"30 µC.","E":"120 µC."},"res":"Ideia-chave: quando esferas condutoras idênticas entram em contato, a carga total se divide igualmente entre todas as que estão eletricamente ligadas. Como 2 e 4 estão unidas por fio condutor, tocar a 2 (ou a 4) é tocar as duas ao mesmo tempo.\n\n1º contato (esfera 1 com a 2, que está ligada à 4): três esferas dividem 360 µC.\nq₁ = q₂ = q₄ = 360/3 = 120 µC.\n\n2º contato (esfera 1 com a 3, isolada e neutra):\nq₁ = q₃ = (120 + 0)/2 = 60 µC.\n\n3º contato (esfera 1 com a 4, ligada à 2): três esferas dividem a soma\n60 + 120 + 120 = 300 µC → q₁ = q₂ = q₄ = 300/3 = 100 µC.\n\nConferência (conservação da carga): q₁ + q₂ + q₃ + q₄ = 100 + 100 + 60 + 100 = 360 µC. A esfera 4 termina com 100 µC.","pq":{"A":"180 µC seria o resultado de dividir os 360 µC só entre as esferas 1 e 2, ignorando o fio, e mesmo assim essa seria a carga da esfera 2, não da 4. Como a 4 está ligada à 2, ela participa do primeiro contato e a carga se divide por três (120 µC em cada).","B":"Correta: após os três contatos (120 µC → 60 µC → divisão de 300 µC entre 1, 2 e 4), a esfera 4 fica com 300/3 = 100 µC.","C":"60 µC é a carga da esfera 3 (e da esfera 1 logo após o segundo contato); a esfera 4 ainda participa do terceiro contato, junto com a 2.","D":"30 µC surge se você dividir os 60 µC da esfera 1 só com a esfera 4, como se ela ainda estivesse neutra; mas a 4 já tem 120 µC, recebidos pelo fio no primeiro contato, e continua ligada à 2.","E":"120 µC é a carga da esfera 4 depois apenas do primeiro contato; no terceiro contato, a esfera 1 (com 60 µC) redistribui a carga com 2 e 4, e o valor cai para 100 µC."},"dica":"Esferas idênticas ligadas por fio funcionam como um só condutor: some as cargas de todas as que estão ligadas no contato e divida pelo número de esferas.","dif":"difícil","nota":"","obs":""},{"id":"2025d1-32","n":32,"area":"Ciências da Natureza","disc":"Física","assunto":"Eletrodinâmica – associação de resistores e potência elétrica","titulo":"Lâmpadas em série e paralelo: potência de L₂, L₃ e L₄","gab":"C","base":null,"imgs":[{"src":"img/2025d1/q32_1.webp","w":781,"h":1343}],"alt":{"A":"15 W.","B":"40 W.","C":"10 W.","D":"5 W.","E":"25 W."},"res":"Ideia-chave: L₂, L₃ e L₄ estão em paralelo entre si (mesma tensão de 10 V) e esse conjunto está em série com L₁. Logo, toda a corrente que passa por L₁ se divide entre as três lâmpadas iguais.\n\nTensões: 20 V = 10 V (em L₁) + 10 V (no conjunto em paralelo), como informa o enunciado.\n\nCorrente em L₁:\nP = U · i → 30 = 10 · i → i = 3 A.\n\nDivisão da corrente: L₂, L₃ e L₄ são iguais e estão sob a mesma tensão, então cada uma recebe 3 ÷ 3 = 1 A.\n\nPotência em cada uma:\nP = U · i = 10 × 1 = 10 W.\n\nConferência: potência total fornecida = 20 V × 3 A = 60 W = 30 W (L₁) + 3 × 10 W (L₂, L₃ e L₄).","pq":{"A":"15 W aparece se você dividir a corrente de 3 A em só dois ramos (1,5 A em cada) ou dividir os 30 W de L₁ por 2; a corrente se divide entre três lâmpadas iguais.","B":"40 W surge ao aplicar os 20 V da fonte sobre uma das lâmpadas iguais, cuja resistência é 10 V ÷ 1 A = 10 Ω (20²/10 = 40 W); mas cada lâmpada do paralelo está sob 10 V, e não 20 V.","C":"Correta: L₁ conduz 3 A (30 W ÷ 10 V), que se dividem em 1 A por lâmpada; P = 10 V × 1 A = 10 W.","D":"5 W aparece se você calcular a corrente de L₁ com os 20 V da fonte (30 ÷ 20 = 1,5 A) e dividir por três (0,5 A); mas L₁ está sob 10 V, então conduz 3 A.","E":"25 W exigiria 2,5 A em cada lâmpada (25 ÷ 10), ou seja, 7,5 A no total; porém, pela série com L₁, passam só 3 A."},"dica":"Em série a corrente é a mesma; em paralelo a tensão é a mesma e a corrente se divide: comece pela lâmpada cujos dados estão completos.","dif":"média","nota":"","obs":""},{"id":"2025d1-33","n":33,"area":"Ciências da Natureza","disc":"Química","assunto":"Ligação iônica – identificação de cátions","titulo":"Cátions do corante tartrazina (Na⁺)","gab":"D","base":null,"imgs":[{"src":"img/2025d1/q33_1.webp","w":783,"h":992}],"alt":{"A":"enxofre, S.","B":"nitrogênio, N.","C":"carbono, C.","D":"sódio, Na.","E":"oxigênio, O."},"res":"Ideia-chave: em um composto iônico, o cátion é a espécie com carga positiva (+). Basta procurar o sinal “+” na estrutura.\n\nNa figura da tartrazina, a carga positiva aparece em três lugares, sempre junto do mesmo símbolo: “⁺Na⁻O” (à esquerda) e “O⁻Na⁺” (duas vezes, à direita e embaixo). Portanto, os cátions são íons sódio, Na⁺, três por unidade do composto.\n\nO restante da estrutura (C, H, N, O e S, unidos por ligações covalentes) forma um único ânion orgânico grande. As cargas negativas ficam em átomos de oxigênio: dois em grupos –SO₃⁻ (ligados ao enxofre) e um em grupo –COO⁻ (ligado ao carbono). Ou seja, o oxigênio aparece com carga negativa, como parte do ânion.\n\nA tabela periódica confirma: o sódio é um metal alcalino (grupo 1), que tende a perder 1 elétron e formar Na⁺, enquanto C, N, O e S são não metais e compõem a parte covalente da estrutura.\n\nResposta: (D) sódio, Na.","pq":{"A":"O enxofre está no centro dos grupos –SO₃⁻, ligado covalentemente a oxigênios. Ele faz parte do ânion orgânico, e nenhum sinal “+” aparece ao lado do S na figura.","B":"Os átomos de nitrogênio estão no grupo –N=N– e no anel de cinco membros, unidos por ligações covalentes. Nenhum deles carrega carga positiva na estrutura.","C":"O carbono forma o esqueleto (anéis e cadeias) do ânion orgânico, com ligações covalentes. Não há carbono com carga positiva na figura.","D":"Correta: o sinal “+” aparece apenas junto do sódio (⁺Na e Na⁺, três vezes). O sódio, metal alcalino do grupo 1, perde 1 elétron e forma o cátion Na⁺.","E":"Pegadinha: o oxigênio está colado ao Na na fórmula (⁺Na⁻O), mas carrega carga negativa (O⁻). Ele é o ponto de carga negativa do ânion, e não o cátion."},"dica":"Em fórmula de composto iônico, procure o sinal “+”: em sais orgânicos de sódio, o cátion é Na⁺ e a parte orgânica é o ânion.","dif":"fácil","nota":"","obs":""},{"id":"2025d1-34","n":34,"area":"Ciências da Natureza","disc":"Química","assunto":"Tabela periódica – número atômico e número de massa","titulo":"Glaucinium de Vauquelin: elemento de número atômico 4","gab":"A","base":null,"imgs":[{"src":"img/2025d1/q34_1.webp","w":781,"h":713}],"alt":{"A":"Berílio.","B":"Boro.","C":"Flúor.","D":"Lítio.","E":"Oxigênio."},"res":"Ideia-chave: o que identifica um elemento químico é o número atômico (Z), isto é, o número de prótons. O nome pode mudar ao longo da história; o Z, não.\n\nO texto informa que o elemento tem “número atômico 4 e número de massa 9”. Na Classificação Periódica, a casa de número atômico 4 é a do Be, berílio (grupo 2, 2º período), com massa atômica 9,01, valor coerente com o número de massa 9 citado.\n\nConferência com a relação A = Z + n:\n9 = 4 + n\nn = 5 nêutrons\nO átomo descrito tem, portanto, 4 prótons e 5 nêutrons (berílio-9).\n\nAs demais opções têm outros números atômicos: lítio (Z = 3), boro (Z = 5), oxigênio (Z = 8) e flúor (Z = 9).\n\nResposta: (A) Berílio.","pq":{"A":"Correta: na tabela, Z = 4 corresponde ao berílio (Be), cuja massa atômica 9,01 bate com o número de massa 9 informado.","B":"O boro (B) tem número atômico 5 e massa atômica 10,8. Ele é o vizinho seguinte ao berílio na tabela, não o elemento de Z = 4.","C":"Pegadinha: o flúor tem número atômico 9, que é o número de MASSA citado no texto, não o número atômico. Quem confunde A com Z cai aqui; além disso, a massa atômica do flúor é 19,0.","D":"O lítio (Li) tem número atômico 3 e massa atômica 6,94; ele vem imediatamente antes do berílio na tabela.","E":"O oxigênio (O) tem número atômico 8, o dobro do valor informado, e massa atômica 16,0."},"dica":"Para identificar um elemento, use o número atômico (Z = número de prótons); o número de massa (A = prótons + nêutrons) não localiza o elemento na tabela.","dif":"fácil","nota":"","obs":""},{"id":"2025d1-35","n":35,"area":"Ciências da Natureza","disc":"Química","assunto":"Balanceamento de equações químicas","titulo":"Ustulação da galena: coeficiente x do PbO","gab":"E","base":"35-36","imgs":[{"src":"img/2025d1/q35_1.webp","w":783,"h":532}],"alt":{"A":"2,5.","B":"3,5.","C":"3.","D":"4.","E":"2."},"res":"Ideia-chave: numa equação balanceada, cada elemento tem o mesmo número de átomos nos reagentes e nos produtos (conservação da massa). O coeficiente multiplica todos os átomos da fórmula.\n\nEquação da etapa 1: 2 PbS + 3 O₂ → x PbO + 2 SO₂\n\nChumbo (Pb), que aparece em uma só substância de cada lado:\nesquerda: 2 PbS → 2 átomos de Pb\ndireita: x PbO → x átomos de Pb\nLogo, x = 2.\n\nConferência com os outros elementos:\nEnxofre (S): esquerda 2 × 1 = 2; direita 2 × 1 = 2. Confere.\nOxigênio (O): esquerda 3 × 2 = 6; direita 2 × 1 (no PbO) + 2 × 2 (no SO₂) = 2 + 4 = 6. Confere.\n\nEquação balanceada: 2 PbS + 3 O₂ → 2 PbO + 2 SO₂.\n\nResposta: (E) 2.","pq":{"A":"Com x = 2,5 haveria 2,5 átomos de Pb nos produtos contra apenas 2 nos reagentes, e o oxigênio somaria 2,5 + 4 = 6,5 à direita contra 6 à esquerda. O próprio chumbo já fixa x = 2.","B":"Com x = 3,5 sairiam 3,5 Pb a partir de só 2 Pb nos reagentes, e o oxigênio somaria 3,5 + 4 = 7,5 contra 6. Não há motivo para fração: o Pb se balanceia com o inteiro 2.","C":"3 é o coeficiente do O₂ copiado para o PbO. Com x = 3 haveria 3 Pb à direita contra 2 à esquerda, e 3 + 4 = 7 oxigênios contra 6.","D":"4 aparece se você balancear o oxigênio esquecendo o coeficiente do SO₂ (contando só 2 O em vez de 2 × 2 = 4): 6 = x + 2, x = 4. Mas aí o Pb ficaria 4 à direita contra 2 à esquerda.","E":"Correta: o Pb exige x = 2 (2 PbS → 2 PbO), e a conferência do oxigênio fecha: 6 à esquerda e 2 + 4 = 6 à direita."},"dica":"Comece o balanceamento pelo elemento que aparece em uma só substância de cada lado (aqui, o Pb) e deixe o oxigênio para a conferência final.","dif":"fácil","nota":"","obs":""},{"id":"2025d1-36","n":36,"area":"Ciências da Natureza","disc":"Química","assunto":"Oxirredução – número de oxidação","titulo":"Etapa 2 da obtenção do chumbo: Nox do Pb e redução","gab":"E","base":"35-36","imgs":[{"src":"img/2025d1/q36_1.webp","w":783,"h":755}],"alt":{"A":"+2 … oxidado … perde","B":"–2 … reduzido … perde","C":"–2 … oxidado … ganha","D":"+2 … oxidado … ganha","E":"+2 … reduzido … ganha"},"res":"Ideia-chave: em óxidos, o oxigênio tem número de oxidação (Nox) –2, e a soma dos Nox em um composto neutro é zero. Quem ganha elétrons tem o Nox diminuído e sofre redução.\n\nEtapa 2: 2 PbO + C → 2 Pb + CO₂\n\nNox do chumbo no PbO:\nNox(Pb) + Nox(O) = 0\nNox(Pb) + (–2) = 0\nNox(Pb) = +2\n\nNo produto, o chumbo metálico é substância simples, com Nox = 0, como informa o próprio enunciado.\n\nVariação: +2 → 0, o Nox diminui 2 unidades. Para isso, cada chumbo recebe 2 elétrons:\nPb²⁺ + 2 e⁻ → Pb\nGanhar elétrons e ter o Nox diminuído é redução: o chumbo é reduzido.\n\nQuem fornece esses elétrons é o carbono, que passa de 0 (C) para +4 (CO₂): ele é oxidado, perde elétrons e atua como agente redutor.\n\nFrase completa: o chumbo apresenta Nox igual a +2, é reduzido e ganha elétrons.\n\nResposta: (E).","pq":{"A":"O +2 está certo, mas “oxidado … perde” descreve o carbono (0 → +4), não o chumbo. O Pb vai de +2 para 0: o Nox diminui, então ele ganha elétrons e é reduzido.","B":"–2 é o Nox do oxigênio no PbO (e do enxofre no S²⁻ da galena), não do chumbo. Além disso, “reduzido” e “perde” se contradizem: quem é reduzido ganha elétrons.","C":"–2 é o Nox do oxigênio, não do Pb. E a combinação é incoerente: ser “oxidado” significa perder elétrons, não ganhar.","D":"O +2 está certo, mas “oxidado” e “ganha” são contraditórios: ganhar elétrons é redução, e a queda do Nox do Pb (+2 → 0) confirma que ele é reduzido.","E":"Correta: no PbO, o Pb tem Nox +2 (pois o O vale –2); ao virar chumbo metálico (Nox 0), ganha 2 elétrons e, portanto, é reduzido."},"dica":"Redução = recebe elétrons e o Nox diminui; oxidação = perde elétrons e o Nox aumenta.","dif":"média","nota":"","obs":""},{"id":"2025d1-37","n":37,"area":"Ciências da Natureza","disc":"Química","assunto":"Soluções – concentração comum","titulo":"Concentração de zinco em bolsa de soro de 250 mL","gab":"A","base":null,"imgs":[{"src":"img/2025d1/q37_1.webp","w":1575,"h":936}],"alt":{"A":"20,0 mg/L.","B":"10,0 mg/L.","C":"40,0 mg/L.","D":"5,0 mg/L.","E":"2,5 mg/L."},"res":"Ideia-chave: concentração comum é a massa de soluto dividida pelo volume da solução, C = m/V, com o volume em litros quando a resposta é pedida em mg/L.\n\nDados: m = 5,0 mg de zinco; V = 250 mL, que é o volume total da solução depois que o suplemento foi transferido para a bolsa.\n\nConversão do volume:\n250 mL = 250/1000 L = 0,250 L\n\nCálculo:\nC = 5,0 mg / 0,250 L\nC = 20,0 mg/L\n\nConferência: 250 mL é 1/4 de litro. Se em 1/4 de litro há 5,0 mg, em 1 L da mesma solução haveria 4 × 5,0 = 20,0 mg. Logo, 20,0 mg/L.\n\nO gotejamento lento não altera a concentração: ele só controla a velocidade com que a solução entra no paciente.\n\nResposta: (A) 20,0 mg/L.","pq":{"A":"Correta: C = 5,0 mg ÷ 0,250 L = 20,0 mg/L, pois 5,0 mg em 1/4 de litro equivalem a 20,0 mg em 1 litro.","B":"10,0 mg/L corresponderia a 5,0 mg em 500 mL. Aparece se você tratar a bolsa de 250 mL como se fosse meio litro (5,0 ÷ 0,5 L).","C":"40,0 mg/L é o dobro do valor correto: corresponderia a 5,0 mg em apenas 125 mL (0,125 L), metade do volume real da bolsa.","D":"5,0 mg/L apenas repete a massa de zinco com unidade de concentração, como se a solução tivesse 1 L. Ignora que o volume é de só 0,250 L.","E":"2,5 mg/L corresponderia a 5,0 mg em 2 L. Como o volume real (0,250 L) é menor que 1 L, a concentração tem de ser maior que 5,0 mg/L, nunca menor."},"dica":"Em C = m/V com resposta em mg/L, converta mL para L (÷ 1000) antes de dividir; se o volume é menor que 1 L, o valor em mg/L fica maior que a massa em mg.","dif":"fácil","nota":"","obs":""},{"id":"2025d1-38","n":38,"area":"Ciências da Natureza","disc":"Química","assunto":"Transformações químicas – fotocromismo (leitura de esquema)","titulo":"Lentes fotocromáticas: molécula 1 vira 2 ao absorver UV-A","gab":"B","base":null,"imgs":[{"src":"img/2025d1/q38_1.webp","w":1575,"h":1083}],"alt":{"A":"1 é aquecida na ausência de radiação UV-A, transformando-se na molécula 2.","B":"1 absorve radiação UV-A, transformando-se na molécula 2.","C":"1 é resfriada na ausência de radiação UV-A, transformando-se na molécula 2.","D":"2 absorve radiação UV-A, transformando-se na molécula 1.","E":"2 é resfriada na ausência de radiação UV-A, transformando-se na molécula 1."},"res":"Ideia-chave: leia o esquema seguindo as setas; o que está escrito sobre cada seta é a condição que provoca aquela transformação.\n\nO texto diz que a molécula 2 é a “responsável pelo escurecimento das lentes” e que a molécula 2, “ao se transformar na molécula 1, torna a lente novamente transparente”. Portanto, a lente escurece quando se forma a molécula 2.\n\nNo esquema:\nMolécula 1 → (UV-A) → Molécula 2: a lente escurece.\nMolécula 2 → (Aquecimento) → Molécula 1: a lente volta a ficar transparente.\n\nLogo, as lentes escurecem quando a molécula 1 absorve radiação UV-A e se transforma na molécula 2. Isso combina com o uso no dia a dia: sob sol forte, rico em radiação ultravioleta, a lente escurece; longe dessa radiação, a transformação inversa, favorecida pelo calor, regenera a molécula 1 e a lente clareia.\n\nResposta: (B).","pq":{"A":"No esquema, o aquecimento atua na seta 2 → 1, que clareia a lente. Não há seta indicando que a molécula 1 vire 2 por aquecimento.","B":"Correta: a seta marcada “UV-A” leva a molécula 1 à molécula 2, e o texto afirma que a molécula 2 é a responsável pelo escurecimento.","C":"Resfriamento não aparece no esquema. A conversão 1 → 2 depende justamente da presença de radiação UV-A, não da ausência dela.","D":"Inverte o processo: no esquema, a molécula 2 vira 1 por aquecimento, não por UV-A. E a conversão 2 → 1 torna a lente transparente, não escura.","E":"A transformação 2 → 1 clareia a lente (o texto diz que ela “torna a lente novamente transparente”), e o esquema indica aquecimento, não resfriamento."},"dica":"Em esquemas de reação, a condição escrita sobre a seta (luz, calor, catalisador) vale só para aquele sentido; associe cada produto ao efeito descrito no texto.","dif":"fácil","nota":"","obs":""},{"id":"2025d1-39","n":39,"area":"Ciências da Natureza","disc":"Química","assunto":"Indicadores ácido-base e pH – óxido ácido (CO₂)","titulo":"Vela na campânula: CO₂ descolore solução de NaOH com fenolftaleína","gab":"C","base":null,"imgs":[{"src":"img/2025d1/q39_1.webp","w":781,"h":1676}],"alt":{"A":"ácida … diminuiu … maior","B":"alcalina … aumentou … maior","C":"alcalina … diminuiu … menor","D":"ácida … aumentou … menor","E":"alcalina … aumentou … menor"},"res":"Ideia-chave: a fenolftaleína é rosa em pH acima de 8,2 (meio básico) e incolor abaixo disso; o CO₂ é um óxido ácido, que reage com a água e neutraliza bases.\n\nCondição inicial: foi adicionado NaOH, uma base, até a solução ficar “levemente rosada”. Rosa com fenolftaleína significa pH > 8,2, portanto a solução era alcalina (básica).\n\nDurante o experimento: a combustão “libera gás carbônico (CO₂) dentro da campânula”. Parte desse gás se dissolve na água e forma ácido carbônico:\nCO₂ + H₂O ⇌ H₂CO₃\nEsse ácido reage com o NaOH (neutralização), consumindo os íons OH⁻ da base. Com menos OH⁻ em solução, o pH diminui.\n\nCondição final: a solução ficou incolor, o que, segundo o enunciado, ocorre com pH abaixo de 8,2, ou seja, um valor menor que 8,2.\n\nFrase completa: a solução era alcalina e o pH diminuiu até atingir um valor menor que 8,2.\n\nResposta: (C).","pq":{"A":"Solução rosa com fenolftaleína tem pH > 8,2, logo não era ácida; além disso, foi preparada com NaOH, uma base. E um pH “maior que 8,2” manteria a cor rosa, mas a solução ficou incolor.","B":"Se o pH tivesse aumentado e ficado acima de 8,2, a solução continuaria rosa. O CO₂ é um óxido ácido: ao se dissolver na água, ele abaixa o pH.","C":"Correta: com NaOH e cor rosa, o meio era alcalino (pH > 8,2); o CO₂ formou ácido carbônico, que neutralizou a base, e o pH caiu abaixo de 8,2, deixando a solução incolor.","D":"A solução inicial não era ácida (estava rosa e continha NaOH), e o pH não aumentou: o CO₂ dissolvido acidifica a água, fazendo o pH cair.","E":"Começa certo (alcalina), mas é contraditória: se o pH partiu de um valor acima de 8,2 e aumentou, jamais chegaria a um valor menor que 8,2. O CO₂ faz o pH diminuir."},"dica":"CO₂ é óxido ácido: dissolvido em água, forma H₂CO₃ e diminui o pH; com fenolftaleína, a cor rosa some quando o pH cai abaixo de 8,2.","dif":"média","nota":"","obs":""},{"id":"2025d1-40","n":40,"area":"Ciências da Natureza","disc":"Química","assunto":"Polaridade das moléculas e miscibilidade","titulo":"Arte Ebru: por que a tinta a óleo não se mistura com a água","gab":"B","base":null,"imgs":[{"src":"img/2025d1/q40_1.webp","w":783,"h":2022}],"alt":{"A":"imiscíveis, porque a água e a tinta a óleo são apolares.","B":"imiscíveis, porque a água é polar e a tinta a óleo é apolar.","C":"miscíveis, porque a água e a tinta a óleo são apolares.","D":"imiscíveis, porque a água é apolar e a tinta a óleo é polar.","E":"miscíveis, porque a água é polar e a tinta a óleo é apolar."},"res":"Ideia-chave: “semelhante dissolve semelhante”. Substâncias polares se misturam com polares, e apolares com apolares; polaridades diferentes resultam em líquidos imiscíveis.\n\nO próprio texto entrega a primeira parte: as tintas a óleo “não se misturam com água”, ou seja, são imiscíveis com ela. É por isso que a tinta permanece na superfície da água, formando o desenho que depois é transferido ao papel.\n\nAgora, a justificativa. A molécula de água (H₂O) é polar: as ligações O–H são polares (o oxigênio é bem mais eletronegativo que o hidrogênio) e a geometria angular não cancela esses dipolos. Além disso, as moléculas de água se atraem fortemente por ligações de hidrogênio.\n\nOs óleos são formados principalmente por longas cadeias de carbono e hidrogênio, com ligações praticamente apolares; por isso, a tinta a óleo é apolar. Como as moléculas de água interagem muito mais entre si do que com as do óleo, os dois líquidos ficam separados.\n\nResposta: (B) imiscíveis, porque a água é polar e a tinta a óleo é apolar.","pq":{"A":"Acerta em “imiscíveis”, mas erra a justificativa: a água é polar (molécula angular com ligações O–H polares). E, se as duas fossem apolares, elas se misturariam.","B":"Correta: água polar e óleo apolar têm polaridades diferentes, por isso não se misturam, o que permite que a tinta fique na superfície da água.","C":"O texto diz que as tintas a óleo “não se misturam com água”, logo não são miscíveis. Além disso, a água não é apolar.","D":"Inverte as polaridades: a água é que é polar, e o óleo, formado por cadeias de carbono e hidrogênio, é apolar.","E":"As polaridades estão certas, mas a conclusão não: polar com apolar forma mistura imiscível, e o texto afirma que as tintas “não se misturam com água”."},"dica":"Semelhante dissolve semelhante: água (polar) não se mistura com óleos e gorduras (apolares).","dif":"fácil","nota":"","obs":""},{"id":"2025d1-41","n":41,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Citologia – lisossomos e digestão intracelular","titulo":"Doença de Fabry e a organela responsável pela degradação celular","gab":"D","base":null,"imgs":[{"src":"img/2025d1/q41_1.webp","w":781,"h":1067}],"alt":{"A":"ribossomo.","B":"retículo endoplasmático rugoso.","C":"mitocôndria.","D":"lisossomo.","E":"centríolo."},"res":"Ideia-chave: a organela responsável pela digestão intracelular é o lisossomo, uma vesícula cheia de enzimas digestivas (hidrolases).\n\nO texto diz que a doença é caracterizada pela “ausência ou atividade reduzida de uma enzima responsável por parte da degradação de substâncias geradas nas células” e que, sem essa degradação, os tecidos “apresentam depósitos de substâncias geradas nas células”. Degradar (digerir) moléculas dentro da célula é justamente a função dos lisossomos: suas enzimas quebram macromoléculas, organelas velhas e material englobado pela célula (autofagia e heterofagia).\n\nQuando falta uma dessas enzimas, a substância que ela deveria quebrar se acumula dentro dos lisossomos e a célula vai ficando “entupida”. Por isso a doença de Fabry é classificada como uma doença de depósito (armazenamento) lisossômico. O acúmulo em células da pele, do coração, dos rins e do sistema nervoso explica os problemas citados no texto.\n\nResposta: (D) lisossomo.","pq":{"A":"O ribossomo faz a síntese de proteínas (tradução), não a degradação de substâncias. Ele até monta a enzima, mas quem digere o material dentro da célula é o lisossomo.","B":"O retículo endoplasmático rugoso, por ter ribossomos aderidos, sintetiza e transporta proteínas — inclusive as enzimas que vão para os lisossomos —, mas não é ele que realiza a digestão intracelular. A pegadinha é confundir quem fabrica a enzima com quem a usa.","C":"A mitocôndria realiza a respiração celular e produz ATP; ela oxida nutrientes para gerar energia, mas não é o compartimento de digestão e reciclagem cujo defeito causa depósitos de substâncias nos tecidos.","D":"Correta: os lisossomos guardam as enzimas digestivas da célula; se uma delas falta ou funciona pouco, a substância não é degradada e se acumula, exatamente como o texto descreve.","E":"O centríolo participa da divisão celular (organização do fuso) e da formação de cílios e flagelos; não tem nenhuma relação com a degradação de substâncias."},"dica":"Digestão intracelular e acúmulo de substâncias não degradadas apontam para o lisossomo; doenças como a de Fabry são chamadas de doenças de depósito lisossômico.","dif":"fácil","nota":"","obs":""},{"id":"2025d1-42","n":42,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Parasitologia – doenças transmitidas por vetores","titulo":"Vigilância entomológica e doença transmitida por inseto","gab":"A","base":null,"imgs":[{"src":"img/2025d1/q42_1.webp","w":783,"h":807}],"alt":{"A":"peste bubônica.","B":"sífilis.","C":"amebíase.","D":"toxoplasmose.","E":"hepatite B."},"res":"Ideia-chave: vigilância entomológica (entomologia = estudo dos insetos) só reduz diretamente as doenças que dependem de um inseto vetor para serem transmitidas.\n\nO texto define a ação como voltada a “doenças transmitidas por insetos” e ao “levantamento de informações a respeito dos vetores”. Entre as alternativas, a única doença transmitida por inseto é a peste bubônica: causada pela bactéria Yersinia pestis, ela passa de roedores (como ratos) para o ser humano pela picada da pulga — e a pulga é um inseto.\n\nAs demais não têm inseto vetor: sífilis e hepatite B são transmitidas por relação sexual, sangue ou da mãe para o filho; amebíase e toxoplasmose são adquiridas principalmente pela ingestão de água ou alimentos contaminados (cistos ou oocistos do parasita). Monitorar e controlar insetos não interrompe diretamente nenhuma dessas vias.\n\nResposta: (A) peste bubônica.","pq":{"A":"Correta: a peste bubônica é transmitida ao ser humano pela picada de pulgas infectadas, que vivem em roedores; monitorar e controlar esse inseto vetor reduz diretamente os casos.","B":"A sífilis é uma infecção sexualmente transmissível causada pela bactéria Treponema pallidum, passada por contato sexual ou da mãe para o feto; não há inseto envolvido, e a prevenção é feita com preservativo e pré-natal.","C":"A amebíase, causada pelo protozoário Entamoeba histolytica, é adquirida pela ingestão de cistos em água e alimentos contaminados por fezes; combate-se com saneamento básico e higiene, não com vigilância de vetores.","D":"A toxoplasmose, causada pelo protozoário Toxoplasma gondii, é adquirida pela ingestão de oocistos eliminados nas fezes de gatos ou de cistos em carne crua ou malpassada, além da transmissão da gestante para o feto. O gato é hospedeiro, não inseto vetor.","E":"A hepatite B é causada por um vírus transmitido por sangue, relação sexual e da mãe para o bebê; a prevenção é a vacina e o cuidado com materiais perfurocortantes, não o controle de insetos."},"dica":"“Entomológica” remete a insetos: procure a doença que tem inseto vetor (pulga na peste, mosquito na dengue e na malária, barbeiro na doença de Chagas).","dif":"média","nota":"","obs":""},{"id":"2025d1-43","n":43,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Evolução – cladograma dos vertebrados","titulo":"Cladograma com R. beckerorum: novidade evolutiva no ponto X","gab":"C","base":null,"imgs":[{"src":"img/2025d1/q43_1.webp","w":781,"h":1412}],"alt":{"A":"à placenta.","B":"ao coração com quatro cavidades.","C":"ao ovo amniótico.","D":"ao sistema circulatório fechado.","E":"ao sistema digestório completo."},"res":"Ideia-chave: num cladograma, uma característica marcada num ponto do tronco é uma novidade evolutiva compartilhada por todos os grupos que se ramificam depois desse ponto — e ausente nos que saíram antes.\n\nO ponto X fica depois da saída do sapo-cururu (anfíbio) e antes da saída de R. beckerorum. Logo, X é uma característica presente no réptil, na ema (ave) e na anta (mamífero), mas ausente no tucunaré (peixe ósseo) e no sapo-cururu.\n\nO caráter que reúne répteis, aves e mamíferos e os separa de peixes e anfíbios é o ovo amniótico: um ovo com anexos embrionários (âmnio, cório, alantoide e saco vitelínico) que protege o embrião contra a desidratação e permitiu a reprodução fora da água. Por isso esses três grupos são chamados de amniotas. Peixes e anfíbios têm ovos sem âmnio, que dependem de água ou de ambiente muito úmido.\n\nResposta: (C) ovo amniótico.","pq":{"A":"A placenta é típica dos mamíferos placentários; no cladograma ela apareceria só no ramo da anta, e não num ponto compartilhado também com o réptil e a ema.","B":"O coração com quatro cavidades totalmente separadas existe em aves e mamíferos, que o adquiriram de forma independente, e, entre os répteis atuais, só nos crocodilianos; a maioria dos répteis tem o ventrículo apenas parcialmente dividido. Como não é comum a todos os grupos que se ramificam depois de X, não pode ser a novidade desse ponto.","C":"Correta: o ovo amniótico surgiu depois da separação dos anfíbios e é compartilhado por répteis, aves e mamíferos (os amniotas), exatamente os grupos que se ramificam depois de X.","D":"O sistema circulatório fechado existe em todos os vertebrados, inclusive no tucunaré e no sapo-cururu; por isso ficaria na base do cladograma, antes da primeira ramificação, e não em X.","E":"Sistema digestório completo (com boca e ânus) existe em todos os cordados e em muitos invertebrados; é uma característica antiga, que também estaria na base da árvore, compartilhada com peixes e anfíbios."},"dica":"Para achar a novidade de um ponto do cladograma, veja quem se ramifica depois dele (tem a característica) e quem saiu antes (não tem): répteis + aves + mamíferos, sem peixes e anfíbios, são os amniotas.","dif":"média","nota":"","obs":""},{"id":"2025d1-44","n":44,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Genética molecular – transcrição","titulo":"Esquema de processo molecular: identificar o processo e o produto","gab":"C","base":null,"imgs":[{"src":"img/2025d1/q44_1.webp","w":783,"h":1030}],"alt":{"A":"transcrição e DNA.","B":"tradução e DNA.","C":"transcrição e RNA.","D":"tradução e RNA.","E":"duplicação e DNA."},"res":"Ideia-chave: observe quantas fitas do DNA servem de molde e o que sai no final — se só uma fita é copiada e o produto se solta como fita simples, o processo é a transcrição e o produto é RNA.\n\nNo esquema: (1) a dupla-hélice de DNA se abre em um trecho; (2) nucleotídeos livres se encaixam em apenas uma das fitas, por pareamento de bases; (3) forma-se uma fita nova (em vermelho) junto a esse molde, enquanto a outra fita do DNA fica sem nada pareado; (4) a fita nova se solta como uma molécula de fita simples, e o DNA volta a se fechar.\n\nUsar só uma fita como molde e liberar uma cópia unifilamentar é exatamente a transcrição, em que a enzima RNA polimerase sintetiza RNA a partir do DNA. Na duplicação, as duas fitas seriam copiadas e o resultado seriam duas duplas-hélices; na tradução, não há DNA aberto, e sim RNA mensageiro lido por ribossomos para formar proteína.\n\nResposta: (C) transcrição e RNA.","pq":{"A":"Acerta o processo, mas erra o produto: a transcrição fabrica RNA, não DNA. A molécula que se solta no fim é uma fita simples, e o DNA original se fecha de novo.","B":"Tradução é a síntese de proteína nos ribossomos a partir da leitura do RNA mensageiro; o esquema mostra o DNA aberto servindo de molde, sem ribossomo, e o produto também não é DNA.","C":"Correta: uma só fita do DNA serve de molde, a fita nova se solta e o DNA se fecha — isso é a transcrição, cujo produto é RNA.","D":"O produto é mesmo RNA, mas o processo não é tradução: na tradução o RNA é lido para formar uma cadeia de aminoácidos (proteína), e não fabricado a partir do DNA.","E":"Na duplicação (replicação), as duas fitas servem de molde e formam-se duas moléculas de DNA em dupla-hélice; no esquema só uma fita é copiada e o produto sai como fita simples."},"dica":"DNA → DNA é duplicação (duas fitas molde, duas duplas-hélices); DNA → RNA é transcrição (uma fita molde, produto de fita simples); RNA → proteína é tradução (no ribossomo).","dif":"fácil","nota":"","obs":""},{"id":"2025d1-45","n":45,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Ecologia – ciclo do nitrogênio","titulo":"Adubação verde com leguminosas no ciclo do nitrogênio","gab":"E","base":null,"imgs":[{"src":"img/2025d1/q45_1.webp","w":781,"h":1460}],"alt":{"A":"1, convertendo o gás nitrogênio em nitrato.","B":"2, ampliando a assimilação de amônia pela planta.","C":"3, convertendo nitrato em gás nitrogênio que retorna à atmosfera.","D":"2, transformando a matéria orgânica em nitrato.","E":"1, fixando o gás nitrogênio e transformando-o em amônia."},"res":"Ideia-chave: leguminosas (feijão, soja, ervilha etc.) vivem associadas a bactérias fixadoras, como as do gênero Rhizobium, que ficam em nódulos das raízes e fixam o N₂ do ar, transformando-o em amônia (NH₃).\n\nO solo pobre em nitrogênio recebe leguminosas justamente porque elas trazem para o sistema o nitrogênio que estava na atmosfera, numa forma que os seres vivos conseguem usar. Na figura, a etapa 1 está indicada como “Bactérias fixadoras de nitrogênio” e leva ao NH₃: é a fixação biológica do nitrogênio.\n\nAs outras etapas numeradas são diferentes: na etapa 2, bactérias nitrificantes oxidam o amônio (NH₄⁺) a nitrito (NO₂⁻) e depois a nitrato (NO₃⁻); na etapa 3, bactérias desnitrificantes transformam nitrato em N₂, que volta à atmosfera. A amonificação (matéria orgânica → amônia) aparece na figura sem número.\n\nResposta: (E) 1, fixando o gás nitrogênio e transformando-o em amônia.","pq":{"A":"A etapa 1 é a certa, mas o produto não: a fixação converte N₂ em amônia (NH₃), e não em nitrato. O nitrato só aparece depois, na nitrificação (etapa 2).","B":"A etapa 2 é a nitrificação, feita por bactérias que oxidam a amônia a nitrito e nitrato; não é ali que atuam as leguminosas, cujo papel na adubação verde é fixar o N₂ (etapa 1).","C":"A etapa 3 é a desnitrificação, que devolve nitrogênio à atmosfera e, portanto, empobrece o solo — o oposto do objetivo da adubação verde.","D":"A etapa 2 converte amônia em nitrito e depois em nitrato; quem transforma matéria orgânica em amônia é a amonificação, feita por decompositores. Nenhuma das duas é a ação das leguminosas.","E":"Correta: as leguminosas abrigam bactérias fixadoras (Rhizobium) que convertem o N₂ atmosférico em amônia, a etapa 1 da figura."},"dica":"Leguminosa + Rhizobium = fixação biológica (N₂ → NH₃); nitrificação faz NH₃ → NO₂⁻ → NO₃⁻; desnitrificação devolve NO₃⁻ → N₂ para o ar.","dif":"média","nota":"","obs":""},{"id":"2025d1-46","n":46,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Método científico","titulo":"Etapas do método científico em experimento com luz e espessura de folhas","gab":"D","base":null,"imgs":[{"src":"img/2025d1/q46_1.webp","w":783,"h":1361}],"alt":{"A":"formulação de hipóteses, experimentação e conclusão.","B":"formulação de hipóteses, experimentação e análise de resultados.","C":"observação do fenômeno, formulação de hipóteses e análise de resultados.","D":"observação do fenômeno, formulação de hipóteses e experimentação.","E":"observação do fenômeno, experimentação e conclusão."},"res":"Ideia-chave: identifique cada etapa pelo que o estudante faz: perceber algo (observação), propor uma explicação testável (hipótese), testar em condições controladas (experimentação), interpretar os dados (análise) e responder à pergunta (conclusão).\n\nObservação: “Um estudante notou que duas plantas de uma mesma espécie [...] apresentavam folhas com diferentes características físicas”, mais grossas ao sol.\n\nHipótese: “Ele então imaginou que a luminosidade intensa poderia estar estimulando a planta a produzir mais tecido fotossintetizante”, com uma previsão: “plantas cultivadas sob baixa luminosidade apresentariam uma menor quantidade de tecido fotossintetizante”.\n\nExperimentação: ele decidiu “cultivar, por 30 dias, várias mudas idênticas”, “variando apenas a intensidade da luz fornecida”, e ao final “mediu a espessura das folhas” — medir é coleta de dados, parte do experimento.\n\nO texto para aí: não informa os resultados, não os compara e não diz se a hipótese foi confirmada. Portanto, não há análise de resultados nem conclusão.\n\nResposta: (D).","pq":{"A":"Deixa de fora a observação, que abre o texto (o estudante “notou” as folhas diferentes), e inclui uma conclusão que não aparece: o texto não diz se a hipótese foi confirmada ou refutada.","B":"Omite a observação inicial e inclui análise de resultados, que o texto não traz: o estudante mede as folhas, mas nenhum dado é apresentado ou comparado. Medir ainda é coleta de dados, dentro da experimentação.","C":"Acerta observação e hipótese, mas troca a experimentação (o cultivo controlado por 30 dias, que está descrito) por análise de resultados, que não está.","D":"Correta: o texto descreve a observação das folhas diferentes, a hipótese sobre a luminosidade e o experimento controlado com medições — e termina antes de qualquer análise ou conclusão.","E":"Pula a formulação de hipóteses, claramente presente em “imaginou que a luminosidade intensa poderia estar estimulando a planta”, e inclui uma conclusão que o texto não apresenta."},"dica":"Em questões de método científico, marque só as etapas que o texto realmente mostra: se nenhum resultado é apresentado, não há análise nem conclusão.","dif":"fácil","nota":"","obs":""},{"id":"2025d1-47","n":47,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Genética – herança autossômica dominante (heredograma)","titulo":"Acondroplasia: genótipos de II-1 e II-4 no heredograma","gab":"A","base":null,"imgs":[{"src":"img/2025d1/q47_1.webp","w":781,"h":1122}],"alt":{"A":"aa e Aa.","B":"aa e AA.","C":"Aa e AA.","D":"Aa e aa.","E":"AA e Aa."},"res":"Ideia-chave: na herança autossômica dominante, afetados são AA ou Aa e normais são aa; a proporção esperada entre os filhos de um casal revela o genótipo do parceiro desconhecido.\n\n1) II-2 e II-3 são afetadas, mas a mãe I-2 é normal (aa) e só pode ter passado o alelo a. Logo, as duas são Aa.\n\n2) O casal II-1 × II-2 tem 50% de chance de filho afetado.\naa × Aa → 1/2 Aa (afetado) : 1/2 aa (normal) = 50%\nJá Aa × Aa daria 75% e AA × Aa daria 100%. Então II-1 é aa.\n\n3) II-4, cruzado com II-3 (Aa):\nAa × aa → 1/2 Aa : 1/2 aa\nAa × AA → 1/2 AA : 1/2 Aa\nAa × Aa → 1/4 AA : 2/4 Aa : 1/4 aa\nSó Aa × Aa gera uma proporção de 1/4 (25%); por isso II-4 = Aa.\n\nAtenção: nesse cruzamento, 25% é a chance de um filho **sem** acondroplasia (aa), ou de um filho AA; a de filho afetado é 1/4 + 2/4 = 3/4 (75%). Lembrar que o homozigoto AA geralmente não sobrevive também não leva a 25%: entre os filhos que sobrevivem, 2/3 seriam afetados. O enunciado tem essa imprecisão, mas a (A) é a única alternativa coerente com os dados.\n\nResposta: (A) aa e Aa.","pq":{"A":"Correta: II-1 é aa porque aa × Aa dá 50% de afetados; II-4 é Aa porque, com II-3 = Aa, só o cruzamento Aa × Aa gera uma proporção de 1/4 (25%). A rigor, esses 25% são a chance de um filho sem a síndrome (aa), não com ela.","B":"II-1 = aa está certo, mas II-4 = AA tornaria todos os filhos do casal afetados (Aa × AA → 1/2 AA + 1/2 Aa = 100%), longe dos 25% informados.","C":"Se II-1 fosse Aa, o casal Aa × Aa teria 75% de chance de filho afetado, e não 50%. E II-4 = AA daria 100% de afetados com II-3.","D":"Inverte os genótipos: II-1 = Aa daria 75% de afetados com II-2, e II-4 = aa daria 50% com II-3 — nenhum dos dois bate com os valores do enunciado.","E":"II-1 = AA faria 100% dos filhos com II-2 afetados (AA × Aa → 1/2 AA + 1/2 Aa), contrariando os 50% do enunciado."},"dica":"Na herança dominante, 50% de afetados indica Aa × aa, 100% indica que um dos pais é AA, e proporções de 1/4 só aparecem quando os dois pais são heterozigotos (Aa × Aa).","dif":"média","nota":"Este enunciado tem uma imprecisão. Com II-3 = Aa, nenhum genótipo de II-4 dá 25% de chance de filho com acondroplasia (com aa seriam 50%, com Aa 75% e com AA 100%); os 25% só aparecem no cruzamento Aa × Aa, como a chance de um filho sem a síndrome. Por isso a resposta oficial continua sendo a (A): II-1 = aa pelos 50% e II-4 = Aa, o único genótipo que gera uma proporção de 1/4.","obs":""},{"id":"2025d1-48","n":48,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Evolução – teoria sintética","titulo":"Miniaturização do sapo-pulga segundo a teoria sintética da evolução","gab":"C","base":null,"imgs":[{"src":"img/2025d1/q48_1.webp","w":783,"h":1932}],"alt":{"A":"pela ação da deriva genética que atua sobre os indivíduos mais aptos de uma população, garantindo o surgimento de novas espécies.","B":"pelo uso reduzido de determinados órgãos, o que levou à sua atrofia e posterior herança dessa característica pelos descendentes.","C":"por meio de mutações aleatórias que, ao surgirem e conferirem vantagem adaptativa, foram selecionadas naturalmente ao longo das gerações.","D":"pelo maior sucesso reprodutivo de indivíduos com características vantajosas, como corpo compacto e aumento do número de ossos por fragmentação.","E":"por mudanças fenotípicas induzidas pelas condições ambientais, sem envolvimento de alterações genéticas."},"res":"Ideia-chave: a teoria sintética (neodarwinismo) une a seleção natural de Darwin à genética: a variação surge ao acaso, por mutação e recombinação, e a seleção natural favorece as variantes vantajosas, que aumentam de frequência ao longo das gerações.\n\nAplicando ao sapo-pulga: em populações ancestrais surgiram, aleatoriamente, mutações que alteravam o desenvolvimento e reduziam o tamanho do corpo e de certas estruturas. Essas mutações não apareceram “para” o animal ficar pequeno; surgiram por acaso. Como, naquele ambiente, ser menor trouxe vantagem adaptativa, os portadores dessas variantes sobreviveram e se reproduziram mais, passando os alelos adiante. Ao longo de muitas gerações, a seleção natural acumulou essas alterações, resultando na miniaturização descrita no texto, com “ausência de alguns ossos cranianos e de ouvido, bem como a ausência de alguns dentes e de tímpano externo”.\n\nO ponto central: a mudança é genética e herdável, e a direção é dada pela seleção, não pelo uso dos órgãos nem pelo ambiente agindo diretamente sobre o corpo.\n\nResposta: (C).","pq":{"A":"Deriva genética é a mudança de frequências alélicas por puro acaso, que não atua preferencialmente sobre os “mais aptos” — quem favorece os mais aptos é a seleção natural. Além disso, nenhum mecanismo “garante” o surgimento de novas espécies.","B":"É a lei do uso e desuso com herança dos caracteres adquiridos, de Lamarck; a teoria sintética rejeita essa ideia, pois a atrofia de um órgão por pouco uso não altera o DNA e não passa para os filhos.","C":"Correta: é a explicação neodarwinista — mutações aleatórias geram variação, e a seleção natural mantém e acumula as vantajosas ao longo das gerações.","D":"Começa bem (maior sucesso reprodutivo dos portadores de características vantajosas), mas inventa um “aumento do número de ossos por fragmentação”, o contrário do texto, que descreve a ausência de alguns ossos.","E":"Mudanças fenotípicas induzidas pelo ambiente, sem alteração genética, não são herdadas e por isso não explicam a evolução; a teoria sintética exige variação genética como matéria-prima."},"dica":"Teoria sintética = mutação e recombinação (variação ao acaso) + seleção natural; desconfie de alternativas com “uso e desuso”, “herança de caracteres adquiridos” ou mudança sem base genética.","dif":"fácil","nota":"","obs":""}],"grupos":{"01-05":{"rotulo":"01 a 05","imgs":[{"src":"img/2025d1/g01-05_1.webp","w":781,"h":1642}]},"03-05":{"rotulo":"03 a 05","imgs":[{"src":"img/2025d1/g03-05_1.webp","w":781,"h":1042}]},"06-08":{"rotulo":"06 a 08","imgs":[{"src":"img/2025d1/g06-08_1.webp","w":781,"h":1608}]},"09-10":{"rotulo":"09 e 10","imgs":[{"src":"img/2025d1/g09-10_1.webp","w":781,"h":836}]},"11-12":{"rotulo":"11 e 12","imgs":[{"src":"img/2025d1/g11-12_1.webp","w":785,"h":1221}]},"19-21":{"rotulo":"19 a 21","imgs":[{"src":"img/2025d1/g19-21_1.webp","w":784,"h":1357}]},"35-36":{"rotulo":"35 e 36","imgs":[{"src":"img/2025d1/g35-36_1.webp","w":781,"h":1247}]}},"anexos":[{"titulo":"Classificação periódica","src":"img/2025d1/tabela-periodica.webp","w":2024,"h":1146,"disc":"Química"}]},"2025d2":{"ano":2025,"dia":2,"descricao":"Matemática e Ciências Humanas (História, Geografia, Filosofia, Sociologia).","questoes":[{"id":"2025d2-01","n":1,"area":"Matemática","disc":"Matemática","assunto":"Área de figuras planas","titulo":"Chapa quadrada de alumínio: área que sobra após cortar 49 discos","gab":"D","base":null,"imgs":[{"src":"img/2025d2/q01_1.webp","w":781,"h":1184}],"alt":{"A":"1 755 cm².","B":"4 320 cm².","C":"3 125 cm².","D":"2 650 cm².","E":"850 cm²."},"res":"Ideia-chave: a sobra é a área da chapa menos a área total dos discos retirados.\n\nÁrea da chapa (quadrado de lado 100 cm):\n100 × 100 = 10 000 cm²\n\nÁrea dos 49 discos (cada um com 150 cm²):\n49 × 150 = 7 350 cm²\n\nSobra:\n10 000 − 7 350 = 2 650 cm²\n\nConferência: a figura mostra 7 fileiras com 7 discos cada (7 × 7 = 49), e os discos cobrem 7 350/10 000 = 73,5% da chapa, sobrando 26,5% de 10 000, ou seja, 2 650 cm². Repare que não é preciso usar π nem calcular raio: a área de cada disco já foi dada no enunciado.","pq":{"A":"Para sobrar 1 755 cm², os discos teriam de ocupar 10 000 − 1 755 = 8 245 cm², o que dá cerca de 55 discos de 150 cm², e não 49. O valor não sai da conta 10 000 − 49 × 150.","B":"Sobrar 4 320 cm² significaria retirar só 5 680 cm², menos de 38 discos de 150 cm². Subestima a área retirada, que é 49 × 150 = 7 350 cm².","C":"3 125 cm² corresponde a retirar 6 875 cm², cerca de 45,8 discos, que nem é um número inteiro de discos. A área retirada correta é 49 × 150 = 7 350 cm².","D":"Correta: 10 000 − 49 × 150 = 10 000 − 7 350 = 2 650 cm².","E":"Só sobrariam 850 cm² se fossem retirados 10 000 − 850 = 9 150 cm², isto é, 9 150 ÷ 150 = 61 discos, 12 a mais que os 49 da figura."},"dica":"Área que sobra = área total − área retirada; quando a área de cada peça já é dada, basta multiplicá-la pela quantidade de peças.","dif":"fácil","nota":"","obs":""},{"id":"2025d2-02","n":2,"area":"Matemática","disc":"Matemática","assunto":"Função afim – leitura de gráfico","titulo":"Pressão da água em função da profundidade: valor a 70 m","gab":"E","base":null,"imgs":[{"src":"img/2025d2/q02_1.webp","w":783,"h":1103}],"alt":{"A":"7,5 atmosferas.","B":"7,2 atmosferas.","C":"7,7 atmosferas.","D":"7,0 atmosferas.","E":"8,0 atmosferas."},"res":"Ideia-chave: o gráfico é uma reta que passa por (0, 1) e (100, 11); basta achar a lei P(d) = a·d + b e calcular P(70).\n\nValor inicial (onde a reta corta o eixo P):\nb = 1\n\nTaxa de variação:\na = (11 − 1)/(100 − 0) = 10/100 = 0,1 atm por metro\n\nLei da função:\nP(d) = 0,1·d + 1\n\nA 70 m:\nP(70) = 0,1 × 70 + 1\nP(70) = 7 + 1 = 8 atm\n\nConferência: de 70 m até 100 m faltam 30 m, que valem 0,1 × 30 = 3 atm; 11 − 3 = 8 atm.\n\nAtenção: o texto fala em “proporcional” e em “função linear”, mas a reta do gráfico não passa pela origem: em d = 0 a pressão já vale 1 atm (a pressão do ar na superfície). O que é proporcional à profundidade é só o acréscimo de pressão, P − 1 = 0,1·d; a própria P(d) = 0,1·d + 1 é uma função afim. Por isso não dá para fazer regra de três direta entre 11 atm e 100 m.","pq":{"A":"7,5 atm não está sobre a reta: exigiria uma taxa de (7,5 − 1)/70 ≈ 0,093 atm por metro, diferente dos 0,1 atm por metro do gráfico (10 atm a cada 100 m).","B":"7,2 atm corresponderia a uma taxa de (7,2 − 1)/70 ≈ 0,089 atm por metro, que não é a do gráfico. Com a taxa correta, a 70 m o acréscimo é de 7 atm sobre o 1 atm inicial.","C":"7,7 aparece na regra de três direta “100 m → 11 atm, 70 m → x”, ou seja, 0,7 × 11 = 7,7. Isso trata a função como se passasse pela origem, ignorando que a reta começa em 1 atm.","D":"7,0 é só o acréscimo de pressão (0,1 × 70 = 7); faltou somar o 1 atm que já existe na superfície (d = 0).","E":"Correta: P(d) = 0,1d + 1, logo P(70) = 7 + 1 = 8 atm."},"dica":"Em gráfico de função afim, leia o valor inicial no eixo vertical (b) e calcule a taxa a = Δy/Δx; regra de três direta só vale quando a reta passa pela origem.","dif":"fácil","nota":"","obs":""},{"id":"2025d2-03","n":3,"area":"Matemática","disc":"Matemática","assunto":"Função exponencial","titulo":"Temperatura de um bolo após 20 minutos fora do forno (função exponencial)","gab":"A","base":null,"imgs":[{"src":"img/2025d2/q03_1.webp","w":781,"h":649}],"alt":{"A":"30 °C.","B":"50 °C.","C":"40 °C.","D":"20 °C.","E":"60 °C."},"res":"Ideia-chave: substituir s = 20 em T(s) = 20 + 160 · 2^(−0,2s) e calcular com cuidado a potência de expoente negativo.\n\nExpoente:\n−0,2 × 20 = −4\n\nPotência:\n2⁻⁴ = 1/2⁴ = 1/16\n\nTemperatura:\nT(20) = 20 + 160 · 1/16\nT(20) = 20 + 10\nT(20) = 30 °C\n\nConferência: a cada 5 minutos o expoente diminui 1, então a parcela 160 cai pela metade: 160 → 80 (5 min) → 40 (10 min) → 20 (15 min) → 10 (20 min). Somando os 20 °C fixos, após 20 minutos o bolo está a 30 °C. E em s = 0 a fórmula dá 20 + 160 = 180 °C, exatamente a temperatura de saída do forno citada no enunciado.","pq":{"A":"Correta: 2^(−0,2·20) = 2⁻⁴ = 1/16, e 20 + 160/16 = 20 + 10 = 30 °C.","B":"50 °C exigiria 160 · 2^(−0,2s) = 30, isto é, um fator de 3/16, que não é potência de 2. Com s = 20 o fator é exatamente 1/16, o que dá 10, e não 30.","C":"40 °C sai de 20 + 160/8 = 20 + 20, erro típico de calcular 2⁴ como 2 × 4 = 8 (ou usar 2⁻³). Esse valor é a temperatura aos 15 minutos, não aos 20.","D":"20 °C é a temperatura-limite (a do ambiente), da qual o bolo se aproxima sem atingir, pois 160 · 2^(−0,2s) nunca vale zero. Marca quem despreza a parcela exponencial.","E":"60 °C sai de 20 + 160/4 = 20 + 40, isto é, de usar 2⁻² em vez de 2⁻⁴ (errando o expoente −0,2 × 20). É a temperatura aos 10 minutos."},"dica":"Potência de expoente negativo é o inverso: 2⁻⁴ = 1/2⁴ = 1/16. Calcule primeiro o expoente, depois a potência, e só então multiplique e some.","dif":"fácil","nota":"","obs":""},{"id":"2025d2-04","n":4,"area":"Matemática","disc":"Matemática","assunto":"Lei dos cossenos","titulo":"Abertura do compasso: raio da circunferência pela lei dos cossenos","gab":"B","base":null,"imgs":[{"src":"img/2025d2/q04_1.webp","w":783,"h":1552}],"alt":{"A":"7 cm.","B":"8 cm.","C":"5 cm.","D":"6 cm.","E":"9 cm."},"res":"Ideia-chave: as duas hastes (12 cm cada) e a distância entre a ponta seca e o grafite formam um triângulo isósceles. Essa distância é o raio r da circunferência e é o lado oposto ao ângulo α. Use a lei dos cossenos.\n\nr² = 12² + 12² − 2 · 12 · 12 · cos(α)\nr² = 144 + 144 − 288 · 7/9\nr² = 288 − 224\nr² = 64\nr = 8 cm\n\n(Detalhe da conta: 288 · 7/9 = 32 · 7 = 224.)\n\nConferência por outro caminho: a altura do triângulo isósceles divide α ao meio. Como cos(α) = 1 − 2·sen²(α/2), temos 7/9 = 1 − 2·sen²(α/2), logo sen²(α/2) = 1/9 e sen(α/2) = 1/3. Cada metade do raio vale 12 · 1/3 = 4 cm, então r = 2 · 4 = 8 cm.","pq":{"A":"7 cm é apenas o numerador do cosseno (7/9) tomado como medida; não vem da lei dos cossenos. Com r = 7 teríamos cos(α) = (288 − 49)/288 = 239/288, e não 7/9.","B":"Correta: r² = 144 + 144 − 288 · 7/9 = 288 − 224 = 64, logo r = 8 cm.","C":"5 cm não satisfaz a lei dos cossenos: daria cos(α) = (288 − 25)/288 = 263/288 ≈ 0,91, uma abertura menor que a do enunciado (7/9 ≈ 0,78).","D":"6 cm é a metade da haste, um chute comum. Mas com r = 6 a lei dos cossenos daria cos(α) = (288 − 36)/288 = 252/288 = 7/8, e não 7/9.","E":"9 cm é o denominador do cosseno usado como medida. Com r = 9, cos(α) = (288 − 81)/288 = 207/288 = 23/32 ≈ 0,72, diferente de 7/9."},"dica":"Conhece dois lados e o ângulo entre eles? Use a lei dos cossenos: a² = b² + c² − 2bc·cos(Â), em que a é o lado oposto ao ângulo.","dif":"média","nota":"","obs":""},{"id":"2025d2-05","n":5,"area":"Matemática","disc":"Matemática","assunto":"Trigonometria no triângulo retângulo","titulo":"Triângulo retângulo ABC com ponto D em AC: ângulo β e sen(α)","gab":"E","base":null,"imgs":[{"src":"img/2025d2/q05_1.webp","w":781,"h":1126}],"alt":{"A":"β = 45° e sen(α) = 5/7","B":"β = 60° e sen(α) = 5/13","C":"β = 60° e sen(α) = 5/12","D":"β = 30° e sen(α) = 5/7","E":"β = 45° e sen(α) = 5/13"},"res":"Ideia-chave: o triângulo BCD é retângulo em C com catetos iguais (DC = BC = 5 cm), e o triângulo ABC é retângulo com catetos AC e BC.\n\nÂngulo β (no triângulo BCD):\ntg(β) = BC/DC = 5/5 = 1\nβ = 45°\n(triângulo retângulo isósceles: os dois ângulos agudos valem 45°)\n\nTriângulo ABC:\nAC = AD + DC = 7 + 5 = 12 cm\nAB² = AC² + BC² = 12² + 5² = 144 + 25 = 169\nAB = 13 cm\n\nSeno de α (cateto oposto a α sobre a hipotenusa):\nsen(α) = BC/AB = 5/13\n\nConferência: 5, 12, 13 é um terno pitagórico conhecido (25 + 144 = 169). Resposta: β = 45° e sen(α) = 5/13.","pq":{"A":"β = 45° está certo, mas 5/7 divide BC pelo segmento AD, que não é a hipotenusa do triângulo de α. A hipotenusa é AB = 13 cm, então sen(α) = 5/13.","B":"sen(α) = 5/13 está certo, mas β não é 60°: no triângulo BCD os catetos são iguais (5 e 5), então tg(β) = 1 e β = 45°. Para dar 60°, BC teria de medir 5√3 ≈ 8,7 cm.","C":"Erra as duas partes: β = 60° ignora que os catetos DC e BC são iguais, e 5/12 é BC/AC, ou seja, a tangente de α (oposto/adjacente), e não o seno.","D":"β = 30° está errado (catetos iguais dão 45°) e 5/7 usa AD como se fosse a hipotenusa, em vez de AB = 13 cm.","E":"Correta: catetos iguais no triângulo BCD dão β = 45°, e com AC = 12 cm e AB = 13 cm, sen(α) = 5/13."},"dica":"Triângulo retângulo com catetos iguais tem ângulos agudos de 45°; e lembre: seno = oposto/hipotenusa, tangente = oposto/adjacente.","dif":"fácil","nota":"","obs":""},{"id":"2025d2-06","n":6,"area":"Matemática","disc":"Matemática","assunto":"Semelhança de triângulos","titulo":"Triângulos semelhantes ABC e DAC: comprimento de BC","gab":"C","base":null,"imgs":[{"src":"img/2025d2/q06_1.webp","w":783,"h":1232}],"alt":{"A":"8,5 cm.","B":"8,0 cm.","C":"9,0 cm.","D":"7,5 cm.","E":"7,0 cm."},"res":"Ideia-chave: os triângulos ABC e DAC são semelhantes pelo caso AA: os dois têm um ângulo α (em B no primeiro, em A no segundo) e têm o ângulo C em comum.\n\nCorrespondência dos vértices: B ↔ A, C ↔ C, A ↔ D.\nLados correspondentes: AC (oposto a α em ABC) ↔ DC (oposto a α em DAC); BC ↔ AC.\n\nProporção:\nAC/DC = BC/AC\nAC² = DC · BC\n\nChamando BC = x, temos DC = x − 5:\n6² = (x − 5) · x\n36 = x² − 5x\nx² − 5x − 36 = 0\nΔ = 25 + 144 = 169, √Δ = 13\nx = (5 + 13)/2 = 9 (a outra raiz, −4, não serve como medida)\n\nBC = 9 cm\n\nConferência: DC = 9 − 5 = 4 cm e DC · BC = 4 · 9 = 36 = 6². A razão de semelhança é 4/6 = 6/9 = 2/3.","pq":{"A":"8,5 aparece se, na fórmula de Bhaskara, o Δ for calculado sem o b² (Δ = 144, √Δ = 12, x = (5 + 12)/2 = 8,5). Conferindo: DC = 3,5 e 3,5 · 8,5 = 29,75 ≠ 36.","B":"Com BC = 8 teríamos DC = 3 e DC · BC = 24, não 36 = AC². A razão 3/6 seria diferente de 6/8, então os triângulos não seriam semelhantes.","C":"Correta: pela semelhança, AC² = DC · BC, ou seja, 36 = x(x − 5), que dá x = 9 cm.","D":"Com BC = 7,5 teríamos DC = 2,5 e DC · BC = 18,75 ≠ 36 = AC². A razão 2,5/6 ≈ 0,42 também não é igual a 6/7,5 = 0,8, então a proporção da semelhança não se mantém.","E":"Com BC = 7, DC = 2 e DC · BC = 14 ≠ 36; a razão 2/6 não é igual a 6/7. O valor 7 também não é raiz de x² − 5x − 36 = 0."},"dica":"Dois ângulos iguais garantem semelhança; para montar a proporção, pareie os lados opostos aos ângulos iguais (aqui sai AC² = DC · BC).","dif":"difícil","nota":"","obs":""},{"id":"2025d2-07","n":7,"area":"Matemática","disc":"Matemática","assunto":"Gráfico de setores (pizza)","titulo":"Gráfico de pizza dos gastos de uma família: legenda correta","gab":"D","base":null,"imgs":[{"src":"img/2025d2/q07_1.webp","w":781,"h":1226},{"src":"img/2025d2/q07_2.webp","w":717,"h":1705}],"alt":{"A":"[legenda: amarelo – Alimentação; rosa – Saúde; verde-claro – Aluguel; laranja – Contas; cinza – Transporte]","B":"[legenda: amarelo – Transporte; rosa – Saúde; verde-claro – Contas; laranja – Alimentação; cinza – Aluguel]","C":"[legenda: amarelo – Contas; rosa – Saúde; verde-claro – Alimentação; laranja – Aluguel; cinza – Transporte]","D":"[legenda: amarelo – Transporte; rosa – Saúde; verde-claro – Aluguel; laranja – Alimentação; cinza – Contas]","E":"[legenda: amarelo – Saúde; rosa – Transporte; verde-claro – Aluguel; laranja – Alimentação; cinza – Contas]"},"res":"Ideia-chave: no gráfico de pizza, cada fatia é proporcional à fração do total. Calcule as porcentagens e compare com o tamanho de cada cor.\n\nTotal: 900 + 750 + 600 + 300 + 450 = R$ 3 000,00\n\nAlimentação: 900/3 000 = 30% → 0,30 × 360° = 108°\nAluguel: 750/3 000 = 25% → 90°\nContas: 600/3 000 = 20% → 72°\nSaúde: 450/3 000 = 15% → 54°\nTransporte: 300/3 000 = 10% → 36°\n\nNo gráfico:\nverde-claro: exatamente um quarto do círculo (ângulo reto) → 25% → Aluguel\nlaranja: a maior fatia, um pouco mais que um quarto → 30% → Alimentação\ncinza: vai até o raio horizontal da esquerda, um pouco menos que um quarto → 20% → Contas\nrosa: fatia intermediária pequena → 15% → Saúde\namarelo: a menor fatia → 10% → Transporte\n\nA legenda amarelo – Transporte, rosa – Saúde, verde-claro – Aluguel, laranja – Alimentação, cinza – Contas é a da alternativa D.","pq":{"A":"Põe Alimentação (30%, o maior gasto) no amarelo, que é a menor fatia, Contas no laranja (a maior fatia) e Transporte no cinza. Só Saúde (rosa) e Aluguel (verde-claro) estão certos.","B":"Acerta Transporte, Saúde e Alimentação, mas troca Aluguel e Contas: o verde-claro é exatamente um quarto do círculo (25% = Aluguel), e não 20% (Contas); o cinza é que vale 20%.","C":"Só acerta Saúde (rosa). O verde-claro, um quarto exato, não pode ser Alimentação (30%); o laranja, a maior fatia, não é Aluguel (25%); e o amarelo, a menor, não é Contas (20%).","D":"Correta: amarelo 10% Transporte, rosa 15% Saúde, verde-claro 25% Aluguel, laranja 30% Alimentação e cinza 20% Contas.","E":"Troca Saúde e Transporte: o amarelo é a menor fatia (10%, Transporte) e o rosa é um pouco maior (15%, Saúde). O resto está certo, por isso é uma pegadinha de atenção."},"dica":"Em gráfico de pizza, comece pelas fatias fáceis de reconhecer (um quarto = 25%, a maior, a menor) e use-as como âncora para as demais.","dif":"média","nota":"","obs":""},{"id":"2025d2-08","n":8,"area":"Matemática","disc":"Matemática","assunto":"Variação percentual","titulo":"Filmes em plataforma de streaming: ano de maior aumento percentual","gab":"A","base":null,"imgs":[{"src":"img/2025d2/q08_1.webp","w":781,"h":1130}],"alt":{"A":"2020","B":"2023","C":"2019","D":"2021","E":"2022"},"res":"Ideia-chave: aumento percentual = (valor do ano − valor do ano anterior) ÷ valor do ano anterior. Não basta olhar o maior salto em número absoluto.\n\n2019: (2 100 − 2 000)/2 000 = 100/2 000 = 5%\n2020: (2 625 − 2 100)/2 100 = 525/2 100 = 25%\n2021: (3 150 − 2 625)/2 625 = 525/2 625 = 20%\n2022: (3 276 − 3 150)/3 150 = 126/3 150 = 4%\n2023: (3 500 − 3 276)/3 276 = 224/3 276 ≈ 6,8%\n\nO maior aumento percentual foi em 2020 (25%).\n\nConferência: 2 100 × 1,25 = 2 625, confere.\n\nRepare na pegadinha: 2020 e 2021 tiveram o mesmo aumento absoluto (525 filmes), mas em 2021 a base era maior (2 625), então o percentual foi menor (20%).","pq":{"A":"Correta: 525/2 100 = 0,25 = 25%, o maior aumento percentual da série.","B":"Em 2023 o aumento foi
