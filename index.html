ama da base para as pontas: todo grupo que sai depois de uma marca no tronco tem aquela característica, e os que saíram antes dela não têm.","dif":"média","nota":"","obs":""},{"id":"2023d1-30","n":30,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Fisiologia – sistema excretor e formação da urina","titulo":"Processos 1, 2 e 3 entre o vaso sanguíneo e o néfron","gab":"D","base":null,"imgs":[{"src":"img/2023d1/q30_1.webp","w":783,"h":1037}],"alt":{"A":"secreção capsular, absorção tubular e secreção tubular.","B":"secreção capsular, reabsorção tubular e excreção tubular.","C":"secreção capsular, absorção tubular e excreção tubular.","D":"filtração glomerular, reabsorção tubular e secreção tubular.","E":"filtração glomerular, absorção tubular e excreção tubular."},"res":"Ideia-chave: observe o sentido de cada seta, de onde ela sai e para onde vai.\n\n**Seta 1:** sai do glomérulo (o novelo de capilares entre as arteríolas) e entra na cápsula do néfron (cápsula de Bowman). A pressão do sangue empurra água e pequenos solutos para dentro da cápsula, formando o filtrado. Esse processo é a **filtração glomerular**.\n\n**Seta 2:** sai do túbulo e vai para os capilares. Substâncias úteis do filtrado, como água, glicose, aminoácidos e sais, voltam para o sangue. Como elas já estavam no sangue antes, o processo se chama **reabsorção tubular**.\n\n**Seta 3:** sai dos capilares e vai para o túbulo. O sangue lança no túbulo substâncias como íons H⁺ e K⁺ e certos medicamentos, que serão eliminadas na urina. Esse processo é a **secreção tubular**.\n\nA sequência é filtração glomerular, reabsorção tubular e secreção tubular: alternativa D.","pq":{"A":"\"Secreção capsular\" não existe: a passagem do sangue do glomérulo para a cápsula é uma filtração movida pela pressão sanguínea. O processo 2 é reabsorção (as substâncias voltam ao sangue), não \"absorção\". Só o item 3 está certo.","B":"Acerta a reabsorção tubular, mas erra o processo 1 (\"secreção capsular\" em vez de filtração glomerular) e o 3: a passagem do capilar para o túbulo se chama secreção tubular. Excreção é a eliminação de resíduos do metabolismo pelo organismo, e não o nome dessa etapa do néfron.","C":"Erra os três termos: o 1 é filtração glomerular, o 2 é reabsorção (retorno ao sangue) e o 3 é secreção tubular, não excreção.","D":"Correta: 1 = filtração glomerular (sangue → cápsula), 2 = reabsorção tubular (túbulo → sangue), 3 = secreção tubular (sangue → túbulo).","E":"Acerta a filtração glomerular, mas chama o processo 2 de \"absorção\" (o certo é reabsorção, porque as substâncias voltam ao sangue) e o 3 de \"excreção\" (o certo é secreção tubular)."},"dica":"Filtração: sangue → cápsula; reabsorção: túbulo → sangue; secreção: sangue → túbulo. O sentido da seta dá o nome do processo.","dif":"média","nota":"","obs":""},{"id":"2023d1-31","n":31,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Evolução – neodarwinismo (teoria sintética)","titulo":"Neodarwinismo: sucesso evolutivo medido pela frequência na população","gab":"B","base":null,"imgs":[{"src":"img/2023d1/q31_1.webp","w":781,"h":1252}],"alt":{"A":"o ambiente exerce papel fundamental na mudança de hábitos, de comportamentos e até de estruturas de indivíduos para melhor adaptá-los ao meio ambiente.","B":"o sucesso evolutivo de uma determinada característica pode ser mensurado a partir do acompanhamento da sua frequência na população ao longo do tempo.","C":"sobrevive e se reproduz o indivíduo que for mais forte, o que justifica a transformação das espécies tal qual se observa nos registros fósseis.","D":"ao longo do tempo, os indivíduos de uma população se mantêm inalterados, o que garante a manutenção da forma e da fisiologia das espécies com o passar do tempo.","E":"indivíduos evoluem ao longo de suas vidas de acordo com o sucesso que obtiverem ao conviverem com as pressões seletivas do meio."},"res":"Ideia-chave: no neodarwinismo (teoria sintética da evolução), quem evolui é a **população**. A evolução é entendida como mudança na frequência de genes e de características ao longo das gerações.\n\nO neodarwinismo junta a seleção natural de Darwin com a genética: mutações e recombinação geram variabilidade, e a seleção natural favorece as variantes que deixam mais descendentes. Se uma característica é vantajosa, os seus portadores se reproduzem mais, e a frequência dela na população aumenta geração após geração.\n\nPor isso dá para \"medir\" o sucesso evolutivo de uma característica acompanhando a sua frequência ao longo do tempo, que é exatamente o que diz a alternativa B. Isso combina com o que o texto destaca: a teoria tem \"apoio argumentativo com bases estatísticas e probabilísticas\". Frequência numa população é justamente um dado estatístico.\n\nAs outras alternativas trazem ideias lamarckistas (A e E), um erro comum sobre a seleção natural (C) ou o fixismo (D).","pq":{"A":"Essa é a visão lamarckista: o ambiente provocaria mudanças nos próprios indivíduos para adaptá-los. No neodarwinismo, o ambiente não cria a adaptação; ele apenas seleciona variações que já existiam, surgidas por mutação e recombinação.","B":"Correta. A evolução é vista como mudança da frequência de alelos e características na população, e uma característica vantajosa ganha frequência ao longo das gerações, o que pode ser medido estatisticamente.","C":"A seleção natural não favorece o \"mais forte\", e sim o mais apto, ou seja, quem deixa mais descendentes férteis naquele ambiente. Às vezes isso significa ser menor, mais discreto ou mais resistente a uma doença, e não mais forte.","D":"Isso é fixismo, a ideia de que as espécies não mudam. Contradiz a própria existência da evolução, que é justamente o que o neodarwinismo explica.","E":"Indivíduos não evoluem durante a vida; quem evolui é a população, ao longo das gerações. A alternativa usa o termo \"pressões seletivas\", mas a ideia de o indivíduo se transformar conforme o meio é lamarckista."},"dica":"No neodarwinismo, a unidade evolutiva é a população: evolução = mudança da frequência de alelos ao longo das gerações, nunca \"o indivíduo que se transforma\".","dif":"fácil","nota":"","obs":""},{"id":"2023d1-32","n":32,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Genética – heredograma de herança autossômica recessiva","titulo":"Heredograma autossômico recessivo: chance de o filho de II-1 e II-2 ser afetado","gab":"E","base":null,"imgs":[{"src":"img/2023d1/q32_1.webp","w":783,"h":1105}],"alt":{"A":"25%.","B":"0%.","C":"100%.","D":"75%.","E":"50%."},"res":"Ideia-chave: descubra os genótipos dos pais (II-1 e II-2) olhando para a geração I.\n\nChame de A o alelo dominante (normal) e de a o recessivo (característica marcada em preto).\n\nII-1 (mulher): está marcada em preto, ou seja, é afetada. Então II-1 = aa e sempre passa o alelo a. (Os pais dela, I-1 e I-2, também são afetados, o que é coerente.)\n\nII-2 (homem): não é afetado, então tem pelo menos um A. O pai dele, I-3, é afetado (aa) e só pode ter passado o alelo a. Logo, II-2 = Aa com certeza.\n\nCruzamento: aa × Aa\nGametas da mãe: a\nGametas do pai: A (1/2) ou a (1/2)\nFilhos: Aa (1/2, normal) e aa (1/2, afetado)\n\nProbabilidade de o descendente apresentar a característica = 1/2 = 50%.\n\nO sexo do bebê não interfere, porque a herança é autossômica: o gene não está nos cromossomos sexuais.","pq":{"A":"25% é a chance de aa no cruzamento Aa × Aa. Mas II-1 não é heterozigota: ela é afetada, portanto aa, e sempre transmite o alelo a.","B":"0% sairia se você supusesse que II-2, por ser normal, é AA. Só que o pai dele (I-3) é afetado (aa) e obrigatoriamente lhe passou um alelo a, então II-2 é Aa.","C":"100% só aconteceria se os dois pais fossem aa. A mãe passa sempre o alelo a, mas o pai é Aa e passa A em metade dos casos, gerando filhos normais.","D":"75% é a chance do fenótipo dominante (normal) num cruzamento Aa × Aa. Além de o cruzamento aqui ser aa × Aa, esse valor nem se refere à característica recessiva.","E":"Correta. II-1 é aa e II-2 é Aa (herdou o a do pai afetado). No cruzamento aa × Aa, metade dos filhos é aa: 50%."},"dica":"Num heredograma, o genótipo de um indivíduo normal costuma ser revelado pelos pais ou filhos: se um dos pais é afetado (aa) por característica recessiva, o filho normal é obrigatoriamente heterozigoto (Aa).","dif":"média","nota":"","obs":""},{"id":"2023d1-33","n":33,"area":"Ciências da Natureza","disc":"Física","assunto":"Cinemática – movimento uniforme e conversão de tempo","titulo":"Frente fria a 80 km/h e cidade a 280 km: tempo de chegada","gab":"A","base":null,"imgs":[{"src":"img/2023d1/q33_1.webp","w":781,"h":1325}],"alt":{"A":"3 horas e 30 minutos.","B":"2 horas e 50 minutos.","C":"2 horas e 30 minutos.","D":"3 horas e 10 minutos.","E":"3 horas e 50 minutos."},"res":"Ideia-chave: com velocidade constante, tempo = distância ÷ velocidade. Depois, converta a parte decimal da hora em minutos.\n\nDados: v = 80 km/h; Δs = 280 km.\n\nΔt = Δs ÷ v\nΔt = 280 ÷ 80\nΔt = 3,5 h\n\nConversão: 3,5 h = 3 h + 0,5 h\n0,5 h = 0,5 × 60 min = 30 min\n\nLogo, Δt = 3 horas e 30 minutos.\n\nConferindo: em 3 h a frente percorre 3 × 80 = 240 km, e em mais meia hora percorre 40 km. Total: 240 + 40 = 280 km. Bate certinho.\n\nA figura e o texto sobre a frente fria são só o contexto; a conta é de movimento uniforme.","pq":{"A":"Correta. 280 ÷ 80 = 3,5 h, e 0,5 h corresponde a 30 min. Resultado: 3 h 30 min.","B":"Em 2 h 50 min (≈ 2,83 h), a 80 km/h, a frente andaria só cerca de 227 km, menos que os 280 km do enunciado.","C":"Em 2 h 30 min (2,5 h), a frente percorreria 2,5 × 80 = 200 km, e não 280 km.","D":"Em 3 h 10 min (≈ 3,17 h), a frente percorreria cerca de 253 km; ainda faltariam uns 27 km para chegar à cidade.","E":"É a pegadinha clássica: ler 3,5 h como \"3 horas e 50 minutos\". O 0,5 é metade de uma hora, ou seja, 30 min, e não 50 min."},"dica":"Hora decimal não é minuto: multiplique a parte decimal por 60 (0,5 h = 30 min; 0,25 h = 15 min).","dif":"fácil","nota":"","obs":""},{"id":"2023d1-34","n":34,"area":"Ciências da Natureza","disc":"Física","assunto":"Dinâmica – Leis de Newton em sistema de blocos com polia","titulo":"Bloco B na mesa e bloco A pendurado: aceleração do sistema ideal","gab":"C","base":null,"imgs":[{"src":"img/2023d1/q34_1.webp","w":783,"h":950}],"alt":{"A":"8 m/s².","B":"6 m/s².","C":"4 m/s².","D":"2 m/s².","E":"5 m/s²."},"res":"Ideia-chave: no sistema ideal (sem atrito, fio e polia de massas desprezíveis), a única força que move o conjunto é o peso do bloco pendurado (A). Essa força acelera a massa TOTAL (A + B).\n\nO bloco B está sobre a mesa, apoiado em rodinhas, sem atrito. O peso de B é equilibrado pela normal e não ajuda nem atrapalha o movimento.\n\nPeso de A: PA = mA × g = 8 × 10 = 80 N\n\n2ª Lei de Newton para o conjunto:\nF resultante = (mA + mB) × a\n80 = (8 + 12) × a\n80 = 20 × a\na = 4 m/s²\n\nSe preferir montar bloco a bloco (T = tração no fio):\nBloco B: T = mB × a = 12a\nBloco A: PA − T = mA × a, ou seja, 80 − T = 8a\nSomando as duas equações: 80 = 20a, logo a = 4 m/s² (e T = 48 N).","pq":{"A":"Para dar 8 m/s², os 80 N do peso de A teriam de acelerar apenas 10 kg. Isso ignora parte da massa: o fio faz os dois blocos se moverem juntos, e a massa total é 20 kg.","B":"6 m/s² sai de usar o peso de B como força motriz: 120 ÷ 20 = 6. Só que o peso de B é anulado pela normal da mesa; quem puxa o sistema é o peso de A.","C":"Correta. A força resultante é o peso de A (80 N) agindo sobre a massa total (20 kg): a = 80 ÷ 20 = 4 m/s².","D":"2 m/s² aparece se você fizer (PB − PA) ÷ (mA + mB) = (120 − 80) ÷ 20 = 2, como numa máquina de Atwood com os dois blocos pendurados. Aqui B está na horizontal e seu peso não entra na resultante.","E":"5 m/s² é g/2, valor que só sairia se os dois blocos tivessem a mesma massa (por exemplo, 8 kg cada: 80 ÷ 16 = 5). Com 12 kg em B, a massa total é maior e a aceleração fica menor."},"dica":"Em blocos ligados por fio: a = (forças que puxam a favor − forças contra) ÷ (soma de TODAS as massas que se movem juntas).","dif":"média","nota":"","obs":""},{"id":"2023d1-35","n":35,"area":"Ciências da Natureza","disc":"Física","assunto":"Energia mecânica – dissipação de energia","titulo":"Carrinho desce rampa com lençol de água: energia mecânica dissipada","gab":"E","base":null,"imgs":[{"src":"img/2023d1/q35_1.webp","w":781,"h":1260}],"alt":{"A":"15,0 kJ.","B":"18,0 kJ.","C":"16,5 kJ.","D":"22,5 kJ.","E":"14,5 kJ."},"res":"Ideia-chave: energia dissipada = energia mecânica inicial − energia mecânica final.\n\nAdote o nível da água do canal como referência (h = 0).\n\nNo topo (repouso, h = 6 m), a energia é só potencial:\nEp = m × g × h = 250 × 10 × 6 = 15 000 J\n\nNo canal (h = 0, v = 2 m/s), a energia é só cinética:\nEc = m × v² ÷ 2 = 250 × 2² ÷ 2 = 250 × 4 ÷ 2 = 500 J\n\nEnergia dissipada pela água:\nEdissipada = 15 000 − 500 = 14 500 J = 14,5 kJ\n\nRepare na lógica: dos 15 kJ que o carrinho tinha no alto, só 0,5 kJ sobraram como movimento. O resto foi retirado pela água (atrito e arrasto), virando principalmente energia térmica e movimento da própria água.","pq":{"A":"15,0 kJ é toda a energia potencial inicial. Considerar tudo como dissipado é esquecer que o carrinho ainda chega ao canal a 2 m/s, ou seja, com 500 J de energia cinética que não foram dissipados.","B":"18,0 kJ é maior que toda a energia mecânica que o carrinho tinha no início (15 kJ). É impossível dissipar mais energia do que o sistema possuía.","C":"16,5 kJ também supera os 15 kJ iniciais, então é fisicamente impossível. Vale notar: mesmo quem soma a cinética à potencial, em vez de subtrair, chega a 15,5 kJ, valor igualmente acima do disponível.","D":"22,5 kJ é ainda maior que os 15 kJ disponíveis. Nenhuma dissipação pode passar da energia mecânica inicial.","E":"Correta. 15 000 J (potencial no topo) − 500 J (cinética no canal) = 14 500 J = 14,5 kJ dissipados."},"dica":"Energia dissipada = energia mecânica inicial − energia mecânica final, e ela nunca pode ser maior que a energia mecânica inicial. Use isso para eliminar alternativas.","dif":"média","nota":"","obs":""},{"id":"2023d1-36","n":36,"area":"Ciências da Natureza","disc":"Física","assunto":"Calorimetria – calor latente e calor sensível","titulo":"Caldo congelado de 1 500 g: calor para derreter e aquecer até 100 °C","gab":"C","base":null,"imgs":[{"src":"img/2023d1/q36_1.webp","w":783,"h":943}],"alt":{"A":"120 kcal.","B":"230 kcal.","C":"270 kcal.","D":"100 kcal.","E":"150 kcal."},"res":"Ideia-chave: são DUAS etapas, e o calor total é a soma delas. Primeiro o caldo derrete a 0 °C (calor latente). Depois o líquido esquenta de 0 °C a 100 °C (calor sensível).\n\nEtapa 1: fusão a 0 °C (temperatura constante)\nQ₁ = m × L\nQ₁ = 1 500 × 80 = 120 000 cal = 120 kcal\n\nEtapa 2: aquecimento do líquido de 0 °C a 100 °C\nQ₂ = m × c × Δθ\nQ₂ = 1 500 × 1 × (100 − 0) = 150 000 cal = 150 kcal\n\nCalor total:\nQ = Q₁ + Q₂ = 120 + 150 = 270 kcal\n\nO enunciado diz que \"Rapidamente, a temperatura do caldo congelado chega a 0 °C\" e pede o calor \"a partir daí\". Então não é preciso calcular o aquecimento do gelo abaixo de zero: a conta começa na fusão.","pq":{"A":"120 kcal é só o calor da fusão (m × L). Falta o calor para aquecer o líquido de 0 °C até 100 °C.","B":"230 kcal = 80 + 150: aparece quando se soma o próprio valor de L (80) como se a fusão inteira custasse 80 kcal, sem multiplicar pelos 1 500 g. O certo é 1 500 × 80 = 120 kcal.","C":"Correta. Fusão: 1 500 × 80 = 120 kcal. Aquecimento: 1 500 × 1 × 100 = 150 kcal. Total: 270 kcal.","D":"100 kcal é menos até do que só o aquecimento (150 kcal). Poderia sair de usar 1 000 g no lugar de 1 500 g (1 000 × 1 × 100) e ainda esquecer a fusão.","E":"150 kcal é só o calor sensível do aquecimento (m × c × Δθ). Esquece que, antes de esquentar, o caldo precisa derreter, o que consome mais 120 kcal."},"dica":"Em problemas com mudança de estado, divida em etapas: cada patamar de temperatura constante usa Q = m × L, cada trecho de variação de temperatura usa Q = m × c × Δθ, e no final some tudo.","dif":"média","nota":"","obs":""},{"id":"2023d1-37","n":37,"area":"Ciências da Natureza","disc":"Física","assunto":"Óptica – lentes esféricas (equação de Gauss)","titulo":"Imagem de objeto a 60 cm de lente convergente com f = 40 cm","gab":"D","base":null,"imgs":[{"src":"img/2023d1/q37_1.webp","w":781,"h":825}],"alt":{"A":"maior que o objeto, virtual e direita, estando a 120 cm do centro da lente.","B":"menor que o objeto, virtual e direita, estando a 60 cm do centro da lente.","C":"maior que o objeto, virtual e invertida, estando a 120 cm do centro da lente.","D":"maior que o objeto, real e invertida, estando a 120 cm do centro da lente.","E":"menor que o objeto, real e direita, estando a 60 cm do centro da lente."},"res":"Ideia-chave: uma lente biconvexa (no ar) é convergente, e o próprio enunciado dá a equação de Gauss: 1/f = 1/p + 1/p'.\nDados: f = 40 cm e p = 60 cm.\n1/40 = 1/60 + 1/p'\n1/p' = 1/40 − 1/60 = 3/120 − 2/120 = 1/120\np' = +120 cm\nComo p' é positivo, a imagem se forma do outro lado da lente, pelo cruzamento dos próprios raios de luz: ela é **real** e fica a 120 cm do centro.\nAumento linear: A = −p'/p = −120/60 = −2.\nO sinal negativo indica imagem **invertida**, e |A| = 2 indica que ela tem o dobro do tamanho do objeto, ou seja, é **maior**.\nConferência pelos pontos notáveis: o objeto está entre o foco (40 cm) e o ponto antiprincipal (2f = 80 cm). Nessa situação, a lente convergente sempre forma imagem real, invertida e maior, situada além de 2f. Como 120 cm > 80 cm, tudo bate. Alternativa D.","pq":{"A":"A distância (120 cm) e o tamanho (maior) estão certos, mas a imagem é real, não virtual: p' saiu positivo. Uma lente convergente só forma imagem virtual e direita quando o objeto está entre o foco e a lente (p < 40 cm), e aqui p = 60 cm.","B":"Erra quase tudo: a imagem fica a 120 cm, não a 60 cm, e é real e maior. Imagem virtual, direita e menor é típica de lente divergente, e a biconvexa no ar é convergente.","C":"Com objeto real diante de uma única lente, imagem virtual é sempre direita, então \"virtual e invertida\" é uma combinação impossível aqui. Além disso, p' = +120 cm indica imagem real.","D":"Correta: p' = +120 cm (imagem real) e A = −2 (invertida e com o dobro do tamanho do objeto).","E":"Imagem real formada por uma única lente a partir de objeto real é sempre invertida, então \"real e direita\" não existe aqui. A distância (60 cm) e o tamanho também estão errados: a imagem só seria menor com o objeto além de 2f = 80 cm."},"dica":"Lente convergente com objeto entre f e 2f forma imagem real, invertida e maior; confirme com Gauss (1/f = 1/p + 1/p') e com A = −p'/p.","dif":"média","nota":"","obs":""},{"id":"2023d1-38","n":38,"area":"Ciências da Natureza","disc":"Física","assunto":"Ondulatória – superposição de pulsos","titulo":"Superposição de pulso triangular e pulso retangular invertido numa corda","gab":"E","base":null,"imgs":[{"src":"img/2023d1/q38_1.webp","w":783,"h":1982}],"alt":{"A":"[pulso abaixo do eixo: no trecho central a corda desce verticalmente 1 quadradinho, segue em diagonal descendo até 2 quadradinhos abaixo do eixo e sobe verticalmente de volta ao eixo]","B":"[pulso acima do eixo: no trecho central a corda sobe verticalmente 1 quadradinho, segue em diagonal subindo até 2 quadradinhos acima do eixo e desce verticalmente de volta ao eixo]","C":"[pulso acima do eixo: a corda sobe em diagonal do eixo até 1 quadradinho acima e desce verticalmente de volta ao eixo, igual ao pulso triangular original]","D":"[pulso acima do eixo: a corda sobe verticalmente 1 quadradinho e depois desce em diagonal até voltar ao eixo]","E":"[pulso abaixo do eixo: a corda desce verticalmente 1 quadradinho e depois sobe em diagonal até voltar ao eixo]"},"res":"Ideia-chave: princípio da superposição. Quando dois pulsos ocupam o mesmo trecho da corda, o deslocamento de cada ponto é a SOMA ALGÉBRICA dos deslocamentos produzidos por cada pulso (para cima = +, para baixo = −). Depois do encontro, cada um segue em frente sem se alterar.\nUse o lado de um quadradinho como unidade:\nPulso da esquerda (triangular): vale 0 na sua borda esquerda e sobe em rampa até +1 na borda direita, onde cai verticalmente.\nPulso da direita (retangular): vale −1 em toda a sua largura.\nComo os dois têm a mesma largura (1 quadradinho), na sobreposição completa basta somar ponto a ponto:\nborda esquerda: 0 + (−1) = −1\nmeio: +0,5 + (−1) = −0,5\nborda direita: +1 + (−1) = 0\nResultado: na borda esquerda a corda desce verticalmente até −1 e depois sobe em linha reta até voltar ao eixo na borda direita. É exatamente o desenho da alternativa E.","pq":{"A":"Esse desenho vai de −1 a −2 (−1 menos a rampa): seria a soma se o pulso triangular tivesse virado para baixo. Mas pulsos não se invertem ao se cruzar; inversão só acontece na reflexão em extremidade fixa.","B":"Esse desenho vai de +1 a +2 (+1 mais a rampa): é somar os dois como se ambos estivessem acima do eixo. O pulso retangular está abaixo da corda, então entra com sinal negativo.","C":"Mostra apenas o pulso triangular, como se o retangular tivesse sumido ou sido \"bloqueado\". Na superposição os dois deslocamentos se somam; nenhum desaparece.","D":"É o resultado correto de cabeça para baixo (vai de +1 a 0, ou seja, +1 menos a rampa): erro de sinal, tratando o pulso retangular como positivo e o triangular como negativo.","E":"Correta: rampa (de 0 a +1) somada a −1 dá uma rampa de −1 a 0, isto é, queda vertical até −1 e subida em diagonal até o eixo."},"dica":"Na superposição, some os deslocamentos ponto a ponto respeitando o sinal (acima +, abaixo −); os pulsos se cruzam sem se inverter.","dif":"média","nota":"","obs":""},{"id":"2023d1-39","n":39,"area":"Ciências da Natureza","disc":"Física","assunto":"Eletrodinâmica – resistores em paralelo com gerador ideal","titulo":"Leitura do amperímetro ao fechar chave em ramo paralelo","gab":"B","base":null,"imgs":[{"src":"img/2023d1/q39_1.webp","w":781,"h":1074}],"alt":{"A":"1,0 A.","B":"0,5 A.","C":"1,5 A.","D":"2,0 A.","E":"4,5 A."},"res":"Ideia-chave: o gerador é ideal, então a ddp entre A e C vale sempre E = 20 V, com a chave aberta ou fechada.\nObserve o circuito: o ramo de cima (R₁ + chave ch) e o ramo de baixo (R₂ + amperímetro + R₃) estão ligados diretamente entre os pontos A e C, ou seja, ambos em paralelo com a bateria.\nChave aberta: só o ramo de baixo conduz.\nR₂ + R₃ = U/i = 20/0,5 = 40 Ω → R₃ = 40 − 30 = 10 Ω.\nChave fechada: o ramo de cima passa a conduzir i₁ = 20/40 = 0,5 A. O ramo de baixo, porém, continua submetido aos mesmos 20 V e tem a mesma resistência de 40 Ω:\ni = 20/40 = 0,5 A.\nO amperímetro (ideal) está só no ramo de baixo, então sua leitura não muda: 0,5 A.\nO que aumenta é a corrente total fornecida pela bateria, que passa a 0,5 + 0,5 = 1,0 A, mas essa soma não passa pelo amperímetro.","pq":{"A":"1,0 A é a corrente total que a bateria fornece com a chave fechada (0,5 A em cada ramo). O amperímetro, porém, está só no ramo de baixo e não mede a corrente do ramo de R₁.","B":"Correta: com gerador ideal, o ramo do amperímetro continua com 20 V sobre 40 Ω, logo 0,5 A, com a chave aberta ou fechada.","C":"Para passar 1,5 A no ramo de baixo (40 Ω) seriam necessários 60 V, e a bateria fornece 20 V. Esse valor aparece, por exemplo, se você somar a leitura antiga (0,5 A) com a corrente total (1,0 A).","D":"2,0 A = 20 V ÷ 10 Ω: é o que sai aplicando toda a tensão só sobre R₃ e esquecendo que R₂ está em série com ele no mesmo ramo.","E":"4,5 A no ramo de 40 Ω exigiria 180 V. Fechar a chave não altera nem a ddp nem a resistência do ramo do amperímetro, então a corrente nele não pode aumentar."},"dica":"Gerador ideal mantém a mesma ddp em todos os ramos ligados diretamente aos seus terminais: abrir ou fechar outro ramo em paralelo não muda a corrente dos demais.","dif":"média","nota":"","obs":""},{"id":"2023d1-40","n":40,"area":"Ciências da Natureza","disc":"Física","assunto":"Energia elétrica e potência (kWh)","titulo":"Consumo mensal de esteira elétrica de 2,5 HP","gab":"B","base":null,"imgs":[{"src":"img/2023d1/q40_1.webp","w":783,"h":793}],"alt":{"A":"33 kWh.","B":"38 kWh.","C":"46 kWh.","D":"24 kWh.","E":"28 kWh."},"res":"Ideia-chave: energia consumida = potência × tempo; com potência em kW e tempo em horas, o resultado sai em kWh.\nPotência: P = 2,5 × 750 W = 1875 W = 1,875 kW.\nTempo de uso no mês: 40 min/dia × 30 dias = 1200 min.\n1200 min ÷ 60 = 20 h.\nEnergia: E = P × Δt = 1,875 kW × 20 h = 37,5 kWh.\nOutro caminho: por dia, 40 min = 40/60 h = 2/3 h, então 1,875 × 2/3 = 1,25 kWh por dia; em 30 dias, 1,25 × 30 = 37,5 kWh.\nArredondando, o aumento na conta será de aproximadamente 38 kWh.","pq":{"A":"Com 1,875 kW, 33 kWh corresponderia a cerca de 17,6 h de uso no mês (≈ 35 min por dia), e não às 20 h que resultam de 40 min/dia × 30 dias.","B":"Correta: 1,875 kW × 20 h = 37,5 kWh ≈ 38 kWh.","C":"46 kWh exigiria cerca de 24,5 h de uso no mês (≈ 49 min por dia) com 1,875 kW, mais do que os 40 min diários do enunciado.","D":"24 kWh corresponderia a só ≈ 12,8 h de uso no mês (≈ 26 min por dia). Um erro clássico que leva para perto desse valor é tratar 40 min como 0,4 h: 1,875 × 0,4 × 30 = 22,5 kWh. Mas 40 min = 40/60 h ≈ 0,67 h.","E":"28 kWh ≈ 1,875 kW × 15 h, o que corresponde a 30 min por dia (0,5 h × 30 dias). O tempo diário é de 40 min, que dá 20 h no mês."},"dica":"Energia em kWh = potência em kW × tempo em horas; converta minutos dividindo por 60 (40 min = 2/3 h, não 0,4 h).","dif":"fácil","nota":"","obs":""},{"id":"2023d1-41","n":41,"area":"Ciências da Natureza","disc":"Química","assunto":"Química orgânica – insaturação e fórmula estrutural","titulo":"Diferença estrutural entre citronelol e geraniol","gab":"A","base":null,"imgs":[{"src":"img/2023d1/q41_1.webp","w":781,"h":1555}],"alt":{"A":"4.","B":"3.","C":"2.","D":"1.","E":"5."},"res":"Ideia-chave: comparar as fórmulas moleculares. O citronelol é C₁₀H₂₀O e o geraniol é C₁₀H₁₈O: mesmo número de C e de O, mas o geraniol tem 2 H a menos. Cada 2 H a menos corresponde a uma insaturação a mais, ou seja, o geraniol tem uma ligação dupla C=C extra.\nAgora localize as ligações duplas nos modelos:\nA dupla perto das duas metilas (entre o carbono da região 1 e o da região 2) aparece nas duas moléculas.\nNo geraniol existe uma segunda dupla, entre o carbono que carrega a ramificação metila e o carbono vizinho, no sentido do grupo OH. No citronelol, esse trecho é a região 4: ali o carbono ramificado tem um H (CH) e o vizinho tem dois H (CH₂), unidos por ligação simples.\nNo geraniol, esses mesmos carbonos ficam como C= (sem H) e =CH (um H), unidos por dupla: são exatamente os 2 H que faltam.\nAs regiões 1, 2, 3 e 5 têm os mesmos átomos ligados aos carbonos nas duas moléculas. Logo, a diferença está na região 4.","pq":{"A":"Correta: só na região 4 os carbonos têm átomos ligados diferentes, CH e CH₂ unidos por ligação simples no citronelol e C e CH unidos por dupla no geraniol (2 H a menos).","B":"A região 3 é um CH₂ ligado por ligações simples aos vizinhos nas duas moléculas; nada muda ali.","C":"A região 2 (=CH–CH₂–) é igual nas duas. A dupla ligação na fronteira entre as regiões 1 e 2 existe tanto no citronelol quanto no geraniol, por isso não é a diferença.","D":"A região 1 tem as duas metilas (CH₃) ligadas ao mesmo carbono, arranjo idêntico nas duas moléculas.","E":"A região 5 é o grupo CH₂–OH, presente nas duas moléculas (ambas são álcoois). A hidroxila é uma semelhança, não a diferença."},"dica":"Mesmo número de carbonos e 2 H a menos na fórmula indicam uma insaturação a mais (dupla ou anel): procure onde está essa ligação.","dif":"média","nota":"","obs":""},{"id":"2023d1-42","n":42,"area":"Ciências da Natureza","disc":"Química","assunto":"Ácidos, bases e pH – indicadores naturais","titulo":"Pigmento da beterraba: efeito do bicarbonato e do limão no pH","gab":"C","base":null,"imgs":[{"src":"img/2023d1/q42_1.webp","w":783,"h":1799}],"alt":{"A":"neutro … perde … estabilizar … mantendo","B":"alcalino … mantém … elevar … perdendo","C":"alcalino … perde … reduzir … mantendo","D":"ácido … mantém … elevar … perdendo","E":"ácido … perde … reduzir … perdendo"},"res":"Ideia-chave: o bicarbonato é base e o limão é ácido; a foto mostra em qual meio o pigmento fica vermelho.\n(I) A equação mostra que o bicarbonato consome íons H⁺: HCO₃⁻ + H⁺ → CO₂ + H₂O. Menos H⁺ em solução significa pH mais alto, ou seja, caráter **alcalino** (básico).\n(II) Na foto, a amostra B (fervida com bicarbonato) ficou amarelada: em meio alcalino o pigmento **perde** a coloração vermelha.\n(III) O suco de limão é ácido: fornece H⁺, que neutraliza o bicarbonato e torna o meio mais ácido, ou seja, ajuda a **reduzir** o pH.\n(IV) A amostra A (fervida com limão) continuou vermelha: em meio ácido o pigmento mantém a cor, isto é, a adição de limão reduz o pH **mantendo** a coloração vermelha. É por isso que as receitas sugerem limão, cuja acidez \"compensa o efeito do bicarbonato de sódio\".\nSequência: alcalino … perde … reduzir … mantendo → alternativa C.","pq":{"A":"Os itens II e IV estão certos, mas o bicarbonato não deixa o meio neutro: ele consome H⁺ (veja a equação) e torna a solução alcalina. E o limão não \"estabiliza\" o pH: por ser ácido, ele o reduz.","B":"Acerta \"alcalino\", mas a foto desmente o resto: a amostra B, com bicarbonato, perdeu o vermelho (ficou amarelada) e a A, com limão, continuou vermelha. Além disso, adicionar ácido reduz o pH, não eleva.","C":"Correta: bicarbonato → meio alcalino → pigmento perde o vermelho; limão → reduz o pH → cor vermelha mantida.","D":"Inverte os papéis: o bicarbonato é base, não ácido, e com ele o pigmento não mantém a cor (amostra B amarelada). Ácido reduz o pH, e com o limão o vermelho é mantido, não perdido.","E":"Acerta \"perde\" e \"reduzir\", mas chama de ácido o meio com bicarbonato, que é básico, e diz que com limão o vermelho se perde, o oposto da amostra A, que continuou vermelha."},"dica":"Bicarbonato é base (consome H⁺ e eleva o pH) e limão é ácido (fornece H⁺ e reduz o pH); use a foto para ver em qual meio o pigmento fica vermelho.","dif":"fácil","nota":"","obs":""},{"id":"2023d1-43","n":43,"area":"Ciências da Natureza","disc":"Química","assunto":"Balanceamento de equações químicas","titulo":"Reforma a vapor do etanol e combustão do H₂: equações balanceadas","gab":"E","base":null,"imgs":[{"src":"img/2023d1/q43_1.webp","w":781,"h":1462}],"alt":{"A":"2CO(g) + 4H₂(g) → C₂H₆O(g) + H₂O(g)\n2H₂O(g) → O₂(g) + 2H₂(g)","B":"C₂H₆O(g) + 1/2O₂ (g) → 2CO₂(g) + 3H₂(g)\n2H₂(g) + O₂(g) → H₂O (g)","C":"CO₂(g) + C(s) + 3H₂O(g) → C₂H₆O(g) + 2O₂(g)\nH₂(g) + O₂(g) → H₂O₂(g)","D":"2H₂O(g) + C₂H₆O (g) → 2CO(g) + 5H₂(g)\n2H₂O₂(g) → O₂(g) + H₂ (g)","E":"C₂H₆O(g) + 3H₂O(g) → 2CO₂(g) + 6H₂(g)\nH₂(g) + 1/2O₂(g) → H₂O (g)"},"res":"Ideia-chave: o texto descreve duas reações, e a alternativa certa precisa acertar as duas, com balanceamento correto.\n\nReação 1 (reforma a vapor): o etanol \"reage com a vapor de água\" e sua molécula \"é quebrada, deixando disponível o hidrogênio\". Então os reagentes são etanol + H₂O e um dos produtos é H₂.\nReação 2 (produção de energia): o resíduo \"é o vapor d’água resultante da ligação do hidrogênio com o oxigênio\". Logo, H₂ + O₂ → H₂O.\n\nConferindo a alternativa E:\nC₂H₆O + 3H₂O → 2CO₂ + 6H₂\nC: 2 = 2\nH: 6 + 3×2 = 12; 6×2 = 12\nO: 1 + 3 = 4; 2×2 = 4\n\nH₂ + 1/2O₂ → H₂O\nH: 2 = 2\nO: 1/2 × 2 = 1; 1\n\nAs duas equações estão balanceadas e correspondem exatamente ao que o texto descreve: o etanol reage com vapor e libera H₂, e depois o H₂ reage com O₂ formando apenas água.","pq":{"A":"As duas equações até estão balanceadas, mas descrevem o contrário do texto: a primeira forma etanol a partir de CO e H₂ (em vez de quebrá-lo), e a segunda decompõe a água em O₂ e H₂, o inverso da reação que gera energia e forma água.","B":"A primeira usa O₂ em vez de vapor de água (não é reforma a vapor) e está desbalanceada: há 1 + 1 = 2 átomos de O à esquerda e 4 à direita. A segunda também está desbalanceada: 2H₂ + O₂ tem 4 H e 2 O, mas H₂O tem só 2 H e 1 O (o certo seria 2H₂O).","C":"A primeira, apesar de balanceada, produz etanol em vez de quebrá-lo e não libera H₂. A segunda também está balanceada, mas forma peróxido de hidrogênio (H₂O₂), e não o vapor d’água citado no texto.","D":"A primeira está desbalanceada no oxigênio: 2 + 1 = 3 átomos de O à esquerda contra 2 à direita. A segunda nem envolve a reação do H₂ com O₂: decompõe H₂O₂ e ainda está desbalanceada (4 H e 4 O à esquerda; 2 H e 2 O à direita).","E":"Correta: etanol + vapor d’água → CO₂ + H₂ (reforma a vapor) e H₂ + 1/2O₂ → H₂O (produção de energia), ambas balanceadas."},"dica":"Em questões de equação compatível com o texto, confira duas coisas separadamente: se reagentes e produtos são os que o texto descreve e se cada elemento tem o mesmo número de átomos dos dois lados.","dif":"média","nota":"","obs":""},{"id":"2023d1-44","n":44,"area":"Ciências da Natureza","disc":"Química","assunto":"Separação de misturas – destilação e estados físicos","titulo":"Destilação de mistura de eteno, butadieno e cicloexenos a 80–90 °C","gab":"D","base":null,"imgs":[{"src":"img/2023d1/q44_1.webp","w":783,"h":1767}],"alt":{"A":"por quantidades iguais de uma fase líquida correspondente ao cicloexeno e uma fase constituída por 1,3-butadieno, que solidificou ao atingir a temperatura ambiente.","B":"por quantidades semelhantes de cicloexeno e 4-vinilcicloexeno, uma vez que os reagentes em excesso, com ponto de fusão alto, não serão destilados.","C":"por 4-vinilcicloexeno, pois os demais compostos não foram destilados, por terem temperatura de ebulição baixa.","D":"por cicloexeno, pois os reagentes em excesso na mistura reacional foram eliminados na forma gasosa e o 4-vinilcicloexeno não foi destilado.","E":"por reagentes líquidos remanescentes sem reagir na mistura reacional."},"res":"Ideia-chave: na destilação, vaporiza e é coletado o componente cujo ponto de ebulição (PE) está abaixo da temperatura de aquecimento; quem tem PE maior fica no balão.\n\nPasso 1: antes da destilação, o reator foi esfriado até a temperatura ambiente (cerca de 25 °C). O eteno (PE = −104 °C) e o 1,3-butadieno (PE = −4 °C) têm PE bem abaixo disso, então são gases nessa temperatura e escapam da mistura.\n\nPasso 2: a destilação ocorre entre 80 °C e 90 °C. O cicloexeno (PE = 83 °C) ferve nessa faixa, vaporiza, condensa no destilador e é coletado na saída.\n\nPasso 3: o 4-vinilcicloexeno (PE = 129 °C) não chega a ferver a 90 °C e permanece no balão.\n\nPortanto, a fração coletada é formada principalmente por cicloexeno: os reagentes em excesso saíram como gás e o 4-vinilcicloexeno não foi destilado.","pq":{"A":"O 1,3-butadieno não solidifica à temperatura ambiente, porque seu ponto de fusão é −109 °C. Com PE = −4 °C, ele é gás a 25 °C e já saiu da mistura, então não forma uma fase no destilado.","B":"O 4-vinilcicloexeno ferve a 129 °C, acima dos 90 °C da destilação, e por isso não é coletado. Além disso, os reagentes não têm ponto de fusão alto (−170 °C e −109 °C): eles saem da mistura por serem gases.","C":"Inverte a lógica: o 4-vinilcicloexeno tem o maior PE da tabela (129 °C), acima de 90 °C, então é justamente ele que fica no balão. E o cicloexeno (PE = 83 °C) não deixa de ser destilado: ele ferve dentro da faixa de 80–90 °C e é o que sai.","D":"Correta: eteno e butadieno são gases à temperatura ambiente, o cicloexeno (PE = 83 °C) destila na faixa de 80–90 °C e o 4-vinilcicloexeno (PE = 129 °C) fica no balão.","E":"Os reagentes que sobraram (eteno e 1,3-butadieno) têm PE de −104 °C e −4 °C. À temperatura ambiente são gases, não líquidos, e não estão mais na mistura para serem coletados."},"dica":"Compare o PE de cada substância com a temperatura do processo: PE abaixo vira gás e sai; PE dentro da faixa destila; PE acima fica no balão.","dif":"média","nota":"","obs":""},{"id":"2023d1-45","n":45,"area":"Ciências da Natureza","disc":"Química","assunto":"Concentração em massa (título) e proporcionalidade","titulo":"Preço por grama de hipoclorito: água sanitária × desinfetante","gab":"B","base":null,"imgs":[{"src":"img/2023d1/q45_1.webp","w":781,"h":1157}],"alt":{"A":"15 vezes menor.","B":"50 vezes menor.","C":"70 vezes maior.","D":"5 vezes maior.","E":"80 vezes menor."},"res":"Ideia-chave: calcule a massa de NaClO em cada embalagem e divida o preço por essa massa.\n\nComo a densidade é 1,0 g/mL, o volume em mL é igual à massa em gramas.\n\nÁgua sanitária:\n1,0 L = 1000 mL → 1000 g de solução\nNaClO = 2,5% × 1000 g = 25 g\nPreço por grama = R$ 5,00 ÷ 25 g = R$ 0,20/g\n\nDesinfetante para hortifrutícolas:\n50,0 mL → 50 g de solução\nNaClO = 2,5% × 50 g = 1,25 g\nPreço por grama = R$ 12,00 ÷ 1,25 g = R$ 9,60/g\n\nComparação:\n9,60 ÷ 0,20 = 48 ≈ 50\n\nNa água sanitária, o grama de hipoclorito custa cerca de 50 vezes menos.\n\nAtalho: como a concentração é a mesma (2,5%), basta comparar o preço por mL: (12/50) ÷ (5/1000) = 0,24 ÷ 0,005 = 48.","pq":{"A":"A direção (menor) está certa, mas o valor não: a razão é 9,60 ÷ 0,20 = 48. É preciso combinar a diferença de volume (1000/50 = 20 vezes) com a de preço (12/5 = 2,4 vezes): 20 × 2,4 = 48, e não 15.","B":"Correta: R$ 0,20/g na água sanitária contra R$ 9,60/g no desinfetante, uma razão de 48 ≈ 50 vezes menor.","C":"A direção está errada: na água sanitária o grama de NaClO é mais barato (R$ 0,20 contra R$ 9,60), então o valor é menor, não maior. O número 70 também não bate com a razão calculada (48).","D":"Erra a direção: o grama de NaClO na água sanitária custa R$ 0,20, bem menos que os R$ 9,60 do desinfetante, então o valor é menor, não maior. E o fator 5 não corresponde à razão correta, que é 48.","E":"A direção está certa (menor), mas 80 superestima a razão: R$ 9,60 ÷ R$ 0,20 = 48, que fica perto de 50, e não de 80."},"dica":"Para comparar custo-benefício, converta tudo para a mesma base (preço por grama ou por mL) antes de dividir um valor pelo outro.","dif":"média","nota":"","obs":""},{"id":"2023d1-46","n":46,"area":"Ciências da Natureza","disc":"Química","assunto":"Cinética química – catalisadores enzimáticos","titulo":"Enzimas de rato e humana na hidrólise da aflatoxina B1","gab":"B","base":null,"imgs":[{"src":"img/2023d1/q46_1.webp","w":783,"h":1581}],"alt":{"A":"I – não mudou … II – ao contrário do","B":"I – aumentou … II – diferentemente do","C":"I – não mudou … II – assim como o","D":"I – diminuiu … II – de forma oposta ao","E":"I – diminuiu … II – igual ao"},"res":"Ideia-chave: compare cada experimento com o controle, o experimento 1 (sem enzima), em que a rapidez é 0,64 µmol·L⁻¹·s⁻¹.\n\nLacuna I (enzima de rato):\nExperimento 2 (10 µM): 0,72 > 0,64\nExperimento 3 (19 µM): 0,78 > 0,64\nA enzima de rato aumentou a rapidez da hidrólise, e quanto mais enzima, maior a rapidez.\n\nLacuna II (enzima humana):\nExperimento 4 (14 µM): 0,64 = 0,64\nCom a enzima humana a rapidez ficou igual à da reação sem enzima, ou seja, ela não teve efeito.\n\nPortanto, a enzima de rato \"aumentou\" a rapidez da reação, \"diferentemente do\" resultado obtido com a enzima humana, que não alterou a rapidez.","pq":{"A":"A enzima de rato mudou a rapidez: ela subiu de 0,64 para 0,72 e 0,78. Quem não mudou nada foi a enzima humana, o que também torna incoerente o “ao contrário do”.","B":"Correta: com a enzima de rato a rapidez sobe (0,72 e 0,78 contra 0,64), enquanto com a enzima humana ela continua 0,64, um resultado diferente.","C":"Descreve o comportamento da enzima humana (0,64 = 0,64), não o da enzima de rato, que aumentou a rapidez para 0,72 e 0,78.","D":"Nenhum valor com enzima de rato ficou abaixo de 0,64, então não houve diminuição. A enzima humana também não teve efeito oposto (não aumentou a rapidez): ela simplesmente não alterou nada.","E":"Erra as duas lacunas: a enzima de rato aumentou a rapidez (não diminuiu), e esse resultado não é igual ao da enzima humana, que manteve 0,64."},"dica":"Em tabelas de experimentos, encontre primeiro o controle (a condição sem o fator testado) e compare cada condição com ele: maior, menor ou igual.","dif":"fácil","nota":"","obs":""},{"id":"2023d1-47","n":47,"area":"Ciências da Natureza","disc":"Química","assunto":"Química ambiental – smog fotoquímico","titulo":"Smog fotoquímico: identificar curvas de NO, NO₂ e O₃ no gráfico","gab":"C","base":null,"imgs":[{"src":"img/2023d1/q47_1.webp","w":783,"h":1764}],"alt":{"A":"O₃; NO; NO₂.","B":"NO₂; O₃; NO.","C":"NO; NO₂; O₃.","D":"NO; O₃; NO₂.","E":"O₃; NO₂; NO."},"res":"Ideia-chave: o texto descreve uma sequência no tempo. Primeiro existe NO, depois ele vira NO₂, e só então o NO₂ gera O₃. Por isso, cada gás atinge seu pico depois do anterior.\n\nPasso 1 (NO): o gás NO está \"acumulado na atmosfera durante a noite\", então tem concentração alta logo cedo e depois cai, porque os radicais peróxido o oxidam, \"transformando-o em gás NO₂\". É a curva I (tracejada), com pico entre 6 h e 7 h e queda até cerca de 9 h.\n\nPasso 2 (NO₂): sua concentração cresce enquanto o NO é consumido e só depois cai, quando ele passa a ser decomposto. É a curva II, com pico por volta das 8 h, logo após o pico de I.\n\nPasso 3 (O₃): só se forma \"Após grande parte do gás NO se transformar em gás NO₂\", pela \"decomposição fotoquímica de NO₂\", que depende da luz solar. É a curva III, que começa por volta das 8 h e tem pico entre 12 h e 14 h.\n\nLogo: I = NO, II = NO₂ e III = O₃.","pq":{"A":"Coloca o O₃ no pico mais cedo (curva I), mas ele é o último a se formar, porque depende da decomposição do NO₂ pela luz. Também põe o NO₂ na curva III, como se ele surgisse à tarde, quando na verdade ele se forma de manhã a partir do NO.","B":"Começa pelo NO₂, mas o NO, acumulado durante a noite, é o que tem o primeiro pico. Além disso, põe o NO na curva III, quando é o O₃ que aparece por último, perto do meio-dia.","C":"Correta: NO (acumulado à noite) tem o primeiro pico, NO₂ (formado a partir do NO) o segundo e O₃ (formado pela fotólise do NO₂) o último, perto do meio-dia.","D":"Acerta o NO na curva I, mas troca NO₂ e O₃: o O₃ só se forma depois que grande parte do NO virou NO₂. Por isso o pico do O₃ (curva III, por volta do meio-dia) vem depois do pico do NO₂ (curva II, cerca de 8 h).","E":"É a sequência exatamente invertida: dá ao O₃ o primeiro pico e ao NO o último, quando o NO é o gás acumulado durante a noite e o O₃ é o produto final, que depende do sol forte."},"dica":"Em gráficos de concentração por tempo de reações em sequência (A → B → C), os picos aparecem na mesma ordem das etapas do mecanismo.","dif":"média","nota":"","obs":""},{"id":"2023d1-48","n":48,"area":"Ciências da Natureza","disc":"Química","assunto":"Número de oxidação e interpretação de texto","titulo":"Toxicidade de compostos de arsênio pelo Nox e grupos orgânicos","gab":"D","base":null,"imgs":[{"src":"img/2023d1/q48_1.webp","w":784,"h":1360}],"alt":{"A":"ácido arsênico > ácido dimetilarsínico > ácido arsenioso.","B":"ácido dimetilarsínico > ácido arsênico > ácido arsenioso.","C":"ácido arsenioso > ácido dimetilarsínico > ácido arsênico.","D":"ácido arsenioso > ácido arsênico > ácido dimetilarsínico.","E":"ácido dimetilarsínico > ácido arsenioso > ácido arsênico."},"res":"Ideia-chave: descubra, para cada composto, o Nox do As e se ele está ligado a grupos orgânicos (CH₃). Depois aplique a ordem do texto: As(III) inorgânico > As(V) inorgânico > As(III) com grupos orgânicos > As(V) com grupos orgânicos.\n\nÁcido arsenioso, As(OH)₃: três ligações As–OH, e cada uma vale +1 para o As, então Nox = +3. Não tem carbono: é As(III) inorgânico, o mais tóxico.\n\nÁcido arsênico, (HO)₃As=O: três –OH (+3) e uma ligação dupla com O (+2), então Nox = +5. Não tem carbono: é As(V) inorgânico, o segundo mais tóxico.\n\nÁcido dimetilarsínico, (CH₃)₂AsO(OH): ligação dupla com O (+2), um –OH (+1) e duas ligações com C (+1 cada, pois o C é mais eletronegativo que o As), então Nox = +5. Tem grupos CH₃: é As(V) ligado a grupos orgânicos, o menos tóxico.\n\nAtalho: como é o único composto orgânico, o dimetilarsínico fica obrigatoriamente em último.\n\nOrdem: ácido arsenioso > ácido arsênico > ácido dimetilarsínico.","pq":{"A":"Põe o ácido arsênico (As(V) inorgânico) acima do arsenioso (As(III) inorgânico), mas pelo texto o As(III) inorgânico é o mais tóxico. Também coloca o composto orgânico no meio, quando ele deveria vir por último.","B":"Coloca o ácido dimetilarsínico como o mais tóxico, mas ele tem As ligado a grupos CH₃, e o texto põe os compostos orgânicos no fim da escala. Ainda deixa o As(III) inorgânico, o mais tóxico, em último lugar.","C":"Acerta o primeiro (arsenioso, As(III) inorgânico), mas põe o composto orgânico à frente do ácido arsênico. Pelo texto, os compostos inorgânicos (As(III) ou As(V)) são mais tóxicos que os ligados a grupos orgânicos.","D":"Correta: As(III) inorgânico (arsenioso) > As(V) inorgânico (arsênico) > As(V) ligado a grupos orgânicos (dimetilarsínico).","E":"Põe o dimetilarsínico (orgânico) como o mais tóxico, quando pelo texto ele é o menos tóxico dos três. Só a ordem relativa arsenioso > arsênico está certa."},"dica":"Quando o texto dá uma ordem de toxicidade ou reatividade, use os critérios citados (aqui, Nox do As e presença de grupo orgânico) como chave e encaixe cada composto nela.","dif":"média","nota":"","obs":""}],"grupos":{"02-06":{"rotulo":"02 a 06","imgs":[{"src":"img/2023d1/g02-06_1.webp","w":781,"h":575},{"src":"img/2023d1/g02-06_2.webp","w":782,"h":904}]},"08-10":{"rotulo":"08 a 10","imgs":[{"src":"img/2023d1/g08-10_1.webp","w":781,"h":1106}]},"11-12":{"rotulo":"11 e 12","imgs":[{"src":"img/2023d1/g11-12_1.webp","w":786,"h":1219}]},"14-16":{"rotulo":"14 a 16","imgs":[{"src":"img/2023d1/g14-16_1.webp","w":781,"h":1445}]},"21-22":{"rotulo":"21 e 22","imgs":[{"src":"img/2023d1/g21-22_1.webp","w":781,"h":670}]}}},"2023d2":{"ano":2023,"dia":2,"descricao":"Matemática e Ciências Humanas (História, Geografia, Filosofia, Sociologia).","questoes":[{"id":"2023d2-01","n":1,"area":"Matemática","disc":"Matemática","assunto":"Média aritmética","titulo":"Preço médio da saca de feijão de julho a outubro","gab":"E","base":null,"imgs":[{"src":"img/2023d2/q01_1.webp","w":781,"h":551}],"alt":{"A":"245 reais.","B":"230 reais.","C":"240 reais.","D":"225 reais.","E":"235 reais."},"res":"Ideia-chave: o preço médio é a média aritmética, ou seja, a soma dos valores dividida pela quantidade de valores.\n\nSão 4 meses (julho, agosto, setembro e outubro):\nSoma = 200 + 220 + 270 + 250 = 940\nMédia = 940 ÷ 4 = 235\n\nO preço médio foi de **235 reais**.\n\nConferência rápida: a média precisa ficar entre o menor valor (200) e o maior (270), e os desvios em relação a ela se anulam:\n(200 − 235) + (220 − 235) + (270 − 235) + (250 − 235) = −35 − 15 + 35 + 15 = 0. Confere.","pq":{"A":"245 é a média só de agosto e setembro: (220 + 270) ÷ 2 = 245. A média do período tem que usar os quatro meses.","B":"230 é a média só de julho a setembro: (200 + 220 + 270) ÷ 3 = 690 ÷ 3 = 230. Ficou faltando outubro (250).","C":"240 aparece se você esquecer agosto: (200 + 270 + 250) ÷ 3 = 720 ÷ 3 = 240. A soma correta dos quatro meses é 940, e 940 ÷ 4 = 235.","D":"225 é a média só do primeiro e do último mês: (200 + 250) ÷ 2 = 225. O período de julho a outubro inclui também agosto e setembro.","E":"Correta: (200 + 220 + 270 + 250) ÷ 4 = 940 ÷ 4 = 235 reais."},"dica":"Média aritmética: some todos os valores do período e divida pela quantidade de valores, conferindo se nenhum mês ficou de fora.","dif":"fácil","nota":"","obs":""},{"id":"2023d2-02","n":2,"area":"Matemática","disc":"Matemática","assunto":"Potências de 2 – dobraduras e medidas","titulo":"Quantas dobras para a carta de 24 cm caber na caixinha 7 × 7 × 2","gab":"B","base":null,"imgs":[{"src":"img/2023d2/q02_1.webp","w":781,"h":729}],"alt":{"A":"6.","B":"4.","C":"2.","D":"3.","E":"5."},"res":"Ideia-chave: cada dobra ao meio divide um dos lados da folha por 2 e dobra o número de camadas, ou seja, dobra a espessura.\n\nPara caber na caixinha, os dois lados da folha dobrada precisam medir no máximo 7 cm, e a espessura no máximo 2 cm.\n\nLados: 24 → 12 → 6. Cada lado de 24 cm precisa de 2 dobras para ficar ≤ 7 cm, porque com 1 dobra ele ainda mede 12 cm. Como são dois lados, o mínimo é 2 + 2 = 4 dobras, e a folha fica com 6 cm × 6 cm.\n\nEspessura: 1 mm = 0,1 cm. Depois de 4 dobras há 2⁴ = 16 camadas:\n16 × 0,1 = 1,6 cm ≤ 2 cm. Cabe!\n\nPortanto, a quantidade mínima é **4 dobras**.\n\nCuriosidade: com 5 dobras a espessura já seria 2⁵ × 0,1 = 3,2 cm, mais do que a altura de 2 cm da caixinha.","pq":{"A":"Com 6 dobras a folha ficaria 3 cm × 3 cm, mas com 2⁶ = 64 camadas, ou 6,4 cm de espessura, mais do que os 2 cm de altura. Além de não caber, não seria o mínimo.","B":"Correta: 2 dobras em cada direção deixam a folha com 6 cm × 6 cm e 16 camadas (1,6 cm de espessura), o que cabe na caixinha de 7 × 7 × 2.","C":"Com 2 dobras, o melhor resultado é 12 cm × 12 cm (ou 6 cm × 24 cm). Em qualquer caso, pelo menos um lado continua maior que 7 cm.","D":"Com 3 dobras, a folha fica com 6 cm × 12 cm. O lado de 12 cm não cabe no fundo de 7 cm, nem mesmo na diagonal, que mede 7√2 ≈ 9,9 cm.","E":"Com 5 dobras a folha teria 2⁵ = 32 camadas, ou 3,2 cm de espessura, mais do que a altura de 2 cm. Além disso, 4 dobras já bastam."},"dica":"Em dobraduras, acompanhe tudo junto: cada dobra ao meio divide um lado por 2 e multiplica a espessura por 2.","dif":"média","nota":"","obs":""},{"id":"2023d2-03","n":3,"area":"Matemática","disc":"Matemática","assunto":"Leitura de tabela e proporção","titulo":"Balancete de vendas de blusas, calças e vestidos","gab":"C","base":null,"imgs":[{"src":"img/2023d2/q03_1.webp","w":783,"h":982}],"alt":{"A":"o valor total arrecado com a venda de todos os itens foi de R$12.000,00.","B":"o valor obtido com a venda de vestidos foi maior que o valor obtido com a venda de blusas.","C":"o valor obtido com a venda das blusas representou menos da metade do total arrecado.","D":"a quantidade total de itens vendidos foi de 185.","E":"o item que mais contribuiu para o valor total das vendas foi a calça."},"res":"Ideia-chave: o valor arrecadado com cada produto é o valor unitário vezes a quantidade vendida.\n\nBlusa: 45 × 100 = R$ 4.500,00\nCalça: 80 × 50 = R$ 4.000,00\nVestido: 60 × 60 = R$ 3.600,00\nTotal: 4.500 + 4.000 + 3.600 = R$ 12.100,00\n\nMetade do total: 12.100 ÷ 2 = R$ 6.050,00.\nAs blusas renderam R$ 4.500,00, que é menos que R$ 6.050,00. Portanto, representaram menos da metade do total arrecadado: 4.500/12.100 ≈ 37%. A alternativa C é verdadeira.\n\nAs outras não passam na conferência: o total não é R$ 12.000,00, os vestidos renderam menos que as blusas, foram vendidos 210 itens e o item que mais contribuiu foi a blusa, não a calça.","pq":{"A":"O total correto é 4.500 + 4.000 + 3.600 = R$ 12.100,00, e não R$ 12.000,00. A diferença é de só R$ 100,00, um erro fácil para quem arredonda ou soma com pressa.","B":"Os vestidos renderam 60 × 60 = R$ 3.600,00 e as blusas, 45 × 100 = R$ 4.500,00. Os vestidos renderam menos, e não mais.","C":"Correta: as blusas renderam R$ 4.500,00, menos que a metade do total (R$ 6.050,00). Isso equivale a cerca de 37%.","D":"185 é a soma dos valores unitários (45 + 80 + 60), e não das quantidades. Os itens vendidos foram 100 + 50 + 60 = 210.","E":"A calça tem o maior preço unitário (R$ 80,00), mas vendeu só 50 unidades, ou R$ 4.000,00. Quem mais contribuiu foi a blusa, com R$ 4.500,00."},"dica":"Em tabelas de vendas, multiplique preço × quantidade antes de comparar: o item mais caro nem sempre é o que mais arrecada.","dif":"fácil","nota":"","obs":""},{"id":"2023d2-04","n":4,"area":"Matemática","disc":"Matemática","assunto":"Função quadrática – forma fatorada","titulo":"Parábola com raízes −5 e 2 e corte em y = −5: valor de a + b + c","gab":"C","base":null,"imgs":[{"src":"img/2023d2/q04_1.webp","w":781,"h":1048}],"alt":{"A":"2.","B":"5.","C":"−3.","D":"−8.","E":"−10."},"res":"Ideia-chave: a + b + c é exatamente o valor de y quando x = 1, pois y(1) = a·1² + b·1 + c.\n\nDo gráfico: as raízes são x₁ = −5 e x₂ = 2, e a parábola corta o eixo y em −5, então c = −5.\n\nForma fatorada: y = a(x + 5)(x − 2).\nEm x = 0: a·(5)·(−2) = −5 → −10a = −5 → a = 1/2.\n\nEntão:\ny = (1/2)(x + 5)(x − 2) = (1/2)(x² + 3x − 10) = (1/2)x² + (3/2)x − 5\nLogo, a = 1/2, b = 3/2 e c = −5.\n\na + b + c = 1/2 + 3/2 − 5 = 2 − 5 = **−3**\n\nConferência pelo atalho: y(1) = (1/2)(1 + 5)(1 − 2) = (1/2)(6)(−1) = −3.\n\nChecagem de sinal: x = 1 está entre as raízes −5 e 2, e a concavidade é para cima. Então a parábola está abaixo do eixo x nesse ponto e y(1) tem que ser negativo. Isso já descarta 2 e 5.","pq":{"A":"2 é apenas a + b = 1/2 + 3/2; faltou somar c = −5. Além disso, y(1) tem que ser negativo, porque x = 1 fica entre as raízes.","B":"Um valor positivo é impossível aqui: em x = 1 a parábola está abaixo do eixo x (x = 1 fica entre as raízes −5 e 2), então a + b + c = y(1) < 0. Com a = 1/2, b = 3/2 e c = −5, a soma dá −3.","C":"Correta: a = 1/2, b = 3/2 e c = −5, então a + b + c = y(1) = (1/2)(6)(−1) = −3.","D":"−8 aparece se você calcular a + b = 2 corretamente, mas usar c = −10 (o produto das raízes) em vez de c = −5: 2 + (−10) = −8. O valor de c é onde o gráfico corta o eixo y, ou seja, −5.","E":"−10 é o produto das raízes, (−5)·2. Ele só seria o valor de c se a = 1. Aqui, o corte no eixo y em −5 obriga a = 1/2, e a soma pedida é −3."},"dica":"Para achar a + b + c de uma parábola, calcule y(1). Para descobrir a, use a forma fatorada y = a(x − x₁)(x − x₂) junto com o ponto onde ela corta o eixo y.","dif":"média","nota":"","obs":""},{"id":"2023d2-05","n":5,"area":"Matemática","disc":"Matemática","assunto":"Sequências periódicas (restos da divisão)","titulo":"Sequência de restos da divisão por 3: soma dos k primeiros termos igual a 31","gab":"D","base":null,"imgs":[{"src":"img/2023d2/q05_1.webp","w":781,"h":731}],"alt":{"A":"12.","B":"42.","C":"53.","D":"31.","E":"21."},"res":"Ideia-chave: os termos se repetem em blocos de 3, e cada bloco soma 3.\n\nCalculando:\na₁ = 1, a₂ = 2, a₃ = resto de 3 ÷ 3 = 0, a₄ = 1, a₅ = 2, a₆ = 0, a₇ = 1, ...\nA sequência é 1, 2, 0, 1, 2, 0, 1, ..., com período 3, e cada bloco (1, 2, 0) soma 3.\n\nSoma S dos k primeiros termos, conforme o valor de k:\nk = 3m → S = 3m\nk = 3m + 1 → S = 3m + 1\nk = 3m + 2 → S = 3m + 3\n\nQueremos S = 31. Como 31 não é múltiplo de 3, só serve o caso S = 3m + 1:\n3m + 1 = 31 → m = 10 → k = 3·10 + 1 = 31\n\nConferindo: 10 blocos completos (30 termos) somam 10 × 3 = 30. O 31º termo é a₃₁ = 1, porque 31 = 3·10 + 1. Então 30 + 1 = 31.\n\nLogo, **k = 31**.","pq":{"A":"Com k = 12 há 4 blocos completos, e a soma é 4 × 3 = 12, não 31.","B":"Com k = 42 há 14 blocos completos, e a soma é 14 × 3 = 42, bem mais que 31.","C":"Como 53 = 3·17 + 2, há 17 blocos somando 51, mais a₅₂ = 1 e a₅₃ = 2. O total é 54, não 31.","D":"Correta: 10 blocos (1, 2, 0) somam 30, e o 31º termo vale 1, totalizando 31.","E":"Com k = 21 há 7 blocos completos, e a soma é 7 × 3 = 21, ainda abaixo de 31."},"dica":"Em sequências de restos, escreva os primeiros termos para achar o período e trabalhe com a soma de cada bloco.","dif":"média","nota":"","obs":""},{"id":"2023d2-06","n":6,"area":"Matemática","disc":"Matemática","assunto":"Áreas de figuras planas","titulo":"Retângulo 8 × 10 com dois triângulos: altura x a partir da área hachurada","gab":"A","base":null,"imgs":[{"src":"img/2023d2/q06_1.webp","w":783,"h":1437}],"alt":{"A":"4.","B":"5.","C":"3.","D":"6.","E":"7."},"res":"Ideia-chave: área hachurada = área do retângulo − área dos dois triângulos brancos.\n\nÁrea do retângulo: 8 × 10 = 80 cm²\nÁrea branca (dois triângulos): 80 − 64 = 16 cm²\n\nNa figura, os dois triângulos iguais estão com as bases lado a lado sobre o lado de 8 cm e ocupam esse lado inteiro. Então cada base mede 8 ÷ 2 = 4 cm.\n\nÁrea de cada triângulo: (4 · x)/2 = 2x\nÁrea dos dois triângulos: 2 · 2x = 4x\n\n4x = 16 → **x = 4 cm**\n\nConferência: cada triângulo tem 4·4/2 = 8 cm², os dois somam 16 cm², e 80 − 16 = 64 cm². Confere.","pq":{"A":"Correta: cada triângulo tem base 4 cm, os dois juntos têm área 4x = 16 cm², e portanto x = 4.","B":"Com x = 5, os dois triângulos teriam 2 · (4·5/2) = 20 cm², e a área hachurada seria 80 − 20 = 60 cm², não 64.","C":"Com x = 3, a área branca seria 2 · (4·3/2) = 12 cm², e a hachurada, 80 − 12 = 68 cm². Cuidado ao medir no desenho: a figura não está em escala exata.","D":"Com x = 6, a área branca seria 2 · (4·6/2) = 24 cm², e a hachurada, 80 − 24 = 56 cm², o que não bate com 64.","E":"Com x = 7, a área branca seria 2 · (4·7/2) = 28 cm², e a hachurada, 80 − 28 = 52 cm², o que não bate com 64."},"dica":"Em regiões sombreadas, calcule a área da figura inteira, subtraia as partes em branco e só então monte a equação com a incógnita.","dif":"fácil","nota":"","obs":""},{"id":"2023d2-07","n":7,"area":"Matemática","disc":"Matemática","assunto":"Porcentagem","titulo":"População urbana da Amazônia: 75% de 28 milhões de habitantes","gab":"B","base":null,"imgs":[{"src":"img/2023d2/q07_1.webp","w":781,"h":990}],"alt":{"A":"13 milhões.","B":"21 milhões.","C":"7 milhões.","D":"19 milhões.","E":"24 milhões."},"res":"Ideia-chave: calcular 75% do total de habitantes.\nO texto informa que há \"75% da população vivendo em áreas urbanas na região\", e o enunciado dá o total: 28 milhões de habitantes.\n75% = 75/100 = 3/4\n3/4 × 28 milhões = 3 × (28 ÷ 4) milhões = 3 × 7 milhões = 21 milhões.\nConferindo na forma decimal: 0,75 × 28 = 21.\nAtalho: 25% (um quarto) de 28 é 7, então 75% é 28 − 7 = 21.\nPortanto, segundo a reportagem, cerca de **21 milhões** de habitantes da Amazônia vivem em área urbana.","pq":{"A":"13 milhões é menos da metade de 28 milhões (13/28 ≈ 46%), bem abaixo dos 75% informados no texto.","B":"Correta: 75% de 28 milhões = 3/4 × 28 = 21 milhões.","C":"7 milhões é 25% de 28 milhões, ou seja, a parcela que NÃO vive em área urbana. Você calculou o complemento em vez dos 75%.","D":"19 milhões corresponde a cerca de 68% de 28 milhões (19/28 ≈ 0,68), abaixo dos 75% do texto.","E":"24 milhões corresponde a cerca de 86% de 28 milhões (24/28 ≈ 0,86), acima dos 75% do texto."},"dica":"75% é 3/4: divida o total por 4 e multiplique por 3 (ou tire um quarto do total).","dif":"fácil","nota":"","obs":""},{"id":"2023d2-08","n":8,"area":"Matemática","disc":"Matemática","assunto":"Função afim – coeficiente angular","titulo":"Inclinação da reta que passa por (0, 2) e (1, −1)","gab":"D","base":null,"imgs":[{"src":"img/2023d2/q08_1.webp","w":781,"h":1122}],"alt":{"A":"– 1.","B":"– 2.","C":"2.","D":"– 3.","E":"3."},"res":"Ideia-chave: a inclinação (coeficiente angular) é a = Δy/Δx, calculada com dois pontos da reta.\nNo gráfico há dois pontos bem identificados:\no ponto em que a reta corta o eixo y, (0, 2);\no ponto marcado pelas linhas tracejadas, (1, −1).\nEntão:\na = (y₂ − y₁)/(x₂ − x₁) = (−1 − 2)/(1 − 0) = −3/1 = −3.\nO sinal negativo confirma o que se vê na figura: a reta é decrescente (desce da esquerda para a direita). Quando x aumenta 1 unidade, y cai 3 unidades.\nA equação da reta é y = −3x + 2, com inclinação **−3**.","pq":{"A":"−1 é o valor de y no ponto de abscissa 1, não a inclinação. A inclinação compara a variação de y (de 2 para −1, ou seja, −3) com a variação de x (de 0 para 1).","B":"−2 aparece se você confundir o coeficiente linear (2, onde a reta corta o eixo y) com o angular e só colocar o sinal negativo. A variação de y entre x = 0 e x = 1 é −3, não −2.","C":"2 é o coeficiente linear b (onde a reta corta o eixo y), não a inclinação. Além disso, a reta é decrescente, então a inclinação precisa ser negativa.","D":"Correta: a = (−1 − 2)/(1 − 0) = −3; a reta é decrescente, então a inclinação é negativa.","E":"3 tem o módulo certo, mas o sinal errado. Costuma vir de fazer 2 − (−1) em cima e 1 − 0 embaixo, trocando a ordem dos pontos só no numerador. A reta desce, logo a inclinação é negativa."},"dica":"Inclinação = Δy/Δx, usando os pontos na mesma ordem em cima e embaixo; reta descendo tem inclinação negativa.","dif":"fácil","nota":"","obs":""},{"id":"2023d2-09","n":9,"area":"Matemática","disc":"Matemática","assunto":"Áreas de figuras planas – base média do triângulo","titulo":"Área hachurada entre o triângulo retângulo ABC e o retângulo DEFG","gab":"E","base":null,"imgs":[{"src":"img/2023d2/q09_1.webp","w":781,"h":1000}],"alt":{"A":"3 cm².","B":"4 cm².","C":"5 cm².","D":"2 cm².","E":"6 cm²."},"res":"Ideia-chave: como AF = FB e BG = GC, F e G são pontos médios de AB e BC. Então FG é base média, e o triângulo FBG é semelhante a ABC com razão 1/2. Por isso a área dele é (1/2)² = 1/4 da área de ABC.\n1) Área de FBG = 24/4 = 6 cm².\n2) A região hachurada é o que sobra de ABC depois de retirar o triângulo FBG e o retângulo DEFG:\nÁrea hachurada = 24 − 6 − 12 = 6 cm².\nConferindo com x: os catetos são AB = 2(x + 1) e BC = 2x, então\n(2x + 2)(2x)/2 = 24 → 2x² + 2x = 24 → x² + x − 12 = 0 → (x + 4)(x − 3) = 0 → x = 3 (−4 não serve).\nAssim AB = 8 cm, BC = 6 cm e AC = 10 cm. Área de FBG = (4 × 3)/2 = 6 cm², como previsto.\nO retângulo também confere: FG = 10/2 = 5 cm, e a altura dele é metade da altura de B em relação a AC (4,8/2 = 2,4 cm), o que dá 5 × 2,4 = 12 cm².\nOs triângulos hachurados AEF (3,84 cm²) e GDC (2,16 cm²) somam **6 cm²**.","pq":{"A":"3 é o valor de x (BG = GC = 3 cm), uma medida de lado e não uma área. Também não é metade de cada triângulo: AEF e GDC são diferentes (3,84 cm² e 2,16 cm²).","B":"4 é a medida de AF = FB = x + 1 = 4 cm, e também é aproximadamente a área de só um triângulo hachurado, AEF (3,84 cm²). A questão pede a área hachurada total, que inclui também GDC.","C":"5 é o comprimento de FG (base média: AC/2 = 10/2 = 5 cm). É uma medida de lado, não de área.","D":"2 cm² é aproximadamente a área só do triângulo GDC (2,16 cm²). Faltou somar o triângulo AEF.","E":"Correta: 24 (ABC) − 6 (FBG, que é 1/4 de ABC) − 12 (retângulo) = 6 cm²."},"dica":"Ligar os pontos médios de dois lados de um triângulo gera um triângulo semelhante com razão 1/2 e área igual a 1/4 da original.","dif":"média","nota":"","obs":""},{"id":"2023d2-10","n":10,"area":"Matemática","disc":"Matemática","assunto":"Função quadrática e Teorema de Pitágoras","titulo":"Comprimento do cabo de teleférico sobre um morro parabólico","gab":"B","base":null,"imgs":[{"src":"img/2023d2/q10_1.webp","w":783,"h":1241}],"alt":{"A":"1 200 m.","B":"1 300 m.","C":"1 100 m.","D":"1 000 m.","E":"1 400 m."},"res":"Ideia-chave: escrever as coordenadas de A e B usando a parábola e depois aplicar Pitágoras.\n1) Topo do morro C: é o vértice da parábola y = −x²/160 + 490, em x = 0, então y = 490. C = (0, 490).\n2) B fica 10 m acima de C, sobre o eixo y: B = (0, 500).\n3) Pé do morro D: é a raiz positiva da parábola.\n−x²/160 + 490 = 0 → x² = 490 × 160 = 78 400 → x = 280. D = (280, 0).\n4) A está 920 m depois de D: A = (280 + 920, 0) = (1 200, 0).\n5) O cabo AB é a hipotenusa do triângulo retângulo de catetos 1 200 m (horizontal) e 500 m (vertical):\nAB² = 1 200² + 500² = 1 440 000 + 250 000 = 1 690 000\nAB = √1 690 000 = 1 300 m.\nAtalho: 500 e 1 200 são 5 × 100 e 12 × 100. Pelo terno pitagórico 5-12-13, AB = 13 × 100 = **1 300 m**.","pq":{"A":"1 200 m é só a distância horizontal da origem até A (280 + 920). Faltou considerar a altura de 500 m de B. O cabo é a hipotenusa, sempre maior que cada cateto.","B":"Correta: A = (1 200, 0) e B = (0, 500), então AB = √(1 200² + 500²) = 1 300 m.","C":"1 100 m é menor que o cateto horizontal de 1 200 m (do eixo y até A). Como o cabo é a hipotenusa do triângulo, não pode ser menor que um cateto.","D":"1 000 m também é menor que o cateto de 1 200 m. Um valor próximo (≈ 1 047 m) sai se você usar 920 m como cateto horizontal e esquecer de somar os 280 m da origem até D.","E":"1 400 m não fecha o Pitágoras: 1 400² = 1 960 000, mas 1 200² + 500² = 1 690 000. Com os catetos corretos, o cabo mede 1 300 m, não 1 400 m."},"dica":"Com parábola e reta, primeiro traduza os pontos em coordenadas (vértice, raízes, deslocamentos) e só depois aplique Pitágoras ou a distância entre pontos.","dif":"média","nota":"","obs":""},{"id":"2023d2-11","n":11,"area":"Matemática","disc":"Matemática","assunto":"Comprimento de arco e ângulo central (rolamento da roda)","titulo":"Roda de bicicleta que rola 22π cm: ângulo BCP ao chegar em B","gab":"C","base":null,"imgs":[{"src":"img/2023d2/q11_1.webp","w":781,"h":1449}],"alt":{"A":"150º","B":"165º","C":"120º","D":"135º","E":"90º"},"res":"Ideia-chave: uma roda que rola sem deslizar gira um arco de comprimento igual à distância percorrida.\n1) Ângulo girado: a roda tem raio 24 cm e anda 22π cm, então gira um arco de 22π cm.\nθ = arco/raio = 22π/24 rad = (22/24) × 180° = 165°.\n(Ou: uma volta mede 2π × 24 = 48π cm; 22π/48π = 11/24 de volta = 11/24 × 360° = 165°.)\n2) Sentido: a bicicleta vai para a direita, então a roda gira no sentido horário. O raio que vai de C ao ponto de contato com o chão aponta sempre para baixo.\n3) Em A, P está 45° à frente (à direita) desse raio vertical. No giro horário, P desce: depois de 45° ele toca o chão, e os 165° − 45° = 120° restantes o levam para trás (à esquerda) do raio vertical.\n4) Em B, o raio CB é justamente o raio vertical para baixo. Logo:\nBCP = 165° − 45° = **120°**.\nIsso confere com a 2ª figura, em que P aparece à esquerda de C e um pouco acima dele.","pq":{"A":"150° sai quando se gira P no sentido errado (anti-horário): 45° + 165° = 210°, e o ângulo convexo é 360° − 210° = 150°. Como a bicicleta vai para a direita, a roda gira no sentido horário e P primeiro desce até o chão.","B":"165° é o ângulo que a roda girou entre A e B, não o ângulo BCP. Faltou descontar os 45° que P já estava à frente do ponto de contato em A.","C":"Correta: a roda gira 22π/24 rad = 165° no sentido horário e, descontando os 45° iniciais, BCP = 165° − 45° = 120°.","D":"135° corresponderia a um giro de meia volta (180° − 45° = 135°), ou seja, a um percurso de 24π cm. A roda andou só 22π cm, o que dá 165°, não 180°.","E":"90° exigiria P na horizontal de C, o que corresponde a um giro de 45° + 90° = 135°, ou seja, a um percurso de 18π cm. Com 22π cm, a roda gira 165°."},"dica":"Roda rolando sem deslizar: ângulo girado (em rad) = distância percorrida ÷ raio; depois confira o sentido do giro e a posição inicial do ponto.","dif":"difícil","nota":"","obs":""},{"id":"2023d2-12","n":12,"area":"Matemática","disc":"Matemática","assunto":"Média aritmética","titulo":"Média das notas da turma sem as cinco piores notas","gab":"B","base":null,"imgs":[{"src":"img/2023d2/q12_1.webp","w":783,"h":551}],"alt":{"A":"6.","B":"7.","C":"4.","D":"5.","E":"8."},"res":"Ideia-chave: média × quantidade = soma. Faça as contas com as somas das notas, não com as médias.\n1) Soma de todas as notas: 20 × 6 = 120.\n2) Soma das cinco piores notas: 5 × 3 = 15.\n3) Soma das notas do restante: 120 − 15 = 105.\n4) Quantidade de alunos restantes: 20 − 5 = 15.\nMédia do restante = 105 ÷ 15 = **7**.\nConferência: (5 × 3 + 15 × 7) ÷ 20 = (15 + 105) ÷ 20 = 120 ÷ 20 = 6, que é a média dada.","pq":{"A":"6 é a média da turma inteira. Quando se tiram as cinco piores notas (média 3, abaixo de 6), a média dos que sobram tem de subir.","B":"Correta: (20 × 6 − 5 × 3) ÷ 15 = 105 ÷ 15 = 7.","C":"4 é menor que a média geral 6, o que é impossível: ao retirar notas abaixo da média, a média do grupo restante fica acima de 6.","D":"5 também é menor que a média geral 6, o que é impossível pelo mesmo motivo. Um valor próximo (5,25) aparece se você dividir a soma do restante (105) por 20 alunos em vez de 15.","E":"8 aparece se você dividir a soma total da turma (120) por 15 sem tirar os 15 pontos das cinco piores notas: 120 ÷ 15 = 8."},"dica":"Em média de grupos, converta cada média em soma (média × quantidade), faça as contas com as somas e só divida no final.","dif":"fácil","nota":"","obs":""},{"id":"2023d2-13","n":13,"area":"Matemática","disc":"Matemática","assunto":"Análise combinatória – combinação simples","titulo":"Time de vôlei: escolher 6 titulares entre 10 jogadores","gab":"E","base":null,"imgs":[{"src":"img/2023d2/q13_1.webp","w":783,"h":646}],"alt":{"A":"60.","B":"72.","C":"420.","D":"720.","E":"210."},"res":"**Ideia-chave:** a ordem da escolha não importa. O enunciado diz que todos \"se dispõem a jogar em qualquer posição\", então o técnico só decide QUEM entra, e não em que posição cada um joga. Escolher Ana, Beto e Caio ou Caio, Beto e Ana dá o mesmo time. Isso é combinação.\n\nC(10,6) = 10! / (6! · 4!)\n\nCortando o 6! de cima e de baixo:\nC(10,6) = (10 · 9 · 8 · 7) / (4 · 3 · 2 · 1)\nC(10,6) = 5040 / 24\nC(10,6) = 210\n\nAtalho útil: C(10,6) = C(10,4), porque escolher os 6 que jogam equivale a escolher os 4 que ficam no banco. A conta com o 4 é mais curta.\n\nResposta: 210 maneiras (alternativa E).","pq":{"A":"60 aparece se você multiplicar 10 × 6 (jogadores × vagas). Esse produto não conta grupos: escolher 6 entre 10 exige a fórmula de combinação.","B":"72 não corresponde a nenhuma contagem coerente da situação: não é 10 × 6, nem 6!, nem C(10,6). É só um distrator; o número de grupos de 6 formados com 10 pessoas é 210.","C":"420 é o dobro da resposta. Aparece, por exemplo, se você dividir 10 · 9 · 8 · 7 = 5040 por 12 em vez de 4! = 24, descontando só metade das repetições de ordem.","D":"720 é 10 · 9 · 8 (arranjo de 3 elementos) ou 6! (as ordens possíveis de 6 pessoas). Nenhuma dessas contas responde à pergunta: aqui se escolhem 6 jogadores e a ordem não importa.","E":"Correta. A ordem não importa, então é combinação: C(10,6) = 5040/24 = 210."},"dica":"Pergunte-se: se eu trocar a ordem dos escolhidos, o resultado muda? Se não muda, é combinação: C(n,p) = n!/(p!(n−p)!).","dif":"fácil","nota":"","obs":""},{"id":"2023d2-14","n":14,"area":"Matemática","disc":"Matemática","assunto":"Potenciação – fatoração em primos e sistema linear","titulo":"Equação exponencial: valores de x e y em 18ˣ · 24ʸ = 6¹⁰","gab":"A","base":null,"imgs":[{"src":"img/2023d2/q14_1.webp","w":675,"h":443}],"alt":{"A":"x = 4, y = 2.","B":"x = 2, y = 4.","C":"x = 3, y = 6.","D":"x = 2, y = 3.","E":"x = 4, y = 3."},"res":"**Ideia-chave:** escreva tudo em potências de 2 e de 3 e depois iguale os expoentes de cada primo.\n\n18 = 2 · 3², 24 = 2³ · 3 e 6 = 2 · 3\n\n18ˣ = 2ˣ · 3²ˣ\n24ʸ = 2³ʸ · 3ʸ\nProduto: 2^(x + 3y) · 3^(2x + y)\n\n6¹⁰ = 2¹⁰ · 3¹⁰\n\nComo a decomposição em fatores primos é única, os expoentes de cada primo têm de ser iguais:\nx + 3y = 10 (expoente do 2)\n2x + y = 10 (expoente do 3)\n\nDa segunda equação: y = 10 − 2x.\nSubstituindo na primeira: x + 3(10 − 2x) = 10 → x + 30 − 6x = 10 → −5x = −20 → x = 4.\nLogo, y = 10 − 2 · 4 = 2.\n\nVerificação: 18⁴ · 24² = (2⁴ · 3⁸)(2⁶ · 3²) = 2¹⁰ · 3¹⁰ = 6¹⁰ ✓\n\nResposta: x = 4, y = 2 (alternativa A).","pq":{"A":"Correta. Com x = 4 e y = 2, o expoente do 2 é 4 + 6 = 10 e o do 3 é 8 + 2 = 10, ou seja, o produto é 2¹⁰ · 3¹⁰ = 6¹⁰.","B":"Os valores estão trocados: x = 2 e y = 4 resolveriam 24ˣ · 18ʸ = 6¹⁰. Na expressão do enunciado, dá 2^(2+12) · 3^(4+4) = 2¹⁴ · 3⁸ ≠ 6¹⁰.","C":"Dá 2^(3+18) · 3^(6+6) = 2²¹ · 3¹², muito maior que 6¹⁰: os dois expoentes passam de 10.","D":"Dá 2^(2+9) · 3^(4+3) = 2¹¹ · 3⁷. Sobra um fator 2 e faltam três fatores 3.","E":"O x está certo, mas o y não: 2^(4+9) · 3^(8+3) = 2¹³ · 3¹¹, que passa de 10 nos expoentes dos dois primos."},"dica":"Equação exponencial com bases diferentes: fatore tudo em primos e iguale os expoentes de cada primo, um por um.","dif":"média","nota":"","obs":""},{"id":"2023d2-15","n":15,"area":"Matemática","disc":"Matemática","assunto":"Geometria plana – triângulo inscrito com lado no diâmetro e teorema de Pitágoras","titulo":"Triângulo inscrito com lado AC passando pelo centro: medida de BC","gab":"D","base":null,"imgs":[{"src":"img/2023d2/q15_1.webp","w":781,"h":1092}],"alt":{"A":"3 cm.","B":"5 cm.","C":"4 cm.","D":"6 cm.","E":"7 cm."},"res":"**Ideia-chave:** na figura, o lado AC passa pelo centro O, então AC é um diâmetro. Todo triângulo inscrito que tem um diâmetro como lado é retângulo, e o ângulo reto fica no vértice oposto ao diâmetro, ou seja, em B.\n\nDiâmetro: AC = 2 · 5 = 10 cm (é a hipotenusa)\nCatetos: AB = 8 cm e BC = ?\n\nPitágoras:\nAC² = AB² + BC²\n10² = 8² + BC²\n100 = 64 + BC²\nBC² = 36\nBC = 6 cm\n\nÉ o clássico triângulo 6-8-10, que é o 3-4-5 multiplicado por 2.\n\nResposta: 6 cm (alternativa D).","pq":{"A":"3 aparece se você usar o raio como hipotenusa e metade de AB como cateto: √(5² − 4²) = 3. Essa conta dá a distância do centro O até a corda AB, e não o lado BC.","B":"5 cm é o raio. BC liga dois pontos da circunferência sem passar pelo centro, então é uma corda qualquer, e não um raio.","C":"4 cm é a metade de AB. Nenhuma propriedade da figura faz BC valer metade de AB.","D":"Correta. AC é diâmetro (10 cm), então o ângulo em B é reto e, por Pitágoras, BC = √(100 − 64) = 6 cm.","E":"Com BC = 7, teríamos AB² + BC² = 64 + 49 = 113 ≠ 100 = AC². O triângulo não seria retângulo, o que contradiz o fato de AC ser diâmetro."},"dica":"Lado de triângulo inscrito que passa pelo centro é diâmetro e vira hipotenusa: o ângulo oposto é reto e você pode usar Pitágoras.","dif":"média","nota":"","obs":""},{"id":"2023d2-16","n":16,"area":"Matemática","disc":"Matemática","assunto":"Estatística – mediana a partir de gráfico de barras","titulo":"Mediana do lucro mensal de uma empresa em 2022 (gráfico de barras)","gab":"B","base":null,"imgs":[{"src":"img/2023d2/q16_1.webp","w":782,"h":1027}],"alt":{"A":"R$ 20.000,00.","B":"R$ 22.500,00.","C":"R$ 15.000,00.","D":"R$ 17.500,00.","E":"R$ 25.000,00."},"res":"**Ideia-chave:** a mediana é o valor central dos dados depois de colocados EM ORDEM. Como são 12 valores (quantidade par), a mediana é a média do 6º e do 7º valores.\n\nLeitura do gráfico (em mil reais):\nJan 25, Fev 10, Mar 25, Abr 10, Mai 20, Jun 15, Jul 20, Ago 25, Set 25, Out 25, Nov 20, Dez 30.\n\nEm ordem crescente:\n10, 10, 15, 20, 20, **20**, **25**, 25, 25, 25, 25, 30\n\n6º valor = 20.000\n7º valor = 25.000\n\nMediana = (20.000 + 25.000) / 2 = 45.000 / 2 = 22.500\n\nResposta: R$ 22.500,00 (alternativa B).","pq":{"A":"R$ 20.000 é só o 6º valor ordenado; com 12 dados é preciso fazer a média do 6º e do 7º. Também fica perto da média aritmética (250.000/12 ≈ 20.833), mas a pergunta pede a mediana.","B":"Correta. Com os 12 lucros em ordem, os termos centrais são 20.000 e 25.000, e a média deles é 22.500.","C":"R$ 15.000 é o lucro de junho, o 6º mês do calendário. Para achar a mediana, os dados precisam ser ordenados por valor, e não pela sequência dos meses.","D":"R$ 17.500 é a média de junho (15.000) e julho (20.000), os dois meses do meio do calendário. É o erro de não ordenar os dados antes.","E":"R$ 25.000 é a moda (aparece 5 vezes) e também o 7º valor ordenado. Mas, com 12 dados, a mediana é a média do 6º e do 7º, e não só um deles."},"dica":"Mediana: primeiro ordene os dados. Se a quantidade for par, faça a média dos dois termos centrais.","dif":"média","nota":"","obs":""},{"id":"2023d2-17","n":17,"area":"Matemática","disc":"Matemática","assunto":"Trigonometria – inequação com cosseno do arco duplo","titulo":"Intervalo de θ em que cos(2θ) > √3/2","gab":"D","base":null,"imgs":[{"src":"img/2023d2/q17_1.webp","w":783,"h":543}],"alt":{"A":"30° ≤ θ < 45°","B":"15° ≤ θ < 30°","C":"45° ≤ θ < 60°","D":"0° ≤ θ < 15°","E":"60° ≤ θ < 90°"},"res":"**Ideia-chave:** trabalhe com o ângulo 2θ e lembre que cos 30° = √3/2 ≈ 0,866.\n\nEm todas as alternativas, 0° ≤ θ < 90°, então 0° ≤ 2θ < 180°. Nesse trecho o cosseno é decrescente: quanto maior o ângulo, menor o cosseno.\n\nAssim:\ncos(2θ) > cos 30°\n⇔ 2θ < 30°\n⇔ θ < 15°\n\nO intervalo pedido é 0° ≤ θ < 15°.\n\nConferindo: nesse intervalo, 0° ≤ 2θ < 30°, e cos(2θ) vai de 1 (em θ = 0°) até valores um pouco acima de √3/2, sem nunca chegar a ele. Sempre fica maior que √3/2 ✓\n\nResposta: alternativa D.","pq":{"A":"Aqui 2θ fica entre 60° e 90°, então cos(2θ) fica entre 0 e 1/2. O máximo é 0,5, menor que √3/2 ≈ 0,866.","B":"Aqui 2θ fica entre 30° e 60°. Em θ = 15°, cos 30° = √3/2 exatamente (igual, e não maior), e depois o cosseno só diminui. Quem acha 2θ < 30° e esquece de dividir por 2 chega a θ < 30° e pode cair aqui.","C":"Aqui 2θ fica entre 90° e 120°, então cos(2θ) ≤ 0, que nunca é maior que √3/2.","D":"Correta. Com 0° ≤ θ < 15°, temos 0° ≤ 2θ < 30°. Como o cosseno é decrescente nesse trecho, cos(2θ) > cos 30° = √3/2.","E":"Aqui 2θ fica entre 120° e 180°, então cos(2θ) fica entre −1 e −1/2, um valor negativo."},"dica":"Em inequações com arco duplo, trate 2θ como um ângulo só, resolva para ele e no final divida por 2. Lembre que o cosseno diminui de 0° a 180°.","dif":"média","nota":"","obs":""},{"id":"2023d2-18","n":18,"area":"Matemática","disc":"Matemática","assunto":"Probabilidade – união de eventos (inclusão-exclusão)","titulo":"Dado lançado 3 vezes: probabilidade de sair 6 duas vezes seguidas","gab":"C","base":null,"imgs":[{"src":"img/2023d2/q18_1.webp","w":781,"h":881}],"alt":{"A":"13/216","B":"14/216","C":"11/216","D":"12/216","E":"10/216"},"res":"**Ideia-chave:** em 3 lançamentos, \"tirar o número 6 duas vezes consecutivas\" significa que o 6 saiu no 1º e no 2º lançamento OU no 2º e no 3º. O resultado 6-6-6 está nos dois casos e não pode ser contado duas vezes.\n\nTotal de resultados: 6 · 6 · 6 = 216.\n\nContando os casos favoráveis:\n6, 6, x com x ≠ 6: 5 casos\nx, 6, 6 com x ≠ 6: 5 casos\n6, 6, 6: 1 caso\nTotal: 5 + 5 + 1 = 11\n\nPela inclusão-exclusão, a conta é a mesma:\nP(1º e 2º são 6) = 6/216 (o 3º pode ser qualquer número)\nP(2º e 3º são 6) = 6/216\nP(os três são 6) = 1/216\nP = 6/216 + 6/216 − 1/216 = 11/216\n\nResposta: 11/216 (alternativa C).","pq":{"A":"13/216 sai de 12 + 1: você somou o caso 6-6-6 em vez de subtraí-lo. Ele já estava contado duas vezes e precisa ser descontado uma vez.","B":"Não existem 14 sequências favoráveis: os únicos tipos são 66x, x66 e 666, que somam 5 + 5 + 1 = 11. Chegar a 14 significa contar sequências em que o 6 não sai duas vezes seguidas.","C":"Correta. Há 5 casos do tipo 66x, 5 do tipo x66 e o caso 666, num total de 11 favoráveis entre 216.","D":"12/216 é 6 + 6 sem a correção: o 6-6-6 entra tanto em \"1º e 2º são 6\" quanto em \"2º e 3º são 6\" e fica contado duas vezes.","E":"10/216 deixa de fora o 6-6-6, como se o jogo exigisse \"exatamente dois 6\". Mas 6-6-6 também tem 6 duas vezes seguidas, e o jogador vence."},"dica":"Para P(A ou B), use P(A) + P(B) − P(A e B). Antes de somar, procure o caso que está nos dois eventos.","dif":"média","nota":"","obs":""},{"id":"2023d2-19","n":19,"area":"Matemática","disc":"Matemática","assunto":"Poliedros – relação de Euler","titulo":"Poliedro com 2 pentágonos e 10 triângulos: número de arestas","gab":"A","base":null,"imgs":[{"src":"img/2023d2/q19_1.webp","w":781,"h":571}],"alt":{"A":"20.","B":"22.","C":"24.","D":"26.","E":"28."},"res":"Ideia-chave: conte as faces e depois aplique a relação de Euler.\nFaces: F = 2 pentágonos + 10 triângulos = 12.\nVértices: V = 10 (dado no enunciado).\nEuler: V − A + F = 2\n10 − A + 12 = 2\n22 − A = 2\nA = 20.\nConferência pela contagem de lados: cada aresta pertence a exatamente 2 faces, então\nA = (2 × 5 + 10 × 3)/2 = (10 + 30)/2 = 40/2 = 20.\nAs duas contas dão o mesmo resultado. Um exemplo de sólido com essas faces é o antiprisma pentagonal: dois pentágonos paralelos ligados por uma faixa de 10 triângulos.\nResposta: 20 arestas, alternativa A.","pq":{"A":"Correta. Com F = 12 e V = 10, Euler dá 10 − A + 12 = 2, ou seja, A = 20. A contagem de lados confirma: (10 + 30)/2 = 20.","B":"22 é V + F = 10 + 12. Esse valor aparece quando se esquece o 2 do lado direito da fórmula, como se fosse V − A + F = 0.","C":"24 vem de um erro de sinal: quem passa o 2 somando calcula A = 10 + 12 + 2 = 24. O certo é A = V + F − 2 = 20.","D":"Com A = 26, Euler exigiria 10 − 26 + F = 2, ou seja, F = 18 faces. O poliedro tem só 2 + 10 = 12 faces.","E":"Com A = 28, Euler exigiria F = 20 faces, e o poliedro tem 12. Esse valor também não bate com a contagem de lados, que dá 40/2 = 20."},"dica":"Em poliedros, calcule A = (soma dos lados de todas as faces)/2 e confira o resultado com V − A + F = 2.","dif":"fá
