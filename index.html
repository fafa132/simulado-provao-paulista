– peso e massa","titulo":"Massa de um corpo a partir do seu peso na superfície da Lua","gab":"B","base":null,"imgs":[{"src":"img/2024d1/q26_1.webp","w":781,"h":552}],"alt":{"A":"120 kg.","B":"48 kg.","C":"24 kg.","D":"66 kg.","E":"96 kg."},"res":"**Ideia-chave:** peso é P = m·g, e a gravidade que entra na conta é a do lugar onde o peso foi medido, ou seja, a da Lua. A massa é a mesma em qualquer lugar.\n\n1) Gravidade na Lua: a da Terra (10 m/s²) é 6 vezes maior, então\ng(Lua) = 10 ÷ 6 = 10/6 m/s² ≈ 1,67 m/s²\n\n2) Isole a massa:\nm = P ÷ g(Lua) = 80 ÷ (10/6)\nm = 80 × 6/10\nm = 480/10 = 48 kg\n\nConferindo: 48 × 10/6 = 80 N na Lua ✓ (na Terra, esse mesmo corpo pesaria 48 × 10 = 480 N).\n\nA massa é 48 kg: alternativa B.\n\nAtenção a dois erros comuns que nem aparecem nas alternativas: usar g = 10 m/s² (daria 8 kg) ou dividir 80 por 6 (daria ≈ 13,3 kg). Se a sua conta não bate com nenhuma opção, vale revisar qual g você usou.","pq":{"A":"Um corpo de 120 kg pesaria na Lua 120 × 10/6 = 200 N, e não 80 N. Esse valor não sai da relação P = m·g com os dados do enunciado.","B":"Correta. Com g(Lua) = 10/6 m/s², m = 80 ÷ (10/6) = 80 × 6/10 = 48 kg.","C":"É a metade do valor certo: um corpo de 24 kg pesaria na Lua 24 × 10/6 = 40 N, metade do peso informado. Provavelmente houve uma divisão por 2 a mais na conta.","D":"Um corpo de 66 kg pesaria na Lua 66 × 10/6 = 110 N, não 80 N. O número não vem de P = m·g com g(Lua) = 10/6 m/s².","E":"É o dobro do valor certo: um corpo de 96 kg pesaria 96 × 10/6 = 160 N na Lua, o dobro do peso informado."},"dica":"Massa não muda de lugar para lugar, o peso muda: use m = P/g com o g do local onde o peso foi medido.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-27","n":27,"area":"Ciências da Natureza","disc":"Física","assunto":"Energia mecânica (cinética + potencial gravitacional)","titulo":"Energia mecânica de um reboque a 20 m/s, 15 m acima do ponto P","gab":"E","base":null,"imgs":[{"src":"img/2024d1/q27_1.webp","w":783,"h":1143}],"alt":{"A":"40 kJ.","B":"120 kJ.","C":"100 kJ.","D":"80 kJ.","E":"140 kJ."},"res":"**Ideia-chave:** energia mecânica é a soma da energia cinética com a potencial: Em = Ec + Ep. No desengate, o reboque está em movimento (tem Ec) e está 15 m acima da pista onde fica P, que é a referência de Ep nula (então também tem Ep).\n\n1) Energia cinética:\nEc = m·v²/2 = 400 × 20²/2\nEc = 400 × 400/2 = 80 000 J = 80 kJ\n\n2) Energia potencial gravitacional:\nEp = m·g·h = 400 × 10 × 15\nEp = 60 000 J = 60 kJ\n\n3) Energia mecânica:\nEm = 80 kJ + 60 kJ = 140 kJ\n\nA resposta é a alternativa E.","pq":{"A":"40 kJ não é nenhuma das parcelas (Ec = 80 kJ, Ep = 60 kJ) nem a soma delas. Seria a metade da cinética, valor que aparece se você dividir m·v² por 4 em vez de 2 e ainda esquecer a potencial.","B":"120 kJ é o dobro da potencial (60 + 60), como se a cinética também valesse 60 kJ. Também aparece se, em m·g·h, você trocar g pela velocidade (400 × 20 × 15 = 120 000 J). A cinética correta é 400 × 20²/2 = 80 kJ.","C":"É 60 kJ de potencial + 40 kJ de uma cinética calculada errado (dividindo m·v² por 4 em vez de 2). A cinética correta é 400 × 20²/2 = 80 kJ.","D":"80 kJ é só a energia cinética. Faltou somar a potencial, que não é zero porque o reboque está 15 m acima do nível do ponto P: mais 60 kJ.","E":"Correta. Em = Ec + Ep = 400 × 20²/2 + 400 × 10 × 15 = 80 kJ + 60 kJ = 140 kJ."},"dica":"Energia mecânica = Ec + Ep: confira sempre se o corpo tem velocidade (Ec = m·v²/2) E altura acima da referência (Ep = m·g·h).","dif":"fácil","nota":"","obs":""},{"id":"2024d1-28","n":28,"area":"Ciências da Natureza","disc":"Física","assunto":"Termometria – conversão entre escalas","titulo":"Expressão de conversão de Fahrenheit (θF) para kelvin (T)","gab":"A","base":null,"imgs":[{"src":"img/2024d1/q28_1.webp","w":781,"h":1933}],"alt":{"A":"T = 1/9 × (5θF + 2297)","B":"T = θF + 32","C":"T = θF + 273","D":"T = 5θF + 1145","E":"T = 1/5 × (9θF + 1145)"},"res":"**Ideia-chave:** monte a proporção entre as escalas usando os dois pontos fixos da água. Pela figura, congelamento = 32 °F = 0 °C = 273 K. Ebulição = 212 °F = 100 °C, que em kelvin vale 100 + 273 = 373 K.\n\n1) Proporção Fahrenheit × kelvin:\n(θF − 32)/(212 − 32) = (T − 273)/(373 − 273)\n(θF − 32)/180 = (T − 273)/100\nDividindo os dois denominadores por 20: (θF − 32)/9 = (T − 273)/5\n\n2) Isole T:\nT − 273 = 5(θF − 32)/9\nT = (5θF − 160)/9 + 273\nComo 273 = 2457/9:\nT = (5θF − 160 + 2457)/9\nT = (5θF + 2297)/9 = 1/9 × (5θF + 2297)\n\n3) Teste com os pontos fixos:\nθF = 32 → (160 + 2297)/9 = 2457/9 = 273 K ✓\nθF = 212 → (1060 + 2297)/9 = 3357/9 = 373 K ✓\n\nA expressão correta é a da alternativa A.","pq":{"A":"Correta. Sai de (θF − 32)/9 = (T − 273)/5 e acerta os dois pontos fixos: 32 °F → 273 K e 212 °F → 373 K.","B":"Soma 32 como se as escalas tivessem graus do mesmo tamanho, mas o intervalo gelo-vapor tem 180 divisões em Fahrenheit e só 100 em kelvin. Teste rápido: 32 °F daria 64 K, e não 273 K.","C":"Essa é a relação entre kelvin e Celsius (T = θC + 273), aplicada por engano a Fahrenheit. Com ela, 32 °F daria 305 K, e não 273 K.","D":"Falta a divisão por 9, então a fórmula cresce rápido demais: 32 °F daria 5 × 32 + 1145 = 1305 K, um valor absurdo para a água congelando.","E":"Inverte os fatores 5 e 9, como se o grau Fahrenheit fosse maior que o kelvin. Teste: 32 °F daria (288 + 1145)/5 ≈ 286,6 K, e não 273 K."},"dica":"Em conversão de escalas, monte (X − fusão)/(ebulição − fusão) para cada escala e teste a fórmula final com um ponto conhecido, como 32 °F = 273 K.","dif":"média","nota":"","obs":""},{"id":"2024d1-29","n":29,"area":"Ciências da Natureza","disc":"Física","assunto":"Termodinâmica – trabalho em transformação isobárica e lei dos gases","titulo":"Temperatura em B numa expansão isobárica com trabalho de 2 000 J","gab":"B","base":null,"imgs":[{"src":"img/2024d1/q29_1.webp","w":783,"h":957}],"alt":{"A":"1 000 K.","B":"1 200 K.","C":"800 K.","D":"600 K.","E":"1 600 K."},"res":"**Ideia-chave:** em pressão constante, o trabalho é W = P·ΔV (a área do retângulo sob o segmento AB no gráfico), e isso dá o volume em B. Depois, como P é constante, V/T também é constante.\n\nDados do gráfico: P = 5 × 10⁵ Pa e VA = 2 × 10⁻³ m³.\n\n1) Variação de volume:\nW = P·ΔV\n2 000 = 5 × 10⁵ × ΔV\nΔV = 2 000 ÷ (5 × 10⁵) = 4 × 10⁻³ m³\n\n2) Volume em B:\nVB = 2 × 10⁻³ + 4 × 10⁻³ = 6 × 10⁻³ m³\n\n3) Lei de Charles (isobárica):\nVA/TA = VB/TB\n(2 × 10⁻³)/400 = (6 × 10⁻³)/TB\nTB = 400 × 6/2 = 1 200 K\n\nO volume triplicou, então a temperatura absoluta também triplicou: TB = 1 200 K, alternativa B.","pq":{"A":"Corresponde a VB = 5 × 10⁻³ m³ (400 × 5/2 = 1 000 K), como se o volume final fosse o \"5\" que aparece no gráfico, que na verdade é a pressão. Com VB = 5 × 10⁻³ m³, o trabalho seria só 1 500 J.","B":"Correta. ΔV = 2 000 ÷ (5 × 10⁵) = 4 × 10⁻³ m³, então VB = 6 × 10⁻³ m³ e TB = 400 × 6/2 = 1 200 K.","C":"Erro clássico: usar ΔV = 4 × 10⁻³ m³ como se fosse o volume final (400 × 4/2 = 800 K). O volume em B é o inicial mais a variação: 2 + 4 = 6 × 10⁻³ m³. Também cai aqui quem toma a variação de temperatura (ΔT = 800 K) pela temperatura final.","D":"Seria o caso de VB = 3 × 10⁻³ m³ (400 × 3/2 = 600 K), mas aí o trabalho seria 5 × 10⁵ × 1 × 10⁻³ = 500 J, e não 2 000 J.","E":"Sai de multiplicar TA pelo valor de ΔV (400 × 4 = 1 600 K) em vez de pela razão VB/VA = 6/2 = 3. Também aparece se você somar TA à resposta certa (400 + 1 200)."},"dica":"Na isobárica, W = P·ΔV (área sob o gráfico) dá a variação de volume; some ao volume inicial antes de aplicar V/T = constante, com T em kelvin.","dif":"média","nota":"","obs":""},{"id":"2024d1-30","n":30,"area":"Ciências da Natureza","disc":"Física","assunto":"Óptica – refração, ângulo limite e lei de Snell","titulo":"Raio rasante na fronteira: refringência e índice do meio 2","gab":"D","base":null,"imgs":[{"src":"img/2024d1/q30_1.webp","w":781,"h":1183}],"alt":{"A":"maior e índice de refração igual a 1,2.","B":"maior e índice de refração igual a 1,4.","C":"menor e índice de refração igual a 1,4.","D":"menor e índice de refração igual a 1,2.","E":"maior e índice de refração igual a 1,6."},"res":"**Ideia-chave:** se o raio refratado sai rasante, \"seguindo pela fronteira\" (90° com a normal), é porque incidiu exatamente no ângulo limite L. Isso só acontece quando a luz vai do meio MAIS refringente para o MENOS refringente. Logo, n₂ < n₁ = 1,5: refringência menor.\n\n1) Inclinação do raio pela malha: o raio passa exatamente por um vértice dos quadradinhos uma fileira acima da base e, dali até tocar a fronteira (também num vértice), anda 4 quadradinhos na horizontal e sobe 3 na vertical. Isso forma um triângulo 3-4-5:\nhipotenusa = √(3² + 4²) = √25 = 5\n\n2) A fronteira é horizontal, então a normal é vertical. O lado oposto ao ângulo L (medido a partir da normal) é o horizontal:\nsen L = 4/5 = 0,8\n\n3) Lei de Snell com refração a 90°:\nn₁ · sen L = n₂ · sen 90°\n1,5 × 0,8 = n₂ × 1\nn₂ = 1,2\n\nO meio 2 tem refringência menor e índice 1,2: alternativa D.\n\nCuidado: medir o ângulo a partir da superfície (sen = 3/5) daria n₂ = 1,5 × 0,6 = 0,9, menor que 1, o que é impossível para um meio material.","pq":{"A":"O índice 1,2 está certo, mas \"maior\" é contraditório, porque 1,2 < 1,5. Além disso, se o meio 2 fosse mais refringente, a luz sempre passaria, aproximando-se da normal, e nunca sairia rasante.","B":"Erra as duas partes. O raio rasante exige que o meio 2 seja menos refringente, e 1,4 não sai da figura: com sen L = 0,8, n₂ = 1,5 × 0,8 = 1,2.","C":"Acerta que a refringência é menor, mas erra o índice. Para dar n₂ = 1,4, seria preciso sen L = 1,4/1,5 ≈ 0,93, e a malha mostra sen L = 4/5 = 0,8.","D":"Correta. Raio rasante significa incidência no ângulo limite, o que exige n₂ < n₁. Pela malha, sen L = 4/5 = 0,8, e daí n₂ = 1,5 × 0,8 = 1,2.","E":"Indo para um meio mais refringente (1,6 > 1,5), o raio se aproxima da normal e sempre refrata. Nunca haveria ângulo limite nem raio rasante."},"dica":"Raio rasante (90°) ou reflexão total só acontecem indo do meio mais refringente para o menos refringente; use n₁·sen L = n₂ e meça o ângulo a partir da NORMAL.","dif":"média","nota":"","obs":""},{"id":"2024d1-31","n":31,"area":"Ciências da Natureza","disc":"Física","assunto":"Circuitos elétricos – diferença de potencial e curto-circuito","titulo":"Circuito com duas pilhas e três lâmpadas: brilho de L₁, L₂ e L₃","gab":"E","base":null,"imgs":[{"src":"img/2024d1/q31_1.webp","w":783,"h":1826}],"alt":{"A":"L₁: máximo; L₂: nulo; L₃: moderado.","B":"L₁: moderado; L₂: nulo; L₃: moderado.","C":"L₁: moderado; L₂: máximo; L₃: nulo.","D":"L₁: nulo; L₂: máximo; L₃: moderado.","E":"L₁: máximo; L₂: moderado; L₃: nulo."},"res":"Ideia-chave: descobrir o potencial elétrico de cada fio do circuito. Uma lâmpada só acende com a diferença de potencial (ddp) entre os seus dois terminais.\n\nCada pilha fornece 1,5 V; em série, as duas somam 3 V. Tome como 0 V o polo − da pilha de baixo. Então:\nfio de cima (polo + da pilha de cima) → 3 V;\nfio do meio (junção entre as duas pilhas) → 1,5 V;\nfio de L₃ (polo − da pilha de baixo) → 0 V.\n\nO detalhe decisivo é o fio inferior, sem nenhum componente: ele liga o polo − da pilha de baixo diretamente ao fio vertical da direita, onde estão os outros terminais das três lâmpadas. Logo, todo o lado direito está em 0 V.\n\nI. Com Ch₁ fechada, L₁ fica entre 3 V e 0 V → U = 3 V → brilho **máximo**.\nII. Com Ch₂ fechada, L₂ fica entre 1,5 V e 0 V → U = 1,5 V → brilho **moderado**.\nIII. Com Ch₃ fechada, L₃ fica entre 0 V e 0 V, porque está em paralelo com o fio inferior (em curto) → U = 0 → brilho **nulo**.\n\nResposta: L₁ máximo, L₂ moderado e L₃ nulo, alternativa E.","pq":{"A":"Acerta L₁, mas erra L₂ e L₃. L₂ fica entre a junção das pilhas (1,5 V) e o lado direito (0 V), então recebe 1,5 V (moderado). L₃ está em curto pelo fio inferior e recebe 0 V (nulo).","B":"Erra ao achar que L₁ recebe só uma pilha. Como o lado direito está ligado ao polo − da pilha de baixo pelo fio inferior, L₁ recebe as duas pilhas em série: 3 V (máximo). L₂ não é nula (1,5 V) e L₃ não é moderada (0 V).","C":"Troca L₁ e L₂. Quem recebe as duas pilhas (3 V) é L₁; L₂ recebe só a pilha de baixo (1,5 V). Só o L₃ nulo está certo.","D":"L₁ não fica apagada: está entre 3 V e 0 V. A lâmpada sem ddp é L₃, que tem os dois terminais ligados ao polo − por causa do curto do fio inferior. E L₂ recebe 1,5 V, não 3 V.","E":"Correta: L₁ recebe 3 V (as duas pilhas), L₂ recebe 1,5 V (só a pilha de baixo) e L₃ recebe 0 V, pois o fio inferior deixa os seus dois terminais no mesmo potencial."},"dica":"Em circuitos, marque o potencial de cada fio (0 V, 1,5 V, 3 V). Um fio sem resistência liga pontos de mesmo potencial e pode deixar uma lâmpada em curto.","dif":"média","nota":"","obs":""},{"id":"2024d1-32","n":32,"area":"Ciências da Natureza","disc":"Física","assunto":"Magnetismo – campo magnético de ímã em barra","titulo":"Orientação de bússolas ao redor de um ímã em barra","gab":"C","base":null,"imgs":[{"src":"img/2024d1/q32_1.webp","w":781,"h":1925}],"alt":{"A":"[esquema: bússola de cima aponta para cima (↑); de baixo, para baixo (↓); à esquerda do polo N, para a esquerda (←); à direita do polo S, para a direita (→)]","B":"[esquema: bússola de cima aponta para a esquerda (←); de baixo, para a esquerda (←); à esquerda do polo N, para a direita (→); à direita do polo S, para a direita (→)]","C":"[esquema: bússola de cima aponta para a direita (→); de baixo, para a direita (→); à esquerda do polo N, para a esquerda (←); à direita do polo S, para a esquerda (←)]","D":"[esquema: bússola de cima aponta para baixo (↓); de baixo, para cima (↑); à esquerda do polo N, para a direita (→); à direita do polo S, para a esquerda (←)]","E":"[esquema: bússola de cima aponta para a direita (→); de baixo, para a esquerda (←); à esquerda do polo N, para cima (↑); à direita do polo S, para baixo (↓)]"},"res":"Ideia-chave: a agulha da bússola se alinha ao campo magnético, e a ponta (polo Norte da agulha) aponta no sentido do vetor campo B. Fora do ímã, as linhas de campo saem do polo N e entram no polo S.\n\nVamos analisar cada posição.\nÀ esquerda do N: o campo sai do N e se afasta dele, então a agulha aponta para a esquerda (←). Também dá para pensar em repulsão: o Norte da agulha é repelido pelo Norte do ímã.\nÀ direita do S: o campo entra no S e aponta para ele, então a agulha aponta para a esquerda (←), em direção ao ímã. O Norte da agulha é atraído pelo Sul do ímã.\nAcima e abaixo do meio do ímã: as linhas fazem a curva do N para o S e ali ficam paralelas à barra, então a agulha aponta para a direita (→) nas duas posições.\n\nO esquema com ← nas duas laterais e → em cima e embaixo é o da alternativa C.","pq":{"A":"Desenha as agulhas apontando para fora do ímã em todas as direções. À direita do S, a ponta da agulha deveria apontar para o S (atração), e não se afastar dele. Acima e abaixo do centro, o campo é paralelo à barra, não perpendicular.","B":"É o inverso exato da correta: as quatro agulhas apontam como se o campo saísse do S e entrasse no N. Quem marca B costuma inverter o sentido das linhas de campo ou tomar a ponta da agulha como polo Sul.","C":"Correta: nas laterais, a agulha aponta para longe do N e em direção ao S (←). Em cima e embaixo, o campo vai de N para S, paralelo à barra (→).","D":"Todas as agulhas apontam para o ímã, como se ele só puxasse a ponta da agulha, feito ímã com ferro. Mas o Norte da agulha é repelido pelo N do ímã, então à esquerda deveria apontar para longe dele. Acima e abaixo, o campo é horizontal, não vertical.","E":"Só a bússola de cima está certa. Embaixo, o campo também vai de N para S (→), e não ←. Nas laterais, sobre o eixo do ímã, o campo é horizontal, e não vertical (↑ e ↓)."},"dica":"A ponta (Norte) da bússola segue o campo: fora do ímã, ele sai do N e entra no S. Acima e abaixo do meio da barra, a agulha fica paralela ao ímã, apontando de N para S.","dif":"média","nota":"","obs":""},{"id":"2024d1-33","n":33,"area":"Ciências da Natureza","disc":"Química","assunto":"Química orgânica – estrutura e clivagem do betacaroteno em retinal","titulo":"Quebra do betacaroteno em duas moléculas de retinal","gab":"B","base":null,"imgs":[{"src":"img/2024d1/q33_1.webp","w":784,"h":1685}],"alt":{"A":"2.","B":"3.","C":"4.","D":"5.","E":"1."},"res":"Ideia-chave: a equação mostra que 1 molécula de betacaroteno gera 2 moléculas iguais de retinal (\"Betacaroteno + O₂ → 2 retinal\"). Como o betacaroteno é simétrico, a quebra tem de acontecer exatamente no meio da cadeia.\n\nConfira pela estrutura. O retinal tem o anel, dois grupos CH₃ ao longo da cadeia e termina no grupo aldeído (o C=O, em vermelho). Percorrendo o betacaroteno da esquerda para a direita, encontramos o anel (região 1), o primeiro CH₃ da cadeia (região 2) e o segundo CH₃ da cadeia (início da região 3). Depois do segundo CH₃, o retinal ainda tem uma ligação dupla e o carbono do aldeído. Portanto, a quebra ocorre na ligação dupla central, que fica dentro da região 3, entre o CH₃ da região 3 e o CH₃ da região 4.\n\nNessa ligação dupla central, o O₂ entra e cada carbono vira um C=O:\nC₄₀H₅₆ + O₂ → 2 C₂₀H₂₈O.\nCada metade fica com um anel e dois CH₃ na cadeia, idêntica ao retinal.\n\nResposta: região 3, alternativa B.","pq":{"A":"Quebrando na região 2, logo após o primeiro CH₃ da cadeia, o pedaço da esquerda teria só um CH₃ na cadeia (o retinal tem dois), e o da direita seria bem maior. Não sairiam duas moléculas iguais.","B":"Correta: a região 3 contém a ligação dupla central da molécula simétrica. Rompê-la gera duas metades idênticas, cada uma com anel e dois CH₃ na cadeia, como o retinal.","C":"A região 4 fica depois do centro. O fragmento da esquerda ficaria com três CH₃ na cadeia e o da direita com apenas um, ou seja, dois produtos diferentes, o que contraria o \"2 retinal\" da equação.","D":"A região 5 fica junto ao anel da direita. Uma quebra ali separaria um pedaço pequeno de um pedaço enorme, nada parecido com duas moléculas de retinal.","E":"A região 1 é o anel da esquerda. Quebrar ali só separaria o anel do resto da cadeia, gerando fragmentos muito diferentes entre si."},"dica":"Se uma molécula simétrica se quebra em duas moléculas iguais, a quebra é exatamente no centro. Conte os grupos substituintes (como os CH₃) para achar o meio.","dif":"média","nota":"","obs":""},{"id":"2024d1-34","n":34,"area":"Ciências da Natureza","disc":"Química","assunto":"Indicadores ácido-base e caráter ácido/básico de substâncias","titulo":"Chá de hibisco como indicador ácido-base: NaCl, CaO e HNO₃","gab":"D","base":null,"imgs":[{"src":"img/2024d1/q34_1.webp","w":781,"h":1431}],"alt":{"A":"HNO₃, CaO e NaCl.","B":"NaCl, CaO e HNO₃.","C":"NaCl, HNO₃ e CaO.","D":"CaO, HNO₃ e NaCl.","E":"CaO, NaCl e HNO₃."},"res":"Ideia-chave: classificar cada substância como ácida, básica ou neutra em água e depois ler a cor na escala do hibisco.\n\nPela escala da figura, pH de 1 a 3 dá vermelho, pH perto de 7–8 dá violeta (arroxeado) e pH de 12 a 14 dá amarelo.\n\nHNO₃ é um ácido forte: libera H⁺ em água, o pH fica baixo e a cor é **vermelha**.\nCaO é um óxido básico: CaO + H₂O → Ca(OH)₂, uma base forte. O pH fica alto e a cor é **amarela**.\nNaCl é um sal de ácido forte (HCl) com base forte (NaOH) e não sofre hidrólise. A solução é neutra, com pH ≈ 7, e a cor é **violeta**.\n\nLogo, o tubo 1 (amarelo) tem CaO, o tubo 2 (vermelho) tem HNO₃ e o tubo 3 (violeta) tem NaCl. Alternativa D.","pq":{"A":"Põe o HNO₃ no tubo amarelo e o CaO no vermelho, exatamente o inverso. Ácido forte deixa o hibisco vermelho (pH baixo), e a base Ca(OH)₂ deixa amarelo (pH alto). Só o NaCl no violeta está certo.","B":"NaCl é neutro (pH ≈ 7, violeta), não amarelo. O CaO forma base e não daria vermelho, e o HNO₃ é ácido e não daria violeta. Todas as atribuições estão trocadas.","C":"Acerta o HNO₃ no tubo vermelho, mas troca CaO e NaCl: o NaCl, neutro, daria violeta, e o CaO, que forma Ca(OH)₂, daria amarelo. Quem marca C costuma achar que o CaO, por ser só um óxido, é neutro.","D":"Correta: o CaO forma base forte (amarelo), o HNO₃ é ácido forte (vermelho) e o NaCl é sal neutro (violeta).","E":"Acerta o CaO no tubo amarelo, mas troca os outros dois. O NaCl é neutro e não deixaria o indicador vermelho, e o HNO₃ é ácido forte e não daria violeta, a cor da faixa neutra."},"dica":"Óxido de metal alcalino ou alcalinoterroso (CaO, Na₂O) com água forma base; sal de ácido forte com base forte (NaCl) dá solução neutra.","dif":"média","nota":"","obs":""},{"id":"2024d1-35","n":35,"area":"Ciências da Natureza","disc":"Química","assunto":"Corrosão de metais por ácido – interpretação de tabela","titulo":"Perda de massa de metais em ácido nítrico: o mais resistente","gab":"A","base":null,"imgs":[{"src":"img/2024d1/q35_1.webp","w":783,"h":1248}],"alt":{"A":"aço cromo-níquel.","B":"cobre-níquel.","C":"níquel.","D":"aço carbono.","E":"aço manganês."},"res":"Ideia-chave: o próprio texto dá a regra: \"quanto mais sensível o material metálico ao ácido, maior a massa perdida\". Então o material mais resistente é o que perdeu MENOS massa.\n\nOrdenando as perdas de massa (g/m²):\naço cromo-níquel: 0,1\ncobre-níquel: 1,0\nníquel: 1,2\naço manganês: 95,0\naço carbono: 205,0\n\nO menor valor é 0,1 g/m², do aço cromo-níquel. Ele é 10 vezes menor que o do cobre-níquel e mais de 2000 vezes menor que o do aço carbono. Esse é o material de menor sensibilidade e, portanto, de maior resistência ao ácido nítrico. Alternativa A.","pq":{"A":"Correta: perdeu só 0,1 g/m², a menor perda da tabela. Menor perda significa menor sensibilidade e, portanto, maior resistência.","B":"O cobre-níquel perdeu 1,0 g/m², valor baixo, mas 10 vezes maior que o do aço cromo-níquel (0,1). É a pegadinha de quem para no primeiro valor pequeno ou lê 0,1 e 1,0 sem atenção.","C":"O níquel perdeu 1,2 g/m², mais que o aço cromo-níquel (0,1) e que o cobre-níquel (1,0). É resistente, mas não o mais resistente.","D":"O aço carbono perdeu 205,0 g/m², a MAIOR perda, então é o material mais sensível. Escolher essa letra é inverter a regra do texto (maior perda = maior sensibilidade).","E":"O aço manganês perdeu 95,0 g/m², a segunda maior perda. É bastante atacado pelo ácido."},"dica":"Use a regra que o próprio texto dá e cuidado com a inversão: maior resistência = menor perda de massa.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-36","n":36,"area":"Ciências da Natureza","disc":"Química","assunto":"Densidade e separação de misturas","titulo":"Separação de plásticos por densidade em água e água com sal","gab":"C","base":null,"imgs":[{"src":"img/2024d1/q36_1.webp","w":1575,"h":1981}],"alt":{"A":"sobrenadante 1, com fragmentos de PEAD e PVC.","B":"sobrenadante 2, com fragmentos de PP e PS.","C":"sobrenadante 1, com fragmentos de PP e PEAD.","D":"submersa 2, com fragmentos de PS e PVC.","E":"submersa 2, com fragmentos de PEAD e PS."},"res":"Ideia-chave: um sólido flutua se for menos denso que o líquido e afunda se for mais denso. Basta comparar as densidades em cada etapa do infográfico.\n\nEtapa 1, na água (1,00 g/cm³):\nPP (0,90) e PEAD (0,94) são menos densos que 1,00, então flutuam e formam o **sobrenadante 1**.\nPS (1,04) e PVC (1,22) são mais densos que 1,00, então afundam e formam a submersa 1.\n\nEtapa 2: só a fase submersa 1 (PS + PVC) vai para a água com sal (1,17 g/cm³).\nPS (1,04) é menos denso que 1,17, então flutua: o sobrenadante 2 tem só PS.\nPVC (1,22) é mais denso que 1,17, então afunda: a submersa 2 tem só PVC.\n\nO sobrenadante 2 e a submersa 2 têm um plástico cada. A única fase que fica com mistura de dois plásticos é o sobrenadante 1, com PP e PEAD. Alternativa C.","pq":{"A":"O PVC (1,22 g/cm³) é mais denso que a água (1,00) e afunda já na primeira etapa, então nunca estará no sobrenadante 1. O PEAD está lá, mas junto com o PP.","B":"O PP flutua na água (0,90 < 1,00), fica no sobrenadante 1 e nem chega à água com sal. O sobrenadante 2 contém apenas PS.","C":"Correta: na água, PP (0,90) e PEAD (0,94) flutuam juntos e formam o sobrenadante 1, uma mistura de dois plásticos.","D":"PS e PVC juntos formam a submersa 1, não a 2. Na água com sal (1,17), o PS (1,04) flutua e vai para o sobrenadante 2, de modo que a submersa 2 tem só PVC.","E":"O PEAD (0,94) flutua na água e fica no sobrenadante 1, e o PS flutua na água com sal. A submersa 2 contém só PVC."},"dica":"Flutua quem tem densidade menor que a do líquido. Em separações em etapas, acompanhe qual fase segue para a etapa seguinte.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-37","n":37,"area":"Ciências da Natureza","disc":"Química","assunto":"Oxirredução – NOX, agente oxidante e elétrons transferidos","titulo":"Redução do HCrO₄⁻ por Fe²⁺: agente oxidante, NOX do Cr e elétrons","gab":"E","base":null,"imgs":[{"src":"img/2024d1/q37_1.webp","w":781,"h":812}],"alt":{"A":"Fe²⁺; +6; 3 mol de elétrons.","B":"Fe²⁺; +4; 3 mol de elétrons.","C":"Fe²⁺; +3; 6 mol de elétrons.","D":"HCrO₄⁻; +4; 6 mol de elétrons.","E":"HCrO₄⁻; +6; 3 mol de elétrons."},"res":"Ideia-chave: o agente oxidante é a espécie que sofre redução, ou seja, recebe elétrons. O NOX mostra quem ganha e quem perde elétrons.\n\n1) NOX do Cr no reagente HCrO₄⁻ (a soma dá a carga −1):\n(+1) + x + 4·(−2) = −1\nx − 7 = −1 → x = +6\n\n2) NOX do Cr no produto CrOH²⁺ (a soma dá a carga +2):\nx + (−2) + (+1) = +2 → x = +3\nO crômio passa de +6 para +3: ganha 3 elétrons e sofre redução. Então **HCrO₄⁻ é o agente oxidante**.\n\n3) Confira pelo ferro: no Fe(OH)₂⁺, x + 2·(−1) = +1 → x = +3. Cada Fe²⁺ perde 1 elétron, e os 3 Fe²⁺ perdem 3 elétrons, exatamente os 3 que o Cr recebe.\n\n4) Pela equação, forma-se 1 mol de CrOH²⁺ quando 1 mol de Cr passa de +6 para +3: são 3 mol de elétrons.\n\nResposta: HCrO₄⁻; +6; 3 mol de elétrons. Alternativa E.","pq":{"A":"O NOX +6 e os 3 mol de elétrons estão certos, mas o Fe²⁺ é o agente redutor: ele perde elétrons (Fe²⁺ → Fe³⁺) e se oxida. O agente oxidante é quem se reduz.","B":"Tem dois erros. O Fe²⁺ é o redutor, não o oxidante. E o Cr no HCrO₄⁻ tem NOX +6, não +4 (H = +1 e 4 O = −8, com carga total −1, dão Cr = +6).","C":"O Fe²⁺ é o redutor. O +3 é o NOX do Cr no produto (CrOH²⁺), não no reagente. E os 6 mol de elétrons confundem o NOX inicial (+6) com os elétrons transferidos, que são a variação 6 − 3 = 3.","D":"O agente oxidante está certo, mas o NOX do Cr no reagente é +6, não +4. E a passagem de +6 para +3 envolve 3 mol de elétrons por mol de CrOH²⁺, não 6.","E":"Correta. O HCrO₄⁻ tem o Cr que se reduz de +6 para +3, por isso é o oxidante. Cada mol de CrOH²⁺ formado corresponde a 3 mol de elétrons recebidos."},"dica":"Agente oxidante é quem se reduz (ganha elétrons). O número de elétrons transferidos é a variação do NOX multiplicada pela quantidade de átomos que mudam de NOX.","dif":"média","nota":"","obs":""},{"id":"2024d1-38","n":38,"area":"Ciências da Natureza","disc":"Química","assunto":"Concentração comum e quantidade de matéria (mol)","titulo":"Geosmina em reservatório de 2 500 L: quantidade em mol","gab":"E","base":null,"imgs":[{"src":"img/2024d1/q38_1.webp","w":781,"h":848}],"alt":{"A":"1,0 × 10⁻⁴.","B":"1,0 × 10⁻⁶.","C":"2,5 × 10⁻⁴.","D":"2,5 × 10⁻⁵.","E":"1,0 × 10⁻⁵."},"res":"Ideia-chave: concentração (g/L) × volume (L) dá a massa (g). Massa ÷ massa molar dá a quantidade em mol.\n\n1) Massa de geosmina no reservatório:\nm = 728 × 10⁻⁹ g/L × 2 500 L\nm = 1 820 000 × 10⁻⁹ g = 1,82 × 10⁻³ g\n\n2) Quantidade em mol:\nn = m / M = 1,82 × 10⁻³ g ÷ 182 g/mol\nn = 0,01 × 10⁻³ mol = 1,0 × 10⁻⁵ mol\n\nAtalho: repare que 728 = 4 × 182. Então a concentração em quantidade de matéria é 4 × 10⁻⁹ mol/L, e\nn = 4 × 10⁻⁹ mol/L × 2 500 L = 10 000 × 10⁻⁹ mol = 1,0 × 10⁻⁵ mol.\n\nResposta: alternativa E.","pq":{"A":"É 10 vezes maior que o correto. É um erro na potência de 10, como contar um zero a mais em 4 × 2 500 (dar 100 000 em vez de 10 000) ou escrever a massa como 1,82 × 10⁻² g.","B":"É 10 vezes menor que o correto. Aparece quando se conta um zero a menos, como fazer 4 × 2 500 = 1 000 ou escrever a massa como 1,82 × 10⁻⁴ g.","C":"O fator 2,5 vem do volume (2,5 × 10³ L). Na conta certa ele se junta ao 4 de 728/182 (4 × 2,5 = 10) e some. Se o 2,5 ficou na resposta, essa combinação não foi feita, e a potência ainda está 10 vezes acima da correta.","D":"É a mesma armadilha da C: é 2,5 vezes o valor correto. O 2,5 é a marca do volume de 2 500 L e deveria se cancelar com o 4 (4 × 10⁻⁹ × 2,5 × 10³ = 10 × 10⁻⁶ = 1,0 × 10⁻⁵).","E":"Correta. 728 × 10⁻⁹ g/L × 2 500 L = 1,82 × 10⁻³ g, e 1,82 × 10⁻³ g ÷ 182 g/mol = 1,0 × 10⁻⁵ mol."},"dica":"Antes de multiplicar, procure simplificações. Aqui 728/182 = 4 e 4 × 2 500 = 10⁴, o que deixa a conta de potências imediata.","dif":"média","nota":"","obs":""},{"id":"2024d1-39","n":39,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Enzimas – efeito da temperatura (desnaturação)","titulo":"Atividade da bromelina a 40, 60 e 80 °C: leitura de gráfico","gab":"C","base":null,"imgs":[{"src":"img/2024d1/q39_1.webp","w":783,"h":1867}],"alt":{"A":"80 °C … o aumento","B":"60 °C … a diminuição","C":"40 °C … o aumento","D":"40 °C … a diminuição","E":"80 °C … a diminuição"},"res":"Ideia-chave: leia cada curva do gráfico e compare como o percentual de bromelina ativa muda com o tempo em cada temperatura.\n\n1) Curva de 40 °C (triângulos verdes): fica em 100% do início ao fim, de 0 a 15 minutos. É a única que se mantém constante. Primeira lacuna: 40 °C.\n\n2) Curva de 60 °C (quadrados): cai aos poucos, de 100% para cerca de 26% em 15 minutos.\n\n3) Curva de 80 °C (círculos vermelhos): despenca. Fica abaixo de 20% em uns 3 minutos e praticamente zera a partir de uns 6 a 10 minutos.\n\nComparando as três: quanto maior a temperatura, maior e mais rápida a perda de atividade. Isso acontece porque o calor excessivo desnatura a enzima, alterando sua forma tridimensional e o sítio ativo. Segunda lacuna: o aumento.\n\nResposta: 40 °C … o aumento. Alternativa C.","pq":{"A":"A segunda lacuna está certa, mas 80 °C é justamente a temperatura em que a atividade cai mais depressa, a quase 0% em poucos minutos. Não é a que se mantém constante.","B":"A 60 °C a atividade cai de 100% para cerca de 26% em 15 minutos, então não fica constante. E a capacidade da enzima diminui com o aumento da temperatura, não com a diminuição.","C":"Correta. Só a 40 °C a curva fica em 100%. Indo de 40 para 60 e depois 80 °C, a perda de atividade fica cada vez maior e mais rápida.","D":"A primeira lacuna está certa, mas a conclusão está invertida. No experimento a atividade cai quando a temperatura sobe (40 → 60 → 80 °C), e nenhum dado mostra queda quando a temperatura baixa.","E":"Erra as duas lacunas. 80 °C é a curva que mais cai, e a redução acompanha o aumento da temperatura, não a diminuição."},"dica":"Em gráfico com várias curvas, identifique cada uma pela legenda e compare as inclinações: queda mais íngreme significa efeito mais intenso. Lembre também que calor excessivo desnatura enzimas.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-40","n":40,"area":"Ciências da Natureza","disc":"Química","assunto":"Polaridade de moléculas e impacto ambiental de gases refrigerantes","titulo":"Gás refrigerante menos danoso (PDO e PAG) e sua polaridade","gab":"A","base":null,"imgs":[{"src":"img/2024d1/q40_1.webp","w":781,"h":1966}],"alt":{"A":"R290, que é apolar.","B":"CTC, que é apolar.","C":"CFC-11, que é polar.","D":"HCFC-22, que é polar.","E":"Halon-1211, que é polar."},"res":"Ideia-chave: pelo enunciado, \"Quanto maiores esses valores, mais danosa é a substância\". Procure o gás com os menores PDO e PAG e depois analise a polaridade da molécula.\n\n1) Valores da tabela:\nCTC: PDO 1,1; PAG 1400\nCFC-11: PDO 1,0; PAG 4750\nHCFC-22: PDO 0,055; PAG 1790\nHalon-1211: PDO 3,0; PAG 1890\nR290: PDO 0,0; PAG 3\nO R290 tem o menor valor nas duas colunas: não destrói ozônio e quase não contribui para o aquecimento global.\n\n2) Polaridade: pela fórmula H₃C–CH₂–CH₃, o R290 é o propano, um hidrocarboneto. As ligações C–C são apolares e as C–H têm diferença de eletronegatividade muito pequena. Por isso a molécula é apolar.\n\nResposta: R290, que é apolar. Alternativa A.","pq":{"A":"Correta. O R290 tem PDO 0,0 e PAG 3, os menores da tabela, e, por ser um hidrocarboneto (propano), é apolar.","B":"O CTC (CCl₄) é mesmo apolar: é tetraédrico com quatro ligantes iguais, e os dipolos se anulam. Mas tem PDO 1,1 e PAG 1400, muito mais danoso que o R290.","C":"O CFC-11 é polar, mas tem o maior PAG da tabela (4750), ou seja, é o pior para o aquecimento global, e ainda tem PDO 1,0.","D":"O HCFC-22 tem PDO baixo (0,055), o que atrai quem olha só para a camada de ozônio. Mas seu PAG é 1790, e a questão pede o menor dano nos dois aspectos.","E":"O Halon-1211 tem o maior PDO da tabela (3,0) e PAG 1890: é o que mais destrói a camada de ozônio."},"dica":"Se a pergunta tem dois critérios, procure a opção que é a melhor nos dois ao mesmo tempo. E lembre que hidrocarbonetos são apolares.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-41","n":41,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Nutrição – alimentos ultraprocessados e saúde","titulo":"Ultraprocessados: alimento, doença associada e componente em excesso","gab":"C","base":null,"imgs":[{"src":"img/2024d1/q41_1.webp","w":783,"h":934}],"alt":{"A":"os refrigerantes … ao AVC … corante","B":"as massas … à escoliose … gordura","C":"as salsichas … à hipertensão … sódio","D":"as frutas frescas … à diabetes tipo 2 … açúcar","E":"os cereais … ao infarto … aromatizante"},"res":"Ideia-chave: ultraprocessados são produtos industriais feitos com muitos ingredientes e aditivos (sal, açúcar, gorduras, conservantes). Os embutidos são um exemplo clássico. As três lacunas precisam formar uma cadeia coerente: alimento → componente em excesso → doença.\n\n1) Primeira lacuna: entre as opções, as salsichas são o exemplo típico de ultraprocessado, feitas de carne reconstituída com sal, conservantes e outros aditivos. Frutas frescas, ao contrário, são alimentos in natura.\n\n2) Terceira lacuna: embutidos levam muito sal (cloreto de sódio), usado para dar sabor e conservar. Excesso de sódio.\n\n3) Segunda lacuna: o excesso de sódio faz o organismo reter água, o que aumenta o volume de sangue e eleva a pressão arterial. Hipertensão.\n\nSalsicha → sódio → hipertensão é a única sequência coerente nas três lacunas.\n\nResposta: alternativa C.","pq":{"A":"Refrigerante é ultraprocessado, mas seu problema central é o excesso de açúcar, não de corante. E o AVC está ligado principalmente à hipertensão, não a corantes.","B":"Escoliose é um desvio da coluna vertebral e não tem relação com a alimentação. Além disso, massas simples (farinha e água) não são o exemplo típico de ultraprocessado.","C":"Correta. A salsicha é um embutido ultraprocessado, rico em sódio, e o excesso de sódio está associado à hipertensão arterial.","D":"Frutas frescas são alimentos in natura, o oposto de ultraprocessados. O açúcar delas é natural e vem acompanhado de fibras, não é açúcar adicionado pela indústria.","E":"Cereais como arroz, milho e aveia são, em geral, alimentos in natura ou minimamente processados. E o aromatizante não é o componente ligado ao infarto: o que pesa para o coração é o excesso de gordura e de sódio."},"dica":"Ultraprocessado é uma fórmula industrial cheia de aditivos (embutidos, salgadinhos, refrigerantes, macarrão instantâneo). Ligue sal/sódio à hipertensão e açúcar ao diabetes.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-42","n":42,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Divisão celular – mitose e tumores","titulo":"Neoplasmas: processo responsável pela multiplicação das células do tumor","gab":"B","base":null,"imgs":[{"src":"img/2024d1/q42_1.webp","w":783,"h":849}],"alt":{"A":"apoptose.","B":"mitose.","C":"citocinese.","D":"meiose.","E":"necrose."},"res":"Ideia-chave: tumor é um aumento descontrolado do número de células do corpo (células somáticas), e células somáticas se multiplicam por mitose.\n\n1) O texto define os neoplasmas como \"massas anormais de células que perderam controle de multiplicação\". Ou seja, o tumor surge porque as células se dividem sem os freios normais do ciclo celular.\n\n2) A divisão que produz duas células-filhas geneticamente iguais à célula-mãe, responsável pelo crescimento e pela renovação dos tecidos, é a mitose. No tumor ela se repete sem controle e forma a massa de células.\n\n3) As outras opções descrevem morte celular (apoptose e necrose), só a etapa final da divisão (citocinese) ou a divisão que forma gametas (meiose).\n\nResposta: mitose. Alternativa B.","pq":{"A":"Apoptose é a morte celular programada, um mecanismo que elimina células defeituosas e reduz o número de células. Nos tumores costuma haver justamente uma falha na apoptose, e não é ela que multiplica as células.","B":"Correta. A multiplicação de células somáticas, inclusive as tumorais, acontece por mitose, que gera células-filhas idênticas à célula-mãe.","C":"Citocinese é só a divisão do citoplasma no fim da divisão celular, uma etapa e não o processo inteiro de multiplicação. A pergunta pede o tipo de divisão, que é a mitose.","D":"A meiose ocorre em células germinativas e forma gametas com metade dos cromossomos. Tumores como as pintas são formados por células somáticas que se dividem por mitose.","E":"Necrose é a morte celular causada por lesão (falta de oxigênio, trauma, toxinas), o oposto de multiplicação."},"dica":"Crescimento, regeneração e tumores = mitose; gametas = meiose; morte programada = apoptose; morte por lesão = necrose.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-43","n":43,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Imunologia – resposta imune primária e secundária (vacinação)","titulo":"Vacina da dengue em duas doses: gráfico da concentração de anticorpos","gab":"D","base":null,"imgs":[{"src":"img/2024d1/q43_1.webp","w":781,"h":1721},{"src":"img/2024d1/q43_2.webp","w":662,"h":1366}],"alt":{"A":"[gráfico: após a 1ª dose, a concentração de anticorpos sobe até um pico e volta ao nível inicial; após a 2ª dose, repete-se um pico de mesma altura e mesma forma, que também volta ao nível inicial]","B":"[gráfico: retas sempre crescentes, com subida lenta e linear após a 1ª dose e subida linear mais inclinada após a 2ª dose, sem nenhuma queda]","C":"[gráfico: pico alto logo após a 1ª dose, seguido de queda; após a 2ª dose, surge apenas um pico pequeno, bem mais baixo que o primeiro]","D":"[gráfico: subida lenta até um pico moderado após a 1ª dose, seguida de queda; após a 2ª dose, subida rápida até um pico muito mais alto que o primeiro, seguida de queda lenta, com a concentração permanecendo elevada]","E":"[gráfico: reta crescente da 1ª dose até a 2ª dose; depois da 2ª dose, a concentração fica constante (patamar horizontal)]"},"res":"Ideia-chave: **memória imunológica**. A vacina não dá duas respostas iguais; a segunda é mais forte porque o corpo já \"conhece\" o antígeno.\n\n1ª dose → **resposta primária**: há um período de latência, a produção de anticorpos começa devagar, atinge um pico moderado e depois cai. Além dos anticorpos, formam-se **células de memória** (linfócitos B e T de memória).\n\n2ª dose (3 meses depois) → **resposta secundária**: as células de memória são reativadas, então a produção de anticorpos é **mais rápida** (subida íngreme), **mais intensa** (pico bem mais alto) e **mais duradoura** (a queda é lenta e a concentração se mantém elevada).\n\nO gráfico D mostra exatamente isso: um primeiro pico pequeno e de subida lenta, uma queda, e depois da 2ª dose um pico muito maior, que demora a cair. É por isso que se aplica dose de reforço: para ampliar e prolongar a proteção.","pq":{"A":"Mostra dois picos idênticos, como se o organismo não tivesse memória imunológica. Na prática, a 2ª exposição gera resposta mais rápida e mais intensa que a 1ª.","B":"Acerta que a 2ª dose aumenta mais a produção, mas mostra anticorpos crescendo em linha reta para sempre. Anticorpos são proteínas degradadas com o tempo: a concentração sobe até um pico e depois cai, não cresce indefinidamente.","C":"Inverte a lógica: coloca a resposta secundária menor que a primária. Com as células de memória, a resposta à 2ª dose é maior, e não menor.","D":"Correta: resposta primária lenta e modesta e resposta secundária rápida, intensa e duradoura, graças às células de memória formadas após a 1ª dose.","E":"Sugere que a 2ª dose não muda nada (patamar constante) e que, antes dela, a concentração subia sem parar. Falta o pico mais alto da resposta secundária e a queda natural dos anticorpos."},"dica":"Na 2ª exposição ao mesmo antígeno, a resposta imune é mais rápida, mais intensa e mais duradoura: procure o gráfico com o segundo pico bem maior que o primeiro.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-44","n":44,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Ecologia – teia alimentar e níveis tróficos","titulo":"Teia alimentar: níveis tróficos ocupados pela águia","gab":"E","base":null,"imgs":[{"src":"img/2024d1/q44_1.webp","w":781,"h":1418}],"alt":{"A":"lagartas, rãs e esquilos ocupam o nível trófico de produtores.","B":"serpentes se alimentam de todos os consumidores primários.","C":"raposas, aves e águias possuem o mesmo nicho ecológico.","D":"águias e raposas se alimentam dos mesmos consumidores.","E":"águias podem ser consumidoras terciárias ou quaternárias."},"res":"Ideia-chave: numa teia, a seta aponta para quem come. Um mesmo animal pode ocupar níveis tróficos diferentes, dependendo da cadeia considerada.\n\nLendo as setas da figura: a planta (produtor) é comida pela lagarta, pela ave e pelo esquilo; a lagarta é comida pela rã; a rã é comida pela águia e pela serpente; a serpente come a ave, o esquilo e a rã, e é comida pela águia; o esquilo também é comido pela raposa.\n\nAgora, as cadeias que terminam na águia:\nplanta → lagarta → rã → águia: águia é **consumidora terciária**.\nplanta → esquilo → serpente → águia: águia é **consumidora terciária**.\nplanta → lagarta → rã → serpente → águia: águia é **consumidora quaternária**.\n\nLogo, a águia pode ser consumidora terciária ou quaternária, como afirma a alternativa E.","pq":{"A":"O único produtor da teia é a planta (o arbusto com frutos vermelhos). Lagarta e esquilo são consumidores primários (comem a planta) e a rã é consumidora secundária (come a lagarta).","B":"Os consumidores primários são lagarta, ave e esquilo. A serpente come a ave e o esquilo, mas não há seta da lagarta para a serpente, então ela não come todos os consumidores primários.","C":"Nicho ecológico inclui o que o organismo come e o papel que ele exerce. A ave come a planta, a raposa come o esquilo e a águia come rã e serpente: são nichos diferentes.","D":"A águia come rã e serpente; a raposa come apenas o esquilo. Elas não compartilham nenhuma presa nessa teia.","E":"Correta: em planta → lagarta → rã → águia a águia é terciária; em planta → lagarta → rã → serpente → águia ela é quaternária."},"dica":"Para achar o nível trófico, conte a partir do produtor seguindo as setas: 1º consumidor, 2º, 3º... e lembre que o mesmo animal pode ter níveis diferentes em cadeias diferentes.","dif":"média","nota":"","obs":""},{"id":"2024d1-45","n":45,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Viroses – raiva (agente etiológico e transmissão)","titulo":"Raiva: vírus como parasita intracelular e transmissão por mordida","gab":"A","base":null,"imgs":[{"src":"img/2024d1/q45_1.webp","w":783,"h":1353}],"alt":{"A":"o parasita necessita das células do hospedeiro para se replicar; é adquirido através da mordida de alguns vertebrados infectados.","B":"o parasita usa a energia da célula hospedeira para seu metabolismo; é transmitido pela picada de carrapatos-estrela infectados.","C":"o agente etiológico tem metabolismo próprio; é transmitido pelo contato com a pele de vertebrados infectados.","D":"o agente etiológico não codifica suas proteínas; é adquirido pela ingestão de carne mal cozida de alguns vertebrados infectados.","E":"o parasita infecta quaisquer células do hospedeiro; é adquirido pela picada de insetos vetores infectados."},"res":"Ideia-chave: o texto diz que a raiva é \"causada por um vírus do gênero Lyssavirus\". Então são duas coisas para conferir: característica de vírus e forma de transmissão da raiva.\n\n1) Vírus é **parasita intracelular obrigatório**: não tem metabolismo próprio nem ribossomos. Para se replicar, precisa entrar numa célula e usar a maquinaria dela. Isso confirma a primeira parte da alternativa A.\n\n2) A raiva é transmitida principalmente pela **saliva de mamíferos infectados** (cães, gatos, morcegos, entre outros), que entra no corpo pela **mordida** (também por arranhadura ou lambedura de feridas e mucosas). Mamíferos são vertebrados, por isso a alternativa fala em \"mordida de alguns vertebrados infectados\".\n\nAs duas partes da alternativa A estão corretas. É justamente por isso que se vacinam cães e gatos e que qualquer mordida de animal deve ser avaliada num serviço de saúde.","pq":{"A":"Correta: vírus só se replica dentro de células (parasita intracelular obrigatório) e a raiva é transmitida pela mordida de mamíferos infectados, que são vertebrados.","B":"A primeira parte até se aproxima (o vírus depende da célula), mas o erro decisivo é a transmissão: o carrapato-estrela transmite a febre maculosa, causada por bactéria, e não a raiva.","C":"Vírus não têm metabolismo próprio; essa é justamente a característica que os torna parasitas obrigatórios. Além disso, o simples contato com a pele íntegra não transmite raiva: é preciso que a saliva entre no corpo, como numa mordida.","D":"O vírus codifica suas proteínas no próprio material genético (RNA); o que ele não tem são ribossomos, por isso usa os da célula para fabricá-las. E comer carne mal cozida é forma de transmissão de outras doenças, como a teníase, não da raiva.","E":"O vírus da raiva ataca o sistema nervoso (o texto cita a \"inflamação progressiva do cérebro\"), não quaisquer células. E a raiva não tem inseto vetor; picada de inseto transmite doenças como dengue e febre amarela."},"dica":"Raiva = vírus (parasita intracelular obrigatório, sem metabolismo próprio) transmitido pela saliva de mamíferos, principalmente por mordida.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-46","n":46,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Sistema circulatório – artérias, veias e circulação","titulo":"Aorta torácica: tipo de vaso e sangue que transporta","gab":"D","base":null,"imgs":[{"src":"img/2024d1/q46_1.webp","w":781,"h":1054}],"alt":{"A":"artéria, que transporta sangue rico em gás oxigênio dos tecidos do corpo para o coração.","B":"veia, que transporta sangue rico em gás oxigênio do coração para os tecidos do corpo.","C":"artéria, que transporta sangue rico em gás carbônico do coração para os pulmões.","D":"artéria, que transporta sangue rico em gás oxigênio do coração para os tecidos do corpo.","E":"veia, que transporta sangue rico em gás carbônico do coração para os pulmões."},"res":"Ideia-chave: artéria e veia se definem pelo **sentido do fluxo**, não pelo tipo de sangue. **Artéria sai do coração**; **veia chega ao coração**.\n\nA aorta é a maior artéria do corpo. Ela sai do **ventrículo esquerdo**, que recebeu o sangue vindo dos pulmões (pelas veias pulmonares e átrio esquerdo). Esse sangue acabou de passar pela troca gasosa, então é **rico em gás oxigênio** (sangue arterial).\n\nA partir da aorta, esse sangue oxigenado é distribuído para os tecidos do corpo todo: é a **grande circulação** (circulação sistêmica). A \"aorta torácica\" é apenas o trecho da aorta que fica no tórax; o texto fala da \"parte ascendente da aorta\", o primeiro segmento, logo na saída do coração.\n\nPortanto: artéria, sangue rico em O₂, do coração para os tecidos, que é a alternativa D.","pq":{"A":"Acerta que a aorta é artéria e que leva sangue oxigenado, mas inverte o sentido: artérias levam sangue do coração para os tecidos; quem traz sangue dos tecidos para o coração são as veias (cavas).","B":"A aorta não é veia. Por definição, o vaso que leva sangue do coração para os tecidos é artéria, e a própria alternativa descreve esse sentido.","C":"Descreve a artéria pulmonar, que sai do ventrículo direito levando sangue rico em CO₂ para os pulmões. A aorta leva sangue oxigenado para o corpo.","D":"Correta: a aorta sai do ventrículo esquerdo e leva sangue rico em O₂ do coração para os tecidos do corpo (circulação sistêmica).","E":"Erra duas vezes: a aorta não é veia, e o vaso que leva sangue rico em CO₂ do coração aos pulmões é a artéria pulmonar, que é artéria, apesar de levar sangue pobre em O₂."},"dica":"Artéria sai do coração, veia chega ao coração, seja qual for o sangue: a aorta sai do ventrículo esquerdo levando sangue oxigenado ao corpo.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-47","n":47,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Evolução – teoria sintética (mutação e seleção natural)","titulo":"Bicho-pau parecido com galhos: explicação pela teoria sintética","gab":"C","base":null,"imgs":[{"src":"img/2024d1/q47_1.webp","w":783,"h":1458}],"alt":{"A":"O ambiente induziu a recombinações gênicas, que resultaram em estruturas físicas no corpo do animal semelhantes aos galhos das árvores.","B":"Permutações direcionadas geraram patas em forma de galhos de árvores e essa característica adaptou o animal ao ambiente.","C":"Mutações aleatórias geraram estruturas físicas no animal semelhantes aos galhos de árvores e essas características foram selecionadas positivamente.","D":"O ambiente provocou a transformação física do animal para se parecer aos galhos das árvores.","E":"O uso intenso das patas e do corpo do animal gerou semelhança com galhos de árvores, proporcionando vantagens evolutivas."},"res":"Ideia-chave: a teoria sintética (neodarwinismo) junta a **seleção natural** de Darwin com a **genética**. Ela tem duas etapas que não podem ser confundidas:\n\n1) **Origem da variação**: mutações (e recombinação gênica) ocorrem **ao acaso**. O ambiente não \"encomenda\" a característica de que o animal precisa.\n\n2) **Seleção natural**: o ambiente atua como **seletor**. Os insetos que, por acaso, eram mais parecidos com galhos ficavam mais camuflados, escapavam mais dos predadores, viviam mais e deixavam mais descendentes. Assim, os alelos ligados a essa semelhança ficaram mais frequentes na população ao longo das gerações.\n\nA alternativa C traz exatamente essas duas etapas: \"Mutações aleatórias geraram estruturas físicas [...] e essas características foram selecionadas positivamente\". As outras colocam o ambiente ou o uso do corpo como causa direta da característica, o que contraria a teoria.","pq":{"A":"A recombinação é, sim, fonte de variação, mas o ambiente não a induz numa direção: ela ocorre ao acaso. O ambiente seleciona as variações que já existem, e a alternativa nem menciona a seleção.","B":"A permutação (crossing-over) não é direcionada a um objetivo; ela não \"fabrica\" patas em forma de galho porque isso seria útil. Falta também a seleção natural como mecanismo.","C":"Correta: variação aleatória (mutação) seguida de seleção natural, que favoreceu os indivíduos mais parecidos com galhos (mais camuflados).","D":"É a ideia de que o ambiente transforma o indivíduo diretamente para se adaptar. Na teoria sintética, o ambiente não cria a característica, apenas seleciona entre as variações já existentes.","E":"É o lamarckismo (lei do uso e desuso): usar muito uma parte do corpo não altera os genes nem é herdado pelos filhos."},"dica":"Teoria sintética = variação ao acaso (mutação e recombinação) + seleção natural. Se a alternativa diz que o ambiente \"induziu\", \"provocou\" ou que o \"uso\" criou a característica, está errada.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-48","n":48,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Genética – sistema ABO e heredograma (alelos múltiplos)","titulo":"Heredograma ABO: chance de menino AB do casal Victor e Olívia","gab":"A","base":null,"imgs":[{"src":"img/2024d1/q48_1.webp","w":781,"h":1167}],"alt":{"A":"1/8.","B":"0.","C":"1/4.","D":"3/4.","E":"3/8."},"res":"Ideia-chave: descobrir os genótipos de Victor e Olívia pelos filhos e pelos pais deles. Alelos: Iᴬ e Iᴮ (codominantes) e i (recessivo).\n\n1) O filho O é ii, então recebeu um i de cada um: Victor e Olívia têm, cada um, um alelo i.\n\n2) Os pais de Olívia são ambos do tipo B (Iᴮ_), então Olívia **não pode ter Iᴬ**. A filha A recebeu o Iᴬ de Victor. Logo, **Victor = Iᴬi** (compatível com a mãe dele, do tipo A, que pode ser Iᴬi).\n\n3) Victor não tem Iᴮ, então o filho B recebeu o Iᴮ de Olívia. Logo, **Olívia = Iᴮi** (compatível com pais B × B heterozigotos).\n\n4) Cruzamento Iᴬi × Iᴮi:\nIᴬIᴮ (AB) = 1/4\nIᴬi (A) = 1/4\nIᴮi (B) = 1/4\nii (O) = 1/4\n\n5) Menino **e** AB (eventos independentes, multiplica):\nP = 1/2 × 1/4 = **1/8**","pq":{"A":"Correta: Victor é Iᴬi e Olívia é Iᴮi; a chance de AB é 1/4 e a de ser menino é 1/2, então 1/2 × 1/4 = 1/8.","B":"Aparece se você achar que, como nenhum dos dois é AB, não pode nascer filho AB. Mas um pai Iᴬi com uma mãe Iᴮi gera IᴬIᴮ em 1/4 dos casos.","C":"1/4 é só a chance de o filho ser AB. Faltou multiplicar por 1/2, a chance de ser menino, que a pergunta exige.","D":"3/4 é a chance de o filho NÃO ser AB (1 − 1/4); usa o complementar no lugar do evento pedido e ainda ignora o sexo.","E":"3/8 = 3/4 × 1/2, ou seja, a chance de nascer um menino que NÃO seja AB. É a conta do complementar por engano."},"dica":"Filho O revela que os dois pais carregam i; depois, quando a pergunta junta sexo e tipo sanguíneo (\"menino AB\"), multiplique por 1/2.","dif":"média","nota":"","obs":""}],"grupos":{"01-04":{"rotulo":"01 a 04","imgs":[{"src":"img/2024d1/g01-04_1.webp","w":781,"h":911}]},"05-06":{"rotulo":"05 e 06","imgs":[{"src":"img/2024d1/g05-06_1.webp","w":781,"h":1010}]},"07-09":{"rotulo":"07 a 09","imgs":[{"src":"img/2024d1/g07-09_1.webp","w":782,"h":752}]},"10-12":{"rotulo":"10 a 12","imgs":[{"src":"img/2024d1/g10-12_1.webp","w":781,"h":371},{"src":"img/2024d1/g10-12_2.webp","w":782,"h":1208}]},"14-17":{"rotulo":"14 a 17","imgs":[{"src":"img/2024d1/g14-17_1.webp","w":781,"h":1728}]}}},"2024d2":{"ano":2024,"dia":2,"descricao":"Matemática e Ciências Humanas (História, Geografia, Filosofia, Sociologia).","questoes":[{"id":"2024d2-01","n":1,"area":"Matemática","disc":"Matemática","assunto":"Funções – leitura de gráficos (crescimento e sinal)","titulo":"Gráfico de função crescente com f(0) = −2 e f(x) < 0 para x < 1","gab":"D","base":null,"imgs":[{"src":"img/2024d2/q01_1.webp","w":781,"h":1982}],"alt":{"A":"[gráfico: parábola com concavidade para cima, vértice próximo de (−0,5; −2,25), que corta o eixo x em −2 e em 1 e o eixo y em −2]","B":"[gráfico: reta decrescente que corta o eixo y em −2 e fica abaixo do eixo x em todo o trecho de x = −3 a x = 3]","C":"[gráfico: reta crescente que corta o eixo x em −2 e o eixo y em 1]","D":"[gráfico: curva sempre crescente, do tipo exponencial, que se aproxima de y ≈ −3,5 à esquerda, corta o eixo y em −2 e o eixo x em 1 e sobe rapidamente até y = 4 perto de x ≈ 1,6]","E":"[gráfico: curva que desce de x = −3 até um mínimo perto de x ≈ −1,2 (y ≈ −2,9) e depois sobe, cortando o eixo y em −2 e o eixo x em 1]"},"res":"Ideia-chave: o gráfico precisa cumprir as três condições ao mesmo tempo: ser crescente em todo o domínio, passar por (0, −2) e ficar abaixo do eixo x para todo x < 1.\n\nTeste uma condição por vez e vá eliminando.\n1) **Crescente**: andando para a direita, o gráfico só pode subir. Isso elimina B (reta que desce), A e E (curvas que descem até um ponto de mínimo e só depois sobem).\n2) **f(0) = −2**: das que sobraram (C e D), a reta C corta o eixo y em 1, e não em −2. Eliminada.\n3) **f(x) < 0 para x < 1**: no gráfico D, a curva fica abaixo do eixo x em toda a parte à esquerda de x = 1. Ela se aproxima de y ≈ −3,5 à esquerda e cruza o eixo x exatamente em x = 1.\n\nO gráfico D sobe o tempo todo, passa por (0, −2) e só deixa de ser negativo a partir de x = 1. Resposta: D.","pq":{"A":"A parábola desce de x = −3 até x ≈ −0,5, então não é crescente. Além disso, fica positiva para x < −2, o que viola a condição f(x) < 0 para todo x < 1.","B":"A reta passa por (0, −2) e é negativa para x < 1, mas é decrescente: desce da esquerda para a direita. O enunciado exige uma função crescente.","C":"A reta é crescente, mas corta o eixo y em 1, ou seja, f(0) = 1 e não −2. Ela também é positiva para x > −2 (em x = 0, por exemplo), contrariando f(x) < 0 para x < 1.","D":"Correta: a curva sobe o tempo todo, passa por (0, −2) e só cruza o eixo x em x = 1, ficando negativa para todo x < 1.","E":"É a pegadinha: passa por (0, −2) e é negativa para x < 1, mas desce de x = −3 até x ≈ −1,2 antes de subir. Por isso não é crescente em todo o domínio."},"dica":"Em questões de gráfico, teste uma condição de cada vez e elimine. 'Crescente' quer dizer que o gráfico só sobe da esquerda para a direita, sem nenhum trecho de descida.","dif":"fácil","nota":"","obs":""},{"id":"2024d2-02","n":2,"area":"Matemática","disc":"Matemática","assunto":"Expressões algébricas – produto de binômios e área do retângulo","titulo":"Retângulo ampliado em 3 cm: valor de a + b","gab":"B","base":null,"imgs":[{"src":"img/2024d2/q02_1.webp","w":783,"h":498}],"alt":{"A":"16 cm.","B":"11 cm.","C":"17 cm.","D":"14 cm.","E":"10 cm."},"res":"Ideia-chave: não é preciso descobrir a e b separadamente. Basta expandir o produto da nova área e isolar a + b.\n\nÁrea original: a · b = 24\nNovo retângulo: lados (a + 3) e (b + 3), com área 66.\n(a + 3)(b + 3) = 66\nab + 3a + 3b + 9 = 66\nSubstituindo ab = 24:\n24 + 3(a + b) + 9 = 66\n3(a + b) = 66 − 33\n3(a + b) = 33\na + b = 11 cm\n\nConferência: a e b são as raízes de t² − 11t + 24 = 0, ou seja, 3 e 8. De fato, 3 × 8 = 24 e (3 + 3) × (8 + 3) = 6 × 11 = 66. Confere.","pq":{"A":"Não satisfaz as condições: com a + b = 16 e ab = 24, a nova área seria 24 + 3 · 16 + 9 = 81 cm², e não 66 cm².","B":"Correta: expandindo (a + 3)(b + 3) = ab + 3(a + b) + 9 e substituindo ab = 24, chega-se a 3(a + b) = 33, ou seja, a + b = 11 cm.","C":"17 aparece se você trocar o sinal do 9 (24 + 3(a + b) − 9 = 66 dá 3(a + b) = 51). É também a soma dos lados do retângulo ampliado, 6 + 11, e não a do original.","D":"14 aparece quando se esquece a parcela 3 × 3 = 9 da expansão: 24 + 3(a + b) = 66 dá a + b = 14. O produto (a + 3)(b + 3) tem quatro parcelas.","E":"10 corresponde, por exemplo, ao chute de lados 4 e 6 (área 24). Só que a nova área seria então 7 × 9 = 63 cm², e não 66 cm²."},"dica":"Quando a pergunta pede a + b (ou ab), expanda o produto e substitua o que já é conhecido. Não é preciso achar cada incógnita.","dif":"fácil","nota":"","obs":""},{"id":"2024d2-03","n":3,"area":"Matemática","disc":"Matemática","assunto":"Trigonometria no triângulo retângulo – tangente e semelhança","titulo":"Rampa ao lado de escada: altura do degrau com tg α = 9/35","gab":"E","base":null,"imgs":[{"src":"img/2024d2/q03_1.webp","w":783,"h":1416}],"alt":{"A":"20 cm.","B":"23 cm.","C":"10 cm.","D":"15 cm.","E":"18 cm."},"res":"Ideia-chave: as alturas x dos seis triângulos pequenos, somadas, formam a altura total BC da rampa. Logo, BC = 6x.\n\nNo triângulo retângulo ABC (ângulo reto em B), a tangente de α é o cateto oposto dividido pelo cateto adjacente:\ntg α = BC/AB\n9/35 = BC/420\nBC = 420 × 9/35 = 12 × 9 = 108 cm\n\nOs seis triângulos pequenos se sucedem desde o ponto C até o chão. O primeiro tem o cateto vertical sobre BC, e o último tem o cateto horizontal sobre AB, junto ao ponto A. Então:\n6x = 108\nx = 18 cm\n\nOutra forma de conferir: cada triângulo pequeno é semelhante a ABC, porque tem o mesmo ângulo α. Assim, seu cateto horizontal mede x ÷ (9/35) = 35x/9. Os seis catetos horizontais juntos formam AB:\n6 · 35x/9 = 420\n210x/9 = 420\nx = 18 cm","pq":{"A":"Com x = 20 cm, a altura total seria 6 × 20 = 120 cm e tg α = 120/420 = 2/7 ≈ 0,286, diferente de 9/35 ≈ 0,257.","B":"Com x = 23 cm, BC = 138 cm e tg α = 138/420 ≈ 0,33, bem acima de 9/35 ≈ 0,257. Nenhuma conta correta leva a esse valor.","C":"Com x = 10 cm, os seis triângulos somariam só 60 cm de altura (tg α = 60/420 ≈ 0,14). Mas a tangente dada exige BC = 108 cm.","D":"15 fica perto de 108 ÷ 7 ≈ 15,4, que é o resultado de quem conta 7 triângulos (incluindo o próprio ABC) em vez dos 6 pequenos. Com x = 15, 6x = 90 cm ≠ 108 cm.","E":"Correta: tg α = BC/AB dá BC = 420 × 9/35 = 108 cm. Como BC = 6x, temos x = 18 cm."},"dica":"Em figuras com vários triângulos semelhantes empilhados, lembre que a soma dos catetos correspondentes dos pequenos dá o cateto do triângulo grande.","dif":"média","nota":"","obs":""},{"id":"2024d2-04","n":4,"area":"Matemática","disc":"Matemática","assunto":"Função quadrática – valor máximo (vértice) e otimização de área","titulo":"Área máxima cercada em trapézio retângulo à beira do rio","gab":"E","base":null,"imgs":[{"src":"img/2024d2/q04_1.webp","w":781,"h":1173}],"alt":{"A":"0,6 km².","B":"2,4 km².","C":"1,5 km².","D":"6,0 km².","E":"2,0 km²."},"res":"Ideia-chave: use o comprimento da cerca para escrever a área em função de uma só variável e depois ache o vértice da parábola.\n\nSeja y o lado de baixo, perpendicular aos lados paralelos (é a altura do trapézio). A margem do rio não recebe cerca, então a cerca cobre só os lados 2x, x e y:\n2x + x + y = 4\ny = 4 − 3x\n\nÁrea do trapézio = (base maior + base menor) × altura ÷ 2:\nA(x) = (2x + x) · y/2 = (3x/2)(4 − 3x) = 6x − (9/2)x²\n\nÉ uma parábola com concavidade para baixo, então o máximo está no vértice:\nx_v = −b/(2a) = −6/(2 · (−9/2)) = 6/9 = 2/3 km\n\nCom isso, y = 4 − 3 · (2/3) = 2 km, e os lados paralelos medem 4/3 km e 2/3 km.\nA_máx = (4/3 + 2/3) · 2/2 = 2 · 2/2 = 2,0 km²","pq":{"A":"0,6 km² é uma área possível, mas fica bem abaixo do máximo de 2 km². Cuidado para não confundir x_v (2/3 ≈ 0,67 km, que é um comprimento) com o valor máximo da área, que é o y do vértice.","B":"2,4 km² é mais do que o máximo de A(x) = 6x − 4,5x², que é 2 km² no vértice. Com 4 km de cerca, nenhum valor de x chega a 2,4 km².","C":"1,5 km² é a área de uma escolha qualquer, não da ótima. Por exemplo, com x = 1 km os lados medem 2 km e 1 km e a base mede y = 1 km, o que dá (2 + 1) · 1/2 = 1,5 km².","D":"6,0 aparece se você esquecer de cercar o lado 2x e usar x + y = 4: aí A = (3x/2)(4 − x) tem máximo 6 em x = 2. Mas o lado 2x não está na margem do rio e também recebe cerca.","E":"Correta: com y = 4 − 3x, a área A(x) = 6x − 4,5x² atinge o máximo em x = 2/3 km, e esse máximo vale 2,0 km²."},"dica":"Em problemas de 'maior área', escreva a área em função de uma única variável usando o vínculo (o comprimento da cerca) e use o vértice da parábola: x_v = −b/(2a).","dif":"difícil","nota":"","obs":""},{"id":"2024d2-05","n":5,"area":"Matemática","disc":"Matemática","assunto":"Trigonometria – triângulo isósceles, lei dos senos e lei dos cossenos","titulo":"Pássaros em formação: base AB do triângulo isósceles","gab":"B","base":null,"imgs":[{"src":"img/2024d2/q05_1.webp","w":783,"h":1681}],"alt":{"A":"1 m.","B":"3 m.","C":"2 m.","D":"4 m.","E":"5 m."},"res":"Ideia-chave: no triângulo isósceles, a altura relativa à base AB cai no ponto médio M de AB. Assim, o triângulo AMC é retângulo em M, e dá para usar o cosseno do ângulo A.\n\nComo AC = BC, a base é AB e os ângulos da base são iguais: ângulo A = ângulo B = 72,5°. Logo, ângulo C = 180° − 145° = 35°.\n\nNo triângulo retângulo AMC:\ncos 72,5° = AM/AC\n0,30 = AM/5\nAM = 1,5 m\nAB = 2 · AM = 3 m\n\nConferência pela lei dos senos:\nAB/sen 35° = BC/sen 72,5°\nAB = 5 · 0,57/0,95 = 2,85/0,95 = 3 m\n\nOu pela lei dos cossenos:\nAB² = 5² + 5² − 2 · 5 · 5 · cos 35°\nAB² = 50 − 50 · 0,82 = 50 − 41 = 9\nAB = 3 m","pq":{"A":"Com AB = 1 m, metade da base mediria 0,5 m e cos A = 0,5/5 = 0,10, e não 0,30 como diz a tabela.","B":"Correta: a metade da base é AM = 5 · cos 72,5° = 5 · 0,30 = 1,5 m, então AB = 3 m. A lei dos senos e a lei dos cossenos confirmam esse valor.","C":"AB = 2 m daria cos A = 1/5 = 0,20. Quem calcula AM = 1,5 m e esquece de dobrar pode acabar arredondando para 2, mas 1,5 m é só a metade da base.","D":"4 m vem de fazer 5 · cos 35° = 5 · 0,82 ≈ 4,1, como se AB fosse cateto adjacente ao ângulo C, mas ABC não é retângulo. Com AB = 4, cos A seria 0,40.","E":"5 m só valeria se o triângulo fosse equilátero, com todos os ângulos de 60°. Aqui AB fica oposto ao menor ângulo (35°), então é o menor lado, menor que 5 m."},"dica":"Em triângulo isósceles, a altura relativa à base divide essa base ao meio. Use o triângulo retângulo que se forma e não se esqueça de dobrar o resultado no final.","dif":"média","nota":"","obs":""},{"id":"2024d2-06","n":6,"area":"Matemática","disc":"Matemática","assunto":"Semelhança de triângulos e bissetriz (triângulo isósceles)","titulo":"Bissetriz e paralela no triângulo retângulo: medida de AB","gab":"A","base":null,"imgs":[{"src":"img/2024d2/q06_1.webp","w":781,"h":1077}],"alt":{"A":"21 cm.","B":"28 cm.","C":"26 cm.","D":"25 cm.","E":"22 cm."},"res":"Ideia-chave: ED ∥ AB, porque os dois segmentos são perpendiculares a BC. Esse paralelismo gera um triângulo isósceles (AED) e uma semelhança (CED com CAB).\n\n1) Paralelismo: o ângulo B é reto, então AB ⊥ BC. Como ED ⊥ BC, segue que ED ∥ AB.\n\n2) Triângulo isósceles: a reta AD corta as paralelas ED e AB, então os ângulos alternos internos são iguais: ângulo ADE = ângulo DAB = α. Como AD é bissetriz, o ângulo DAE também vale α. O triângulo AED tem dois ângulos iguais a α, logo é isósceles com ED = AE = 12 cm.\n\n3) Semelhança: como ED ∥ AB, o triângulo CED é semelhante ao triângulo CAB.\nCA = AE + EC = 12 + 16 = 28 cm\nED/AB = CE/CA\n12/AB = 16/28\nAB = 12 · 28/16 = 336/16 = 21 cm","pq":{"A":"Correta: o triângulo AED é isósceles, então ED = AE = 12 cm. Pela semelhança entre CED e CAB, 12/AB = 16/28, o que dá AB = 21 cm.","B":"28 cm é a medida de AC (12 + 16), que é a hipotenusa. AB é cateto e precisa ser menor que 28. Esse valor também sai se você supuser, errado, que ED = EC = 16 cm na semelhança.","C":"Com AB = 26, a semelhança daria ED = 26 · 16/28 ≈ 14,9 cm. Mas ED precisa ser igual a AE = 12 cm, porque o triângulo AED é isósceles.","D":"Com AB = 25, a semelhança daria ED = 25 · 16/28 ≈ 14,3 cm ≠ 12 cm. Esse valor não respeita a proporção entre CED e CAB.","E":"Fica perto, mas AB = 22 levaria a ED = 22 · 16/28 ≈ 12,6 cm, e não a exatamente 12 cm. A proporção correta, 12/AB = 16/28, dá exatamente 21."},"dica":"Bissetriz combinada com uma reta paralela a um lado do ângulo forma um triângulo isósceles. Procure os ângulos alternos internos.","dif":"difícil","nota":"","obs":""},{"id":"2024d2-07","n":7,"area":"Matemática","disc":"Matemática","assunto":"Sistema de equações do 1º grau – problema de mistura","titulo":"Marmitas de Júlia: quantidades de macarrão e carne para 800 g e R$ 3,00","gab":"C","base":null,"imgs":[{"src":"img/2024d2/q07_1.webp","w":781,"h":842}],"alt":{"A":"400 g de macarrão e 400 g de carne.","B":"200 g de macarrão e 600 g de carne.","C":"600 g de macarrão e 200 g de carne.","D":"700 g de macarrão e 100 g de carne.","E":"500 g de macarrão e 300 g de carne."},"res":"Ideia-chave: montar um sistema com duas equações, uma para o peso e outra para o custo, trabalhando em quilos.\nSeja m a massa de macarrão e c a massa de carne, em kg.\nPeso: m + c = 0,8\nCusto: 1·m + 12·c = 3\nSubtraindo a 1ª equação da 2ª:\n11c = 3 − 0,8 = 2,2 → c = 0,2 kg = 200 g\nm = 0,8 − 0,2 = 0,6 kg = 600 g\nConferindo: 600 g de macarrão custam 0,6 × R$ 1,00 = R$ 0,60; 200 g de carne custam 0,2 × R$ 12,00 = R$ 2,40. Total: R$ 0,60 + R$ 2,40 = R$ 3,00, e 600 g + 200 g = 800 g. As duas condições são satisfeitas: **alternativa C**.\nAtalho: todas as alternativas já somam 800 g, então basta calcular o custo de cada uma e ver qual dá exatamente R$ 3,00.","pq":{"A":"Custo: 0,4 × 1 + 0,4 × 12 = 0,40 + 4,80 = R$ 5,20, acima de R$ 3,00. Dividir meio a meio ignora que a carne é 12 vezes mais cara.","B":"São as quantidades da resposta certa invertidas: 0,2 × 1 + 0,6 × 12 = 0,20 + 7,20 = R$ 7,40. Quem resolve o sistema e troca as variáveis no final cai aqui.","C":"Correta: 600 g + 200 g = 800 g e 0,60 + 2,40 = R$ 3,00. É a única que satisfaz as duas condições ao mesmo tempo.","D":"O peso está certo, mas o custo fica baixo: 0,7 × 1 + 0,1 × 12 = 0,70 + 1,20 = R$ 1,90, e não R$ 3,00.","E":"Custo: 0,5 × 1 + 0,3 × 12 = 0,50 + 3,60 = R$ 4,10. Ainda há carne demais para o orçamento."},"dica":"Em problemas de mistura com duas condições (total e custo), monte um sistema de duas equações; se todas as alternativas já cumprem uma condição, teste só a outra.","dif":"fácil","nota":"","obs":""},{"id":"2024d2-08","n":8,"area":"Matemática","disc":"Matemática","assunto":"Sistema de equações do 1º grau","titulo":"Ingressos de pista e cadeira: quanto Marcos pagou nos dois dias","gab":"D","base":null,"imgs":[{"src":"img/2024d2/q08_1.webp","w":783,"h":1211}],"alt":{"A":"R$ 150,00.","B":"R$ 220,00.","C":"R$ 100,00.","D":"R$ 160,00.","E":"R$ 200,00."},"res":"Ideia-chave: os preços são os mesmos nos dois dias, então cada dia gera uma equação com as mesmas incógnitas.\nSeja p o preço da pista e c o da cadeira.\nSábado: 200p + 100c = 21.000 → (÷100) 2p + c = 210\nDomingo: 180p + 120c = 22.200 → (÷60) 3p + 2c = 370\nDa 1ª equação: c = 210 − 2p. Substituindo na 2ª:\n3p + 2(210 − 2p) = 370\n3p + 420 − 4p = 370\n−p = −50 → p = 50\nc = 210 − 2·50 = 110\nConferindo: 200·50 + 100·110 = 10.000 + 11.000 = 21.000 ✓; 180·50 + 120·110 = 9.000 + 13.200 = 22.200 ✓.\nMarcos comprou 1 ingresso de pista (sábado) e 1 de cadeira (domingo): R$ 50,00 + R$ 110,00 = R$ 160,00. **Alternativa D**.","pq":{"A":"R$ 150,00 é o valor de 3p, uma conta intermediária: subtraindo as equações chega-se a c − p = 60 e, combinando com 2p + c = 210, obtém-se 3p = 150. Quem para aí esquece de dividir por 3 e de somar a cadeira.","B":"R$ 220,00 = 2 × 110, o preço de duas cadeiras. Serve para quem esquece que, no sábado, Marcos comprou pista.","C":"R$ 100,00 = 2 × 50, o preço de dois ingressos de pista. Ignora que no domingo ele comprou cadeira, que custa R$ 110,00.","D":"Correta: pista = R$ 50,00 e cadeira = R$ 110,00, valores que reproduzem as duas arrecadações; 50 + 110 = R$ 160,00.","E":"R$ 200,00 equivale a 4 ingressos de pista (4 × 50), e não à soma pista + cadeira. Nenhum par de preços que dê as arrecadações de R$ 21.000,00 e R$ 22.200,00 soma 200."},"dica":"Quando os mesmos preços aparecem em situações diferentes, cada situação vira uma equação: monte o sistema, resolva e confira substituindo nos totais.","dif":"média","nota":"","obs":""},{"id":"2024d2-09","n":9,"area":"Matemática","disc":"Matemática","assunto":"Volume do paralelepípedo e porcentagem","titulo":"Embalagens de suco: em quantos % o maior volume supera o menor","gab":"B","base":null,"imgs":[{"src":"img/2024d2/q09_1.webp","w":781,"h":833}],"alt":{"A":"83%.","B":"21%.","C":"12%.","D":"50%.","E":"68%."},"res":"Ideia-chave: volume do paralelepípedo = área da base × altura. Depois, compara-se em porcentagem tomando a embalagem MENOR como referência, porque a pergunta é quanto a maior \"supera o volume da outra embalagem\".\nTipo 1: V₁ = 7² × 8 = 49 × 8 = 392 cm³\nTipo 2: V₂ = 6² × 9 = 36 × 9 = 324 cm³\nA maior é a do tipo 1. A diferença é:\nV₁ − V₂ = 392 − 324 = 68 cm³\nEm relação à menor:\n68/324 ≈ 0,21 → cerca de 21%\n(ou, de outro jeito: 392/324 ≈ 1,21, ou seja, 21% a mais).\n**Alternativa B**.\nRepare que a embalagem 2 é mais alta (9 cm contra 8 cm), mas a base da 1 é bem maior (49 cm² contra 36 cm²), e isso pesa mais no volume.","pq":{"A":"324/392 ≈ 0,83 é a razão da menor pela maior: a menor tem cerca de 83% do volume da maior. Isso não é quanto a maior supera a menor.","B":"Correta: (392 − 324)/324 = 68/324 ≈ 0,21, ou seja, a embalagem do tipo 1 tem cerca de 21% a mais de volume.","C":"Cerca de 12% é quanto a área total da superfície do tipo 1 (2·49 + 4·56 = 322 cm²) supera a do tipo 2 (2·36 + 4·54 = 288 cm²): 322/288 ≈ 1,12. Isso compara o material da embalagem, não o volume.","D":"Para a maior superar a menor em 50%, ela precisaria ter 1,5 × 324 = 486 cm³, bem mais que os 392 cm³ reais.","E":"68 é a diferença absoluta em cm³ (392 − 324), não uma porcentagem. Faltou dividir por 324."},"dica":"\"A supera B em quantos %\" se calcula como (A − B)/B: a referência é sempre o valor com que se está comparando.","dif":"média","nota":"","obs":""},{"id":"2024d2-10","n":10,"area":"Matemática","disc":"Matemática","assunto":"Cone – planificação e relação g² = h² + r²","titulo":"Chapéu cônico planificado (geratriz 5 cm, arco 6π cm): altura","gab":"C","base":null,"imgs":[{"src":"img/2024d2/q10_1.webp","w":781,"h":831}],"alt":{"A":"3 cm.","B":"7 cm.","C":"4 cm.","D":"6 cm.","E":"5 cm."},"res":"Ideia-chave: na planificação da superfície lateral do cone, o raio do setor circular é a geratriz g, e o comprimento do arco vira a circunferência da base.\nGeratriz: g = 5 cm (os lados retos do setor).\nArco = circunferência da base:\n2πr = 6π → r = 3 cm\nA altura h, o raio r e a geratriz g formam um triângulo retângulo, com a geratriz como hipotenusa:\ng² = h² + r²\n5² = h² + 3²\n25 = h² + 9\nh² = 16 → h = 4 cm\n**Alternativa C**. É o famoso triângulo retângulo 3-4-5.","pq":{"A":"3 cm é o raio da base, obtido de 2πr = 6π. É só um passo intermediário, não a altura.","B":"Impossível: a altura é cateto de um triângulo retângulo cuja hipotenusa é a geratriz de 5 cm, então h < 5. O 7 pode surgir de somar raio e altura (3 + 4).","C":"Correta: r = 3 cm (de 2πr = 6π), g = 5 cm e h = √(25 − 9) = √16 = 4 cm.","D":"6 cm é o diâmetro da base (2 × 3), ou o \"6\" de 6π lido como medida. Além disso, nenhuma altura pode passar da geratriz de 5 cm.","E":"5 cm é a geratriz, a medida inclinada do chapéu (da ponta até a borda). A altura só seria igual à geratriz se o raio fosse zero."},"dica":"Cone planificado: raio do setor = geratriz; comprimento do arco = 2πr da base; depois use g² = h² + r².","dif":"média","nota":"","obs":""},{"id":"2024d2-11","n":11,"area":"Matemática","disc":"Matemática","assunto":"Leitura de tabela e ordenação","titulo":"Quadro de medalhas de Paris 2024 reordenado pelo total: maior salto","gab":"E","base":null,"imgs":[{"src":"img/2024d2/q11_1.webp","w":783,"h":1679}],"alt":{"A":"Holanda, que subiria de 6º para 4º.","B":"Coreia do Sul, que subiria de 8º para 3º.","C":"Itália, que subiria de 9º para 4º.","D":"Alemanha, que subiria de 10º para 5º.","E":"Grã-Bretanha, que subiria de 7º para 3º."},"res":"Ideia-chave: somar ouro + prata + bronze de cada país, reordenar pelo total e comparar a nova posição com a original.\nTotais (posição original → total):\n1º EUA: 40 + 44 + 42 = 126\n2º China: 40 + 27 + 24 = 91\n3º Japão: 20 + 12 + 13 = 45\n4º Austrália: 18 + 19 + 16 = 53\n5º França: 16 + 26 + 22 = 64\n6º Holanda: 15 + 7 + 12 = 34\n7º Grã-Bretanha: 14 + 22 + 29 = 65\n8º Coreia do Sul: 13 + 9 + 10 = 32\n9º Itália: 12 + 13 + 15 = 40\n10º Alemanha: 12 + 13 + 8 = 33\nNova ordem pelo total: EUA (126), China (91), Grã-Bretanha (65), França (64), Austrália (53), Japão (45), Itália (40), Holanda (34), Alemanha (33), Coreia do Sul (32).\nA Grã-Bretanha vai de 7º para 3º e sobe 4 posições, o maior salto. Os outros que sobem: Itália (9º → 7º, 2 posições), França (5º → 4º) e Alemanha (10º → 9º), com 1 posição cada. **Alternativa E**.","pq":{"A":"A Holanda tem só 34 medalhas (poucas pratas: 7) e, na verdade, cai de 6º para 8º, ultrapassada por Grã-Bretanha (65) e Itália (40).","B":"A Coreia do Sul tem o menor total dos dez (32 medalhas) e desce de 8º para 10º, em vez de subir.","C":"A Itália, com 40 medalhas, fica atrás do Japão (45) e sobe só de 9º para 7º, ou seja, 2 posições, e não para 4º.","D":"A Alemanha, com 33 medalhas, passa apenas a Coreia do Sul (32) e sobe só de 10º para 9º.","E":"Correta: com 65 medalhas, a Grã-Bretanha fica atrás apenas de EUA (126) e China (91) e sobe de 7º para 3º, ou seja, 4 posições, o maior salto."},"dica":"Para reordenar uma tabela, calcule a nova coluna para todos, monte o ranking completo e só então compare as posições, sem confiar na impressão visual.","dif":"média","nota":"","obs":""},{"id":"2024d2-12","n":12,"area":"Matemática","disc":"Matemática","assunto":"Razão e leitura de gráfico de linhas","titulo":"Performance de Pedro (gols dele ÷ gols do time): ano de maior razão","gab":"A","base":null,"imgs":[{"src":"img/2024d2/q12_1.webp","w":781,"h":1330}],"alt":{"A":"2023.","B":"2020.","C":"2021.","D":"2022.","E":"2024."},"res":"Ideia-chave: performance = gols de Pedro ÷ gols do time. A pergunta não quer o ano em que Pedro marcou mais gols, e sim aquele em que ele fez a maior fração dos gols do time.\nLendo o gráfico:\n2020: 20/70 ≈ 0,286 (28,6%)\n2021: 22/65 ≈ 0,338 (33,8%)\n2022: 30/75 = 0,400 (40%)\n2023: 28/65 ≈ 0,431 (43,1%)\n2024: 20/80 = 0,250 (25%)\nA maior razão é a de 2023. Em 2022, Pedro fez mais gols (30), mas o time também fez mais (75); em 2023, ele fez 28 de apenas 65 gols do time.\nComparação rápida entre 2022 e 2023: 30/75 = 2/5 = 0,4, enquanto 28/65 > 26/65 = 0,4.\n**Alternativa A**.","pq":{"A":"Correta: 28/65 ≈ 43%, a maior fração dos gols do time feita por Pedro no período.","B":"Em 2020, 20/70 ≈ 28,6%, a segunda pior performance; só fica acima de 2024.","C":"2021 tem o mesmo denominador de 2023 (65 gols do time), mas Pedro fez menos gols (22 < 28), então a performance é menor: ≈ 33,8%.","D":"2022 é o ano em que Pedro fez mais gols (30), a pegadinha de olhar só o numerador. Como o time fez 75, a razão é 40%, menor que os 43% de 2023.","E":"Em 2024 o time fez mais gols (80), mas Pedro fez só 20: 20/80 = 25%, a menor performance de todas."},"dica":"Quando a pergunta define uma razão, calcule-a em cada caso: o maior numerador sozinho não garante a maior fração.","dif":"fácil","nota":"","obs":""},{"id":"2024d2-13","n":13,"area":"Matemática","disc":"Matemática","assunto":"Números racionais e inequações","titulo":"Racional x com triplo inteiro negativo e x + 1/2 positivo","gab":"C","base":null,"imgs":[{"src":"img/2024d2/q13_1.webp","w":783,"h":969}],"alt":{"A":"1/2","B":"−2/3","C":"−1/3","D":"−1/2","E":"1/3"},"res":"Ideia-chave: transforme cada propriedade numa condição sobre x e veja qual valor atende às duas ao mesmo tempo.\n\nPropriedade 2: x + 1/2 > 0 → x > −1/2.\nPropriedade 1: 3x é inteiro negativo, ou seja, 3x pode ser −1, −2, −3, …\n\nJuntando: se x > −1/2, então 3x > −3/2 = −1,5.\nO único inteiro negativo maior que −1,5 é −1.\nLogo 3x = −1 → x = −1/3.\n\nConferindo:\n3 × (−1/3) = −1 (inteiro negativo) ✓\n−1/3 + 1/2 = −2/6 + 3/6 = 1/6 > 0 ✓\n\nResposta: x = −1/3, alternativa C.","pq":{"A":"Com x = 1/2, a soma com 1/2 dá 1 (positiva), mas o triplo é 3/2 = 1,5, que nem é inteiro nem é negativo. Falha na propriedade 1.","B":"O triplo de −2/3 é −2, inteiro negativo (passa na propriedade 1), mas −2/3 + 1/2 = −4/6 + 3/6 = −1/6, que é negativo. Falha na propriedade 2.","C":"Correta: 3 × (−1/3) = −1, inteiro negativo, e −1/3 + 1/2 = 1/6, positivo. É o único valor que cumpre as duas condições.","D":"O triplo de −1/2 é −3/2, que não é inteiro; além disso, −1/2 + 1/2 = 0, e zero não é positivo. Falha nas duas propriedades.","E":"1/3 + 1/2 = 5/6 é positivo, mas o triplo de 1/3 é 1, inteiro porém positivo, e a propriedade 1 exige negativo. É a pegadinha de esquecer o sinal."},"dica":"Em questões com várias condições, traduza cada uma em desigualdade ou equação e teste as alternativas em todas: muitas passam em uma e falham na outra.","dif":"média","nota":"","obs":""},{"id":"2024d2-14","n":14,"area":"Matemática","disc":"Matemática","assunto":"Porcentagem","titulo":"Prêmio do COB: prata como porcentagem do ouro","gab":"B","base":null,"imgs":[{"src":"img/2024d2/q14_1.webp","w":781,"h":799}],"alt":{"A":"30%.","B":"60%.","C":"40%.","D":"50%.","E":"70%."},"res":"Ideia-chave: \"A corresponde a qual porcentagem de B\" é a razão A/B. Aqui, A = prata e B = ouro.\n\nPrata / Ouro = 210.000 / 350.000\nCortando os quatro zeros: 21/35\nDividindo por 7: 3/5\n3/5 = 0,6 = 60%\n\nConferindo: 60% de 350.000 = 0,6 × 350.000 = 210.000 ✓\n\nO va
