o com o clima.","E":"Correta: o terno contraria o clima quente (\"climas mais tórridos\") e revela uma herança colonial (\"para se parecerem com os europeus que os colonizaram\")."},"dica":"Grave a diferença: \"ir de encontro a\" = contrariar, chocar-se; \"ir ao encontro de\" = concordar, ir na mesma direção.","dif":"média","nota":"","obs":""},{"id":"2023d1-03","n":3,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Ironia e posicionamento do autor","titulo":"Ironia sobre o terno como sinal de competência (Pepetela)","gab":"B","base":"02-06","imgs":[{"src":"img/2023d1/q03_1.webp","w":781,"h":734}],"alt":{"A":"desprezo quanto à popularização de formas informais de se vestir para trabalhos burocratas.","B":"indiferença às roupas como forma de alguém mostrar competência profissional.","C":"admiração por aqueles que alternam suas formas de se vestir, de acordo com as situações.","D":"apreço ao uso de terno para o trabalho, como expediente de confirmação de competência.","E":"apoio a quem opta por usar terno e gravata no trabalho, que é a roupa profissional adequada."},"res":"Ideia-chave: o trecho é irônico. O autor reproduz a lógica de quem acredita que o terno faz o chefe, mas faz isso para mostrar como essa crença é absurda.\n\n1) O contexto: antes do trecho, ele descreve o sofrimento no calor e conclui \"Mas não abdicamos do fato e da gravata\". Ou seja, mesmo sofrendo, as pessoas mantêm o hábito.\n2) Em seguida vêm perguntas retóricas que imitam o pensamento comum: \"Sem fato que seria do burocrata chefe de serviço? Nem parecia um chefe de serviço\". Depois o autor leva a ideia ao exagero: \"Ninguém o respeitava, parecia um falhado\".\n3) O texto todo trata o terno como um dos \"hábitos ou manias\" prejudiciais e elogia quem se vestiu \"sempre de acordo com o clima\".\n\nAssim, para o autor a roupa não é critério para medir competência. Ele não dá importância ao traje como prova de capacidade profissional, e é esse o sentido de \"indiferença\" na alternativa B. A palavra é um pouco fraca para descrever a crítica irônica do autor, mas B é a única alternativa compatível com a posição dele. A, C, D e E atribuem a ele valores que o texto rejeita ou nem menciona.","pq":{"A":"Inverte a posição do autor. Ele defende roupas leves e adequadas ao clima, então não despreza a informalidade. O que ele critica é a insistência no terno.","B":"Correta: por meio da ironia, o autor mostra que não reconhece a roupa como prova de competência profissional.","C":"O texto não fala em alternar roupas conforme a situação. O elogio vai para quem se vestiu \"sempre de acordo com o clima\", como Nyerere e Mandela.","D":"É a leitura literal, que cai na armadilha da ironia. A frase \"Nem parecia um chefe de serviço\" reproduz o preconceito que o autor critica, não a opinião dele.","E":"Mesmo erro da D: toma a ironia ao pé da letra. O autor chama o terno de \"mania\" e associa seu uso a um \"complexo de inferioridade\", então não o considera a roupa adequada."},"dica":"Quando o autor critica um hábito e de repente parece defendê-lo com perguntas retóricas e exageros, suspeite de ironia: a opinião real é a oposta.","dif":"média","nota":"","obs":""},{"id":"2023d1-04","n":4,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Valor semântico de palavras e conectivos","titulo":"Valor semântico de \"mesmo\" e \"mesmo que\"","gab":"D","base":"02-06","imgs":[{"src":"img/2023d1/q04_1.webp","w":781,"h":625}],"alt":{"A":"afirmação e explicação.","B":"intensidade e conclusão.","C":"comparação e causa.","D":"inclusão e concessão.","E":"finalidade e condição."},"res":"Ideia-chave: troque cada expressão por um sinônimo e veja qual sentido aparece.\n\n1) \"fato e gravata, por vezes colete mesmo\". Aqui \"mesmo\" equivale a \"até\" ou \"inclusive\": além do terno e da gravata, às vezes as pessoas usam até colete. O \"mesmo\" acrescenta mais um item à lista e destaca que esse item é surpreendente. O sentido é de inclusão.\n\n2) \"casacos mesmo que de verão\". Aqui \"mesmo que\" equivale a \"ainda que\" ou \"embora\": os casacos são usados ainda que sejam de verão. O autor admite um fato contrário (o casaco é mais leve), mas isso não muda o problema (continua sendo casaco no calor). Esse é o sentido de concessão.\n\nTeste rápido: \"por vezes até colete\" e \"casacos, ainda que de verão\" mantêm o sentido original. Logo, os sentidos são inclusão e concessão, e a resposta é a D.","pq":{"A":"\"Mesmo\" só teria valor de afirmação em frases como \"é mesmo\" (= realmente), o que não acontece aqui. \"Mesmo que\" também não explica nada, pois não equivale a \"porque\" ou \"pois\".","B":"\"Mesmo\" até sugere um reforço, mas o que ele faz é incluir o colete na lista. \"Mesmo que\" não é conclusivo como \"portanto\" ou \"logo\": ele introduz uma concessão.","C":"\"Mesmo\" não compara nada aqui (comparação seria algo como \"o mesmo que\", no sentido de \"igual a\"). \"Mesmo que\" também não indica causa, como \"já que\" ou \"porque\".","D":"Correta: \"mesmo\" = até, inclusive (inclusão); \"mesmo que\" = ainda que, embora (concessão).","E":"Nenhuma das duas indica finalidade (\"para que\", \"a fim de\"). A pegadinha é confundir \"mesmo que\" com \"caso\" (condição), mas \"mesmo que\" sempre traz a ideia de \"apesar de\"."},"dica":"\"Mesmo que\" = \"ainda que\" = \"embora\": concessão. Na dúvida, troque o conectivo por um sinônimo e veja se o sentido se mantém.","dif":"média","nota":"","obs":""},{"id":"2023d1-05","n":5,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Regência verbal e nominal","titulo":"Regência verbal e nominal em reescritas do texto de Pepetela","gab":"E","base":"02-06","imgs":[{"src":"img/2023d1/q05_1.webp","w":783,"h":959}],"alt":{"A":"Com a temperatura muito alta, ansiamos dos nossos gabinetes e salas refrescadas por aparelhos de ar-condicionado, para nos sentirmos mais confortáveis com as roupas.","B":"Não renunciamos do fato e da gravata, mesmo não aguentando a temperatura e desejando os gabinetes e salas, sob a refrigeração dos aparelhos de ar-condicionado.","C":"Alguns países optaram às roupas leves e largas como traje oficial, mais compatíveis aos climas quentes, como é o caso de alguns da África Ocidental ou da América Latina.","D":"Os africanos são adeptos pela cultura europeia, pois preferem as roupas de estilistas famosos de Londres ou Paris do que aquelas leves e largas adequadas ao seu clima.","E":"O responsável, cujo nível é mais elevado, caso aparecesse com uma simples camisa, certamente nenhum subalterno lhe obedeceria, e ele pareceria um falhado."},"res":"Ideia-chave: em cada alternativa, confira se a preposição que acompanha o verbo ou o nome é a exigida pela norma-padrão.\n\nE (correta): o verbo \"obedecer\" é transitivo indireto e pede a preposição \"a\" (obedecer a alguém). O pronome \"lhe\" equivale a \"a ele\", então \"nenhum subalterno lhe obedeceria\" está de acordo com a norma. \"Cujo nível\" também está certo, porque \"cujo\" não vem seguido de artigo.\n\nAs outras alternativas têm erros:\nA: ansiar = ansiar algo ou ansiar por algo, então \"ansiamos dos\" está errado.\nB: renunciar = renunciar a algo (ou renunciar algo), então \"renunciamos do fato\" está errado.\nC: optar por algo e compatível com algo, então \"optaram às\" e \"compatíveis aos\" estão errados.\nD: adepto de algo e preferir algo a algo, então \"adeptos pela\" e \"preferem... do que\" estão errados.\n\nRepare que a pergunta é só sobre regência. A alternativa E muda um pouco o conteúdo do texto (troca \"Ninguém o respeitava\" por \"nenhum subalterno lhe obedeceria\"), mas a preposição está correta.","pq":{"A":"\"Ansiar\" se constrói como \"ansiar algo\" ou \"ansiar por algo\" (ansiamos pelos gabinetes). A preposição \"de\" em \"ansiamos dos\" não é aceita.","B":"\"Renunciar\" pede a preposição \"a\" (renunciar ao terno) ou objeto direto. \"Renunciamos do fato\" usa a preposição errada.","C":"Tem dois erros: \"optar\" pede \"por\" (optaram pelas roupas) e \"compatível\" pede \"com\" (compatíveis com os climas).","D":"Também tem dois erros: \"adepto\" pede \"de\" (adeptos da cultura) e \"preferir\" pede \"a\", sem \"do que\" (preferem as roupas de estilistas àquelas leves).","E":"Correta: \"obedecer\" é transitivo indireto (obedecer a alguém), e \"lhe\" = \"a ele\" cumpre essa exigência."},"dica":"Decore os clássicos da regência: obedecer a, preferir algo a algo (nunca \"do que\"), optar por, renunciar a, compatível com, adepto de.","dif":"média","nota":"","obs":""},{"id":"2023d1-06","n":6,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Variação linguística – ortografia do português europeu x brasileiro","titulo":"Grafia lusitana: \"humidade\" x \"umidade\"","gab":"C","base":"02-06","imgs":[{"src":"img/2023d1/q06_1.webp","w":783,"h":458}],"alt":{"A":"… camisas coloridas e sóbrias de Nelson Mandela.","B":"Mas não abdicamos do fato e da gravata.","C":"Um calor de morrer, humidade no máximo…","D":"… usar fato e gravata, por vezes colete mesmo…","E":"… se não tiverem um casaco escuro…"},"res":"Ideia-chave: o texto é do escritor angolano Pepetela e segue a norma do português europeu, usada em Portugal e em Angola. A pergunta quer uma diferença de grafia, ou seja, de escrita.\n\nNo Brasil, escrevemos \"umidade\", sem h. Em Portugal e em Angola, a forma usual é \"humidade\", com h, como aparece no texto: \"Um calor de morrer, humidade no máximo\". Portanto, a resposta é a C.\n\nO título do livro mostra a mesma norma: \"Crónicas\", com acento agudo, enquanto no Brasil se escreve \"Crônicas\". O texto também tem marcas de vocabulário e de construção típicas do português europeu, como \"fato\" (terno), \"falhado\" (fracassado) e \"a escorrer suor\" (escorrendo suor). Essas, porém, não são diferenças de grafia, e nenhuma delas está destacada nas alternativas.\n\nAs palavras destacadas nas outras alternativas (\"sóbrias\", \"abdicamos\", \"colete\", \"casaco\") são escritas exatamente assim no Brasil.","pq":{"A":"\"Sóbrias\" (discretas) tem a mesma grafia no Brasil, inclusive com o acento agudo. Ela é pouco comum no dia a dia, mas a pergunta é sobre grafia, não sobre frequência de uso.","B":"\"Abdicamos\" (do verbo abdicar = renunciar) tem a mesma grafia no Brasil. É um verbo mais formal, e a pegadinha é confundir \"palavra difícil\" com \"grafia diferente\".","C":"Correta: \"humidade\" é a grafia usada em Portugal e em Angola. No Brasil, escreve-se \"umidade\".","D":"\"Colete\" (peça usada por cima da camisa) é escrita e usada da mesma forma no Brasil. A palavra estranha nesse trecho é \"fato\", mas por diferença de sentido, e ela não está destacada.","E":"\"Casaco\" é uma palavra comum no Brasil, com a mesma grafia. Não há nada de diferente nela."},"dica":"Distinga variação de grafia (humidade/umidade, crónica/crônica) de variação de vocabulário (fato = terno): leia com atenção o que o enunciado pede.","dif":"fácil","nota":"","obs":""},{"id":"2023d1-07","n":7,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Variação linguística – registro informal","titulo":"Registro informal na fala do paciente em charge de Frank & Ernest","gab":"A","base":null,"imgs":[{"src":"img/2023d1/q07_1.webp","w":781,"h":840}],"alt":{"A":"informalidade.","B":"erudição.","C":"desrespeito.","D":"reverência.","E":"mau humor."},"res":"Ideia-chave: observe o registro, ou seja, o \"jeito de falar\" que o paciente usa numa situação que normalmente pede alguma formalidade: a consulta médica.\n\n1) O vocabulário é coloquial. O verbo “CUTUCOU” (de cutucar) é típico da fala do dia a dia. Numa linguagem formal, seria algo como \"examinou\" ou \"tocou\".\n2) O paciente fala com o médico de forma direta, com o imperativo “DIGA”, sem formas de tratamento como \"doutor\" ou \"o senhor\".\n3) A pergunta “ESTOU MADURO?” é uma piada. O médico examina o paciente com o martelinho de reflexos, e o paciente compara esse exame ao gesto de cutucar uma fruta para ver se ela já está madura. Ele se coloca no lugar da fruta e encara a consulta com humor.\n\nEsse tom descontraído, brincalhão e coloquial quebra a seriedade esperada numa consulta. É isso que caracteriza a informalidade. Resposta: A.","pq":{"A":"Correta. O paciente usa o coloquial “CUTUCOU”, fala direto com o imperativo “DIGA”, sem \"doutor\" ou \"o senhor\", e faz uma piada se comparando a uma fruta. É um tom descontraído numa situação que pede seriedade.","B":"Erudição seria usar vocabulário raro, construções rebuscadas ou referências cultas. A fala só tem palavras simples do cotidiano, como “CUTUCOU” e “MADURO”.","C":"A brincadeira não ofende o médico: não há insulto nem agressividade. Ser informal não é o mesmo que desrespeitar. A fala é bem-humorada, não ofensiva.","D":"Reverência pediria tratamento cerimonioso (\"doutor\", \"o senhor\", \"por favor\"), e nada disso aparece. O tom é o oposto: familiar e brincalhão.","E":"O começo, “AGORA QUE JÁ ME CUTUCOU, BASTANTE”, até sugere um pouco de impaciência. Mas o fecho “ESTOU MADURO?” é uma piada, e quem faz graça da situação mostra bom humor, não mau humor. Não há reclamação nem irritação explícitas."},"dica":"Para identificar o registro de uma fala, observe o vocabulário (palavras do dia a dia ou rebuscadas), as formas de tratamento e o tom (brincadeira ou cerimônia) em relação à situação.","dif":"fácil","nota":"","obs":""},{"id":"2023d1-08","n":8,"area":"Linguagens","disc":"Literatura","assunto":"Literatura indígena – tradição oral","titulo":"Tradição oral em conto Karajá de Daniel Munduruku","gab":"D","base":"08-10","imgs":[{"src":"img/2023d1/q08_1.webp","w":783,"h":868}],"alt":{"A":"a superstição exagerada, desmotivando a vida coletiva, sugestionada no primeiro parágrafo: “o fato de sentirem muito medo” e “os perigos eram muitos e grandes”.","B":"o dinamismo do herói para cuidar de todos, constatado no primeiro e quinto parágrafos: “os Karajá precisavam manter um pequeno braseiro aceso” e “preferia ficar ali”.","C":"a insubordinação dos mais jovens em relação aos mais velhos, flagrada no segundo e quarto parágrafo: “sempre ouvia o velho homem lhe dizer” e “um dia eu vou”.","D":"o forte apelo à tradição oral, reiterado pelas formas que iniciam o primeiro e o segundo parágrafo: “Contam os velhos sábios Karajá” e “Nesta época, dizem os velhos”.","E":"o empoderamento feminino, com a mulher decidindo tudo, evidenciado no segundo e último parágrafo: “morava na casa do pai de sua esposa” e “deixando a tarefa para sua esposa”."},"res":"Ideia-chave: a pergunta é o que o texto destaca sobre a herança cultural indígena, e a pista está na forma como a história é apresentada.\n\nO conto começa com “Contam os velhos sábios Karajá que, no início dos tempos...”, e o segundo parágrafo retoma: “Nesta época, dizem os velhos...”. Os verbos “contam” e “dizem” mostram que o narrador não inventou a história. Ela foi passada de boca em boca pelos mais velhos, que guardam a memória do povo.\n\nEssa transmissão oral, de geração em geração, é um traço central da cultura indígena. É assim que se preservam narrativas como esta, que fala de um tempo em que “não havia sol, lua ou estrelas”. A mesma fórmula abre dois parágrafos seguidos, e essa repetição reforça (\"reitera\") o apelo à tradição oral.\n\nAs outras alternativas citam trechos que existem no texto, mas atribuem a eles sentidos que o texto não sustenta. Resposta: D.","pq":{"A":"O próprio texto justifica o medo: ficar fora de casa era arriscado “pois os perigos eram muitos e grandes”. É uma reação compreensível, não uma \"superstição exagerada\", e o texto não fala em vida coletiva desmotivada: o medo é só parte do cenário do mito.","B":"Os trechos mostram o contrário de dinamismo. “Preferia ficar ali” revela a preguiça do herói, que nem lenha queria buscar. E “os Karajá precisavam manter um pequeno braseiro aceso” fala de todo o povo, não de uma ação do herói.","C":"Não há insubordinação: o genro responde com respeito, “Tá bom meu sogro”, e só adia a tarefa por preguiça. O texto não opõe jovens e velhos. Pelo contrário, apresenta os velhos como sábios que transmitem a história.","D":"Correta. As fórmulas “Contam os velhos sábios Karajá” e “Nesta época, dizem os velhos” mostram que a narrativa vem da tradição oral dos anciãos, e a repetição no início de dois parágrafos reforça isso.","E":"“Morava na casa do pai de sua esposa” descreve um costume do povo (o genro morar com a família da esposa), não o poder de decisão da mulher. E “deixando a tarefa para sua esposa” mostra a mulher recebendo o trabalho que o marido evita. Nada indica que ela \"decide tudo\"."},"dica":"Expressões como \"contam os velhos\", \"dizem os antigos\" ou \"reza a lenda\" marcam a tradição oral, traço central dos mitos e das narrativas indígenas.","dif":"fácil","nota":"","obs":""},{"id":"2023d1-09","n":9,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Coesão referencial (anáfora)","titulo":"Referentes de “lá” e “Nesta época” no conto Karajá","gab":"D","base":"08-10","imgs":[{"src":"img/2023d1/q09_1.webp","w":783,"h":549}],"alt":{"A":"à casa; ao tempo de preguiça.","B":"à Terra; à aldeia dos Karajá.","C":"à casa do herói; à noite escura.","D":"à mata; ao início dos tempos.","E":"à claridade; ao escuro e ao frio."},"res":"Ideia-chave: “lá” e “Nesta época” são elementos de coesão que retomam algo já dito. Para achar o referente, volte no texto e teste a substituição.\n\n1) “lá”: logo antes, o texto diz que manter o braseiro “exigia que os homens saíssem para a mata atrás de lenha”. Em seguida vem “todo mundo sentia uma grande indisposição para ir até lá”. O lugar aonde ninguém queria ir é a mata. Faça o teste: \"ir até a mata\" faz todo sentido. Repare também que o advérbio “lá” indica um lugar afastado, fora da casa onde eles estavam.\n\n2) “Nesta época”: o 1º parágrafo situa a história “no início dos tempos”, quando “a Terra era um lugar muito escuro, muito frio”. O 2º parágrafo retoma esse mesmo momento com “Nesta época”, uma expressão de tempo que aponta para “o início dos tempos”.\n\nPortanto, os referentes são a mata e o início dos tempos. Resposta: D.","pq":{"A":"A casa é onde eles já estavam e queriam ficar (o braseiro ficava “dentro de casa”); “lá” aponta para o lugar aonde teriam de ir, a mata. E \"tempo de preguiça\" descreve o que acontecia naquela época (“a preguiça tomava conta de todo mundo”), não o momento que a expressão retoma, que é “o início dos tempos”.","B":"\"Terra\" é amplo demais: eles já estão na Terra, e o destino da ida era a mata. Já \"aldeia dos Karajá\" é um lugar, enquanto “Nesta época” é uma expressão de tempo.","C":"Ninguém resistia a ir até a casa, que era onde todos queriam ficar. E \"noite escura\" só aparece no último parágrafo (“a noite escura e fria da mata”), depois de “Nesta época”, por isso não pode ser o que a expressão retoma.","D":"Correta. “Lá” retoma “a mata”, para onde os homens precisavam ir buscar lenha, e “Nesta época” retoma “no início dos tempos”, momento em que a história se passa.","E":"A claridade era o que faltava, não um lugar aonde se pudesse ir. E \"o escuro e o frio\" são características daquela época, não a época em si: “Nesta época” retoma o momento, “o início dos tempos”."},"dica":"Para achar o referente de palavras como \"lá\", \"aí\" ou \"nesta época\", volte ao trecho anterior e troque a palavra pelo candidato: só o referente certo mantém o sentido.","dif":"fácil","nota":"","obs":""},{"id":"2023d1-10","n":10,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Tempos verbais – pretérito imperfeito do indicativo","titulo":"Valor do pretérito imperfeito em “exigia” no conto Karajá","gab":"E","base":"08-10","imgs":[{"src":"img/2023d1/q10_1.webp","w":783,"h":475}],"alt":{"A":"ação futura em relação ao tempo passado.","B":"ação anterior a outra no tempo passado.","C":"ação concluída no tempo passado.","D":"ação hipotética no tempo passado.","E":"ação contínua no tempo passado."},"res":"Ideia-chave: identifique o tempo verbal. “Exigia” está no pretérito imperfeito do indicativo (ele exigia).\n\nO imperfeito apresenta uma ação passada sem começo e fim marcados: algo que estava em curso, se prolongava ou se repetia como hábito. No trecho “Mas isso era muito trabalhoso, pois exigia que os homens saíssem para a mata atrás de lenha”, manter o braseiro aceso cobrava esse esforço o tempo todo, durante toda aquela época. É uma situação que durava e se repetia, não um fato isolado e encerrado.\n\nCompare com outras formas do mesmo verbo:\n\"exigiu\" (pretérito perfeito) → ação concluída;\n\"exigira\" ou \"tinha exigido\" (mais-que-perfeito) → ação anterior a outra no passado;\n\"exigiria\" (futuro do pretérito) → ação futura em relação ao passado, ou hipotética.\n\nO 1º parágrafo inteiro usa o imperfeito para descrever o cenário (“era”, “havia”, “precisavam”, “sentia”), que é o uso típico desse tempo para estados e hábitos do passado. Resposta: E.","pq":{"A":"Uma ação futura em relação ao passado é expressa pelo futuro do pretérito (\"exigiria\"), não pelo imperfeito “exigia”.","B":"A ação anterior a outra no passado é papel do mais-que-perfeito (\"exigira\" ou \"tinha exigido\"). “Exigia” acontece ao mesmo tempo que a situação descrita (“era muito trabalhoso”).","C":"A ação concluída e pontual é expressa pelo pretérito perfeito (\"exigiu\"). O imperfeito justamente não marca o término da ação.","D":"A hipótese no passado se expressa com o futuro do pretérito (\"exigiria\") ou com o subjuntivo (\"se exigisse\"). “Exigia” afirma um fato real, que de fato acontecia. Cuidado para não confundir com “saíssem”, que está no subjuntivo mas não é a forma destacada.","E":"Correta. O pretérito imperfeito “exigia” indica uma ação que se prolongava ou se repetia no passado, como um estado de coisas permanente naquela época."},"dica":"Imperfeito (-ava, -ia) = passado em andamento ou habitual; perfeito (-ou, -eu, -iu) = passado concluído; mais-que-perfeito (-ara, -era, -ira) = anterior a outro passado; futuro do pretérito (-ria) = futuro do passado ou hipótese.","dif":"média","nota":"","obs":""},{"id":"2023d1-11","n":11,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Intertextualidade e gêneros textuais","titulo":"Intertextualidade com o gênero ata em tira de Calvin e Haroldo","gab":"B","base":"11-12","imgs":[{"src":"img/2023d1/q11_1.webp","w":783,"h":643}],"alt":{"A":"uma apropriação de texto oral, pois seleciona termos próprios dessa modalidade de discurso.","B":"um diálogo intertextual com o texto de uma ata, por imitação de sua linguagem e elementos constituintes.","C":"uma crítica implícita à linguagem das tirinhas, cuja simplicidade afasta vocabulário de prestígio.","D":"uma representação de escolhas linguísticas típicas do formalismo dos diálogos de personagens de quadrinhos.","E":"um diálogo formatado como paráfrase explicativa de textos jornalísticos de humor, caso das tirinhas."},"res":"Ideia-chave: há intertextualidade quando um texto dialoga com outro texto ou gênero, seja citando, parodiando ou imitando.\n\nNo 1º quadrinho, Calvin anuncia que Haroldo “LERÁ A ATA DA REUNIÃO PASSADA”. O que Haroldo lê, entre aspas, copia a forma de uma ata, o documento que registra o que aconteceu numa reunião:\n1) registro cronológico com horários: “9:30”, “9:35”, “9:36”, “9:37”, “10:15”, “10:16”;\n2) vocabulário técnico de assembleias: “QUESTÃO DE ORDEM”, “PROPÕE UMA MOÇÃO”, “SE ABSTÉM DO VOTO”, “A MOÇÃO É DERROTADA”;\n3) linguagem formal e impessoal, em 3ª pessoa e com voz passiva: “É ADVERTIDO”, “SÃO CONCEDIDAS AOS MEMBROS”.\nAté a abertura de Calvin imita o ritual de uma sessão: “DECLARO ABERTA A SESSÃO”.\n\nO humor vem do contraste entre essa linguagem solene e o conteúdo infantil: um clube contra meninas, mordidas e curativos. A tira, portanto, dialoga com a ata imitando sua linguagem e seus elementos. Resposta: B.","pq":{"A":"O texto lido é escrito (uma ata), com termos formais e técnicos como “MOÇÃO”, “QUESTÃO DE ORDEM” e “SE ABSTÉM DO VOTO”, que não são marcas da oralidade espontânea. Ser lido em voz alta não o transforma em texto oral.","B":"Correta. Os horários, o vocabulário de assembleia (“MOÇÃO”, “QUESTÃO DE ORDEM”, “SE ABSTÉM DO VOTO”) e o registro formal e impessoal imitam uma ata, anunciada já no 1º quadrinho.","C":"A tira não critica a linguagem das tirinhas. Ao contrário, usa vocabulário de prestígio (“MOÇÃO”, “ABSTÉM”, “ADVERTIDO”), o que desmente a ideia de que sua simplicidade afasta essas palavras.","D":"Diálogos de quadrinhos costumam ser informais. O formalismo aqui não é típico do gênero: foi emprestado da ata justamente para criar humor pelo contraste com as crianças.","E":"A tira não reexplica com outras palavras (paráfrase) nenhum texto jornalístico. O gênero imitado é a ata de reunião, não uma notícia ou um texto de humor de jornal."},"dica":"Quando uma tira copia a estrutura, o vocabulário e o tom de outro gênero (ata, notícia, receita, bula), pense em intertextualidade por imitação ou paródia.","dif":"fácil","nota":"","obs":""},{"id":"2023d1-12","n":12,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Inferência e implícitos em tirinha","titulo":"O que se infere entre “Discussão filosófica” e “curativos” em Calvin","gab":"C","base":"11-12","imgs":[{"src":"img/2023d1/q12_1.webp","w":783,"h":712}],"alt":{"A":"está implícita a ideia de que as discussões tomaram muito tempo e levaram a gestos de conciliação.","B":"está implícita a ideia de que temas filosóficos desencadearam animosidade, mas ao final houve consenso.","C":"está implícita a ideia de que houve longa discussão acalorada e quebra de protocolo, seguida de sanção.","D":"está explícita a ideia de que o tema das discussões não cabia no contexto do clube HOMEN.","E":"está explícita a ideia de que a harmonização de pontos de vista demandava mais tempo de discussão."},"res":"Ideia-chave: o humor está no que a ata não diz com todas as letras. Você precisa deduzir o que aconteceu a partir dos horários e do item seguinte.\n\nNo 3º quadrinho:\n“9:37 - DISCUSSÃO FILOSÓFICA.”\n“10:15 - APLICAÇÃO DE CURATIVOS. O DITADOR-VITALÍCIO, CALVIN, É ADVERTIDO POR MORDER.”\n\nO que se deduz:\n1) A discussão foi longa: de 9:37 a 10:15 são 38 minutos, enquanto os itens anteriores (9:30, 9:35, 9:36, 9:37) ficavam a poucos minutos um do outro.\n2) Foi acalorada: se depois foi preciso aplicar curativos, a discussão virou briga física.\n3) Houve quebra de protocolo: morder alguém rompe completamente as regras de uma sessão formal.\n4) Veio uma sanção: Calvin “É ADVERTIDO POR MORDER”, ou seja, é punido.\n\nNada disso está escrito de forma direta (a ata não diz \"houve uma briga\"), por isso a ideia é implícita. Resposta: C.","pq":{"A":"O \"muito tempo\" até se confirma (38 minutos). Mas o item seguinte traz curativos e mordida, ou seja, conflito, e não gestos de conciliação.","B":"A animosidade existiu, mas não houve consenso: o resultado foi briga e advertência. E o item das 10:16, “FOI ESQUECIDA A RAZÃO DO DEBATE”, mostra que o motivo foi esquecido, não que se chegou a um acordo.","C":"Correta. O intervalo de 38 minutos indica uma discussão longa, os curativos indicam briga, a mordida é a quebra de protocolo e a advertência é a sanção. Tudo isso fica implícito, sem ser dito diretamente.","D":"Nada no texto diz, nem explícita nem implicitamente, que o tema não cabia no clube HOMEN (sigla de “Heróis que Odeiam Meninas ENjoadas”). A ata só registra “DISCUSSÃO FILOSÓFICA”, sem avaliar se o assunto era pertinente.","E":"Não há nada explícito sobre harmonizar pontos de vista ou sobre precisar de mais tempo. A discussão terminou em agressão e punição, o oposto de harmonização."},"dica":"Em tiras e charges, o humor costuma estar no não dito: cruze dados (como horários) com as consequências para inferir o que aconteceu, e desconfie de alternativas que chamam de \"explícito\" algo que você só consegue deduzir.","dif":"média","nota":"","obs":""},{"id":"2023d1-13","n":13,"area":"Linguagens","disc":"Literatura","assunto":"Figuras de linguagem – metonímia","titulo":"Metonímia em “O capital”, no conto A sociedade, de Alcântara Machado","gab":"A","base":null,"imgs":[{"src":"img/2023d1/q13_1.webp","w":781,"h":1237},{"src":"img/2023d1/q13_2.webp","w":782,"h":1163}],"alt":{"A":"por meio de uma metonímia, ressaltar como se caracteriza a situação envolvendo as personagens no âmbito social, numa negociação que revela novas relações de poder, nas quais o dinheiro se sobrepõe ao prestígio.","B":"por meio de um eufemismo, relativizar a recepção hostil a Salvatore Melli pelo Conselheiro, visto que se sugere que este perdeu seu poder aquisitivo e passou a fazer negociações com o milionário estrangeiro.","C":"por meio de uma metáfora, expor a ruptura de convenções sociais arraigadas na cultura brasileira, questionando valores e pondo em xeque possibilidades de ascensão social pelo dinheiro.","D":"por meio de uma antítese, caracterizar a distância de comunicação que separa as personagens, evidenciada na atribuição de traços contrastantes da linguagem e da postura reticente de uma delas na negociação.","E":"por meio de um paradoxo, escancarar as contradições que marcaram a abordagem de Salvatore Melli ao Conselheiro, contradições essas relacionadas à tentativa de impor ao Conselheiro um negócio suspeito."},"res":"Ideia-chave: chamar Salvatore Melli de “O capital” é trocar a pessoa por aquilo que ela possui e representa, o dinheiro. Essa troca se apoia numa relação real de proximidade (quem possui ↔ o que é possuído), por isso é uma **metonímia**, e não uma metáfora. Não há comparação por semelhança: Melli é, de fato, quem tem o capital, como ele mesmo diz: “Mas io tenho o capital. O capital sono io.”\n\nO efeito de sentido aparece no contraste entre os dois personagens. O Conselheiro José Bonifácio de Matos e Arruda tem nome pomposo, título e terras herdadas, mas elas “Não lhe davam renda alguma”, e ele mesmo admite: “Mas sem capital o senhor compreende é impossível...”. O imigrante, por sua vez, tem “1.200 teares. 36.000 fusos.”\n\nQuando o narrador escreve “O capital acendeu um charuto” e logo depois “O conselheiro coçou os joelhos disfarçando a emoção”, reduz Melli ao seu poder econômico e mostra o aristocrata ansioso diante dele. É a nova relação de poder na São Paulo que se industrializa: o dinheiro do imigrante pesa mais que o prestígio do título. Alternativa A.","pq":{"A":"Correta. “O capital” substitui a pessoa por aquilo que ela possui (metonímia) e mostra que, na negociação, o dinheiro do industrial imigrante vale mais que o título e o sobrenome do aristocrata.","B":"Eufemismo serve para suavizar algo desagradável, e “O capital” não suaviza nada. Além disso, não há recepção hostil: o Conselheiro está interessado no negócio, tanto que “coçou os joelhos disfarçando a emoção”.","C":"Não é metáfora, porque a troca não se baseia em semelhança, e sim numa posse real (“io tenho o capital”). E o texto não põe em xeque a ascensão pelo dinheiro: mostra justamente o dinheiro se impondo.","D":"Antítese exige termos de sentido oposto lado a lado, o que não acontece em “O capital acendeu um charuto”. A mistura de italiano e português também não cria distância de comunicação: os dois se entendem e negociam normalmente.","E":"Paradoxo seria uma afirmação logicamente contraditória, e isso não existe no trecho. O negócio também não é apresentado como suspeito: é descrito como “Lucro certo, mais que certo, garantidíssimo”."},"dica":"Se a troca de nomes se apoia numa relação real (possuidor/possuído, autor/obra, parte/todo), é metonímia; se se apoia em semelhança, é metáfora.","dif":"média","nota":"","obs":""},{"id":"2023d1-14","n":14,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Interpretação de texto – argumentação","titulo":"Foco do artigo sobre os incêndios florestais no Canadá","gab":"D","base":"14-16","imgs":[{"src":"img/2023d1/q14_1.webp","w":783,"h":1130}],"alt":{"A":"na consistência das manifestações que explicam essa crise, já que elas recorrem a raciocínios baseados em causalidade para interpretação dos fatos e apresentação das conclusões, evitando se deixar influenciar por opiniões externas.","B":"na constatação de que a análise da questão é bastante complexa, razão pela qual se justifica a divergência de opiniões dos veículos de comunicação, cujo ponto de contato é a preocupação com expor a verdade.","C":"nas incoerências que podem ser constatadas nos argumentos apresentados pelos especialistas que se manifestaram sobre o assunto, sendo a principal delas a atribuição da responsabilidade pelos incêndios ao fator humano local.","D":"no cotejo de abordagens acerca do assunto, com exposição da fragilidade dos argumentos nelas apresentados, nos quais se identificam pontos de vista desvinculados das evidências de fatos e dados.","E":"no contexto social em que se deram os fatos, o que explicaria a hesitação da mídia em fazer declarações assertivas sobre razões e consequências dos incêndios, já que inexistem dados históricos que sustentem opiniões."},"res":"Ideia-chave: o autor junta o que foi dito sobre os incêndios (mídia, comentários, especialistas) e mostra, uma por uma, por que essas explicações são frágeis.\n\nVeja a comparação que ele faz:\n1) Há comentários dizendo que a situação é nova: “nunca as florestas do Canadá incendiaram antes”. O autor rebate com dados: “há séculos as florestas canadenses sofrem incêndios” e, de 1983 a 2022, “a média anual de incêndios foi de 7.102”.\n2) Um especialista culpa o “ponto de não retorno do aquecimento planetário”. O autor critica que, nos artigos, os incêndios “servem apenas para comprovar os efeitos das mudanças climáticas”, ou seja, viram ilustração de uma tese pronta.\n3) Outro especialista diz que, “Indiretamente, o desmatamento da Amazônia” é o responsável. O autor chama isso de “surrealista” e contrapõe o que os próprios canadenses apontam: “O fator humano local”.\n\nPortanto, o texto compara abordagens e mostra que elas se apoiam em pontos de vista sem base em fatos e dados. É o que diz a alternativa D.","pq":{"A":"É o contrário: o autor não elogia a consistência das explicações, ele as desmonta. Chama uma delas de “surrealista” e desmente outra com a média histórica de incêndios.","B":"O texto não justifica uma divergência de opiniões da mídia; ele denuncia o “apagão midiático” e o “silêncio midiático quase absoluto”. Também não diz que a mídia se preocupa em expor a verdade.","C":"O fator humano local não é uma incoerência apontada pelo autor: é a explicação que ele aceita, apoiada nos próprios canadenses. As incoerências que ele critica são a ideia de “situação nova” e a culpa atribuída à Amazônia.","D":"Correta. O autor confronta as abordagens (comentários, especialistas, mídia) e mostra que elas ignoram fatos e dados, como a média de 7.102 incêndios por ano.","E":"O texto não fala em contexto social nem em “hesitação” da mídia, e sim em silêncio. E é falso que não existam dados históricos: o autor cita a média anual de incêndios de 1983 a 2022."},"dica":"Em texto argumentativo, separe quem diz o quê e veja como o autor reage: se ele rebate com dados e ironia (“surrealista”), o foco está na fragilidade das posições alheias.","dif":"média","nota":"","obs":""},{"id":"2023d1-15","n":15,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Coesão – relação de concessão","titulo":"Valor concessivo de “apesar de seus impactos hemisféricos cada vez maiores”","gab":"B","base":"14-16","imgs":[{"src":"img/2023d1/q15_1.webp","w":781,"h":1048}],"alt":{"A":"manifestação de uma circunstância que se toma como premissa para uma intervenção efetivada no âmbito de interesses restritos.","B":"expressão de um argumento que consistiria em fato suficiente para desencadear uma ação, mas que é representado como irrelevante para certos grupos.","C":"ratificação de ideias veiculadas por grupos formadores de opinião, destacando a relevância do assunto para tomada de decisões urgentes.","D":"condição indispensável para que sua difusão por grupos formadores de opinião seja refutada, à vista da parcialidade da mídia.","E":"exposição de um contraponto à tese segundo a qual grupos específicos se omitiram de opinar, em razão da desimportância do fato apontado."},"res":"Ideia-chave: “apesar de” introduz uma **concessão**, isto é, um fato que deveria levar a certo resultado, mas não leva.\n\nO fato apresentado é que a crise canadense tem “impactos hemisféricos cada vez maiores”. Só isso já seria motivo suficiente para mídia, artistas, ONGs e políticos se manifestarem. A oração principal, porém, mostra o oposto: “segue o apagão midiático, de artistas, ONGS e políticos”. As frases seguintes reforçam a ironia: “Como se ninguém tivesse nada a dizer. Imagine se fosse no Brasil.”\n\nPortanto, o trecho destacado é um argumento que bastaria para provocar uma ação (falar, cobrar, se mobilizar), mas esses grupos tratam o fato como irrelevante, já que ficam calados. É o que afirma a alternativa B.\n\nPara conferir, reescreva: “Embora a crise tenha impactos cada vez maiores, a mídia, os artistas, as ONGs e os políticos se calam.” A expectativa quebrada fica evidente.","pq":{"A":"Nenhuma intervenção foi feita: o texto fala justamente em “apagão” e silêncio. A circunstância não serve de premissa para uma ação realizada.","B":"Correta. A concessiva apresenta um fato forte o bastante para provocar reação (impactos cada vez maiores), mas os grupos citados agem como se ele não tivesse importância.","C":"Não há ideias dos formadores de opinião para confirmar, porque eles não disseram nada: “Como se ninguém tivesse nada a dizer”.","D":"Não existe difusão a ser refutada, pois os grupos ficaram calados. Além disso, “apesar de” não expressa condição (como “se” ou “caso”), e sim um fato que não impede o outro.","E":"Ninguém no texto defende que o fato é desimportante; quem afirma a omissão é o próprio autor. O trecho não contesta o silêncio: mostra que ele acontece mesmo diante de um fato grave."},"dica":"Conectivos concessivos (apesar de, embora, mesmo que) trazem um argumento que deveria impedir o fato principal, mas não impede: procure a expectativa quebrada.","dif":"média","nota":"","obs":""},{"id":"2023d1-16","n":16,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Sintaxe do período – orações subordinadas substantivas","titulo":"Orações subordinadas em “vaticinou” e “É surrealista”","gab":"E","base":"14-16","imgs":[{"src":"img/2023d1/q16_1.webp","w":783,"h":1236}],"alt":{"A":"pelo processo de subordinação, apesar de as sequências terem sentido próprio, o que afasta a dependência de outras partes do fragmento.","B":"pelo processo de coordenação, considerando-se que existe dependência semântica, mas não há vínculo sintático com os trechos destacados.","C":"pelo processo de subordinação, pois ambas as sequências vinculam-se pelo sentido aos trechos destacados, mas não dependem sintaticamente deles.","D":"pelos processos de coordenação e subordinação: a sequência, na primeira passagem, tem sentido independente; na segunda, dependente.","E":"pelo processo de subordinação, pois as sequências integram o conjunto sintático-semântico, dando completude aos enunciados."},"res":"Ideia-chave: há subordinação quando uma oração exerce uma função sintática (sujeito, objeto etc.) dentro de outra; sem ela, a outra fica incompleta.\n\n1) “Um certo especialista vaticinou”: vaticinar (prever, profetizar) é verbo transitivo direto, porque quem vaticina, vaticina algo. O que ele vaticinou? A fala entre aspas: “Indiretamente, o desmatamento da Amazônia é responsável pelo que está acontecendo no Canadá”. Essa sequência funciona como objeto direto de “vaticinou” e completa seu sentido.\n\n2) “É surrealista”: o que é surrealista? “afirmar que há uma troca inter-hemisférica ‘indireta’ de calor e umidade entre o sul da Amazônia e o Canadá”. Essa sequência é o sujeito de “é surrealista” (oração subordinada substantiva subjetiva reduzida de infinitivo).\n\nNos dois casos, o trecho destacado sozinho fica incompleto (vaticinou o quê? é surrealista o quê?), e a sequência completa o enunciado tanto na sintaxe quanto no sentido. Por isso, alternativa E.","pq":{"A":"A alternativa se contradiz: subordinação é justamente dependência, e ela diz que a dependência está afastada. Mesmo que a fala entre aspas faça sentido sozinha, no fragmento ela é o objeto direto de “vaticinou”, e “afirmar que há uma troca...” é o sujeito de “é surrealista”.","B":"Não é coordenação: há vínculo sintático claro, já que uma sequência é objeto direto e a outra é sujeito em relação aos trechos destacados.","C":"Também se contradiz: subordinar é depender sintaticamente. E a dependência sintática existe, sim: uma sequência é objeto direto de “vaticinou” e a outra é sujeito de “é surrealista”.","D":"Os dois-pontos e as aspas enganam, mas não há coordenação na primeira passagem: a fala citada é o complemento (objeto direto) de “vaticinou”, e não uma oração independente posta ao lado da outra.","E":"Correta. As sequências exercem funções sintáticas (objeto direto de “vaticinou” e sujeito de “é surrealista”) e completam o sentido dos trechos destacados."},"dica":"Faça a pergunta “o quê?”: se a sequência responde e completa um verbo ou expressão da outra oração, a relação é de subordinação substantiva.","dif":"difícil","nota":"","obs":""},{"id":"2023d1-17","n":17,"area":"Linguagens","disc":"Literatura","assunto":"Romantismo brasileiro – gerações da poesia","titulo":"Romantismo: poesia nacionalista e ultrarromântica segundo Alfredo Bosi","gab":"A","base":null,"imgs":[{"src":"img/2023d1/q17_1.webp","w":781,"h":1841}],"alt":{"A":"(I) No meio das tabas de amenos verdores, / Cercado de troncos – cobertos e flores, / Alteiam-se os tetos d’altiva nação.\n(II) Adeus, meus sonhos, eu pranteio e morro! / Não levo da existência uma saudade! / E a tanta vida que meu peito enchia / Morreu na minha triste mocidade!","B":"(I) Mas que vejo eu aí... Que quadro d’amarguras! / É canto funeral! ... Que tétricas figuras! ... / Que cena infame e vil... Meu Deus! Meu Deus! Que horror!\n(II) Quem são esses desgraçados / Que não encontram em vós / Mais que o rir calmo da turba / Que excita a fúria do algoz?","C":"(I) Pálida, à luz da lâmpada sombria / Sobre o leito de flores reclinada, / Como a lua por noite embalsamada, / Entre as nuvens do amor ela dormia!\n(II) Deus! ó Deus! onde estás que não respondes? / Em que mundo, em que estrelas tu te escondes / Embuçado nos céus?","D":"(I) Que me resta, meu Deus? Aos meus suspiros / Nem geme a viração. / E dentro – no deserto do meu peito / Não dorme o coração!\n(II) Valente na guerra / Quem há, como eu sou? / Quem vibra o tacape / Com mais valentia?","E":"(I) Encontre a bela, caprichosa sempre, / Nos ternos hinos d’infantil frescor / Entrelaçados na grinalda amiga / Doces perfumes e celeste amor.\n(II) Não mais te embalarei sobre os joelhos / Nem de teus olhos no cerúleo brilho / Acharei um consolo a meus tormentos."},"res":"Ideia-chave: Bosi está falando do século XIX. A “década de 40” são os anos 1840, quando amadurece a “tradição literária nacionalista”, ou seja, a 1ª geração romântica, com o indianismo de Gonçalves Dias. Os “anos que se lhe seguiram” trazem o “extremo subjetivismo” dos poetas mortos jovens (2ª geração, ultrarromântica ou do “mal do século”), com temas de “amor e morte, dúvida e ironia, entusiasmo e tédio”.\n\nNa alternativa A:\n(I) “No meio das tabas de amenos verdores, / Cercado de troncos – cobertos e flores, / Alteiam-se os tetos d’altiva nação.” é a abertura de “I-Juca-Pirama”, de Gonçalves Dias. Aldeia indígena (“tabas”), natureza exuberante e povo orgulhoso (“altiva nação”): nacionalismo indianista.\n(II) “Adeus, meus sonhos, eu pranteio e morro! / Não levo da existência uma saudade!” é de Álvares de Azevedo, um dos poetas que morreram muito jovens. Choro, morte e “triste mocidade”: subjetivismo ultrarromântico puro.\n\nA ordem (I) nacionalista e (II) subjetivista corresponde exatamente ao texto de Bosi.","pq":{"A":"Correta. (I) é o indianismo de Gonçalves Dias, marca da tradição nacionalista; (II) é o lamento de morte e juventude perdida de Álvares de Azevedo, típico do subjetivismo ultrarromântico.","B":"Os dois trechos são poesia social e abolicionista (“O navio negreiro”, de Castro Alves), da geração condoreira. Não há indianismo em (I), e o tom de denúncia coletiva não é o “extremo subjetivismo” pedido em (II).","C":"(I) é lírica amorosa ultrarromântica (Álvares de Azevedo), e não nacionalista; (II) é o clamor de “Vozes d’África”, de Castro Alves, poesia social. A sequência pedida não aparece.","D":"A ordem está invertida: o texto nacionalista está em (II), o canto do guerreiro indígena de “I-Juca-Pirama” (“Quem vibra o tacape / Com mais valentia?”), enquanto (I) é um lamento íntimo (“no deserto do meu peito”), típico do subjetivismo dos anos seguintes.","E":"(I) é lirismo amoroso delicado, sem nenhum traço nacionalista ou indígena. (II), um lamento íntimo de dor e perda, até combina com o subjetivismo dos anos seguintes, mas falta o texto nacionalista que deveria estar em (I)."},"dica":"Poesia romântica: 1ª geração = nacionalismo e indianismo (Gonçalves Dias); 2ª = ultrarromantismo, amor e morte (Álvares de Azevedo); 3ª = condoreira, social (Castro Alves). E atenção: “década de 40” aqui é 1840, não 1940.","dif":"média","nota":"","obs":""},{"id":"2023d1-18","n":18,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Formação de palavras – derivação sufixal e tipos de frase","titulo":"Neologismos com sufixos em “São Marcos”, de Guimarães Rosa","gab":"D","base":null,"imgs":[{"src":"img/2023d1/q18_1.webp","w":783,"h":1199}],"alt":{"A":"criação de palavras por meio de prefixos e pelo emprego de frase declarativa.","B":"retomada de palavras em desuso e pelo emprego de frase exclamativa.","C":"retomada de palavras da botânica e pelo emprego de frase imperativa.","D":"criação de palavras por meio de sufixos e pelo emprego de frase exclamativa.","E":"criação de palavras de radicais diferentes e pelo emprego de frase declarativa."},"res":"Ideia-chave: Guimarães Rosa inventa palavras (neologismos) usando terminações da própria língua, e a última delas aparece num grito de admiração.\n\nOs destaques:\n“drimirim”: palavra inventada com final de valor diminutivo (lembra “mirim”, pequeno), que transmite delicadeza e carinho.\n“amormeuzinho”: junta “amor meu” e acrescenta o sufixo diminutivo -zinho, uma expressão afetiva diante da beleza do gravatá.\n“colossalidade”: colossal + -idade, sufixo que forma substantivos abstratos. Cria um nome para a qualidade de ser colossal, diante do angelim com “cinquenta metros de tronco e fronde”.\n\nQuanto ao tipo de frase, “Ó colossalidade!” é um vocativo com ponto de exclamação, ou seja, uma frase **exclamativa**. Ela expressa o “ímpeto” de “bradá-lo” (gritá-lo) “na direção da altura”. O próprio narrador anuncia a invenção: “criar um vocativo absurdo”.\n\nLogo, criação de palavras por sufixos + frase exclamativa = alternativa D.","pq":{"A":"Não há prefixos nos destaques: os elementos acrescentados ficam no fim das palavras (o diminutivo de “drimirim”, -zinho, -idade). E “Ó colossalidade!” não é declarativa, é exclamativa.","B":"As palavras não estão em desuso: são invenções do narrador (“criar um vocativo absurdo”). A pegadinha é o começo do trecho, que fala de vocábulo “raramente usado”, mas isso não vale para os destaques.","C":"Os termos de botânica do trecho são “gravatá” e “angelim”, e eles não estão destacados. Também não há frase imperativa (ordem ou pedido): “Ó colossalidade!” é exclamação.","D":"Correta. “drimirim”, “amormeuzinho” e “colossalidade” são neologismos formados com sufixos (diminutivos e -idade), e “Ó colossalidade!” é frase exclamativa.","E":"O recurso comum aos três destaques é o sufixo, não a junção de radicais diferentes (só “amormeuzinho” junta amor + meu). E “Ó colossalidade!” é exclamativa, não declarativa."},"dica":"Em Guimarães Rosa, neologismo é marca registrada: veja se o elemento novo está no começo (prefixo) ou no fim (sufixo) da palavra e confira a pontuação para classificar a frase.","dif":"fácil","nota":"","obs":""},{"id":"2023d1-19","n":19,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Discurso direto e indireto","titulo":"Discurso direto e indireto em O canário e o morcego, de Esopo","gab":"C","base":null,"imgs":[{"src":"img/2023d1/q19_1.webp","w":781,"h":1602}],"alt":{"A":"… perguntou: Durante o dia, porque você cantava e você se cala à noite? O canário respondeu que fora capturado, mas não é por mero capricho, é por causa de seu canto, pois cantava de dia.","B":"perguntou por que durante o dia você se cala e à noite você canta? O canário respondeu que não cantara por mero capricho, que era porque cantava de dia e por isso fora capturado.","C":"… perguntou: Por que durante o dia você se cala e à noite você canta? O canário respondeu que não cantava por mero capricho, e sim porque tinha sido capturado durante o dia, por causa de seu canto.","D":"… perguntou: Por que durante o dia você se calava e à noite você cantava? O canário respondeu que não cantava por mero capricho e sim porque tinha sido capturado durante o dia, por causa de seu canto.","E":"… perguntou porque durante o dia você se cala e à noite você canta? O canário respondeu que: tinha sido capturado então não cantava por capricho porque tinha cantado de dia."},"res":"Ideia-chave: a reescrita inverte os discursos. A pergunta do morcego, que está em discurso indireto, passa para o direto; a resposta do canário, que está em discurso direto, passa para o indireto. Cada troca exige ajustar pontuação, pessoa e tempo verbal, sem mudar o sentido.\n\n1) Pergunta do morcego. Original: \"perguntou por que durante o dia ele se calava e cantava à noite\". No discurso direto, a fala vem depois de dois-pontos, a 3ª pessoa vira 2ª (ele → você) e o pretérito imperfeito volta ao presente, que é o tempo do momento da fala: \"perguntou: Por que durante o dia você se cala e à noite você canta?\". O \"por que\" fica separado porque equivale a \"por qual motivo\".\n\n2) Resposta do canário. Original: \"Não é por mero capricho\". No indireto entra a conjunção \"que\" e o presente recua para o imperfeito: \"respondeu que não cantava por mero capricho\". A explicação \"pois fora capturado de dia, por causa do seu canto\" vira \"e sim porque tinha sido capturado durante o dia, por causa de seu canto\" (\"fora capturado\" = \"tinha sido capturado\").\n\nSó a alternativa C faz as duas transposições corretamente e preserva o sentido da fábula.","pq":{"A":"Inverte os fatos: pergunta por que o canário cantava de dia e se calava à noite, quando é o contrário. Ainda mistura tempos na mesma pergunta (\"cantava\" / \"se cala\"), escreve \"porque\" junto numa pergunta direta (o certo é \"por que\") e, na resposta, \"fora capturado, mas não é por mero capricho\" mistura indireto com direto e o \"mas\" quebra a relação de causa.","B":"Sem dois-pontos, \"perguntou por que\" tem estrutura de discurso indireto, mas a frase segue com \"você\", presente e ponto de interrogação, como se fosse direto: um híbrido inadequado. Na resposta, \"não cantara\" (mais-que-perfeito) não corresponde ao \"Não é\" do original, e a explicação fica embaralhada (\"que era porque cantava de dia e por isso fora capturado\").","C":"Correta: a pergunta do morcego vai para o discurso direto com dois-pontos, \"você\" e verbos no presente (\"se cala\", \"canta\"), e a resposta do canário vai para o indireto com \"que\", imperfeito (\"cantava\") e \"tinha sido capturado\".","D":"A resposta do canário está certa, mas a pergunta em discurso direto manteve o imperfeito do indireto (\"se calava\", \"cantava\"). Na fala direta, o morcego pergunta sobre o que acontece no momento em que fala, então o tempo adequado é o presente: \"se cala\", \"canta\".","E":"Escreve \"porque\" junto numa pergunta (o certo é \"por que\"), não usa dois-pontos antes da fala do morcego, embora mantenha \"você\" e interrogação, e coloca dois-pontos depois de \"que\" (\"respondeu que:\"), misturando direto e indireto. A relação de causa também fica confusa: \"tinha sido capturado então não cantava por capricho porque tinha cantado de dia\"."},"dica":"Do indireto para o direto: entram dois-pontos (ou travessão), \"ele\" vira \"você\" e o imperfeito volta ao presente; do direto para o indireto, entra o \"que\" e o presente recua para o imperfeito.","dif":"média","nota":"","obs":""},{"id":"2023d1-20","n":20,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Concordância e regência","titulo":"Concordância e regência em crônica de Lima Barreto","gab":"C","base":null,"imgs":[{"src":"img/2023d1/q20_1.webp","w":783,"h":1487}],"alt":{"A":"Escreve-se esta no dia seguinte ao do aniversário da proclamação da República. Preferi ficar pelos arredores da casa em que moro do que ir à cidade.","B":"As notícias lidas da morte da princesa Isabel me causou tristeza e, mesmo sem o entusiasmo de panegírico dos jornais, não me omito de dizer que lhe tenho simpatia.","C":"Não se ouviram nem sequer as salvas da pragmática; e, hoje, sequer tive acesso à notícia das festas comemorativas realizadas.","D":"Embora eu não a dedique o entusiasmo de panegírico de jornais, confesso que essa eminente senhora é uma das que mais respeito.","E":"Deixei de ir na cidade e fiquei nos arredores da casa aonde moro, num subúrbio distante. Ali nem sequer as salvas da pragmática pode ser ouvida."},"res":"Ideia-chave: em cada alternativa, confira se o verbo concorda com o sujeito e se verbos e nomes recebem a preposição exigida.\n\nNa alternativa C:\n\"Não se ouviram nem sequer as salvas da pragmática\": é voz passiva sintética (verbo + se). O sujeito é \"as salvas\", no plural, então o verbo também vai para o plural: \"ouviram-se\" = \"foram ouvidas\". Concordância correta.\n\"sequer tive acesso à notícia\": quem tem acesso tem acesso A algo. A preposição \"a\" se junta ao artigo \"a\" de \"a notícia\" e forma \"à\", com crase. Regência correta.\n\"das festas comemorativas realizadas\": o particípio \"realizadas\" concorda com \"festas\" (feminino plural).\n\nAs demais têm pelo menos um desvio: \"Preferi... do que\" (A), \"As notícias... me causou\" (B), \"a dedique\" em vez de \"lhe dedique\" (D) e \"ir na cidade\", \"aonde moro\" e \"as salvas... pode ser ouvida\" (E).","pq":{"A":"A concordância está certa (\"Escreve-se esta\"), mas a regência de \"preferir\" não: quem prefere, prefere uma coisa A outra. O correto seria \"Preferi ficar pelos arredores da casa em que moro a ir à cidade\"; \"preferir... do que\" é uso coloquial.","B":"Erro de concordância: o sujeito \"As notícias lidas\" está no plural, então o verbo deveria ser \"causaram\", e não \"causou\".","C":"Correta: \"Não se ouviram... as salvas\" tem verbo no plural concordando com o sujeito da passiva sintética, e \"acesso à notícia\" usa a preposição \"a\" exigida por \"acesso\", com crase.","D":"Erro de regência: \"dedicar\" pede algo (o entusiasmo) a alguém. Para a pessoa, o pronome correto é o oblíquo \"lhe\", que funciona como objeto indireto: \"Embora eu não lhe dedique o entusiasmo\". O pronome \"a\" só funciona como objeto direto.","E":"Tem três desvios: \"ir na cidade\" (verbo de movimento pede \"a\": \"ir à cidade\"), \"aonde moro\" (\"aonde\" só com verbos de movimento; aqui o certo é \"onde moro\") e \"as salvas... pode ser ouvida\" (sujeito plural pede \"podem ser ouvidas\")."},"dica":"Teste as regências clássicas (preferir algo A algo, ir A um lugar, dedicar algo A alguém = lhe) e, na voz passiva com \"se\", faça o verbo concordar com o sujeito.","dif":"média","nota":"","obs":""},{"id":"2023d1-21","n":21,"area":"Linguagens","disc":"Inglês","assunto":"Interpretação de letra de música em inglês","titulo":"Nostalgia e vida adulta em The Logical Song, do Supertramp","gab":"A","base":"21-22","imgs":[{"src":"img/2023d1/q21_1.webp","w":781,"h":640}],"alt":{"A":"à necessidade de maior racionalidade com a chegada da vida adulta.","B":"à perda de uma vivência adolescente mais naturalista e agradável.","C":"ao desvio da juventude diante do consumismo e da perda de valores.","D":"ao aumento das responsabilidades ainda na infância.","E":"à imposição de um ambiente mais lógico e intelectualizado."},"res":"Ideia-chave: o trecho opõe dois momentos, a juventude vista como mágica e o que veio depois, quando o eu lírico foi ensinado a ser racional.\n\nPrimeiro momento, lembrado com saudade: \"When I was young, it seemed that life was so wonderful / A miracle, oh, it was beautiful, magical\" (Quando eu era jovem, a vida parecia maravilhosa, um milagre, bela, mágica). Até os pássaros cantavam \"so happily\".\n\nA virada: \"But then they sent me away to teach me how to be sensible / Logical, oh, responsible, practical\" (Mas então me mandaram embora para me ensinar a ser sensato, lógico, responsável, prático).\n\nO \"But then\" marca a passagem do tempo: crescer significou trocar a visão encantada do mundo pela exigência de ser lógico, responsável e prático. A tristeza e a nostalgia vêm daí: o eu lírico lamenta ter deixado o encantamento da juventude para atender às exigências de racionalidade da vida adulta. É o que afirma a alternativa A.","pq":{"A":"Correta: o contraste entre \"When I was young\" (vida mágica) e \"But then they sent me away to teach me how to be sensible / Logical\" mostra que a nostalgia vem da exigência de racionalidade que chega com a vida adulta.","B":"\"Naturalista\" não está no texto: a juventude é lembrada como mágica (\"a miracle\", \"magical\"), e os pássaros fazem parte desse encantamento, não de um modo de vida ligado à natureza. Além disso, a alternativa só fala da perda e ignora a causa apontada no trecho, que é a racionalidade ensinada depois do \"But then\".","C":"Consumismo e perda de valores não aparecem no trecho. Pelo contrário, o que se impõe ao eu lírico são valores como responsabilidade e praticidade (\"responsible, practical\").","D":"O texto separa as fases: na juventude a vida era \"wonderful\"; as responsabilidades só chegam depois, marcadas por \"But then\". Não há aumento de responsabilidades ainda na infância.","E":"É a distratora mais próxima, porque \"logical\" e \"intellectual\" aparecem no texto. Mas o foco não é um ambiente imposto, e sim a mudança do próprio eu lírico, ensinado a SER sensato, lógico, responsável e prático à medida que cresce; a alternativa deixa de fora essa passagem da juventude para a vida adulta, que é a origem da nostalgia."},"dica":"Em poema ou letra nostálgica, ache o contraste \"antes x depois\" (aqui marcado por \"But then\") e escolha a alternativa que explica a mudança inteira, inclusive a passagem do tempo.","dif":"média","nota":"","obs":""},{"id":"2023d1-22","n":22,"area":"Linguagens","disc":"Inglês","assunto":"Vocabulário – adjetivos e falso cognato","titulo":"Postura indicada pelos adjetivos de The Logical Song","gab":"B","base":"21-22","imgs":[{"src":"img/2023d1/q22_1.webp","w":781,"h":459}],"alt":{"A":"agradável.","B":"sensata.","C":"autêntica.","D":"severa.","E":"despojada."},"res":"Ideia-chave: entender os adjetivos e não cair no falso cognato \"sensible\".\n\nOs últimos quatro versos são: \"But then they sent me away to teach me how to be sensible / Logical, oh, responsible, practical / Then they showed me a world where I could be so dependable / Oh, clinical, oh, intellectual, cynical\".\n\nTradução dos adjetivos: sensible = sensato (e não \"sensível\", que em inglês é \"sensitive\"); logical = lógico; responsible = responsável; practical = prático; dependable = confiável; clinical = frio, objetivo; intellectual = intelectual; cynical = cínico, descrente.\n\nO conjunto aponta para uma postura racional, ponderada e responsável, a de quem age com juízo e bom senso. Isso é ser sensato, que é justamente a tradução de \"sensible\", o primeiro adjetivo da série. Resposta: B.","pq":{"A":"\"Agradável\" descreve a juventude dos primeiros versos (\"wonderful\", \"beautiful\", \"happily\"), não a postura que os últimos versos ensinam ao eu lírico.","B":"Correta: \"sensible\" significa sensato, e os demais adjetivos (logical, responsible, practical, dependable) reforçam a ideia de juízo e racionalidade.","C":"Ser autêntico é ser fiel a si mesmo. O texto mostra o contrário: uma postura ensinada e imposta de fora (\"they sent me away to teach me\").","D":"Severo é rígido, duro, rigoroso. \"Clinical\" e \"cynical\" sugerem frieza e descrença, mas o conjunto (sensible, logical, responsible, practical, dependable) aponta para juízo e racionalidade, não para dureza.","E":"Despojado é descontraído, informal, sem formalidades, o que lembra o \"playfully\" da juventude, justamente o oposto da postura lógica e responsável pedida nos últimos versos."},"dica":"Cuidado com falsos cognatos: sensible = sensato; sensitive = sensível.","dif":"fácil","nota":"","obs":""},{"id":"2023d1-23","n":23,"area":"Linguagens","disc":"Inglês","assunto":"Humor e homofonia em charge","titulo":"Mal-entendido entre pearls e Pearl's em charge de casal idoso","gab":"E","base":null,"imgs":[{"src":"img/2023d1/q23_1.webp","w":783,"h":1222}],"alt":{"A":"à estranha comparação feita pelo idoso.","B":"à compreensão de um elogio como se fosse crítica.","C":"a um erro de pronúncia na fala do idoso.","D":"à desatenção do interlocutor ao interpretar a mensagem.","E":"à sonoridade de “pearls”, que é a mesma de “Pearl’s”."},"res":"Ideia-chave: o humor nasce de uma homofonia, ou seja, duas formas com escrita e sentido diferentes e o mesmo som.\n\nO idoso faz um elogio clássico: \"IN THE MOONLIGHT YOUR TEETH LOOK JUST LIKE PEARLS.\" (Ao luar, seus dentes parecem pérolas.) Aqui \"pearls\" é o plural de \"pearl\" (pérola).\n\nA idosa, porém, entende \"Pearl's\": Pearl como nome de mulher, e \"Pearl's\" como \"os de Pearl\" (os dentes de Pearl). Ela ouve algo como \"Ao luar, seus dentes parecem os de Pearl\". Ora, se o marido sabe como ficam os dentes de Pearl ao luar, é porque esteve com ela ao luar. Por isso ela reage com ciúme: \"WHO'S PEARL, AND WHAT WERE YOU DOING IN THE MOONLIGHT WITH HER?!\" (Quem é Pearl, e o que você estava fazendo ao luar com ela?!)\n\nNa fala, \"pearls\" e \"Pearl's\" soam exatamente iguais; a diferença (maiúscula e apóstrofo) só existe na escrita. Essa coincidência sonora causa o mal-entendido, como diz a alternativa E.","pq":{"A":"Comparar dentes a pérolas é um elogio tradicional, nada estranho. O problema não está na comparação, mas no som da palavra usada.","B":"Ela não entende o elogio como crítica: entende que o marido esteve ao luar com outra mulher, a tal Pearl. A reação é de ciúme, não de ofensa.","C":"O idoso pronuncia \"pearls\" corretamente. A confusão aconteceria com qualquer pronúncia, porque \"pearls\" e \"Pearl's\" têm o mesmo som.","D":"A charge não mostra desatenção: mesmo prestando atenção, dá para ouvir \"Pearl's\", já que o som é idêntico. A alternativa é genérica e ignora o mecanismo linguístico que gera a piada.","E":"Correta: \"pearls\" (pérolas) e \"Pearl's\" (os de Pearl) são homófonos; a idosa ouviu a segunda forma e achou que o marido a comparava a outra mulher."},"dica":"Quando a piada de uma charge em inglês é um mal-entendido, procure palavras de mesmo som e escrita diferente (homófonas) ou palavras com duplo sentido.","dif":"média","nota":"","obs":""},{"id":"2023d1-24","n":24,"area":"Linguagens","disc":"Inglês","assunto":"Interpretação de texto jornalístico em inglês","titulo":"Golpes nos EUA: principais meios segundo o Washington Post","gab":"D","base":null,"imgs":[{"src":"img/2023d1/q24_1.webp","w":781,"h":1520}],"alt":{"A":"mais de 8 bilhões de americanos foram vítimas de golpes virtuais nos anos de 2021 e 2022.","B":"a Comissão Federal de Comércio dos EUA tem um papel no levantamento de golpes e fake news.","C":"o quiz proposto pela jornalista reduziu o número de vítimas de golpes ocasionados por fake news.","D":"os principais veículos de golpes são os e-mails, seguidos de ligações telefônicas e mensagens de texto.","E":"a propagação de fake news e golpes existentes nos EUA é viabilizada por telemarketing."},"res":"Ideia-chave: para cada alternativa, localize no texto o trecho correspondente e confira se a informação está lá, sem acréscimos.\n\nO segundo parágrafo diz: \"Most reported scam attempts come via email, followed by phone calls and text messages\" (A maioria das tentativas de golpe relatadas chega por e-mail, seguida de ligações telefônicas e mensagens de texto).\n\n\"come via\" = chegam por meio de; \"followed by\" = seguido(s) de. Ou seja, os principais meios (veículos) dos golpes são, nesta ordem, e-mails, ligações telefônicas e mensagens de texto, exatamente o que afirma a alternativa D.\n\nAtenção aos números do mesmo parágrafo, usados como pegadinha: \"2.4 million Americans\" (2,4 milhões de americanos) foram vítimas em 2022, \"losing nearly $8.8 billion\" (perdendo quase 8,8 bilhões de dólares), \"a 30 percent increase from 2021\" (aumento de 30% em relação a 2021).","pq":{"A":"Confunde dinheiro com pessoas: \"$8.8 billion\" é o valor perdido, em dólares. O número de vítimas foi de 2,4 milhões (\"2.4 million Americans\"), e só em 2022.","B":"O texto só diz que as vítimas relataram golpes à Federal Trade Commission (\"reported to the Federal Trade Commission\"); fake news não é mencionada. O \"what's real and what's fake\" do subtítulo trata de distinguir golpes de situações verdadeiras.","C":"O quiz é apenas um convite ao leitor (\"Take this quiz\", \"testing your instincts below\"); o texto não diz que ele reduziu o número de vítimas. Na verdade, os golpes relatados cresceram 30%, e fake news não é citada.","D":"Correta: o texto afirma que \"Most reported scam attempts come via email, followed by phone calls and text messages\".","E":"Telemarketing não é citado. As ligações telefônicas aparecem em segundo lugar, atrás dos e-mails, e o texto não fala em propagação de fake news."},"dica":"Em leitura em inglês, desconfie de alternativas que trocam números e unidades (dólares x pessoas) ou acrescentam termos que não estão no texto, como fake news.","dif":"fácil","nota":"","obs":""},{"id":"2023d1-25","n":25,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Parasitologia – malária e ciclo do Plasmodium","titulo":"Plasmodium: tipo de organismo, célula infectada e hospedeiros da malária","gab":"E","base":null,"imgs":[{"src":"img/2023d1/q25_1.webp","w":783,"h":1492}],"alt":{"A":"protozoário, pluricelular, que pode infectar as plaquetas, onde se dá parte do seu ciclo de vida. O mosquito é considerado hospedeiro intermediário e o ser humano hospedeiro definitivo do parasita.","B":"metazoário, unicelular, que pode infectar os leucócitos, onde se dá parte de seu ciclo de vida. O mosquito é considerado hospedeiro intermediário e o ser humano hospedeiro definitivo do parasita.","C":"metazoário, pluricelular, que pode infectar os linfócitos, onde se dá parte de seu ciclo de vida. O mosquito é considerado hospedeiro definitivo e o ser humano hospedeiro intermediário do parasita.","D":"metazoário, pluricelular, que pode infectar as plaquetas, onde se dá parte do seu ciclo de vida. O mosquito é considerado hospedeiro definitivo e o ser humano hospedeiro intermediário do parasita.","E":"protozoário, unicelular, que pode infectar as hemácias, onde se dá parte de seu ciclo de vida. O mosquito é considerado hospedeiro definitivo e o ser humano hospedeiro intermediário do parasita."},"res":"Ideia-chave: cada alternativa tem três partes (tipo de organismo, célula infectada e papel dos hospedeiros), e as três precisam estar certas.\n\n1) Tipo de organismo: o Plasmodium é um **protozoário** (do grupo dos esporozoários/Apicomplexa), portanto **unicelular** e eucarionte. \"Metazoário\" é o nome dado aos animais pluricelulares, então não serve.\n\n2) Célula infectada: a fêmea do Anopheles injeta o parasita (na forma de esporozoíto), que primeiro se multiplica nas células do fígado e depois invade as **hemácias**. Lá ele se reproduz assexuadamente, e o rompimento das hemácias provoca os acessos de febre da malária.\n\n3) Hospedeiros: hospedeiro definitivo é aquele em que o parasita faz reprodução sexuada. Os gametócitos sugados pelo mosquito dão origem a gametas, que se fecundam no intestino do inseto; então o **mosquito é o hospedeiro definitivo**. O ser humano, em que só há reprodução assexuada, é o **hospedeiro intermediário**.\n\nSó a alternativa E acerta as três partes.","pq":{"A":"Protozoário está certo, mas protozoários são unicelulares, nunca pluricelulares. O Plasmodium invade hemácias, não plaquetas, e os hospedeiros estão invertidos: a reprodução sexuada acontece no mosquito, que por isso é o definitivo.","B":"\"Metazoário unicelular\" é contraditório, porque metazoário quer dizer animal pluricelular; o Plasmodium é protozoário. Ele parasita hemácias, não leucócitos, e os papéis dos hospedeiros estão trocados.","C":"Acerta os hospedeiros (mosquito definitivo, ser humano intermediário), mas erra ao chamar o parasita de metazoário pluricelular e ao dizer que ele infecta linfócitos; a célula do sangue parasitada é a hemácia.","D":"Também acerta os hospedeiros, mas o Plasmodium não é um metazoário pluricelular. Além disso, plaquetas são fragmentos de células e não abrigam o parasita: o alvo dele no sangue é a hemácia.","E":"Correta: protozoário unicelular que se multiplica nas hemácias. O mosquito, onde ocorre a reprodução sexuada, é o hospedeiro definitivo, e o ser humano é o intermediário."},"dica":"Hospedeiro definitivo é aquele em que o parasita faz reprodução sexuada. Na malária isso acontece no mosquito Anopheles, e o ser humano é só o intermediário.","dif":"fácil","nota":"","obs":""},{"id":"2023d1-26","n":26,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Ácidos nucleicos – diferenças entre DNA e RNA","titulo":"Componente presente apenas no RNA","gab":"C","base":null,"imgs":[{"src":"img/2023d1/q26_1.webp","w":781,"h":713}],"alt":{"A":"adenina.","B":"timina.","C":"uracila.","D":"fosfato.","E":"desoxirribose."},"res":"Ideia-chave: DNA e RNA diferem em dois componentes do nucleotídeo, o açúcar (pentose) e uma das bases nitrogenadas.\n\nTodo nucleotídeo tem fosfato + pentose + base nitrogenada.\nDNA: pentose = desoxirribose; bases = adenina, guanina, citosina e timina.\nRNA: pentose = ribose; bases = adenina, guanina, citosina e **uracila**.\n\nO fosfato e as bases adenina, guanina e citosina estão nos dois. A base que só existe no RNA é a uracila, que se pareia com a adenina no lugar da timina. Por isso a resposta é a alternativa C.\n\nRepare que a ribose também só existe no RNA, mas ela não aparece entre as opções. A desoxirribose, que está na alternativa E, é justamente o açúcar do DNA.","pq":{"A":"A adenina está nos dois ácidos nucleicos: no DNA ela se pareia com a timina e no RNA, com a uracila. Por isso não serve para diferenciar um do outro.","B":"É a pegadinha invertida: a timina é exclusiva do DNA, não do RNA. No RNA, o lugar dela é ocupado pela uracila.","C":"Correta: a uracila só existe no RNA, onde ocupa o lugar que a timina tem no DNA.","D":"O fosfato faz parte de todos os nucleotídeos, tanto do DNA quanto do RNA. É ele que, junto com a pentose, forma o \"esqueleto\" da cadeia.","E":"A desoxirribose é o açúcar do DNA (o \"D\" de DNA vem dela: ácido desoxirribonucleico). O RNA tem ribose."},"dica":"Decore os pares exclusivos: DNA = desoxirribose + timina; RNA = ribose + uracila. Adenina, guanina, citosina e fosfato estão nos dois.","dif":"fácil","nota":"","obs":""},{"id":"2023d1-27","n":27,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Botânica – classificação dos grupos vegetais","titulo":"Briófitas, pteridófitas, gimnospermas e angiospermas: criptógamas, fanerógamas, traqueófitas","gab":"B","base":null,"imgs":[{"src":"img/2023d1/q27_1.webp","w":781,"h":1204}],"alt":{"A":"pteridófitas são fanerógamas e apresentam um sistema vascular composto por xilema e floema, responsáveis por conduzir seiva bruta e seiva elaborada.","B":"pteridófitas são traqueófitas e apresentam um sistema vascular composto por xilema e floema, responsáveis por conduzir seiva bruta e seiva elaborada.","C":"gimnospermas são fanerógamas e possuem flores e frutos, sendo que são nestes últimos que as sementes são abrigadas até sua completa maturação.","D":"angiospermas são criptógamas e apresentam um sistema vascular composto por xilema e floema, responsáveis por conduzir seiva bruta e seiva elaborada.","E":"briófitas são criptógamas e possuem flores e frutos, sendo que é nas flores que as sementes são abrigadas até sua completa maturação."},"res":"Ideia-chave: cada termo indica uma característica, e um mesmo grupo pode receber mais de um termo.\n\n**Criptógamas** (\"reprodução escondida\"): não produzem sementes e se reproduzem por esporos. São as briófitas e as pteridófitas.\n**Fanerógamas** (\"reprodução visível\"), também chamadas de **espermatófitas**: produzem sementes. São as gimnospermas e as angiospermas.\n**Traqueófitas**: têm vasos condutores. São as pteridófitas, as gimnospermas e as angiospermas. As briófitas são avasculares.\n\nAs pteridófitas (samambaias, avencas) são criptógamas, porque não têm sementes, mas já são traqueófitas: foram as primeiras plantas com **xilema**, que conduz a seiva bruta (água e sais minerais), e **floema**, que conduz a seiva elaborada (açúcares produzidos na fotossíntese). É exatamente o que afirma a alternativa B.","pq":{"A":"A parte sobre xilema e floema está certa, mas as pteridófitas não são fanerógamas: não produzem sementes nem flores e se reproduzem por esporos. Por isso são criptógamas.","B":"Correta: as pteridófitas são as primeiras traqueófitas, com xilema (seiva bruta) e floema (seiva elaborada).","C":"As gimnospermas são mesmo fanerógamas, mas não têm flores verdadeiras nem frutos. As sementes delas ficam expostas (\"nuas\") nos estróbilos, como as pinhas. Fruto é exclusividade das angiospermas.","D":"As angiospermas têm, sim, xilema e floema, mas são fanerógamas (têm flores, sementes e frutos), e não criptógamas.","E":"As briófitas (musgos) são de fato criptógamas, mas não têm flores, frutos, sementes nem vasos condutores. Além disso, nas plantas que têm frutos, quem abriga as sementes até amadurecerem é o fruto, e não a flor."},"dica":"Cripto = escondido (sem semente: briófitas e pteridófitas); fanero = visível (com semente: gimnospermas e angiospermas); traqueófita = tem vasos (todos os grupos, menos as briófitas).","dif":"média","nota":"","obs":""},{"id":"2023d1-28","n":28,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Ecologia – biomas terrestres","titulo":"Clima e vegetação dos biomas terrestres (Floresta Tropical, Campo, Tundra, Taiga)","gab":"C","base":null,"imgs":[{"src":"img/2023d1/q28_1.webp","w":783,"h":1177}],"alt":{"A":"a Floresta Temperada ocorre em regiões de alta latitude da América do Sul, sendo o bioma com maior diversidade, além de ser composto por espécies sempre-verdes.","B":"a Floresta Tropical é encontrada na zona intertropical, onde o clima é quente e seco, e é caracterizada pelo predomínio de vegetação adaptada a longos períodos de estiagem.","C":"o Campo ocorre em regiões temperadas, onde há clima seco e com temperaturas intermediárias, e é caracterizado pela predominância de espécies herbáceas e arbustivas.","D":"a Tundra ocorre em altas latitudes, onde o clima é frio e úmido, e é caracterizada pela presença de espécies arbóreas decíduas.","E":"a Taiga ocorre em latitudes superiores à Tundra, onde o clima é frio e seco, sendo caracterizada pela presença de vegetais rasteiros resistentes a períodos de gelo."},"res":"Ideia-chave: para cada bioma, confira três dados: a latitude, o clima (temperatura e chuva) e a vegetação típica.\n\nOs **Campos temperados** (pradarias da América do Norte, estepes da Eurásia) ficam em latitudes médias. Lá a chuva é moderada a baixa, insuficiente para manter uma floresta, e as temperaturas são intermediárias, com estações bem marcadas. Por isso a vegetação é dominada por gramíneas e outras herbáceas, com arbustos espalhados. É exatamente o que diz a alternativa C.\n\nPara confirmar, veja o erro das outras: a Floresta Tropical é quente e **úmida**; a maior diversidade é da Floresta Tropical, e não da Temperada, que fica em latitudes médias; a Tundra **não tem árvores**; e a Taiga fica em latitudes **menores** que a Tundra e é uma floresta de coníferas.","pq":{"A":"O erro principal é dizer que a Floresta Temperada é o bioma de maior diversidade: esse título é da Floresta Tropical. Além disso, ela ocorre em latitudes médias (não altas), sobretudo no Hemisfério Norte, e na sua forma mais comum (floresta temperada decídua) as árvores perdem as folhas no outono.","B":"A Floresta Tropical fica mesmo na zona intertropical, mas tem clima quente e úmido, com chuva abundante. Vegetação adaptada a longas estiagens descreve savanas, Caatinga ou desertos.","C":"Correta: o Campo é um bioma de regiões temperadas, de clima relativamente seco e temperaturas intermediárias, com predomínio de herbáceas (gramíneas) e arbustos.","D":"A Tundra fica mesmo em altas latitudes, mas lá não há árvores: o frio extremo e o solo congelado (permafrost) só permitem vegetação rasteira de musgos, liquens e pequenas gramíneas. Árvores decíduas são típicas da Floresta Temperada, e a Tundra costuma ser descrita como fria e seca, por ter pouca precipitação.","E":"Inverte as posições: a Taiga fica em latitudes menores que a Tundra (ao sul dela, no Hemisfério Norte). Além disso, a Taiga é uma floresta de coníferas (pinheiros e abetos); vegetação rasteira resistente ao gelo é a descrição da Tundra."},"dica":"Monte a sequência do equador ao polo: Floresta Tropical → Savanas e desertos → Campos e Floresta Temperada → Taiga (coníferas) → Tundra (sem árvores: musgos e liquens).","dif":"média","nota":"","obs":""},{"id":"2023d1-29","n":29,"area":"Ciências da Natureza","disc":"Biologia","assunto":"Evolução – cladogramas de vertebrados","titulo":"Cladograma de anfíbios, mamíferos, répteis e aves: características 1 e 2","gab":"A","base":null,"imgs":[{"src":"img/2023d1/q29_1.webp","w":781,"h":869}],"alt":{"A":"1 corresponde à presença de âmnio.","B":"2 corresponde à presença de dentes.","C":"2 corresponde à circulação dupla e incompleta.","D":"2 corresponde à epiderme queratinizada.","E":"1 corresponde à presença de quatro membros."},"res":"Ideia-chave: num cladograma, uma característica marcada no tronco é herdada por todos os grupos que se ramificam depois desse ponto. Uma característica marcada num ramo terminal é exclusiva daquele grupo.\n\n**Ponto 1:** está no tronco, depois da saída dos Anfíbios e antes da saída dos Mamíferos. Então é uma novidade evolutiva comum a Mamíferos, Répteis e Aves e ausente nos Anfíbios. Isso corresponde ao **âmnio**, a membrana do ovo amniótico que envolve o embrião numa bolsa com líquido e permitiu a reprodução fora da água. É por isso que esses três grupos são chamados de amniotas.\n\n**Ponto 2:** está no ramo que leva só às Aves, depois que os Répteis se separaram. Então é uma característica exclusiva das aves, como as penas.\n\nPortanto, a alternativa correta é a A: a característica 1 é a presença de âmnio.","pq":{"A":"Correta: o âmnio é compartilhado por mamíferos, répteis e aves e não existe nos anfíbios, exatamente o que indica a posição do ponto 1.","B":"As aves atuais não têm dentes, e sim bico córneo. E dentes também existem em mamíferos e em muitos répteis, então não poderiam ser uma novidade exclusiva das aves.","C":"Circulação dupla e incompleta (com mistura de sangue) é típica de anfíbios e da maioria dos répteis. As aves têm coração com quatro cavidades e circulação dupla e completa.","D":"A epiderme queratinizada é comum a todos os amniotas (répteis, aves e mamíferos). Por isso ficaria no ponto 1, e não no 2, que é exclusivo das aves.","E":"Quatro membros (tetrapodia) também existem nos anfíbios. Essa característica teria de aparecer no tronco antes da saída dos Anfíbios, e não no ponto 1, que os exclui."},"dica":"Leia o cladogr
