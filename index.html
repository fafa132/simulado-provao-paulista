lor do bronze (140.000) é só um distrator: não entra na conta.\n\nResposta: alternativa B.","pq":{"A":"30% de 350.000 dá 105.000, só metade do prêmio da prata. Essa porcentagem não sai de nenhuma razão correta entre os valores dados.","B":"Correta: 210.000 / 350.000 = 3/5 = 0,6 = 60%.","C":"40% é a razão bronze/ouro (140.000 / 350.000) e também a diferença (350.000 − 210.000) / 350.000. Você usou a medalha errada ou calculou quanto a prata fica abaixo do ouro.","D":"50% de 350.000 é 175.000, não 210.000. Talvez tenha estimado no olho, achando a prata \"mais ou menos a metade\" do ouro.","E":"70% de 350.000 é 245.000, acima dos 210.000 da prata. Não bate com os dados."},"dica":"\"X é que porcentagem de Y\" é X ÷ Y × 100: quem vem depois do \"de\" vai no denominador.","dif":"fácil","nota":"","obs":""},{"id":"2024d2-15","n":15,"area":"Matemática","disc":"Matemática","assunto":"Proporcionalidade (regra de três)","titulo":"Receita de chá: camomila e hortelã para 500 mL de água","gab":"D","base":null,"imgs":[{"src":"img/2024d2/q15_1.webp","w":781,"h":835}],"alt":{"A":"150 g de camomila e 90 g de hortelã.","B":"125 g de camomila e 60 g de hortelã.","C":"100 g de camomila e 60 g de hortelã.","D":"125 g de camomila e 75 g de hortelã.","E":"100 g de camomila e 75 g de hortelã."},"res":"Ideia-chave: os ingredientes são diretamente proporcionais à quantidade de água. Ache o fator de ampliação e multiplique tudo por ele.\n\nFator = 500 mL ÷ 200 mL = 2,5\n\nCamomila: 50 g × 2,5 = 125 g\nHortelã: 30 g × 2,5 = 75 g\n\nOutro jeito (regra de três para a camomila):\n200 mL → 50 g\n500 mL → x\nx = 500 × 50 / 200 = 25.000 / 200 = 125 g\n\nOs dois ingredientes têm de ser multiplicados pelo MESMO fator.\n\nResposta: 125 g de camomila e 75 g de hortelã, alternativa D.","pq":{"A":"150 g e 90 g é a receita multiplicada por 3, o que corresponderia a 600 mL de água, não a 500 mL.","B":"A camomila está certa (×2,5 = 125 g), mas a hortelã foi só dobrada (30 × 2 = 60 g). Os dois ingredientes precisam do mesmo fator.","C":"100 g e 60 g é a receita dobrada (×2), o que serviria para 400 mL de água.","D":"Correta: fator 500/200 = 2,5; 50 × 2,5 = 125 g e 30 × 2,5 = 75 g.","E":"Mistura fatores: a camomila foi dobrada (100 g) e a hortelã multiplicada por 2,5 (75 g). A proporção da receita se perde."},"dica":"Em receita ampliada, calcule um único fator (novo ÷ original) e aplique-o a todos os ingredientes.","dif":"fácil","nota":"","obs":""},{"id":"2024d2-16","n":16,"area":"Matemática","disc":"Matemática","assunto":"Progressão aritmética","titulo":"PA de cinco termos: razão a partir de duas somas","gab":"D","base":null,"imgs":[{"src":"img/2024d2/q16_1.webp","w":784,"h":927}],"alt":{"A":"4.","B":"3.","C":"12.","D":"2.","E":"7."},"res":"Ideia-chave: escreva todos os termos em função do termo central c e da razão r.\n\na = c − 2r, b = c − r, c, d = c + r, e = c + 2r\n\nPrimeira soma:\na + b + c = (c − 2r) + (c − r) + c = 3c − 3r = 27\n\nSegunda soma:\nc + d + e = c + (c + r) + (c + 2r) = 3c + 3r = 39\n\nSubtraindo a primeira da segunda:\n(3c + 3r) − (3c − 3r) = 39 − 27\n6r = 12\nr = 2\n\n(E também: 3c = 27 + 3r = 33 → c = 11.)\n\nAtalho: em PA, três termos seguidos somam 3 vezes o do meio. Então 3b = 27 → b = 9 e 3d = 39 → d = 13. Como d − b = 2r, temos 2r = 4 → r = 2.\n\nConferindo com a PA 7, 9, 11, 13, 15:\n7 + 9 + 11 = 27 ✓\n11 + 13 + 15 = 39 ✓\n\nResposta: r = 2, alternativa D.","pq":{"A":"4 é d − b (13 − 9), que vale 2r, e não r. Também aparece se você dividir 39 − 27 = 12 por 3, achando que cada termo da segunda soma está só r à frente do correspondente da primeira; na verdade c está 2r à frente de a, d à frente de b e e à frente de c, então a diferença é 6r.","B":"Com r = 3, a primeira soma daria 3c − 9 = 27 → c = 12, e a segunda seria 3 × 12 + 9 = 45, não 39. O 3 é a quantidade de termos em cada soma, não a razão.","C":"12 é a diferença entre as somas (39 − 27), e não a razão. Essa diferença vale 6r.","D":"Correta: (3c + 3r) − (3c − 3r) = 6r = 12, logo r = 2. A PA é 7, 9, 11, 13, 15.","E":"7 é o primeiro termo a da PA (a = c − 2r = 11 − 4 = 7), não a razão. Você achou um termo e parou antes de responder o que se pedia."},"dica":"Em PA com número ímpar de termos, escreva tudo em função do termo do meio (c − r, c, c + r…): as contas ficam bem mais simples.","dif":"média","nota":"","obs":""},{"id":"2024d2-17","n":17,"area":"Matemática","disc":"Matemática","assunto":"Análise combinatória – princípio fundamental da contagem com restrições","titulo":"Posições de dança com restrições para Camila e Breno","gab":"C","base":null,"imgs":[{"src":"img/2024d2/q17_1.webp","w":781,"h":1074}],"alt":{"A":"11.","B":"120.","C":"30.","D":"5.","E":"36."},"res":"Ideia-chave: posicione primeiro quem tem restrição (Camila e Breno) e divida em casos, porque a escolha de Camila muda as opções de Breno (os dois podem querer a posição 1).\n\nCaso 1: Camila na posição 1.\nBreno só pode ficar em 3 ou 4 (a 1 já está ocupada): 2 opções.\nArthur, Diana e Estevão nas 3 posições que sobram: 3! = 3 × 2 × 1 = 6.\nTotal: 2 × 6 = 12.\n\nCaso 2: Camila na posição 2.\nBreno pode ficar em 1, 3 ou 4: 3 opções.\nOs outros três nas posições restantes: 3! = 6.\nTotal: 3 × 6 = 18.\n\nSomando os casos:\n12 + 18 = 30\n\nResposta: alternativa C.","pq":{"A":"11 aparece se você SOMAR as opções (2 + 3 + 6) em vez de multiplicar dentro de cada caso. Escolhas feitas em sequência se multiplicam.","B":"120 = 5! conta todas as formas de ocupar as posições sem nenhuma restrição, ignorando que Camila e Breno só podem ocupar certas posições.","C":"Correta: Camila na 1 dá 2 × 3! = 12; Camila na 2 dá 3 × 3! = 18; total 30.","D":"5 é só o número de pessoas (ou de posições), não a quantidade de arranjos possíveis.","E":"36 = 2 × 3 × 3! multiplica direto as opções de Camila (2) e de Breno (3), sem perceber que, quando Camila fica na posição 1, Breno não pode mais ficar lá. Isso conta 6 arranjos impossíveis (os dois na posição 1)."},"dica":"Quando duas pessoas com restrição disputam a mesma vaga, separe em casos (quem fica com a vaga em comum) e só depois some.","dif":"média","nota":"","obs":""},{"id":"2024d2-18","n":18,"area":"Matemática","disc":"Matemática","assunto":"Probabilidade","titulo":"Sorteio de 1 a 100: chance de Enzo (67) vencer Bianca (46)","gab":"A","base":null,"imgs":[{"src":"img/2024d2/q18_1.webp","w":781,"h":826}],"alt":{"A":"44%.","B":"21%.","C":"67%.","D":"56%.","E":"50%."},"res":"Ideia-chave: encontre o ponto médio entre os dois números; ele separa as bolas mais próximas de cada um.\n\nPonto médio entre 46 e 67:\n(46 + 67) / 2 = 113 / 2 = 56,5\n\nBolas mais próximas de 46 (Bianca): de 1 a 56.\nBolas mais próximas de 67 (Enzo): de 57 a 100.\nComo 56,5 não é inteiro, não há empate.\n\nQuantidade de bolas favoráveis a Enzo:\n100 − 57 + 1 = 44\n\nConferindo dois casos na fronteira:\nBola 56: distância a 46 = 10 e a 67 = 11 → Bianca.\nBola 57: distância a 46 = 11 e a 67 = 10 → Enzo.\n\nProbabilidade:\nP = 44 / 100 = 44%\n\nResposta: alternativa A.","pq":{"A":"Correta: Enzo vence com as bolas de 57 a 100, que são 44 de 100, ou seja, 44%.","B":"21% é a diferença 67 − 46. Ela não indica quantas bolas favorecem Enzo.","C":"67% usa o próprio número de Enzo como probabilidade, como se ele ganhasse com as bolas de 1 a 67. Mas as bolas de 1 a 56 estão mais perto de 46.","D":"56% é a probabilidade de Bianca vencer (bolas de 1 a 56). Você calculou certo, mas para a pessoa errada.","E":"50% supõe que os dois têm a mesma chance, o que só aconteceria se o ponto médio entre os números caísse exatamente no meio da urna (entre 50 e 51). Aqui a fronteira é 56,5, então sobram menos bolas do lado de Enzo."},"dica":"Em problemas de \"mais próximo\", o ponto médio entre os dois valores é a fronteira: conte quantos casos ficam de cada lado dele.","dif":"média","nota":"","obs":""},{"id":"2024d2-19","n":19,"area":"Ciências Humanas","disc":"História","assunto":"Grécia Antiga – democracia ateniense e cidadania","titulo":"Quem era o “povo” na democracia de Atenas","gab":"B","base":null,"imgs":[{"src":"img/2024d2/q19_1.webp","w":783,"h":981}],"alt":{"A":"militares atenienses, isto é, indivíduos aptos à defesa da cidade.","B":"cidadãos de Atenas, isto é, homens atenienses maiores de 18 anos de idade.","C":"habitantes da pólis, isto é, homens e mulheres que viviam em Atenas.","D":"eupátridas, isto é, homens e mulheres que comandavam Atenas.","E":"indivíduos da cidade, isto é, homens que viviam em Atenas."},"res":"Ideia-chave: na democracia ateniense, o “povo” (démos) que exercia o “poder do povo” NÃO era toda a população, e sim apenas os cidadãos.\n\nPasso 1: o texto define democracia como “poder do povo”, mas não diz quem era esse povo. Isso vem do conteúdo de História.\n\nPasso 2: em Atenas, eram cidadãos apenas os homens livres, filhos de atenienses, maiores de 18 anos. Só eles podiam participar da Assembleia (Eclésia) e das decisões políticas.\n\nPasso 3: ficavam de fora as mulheres, os estrangeiros residentes (metecos) e os escravizados, que formavam a maior parte dos habitantes da cidade. Por isso se diz que a democracia ateniense era direta, mas restrita/excludente.\n\nAssim, a alternativa que descreve corretamente o “povo” é a B: cidadãos de Atenas, isto é, homens atenienses maiores de 18 anos.","pq":{"A":"O critério para participar da democracia era a cidadania, não a função militar. Ser apto à defesa da cidade não definia quem votava na Assembleia.","B":"Correta. O “povo” político era o conjunto dos cidadãos: homens livres, atenienses e maiores de 18 anos; mulheres, metecos e escravizados ficavam excluídos.","C":"Errada porque inclui as mulheres e todos os habitantes. As mulheres não tinham direitos políticos, e muitos moradores eram metecos ou escravizados, também excluídos.","D":"Os eupátridas eram a aristocracia (os “bem-nascidos”), ligada ao “poder de poucos” que o texto contrapõe à democracia. Além disso, mulheres não comandavam Atenas.","E":"“Homens que viviam em Atenas” inclui metecos (estrangeiros) e escravizados, que moravam na cidade mas não eram cidadãos. Faltou o critério de ser ateniense e livre."},"dica":"Democracia ateniense = direta, mas excludente: só votavam homens livres, atenienses e adultos; mulheres, metecos e escravizados ficavam de fora.","dif":"fácil","nota":"","obs":""},{"id":"2024d2-20","n":20,"area":"Ciências Humanas","disc":"História","assunto":"Crise do Império Romano – ruralização e invasões bárbaras","titulo":"Depoimento de Orósio sobre a ruína das cidades na Queda de Roma","gab":"E","base":null,"imgs":[{"src":"img/2024d2/q20_1.webp","w":785,"h":909}],"alt":{"A":"ao abandono do cristianismo pelos reinos bárbaros em formação.","B":"à concentração da riqueza fundiária nas mãos dos germânicos.","C":"ao abandono das cidades antigas em detrimento dos burgos medievais.","D":"à fragilidade da vida urbana após o renascimento agrícola.","E":"ao enfraquecimento urbano intensificado pelas invasões bárbaras."},"res":"Ideia-chave: o texto descreve a decadência das cidades romanas no século V, período das invasões germânicas.\n\nPasso 1: Orósio fala em “escombros das grandes cidades” e em “grupos dispersos de míseras populações”. Ou seja: cidades destruídas e esvaziadas.\n\nPasso 2: ele chama isso de “testemunhos das calamidades passadas”. No contexto da Queda do Império Romano do Ocidente, essas calamidades são os saques e as invasões dos povos chamados de bárbaros.\n\nPasso 3: o esvaziamento urbano já vinha da crise do Império (insegurança, retração do comércio, fuga para o campo, a chamada ruralização). As invasões aceleraram esse processo.\n\nPor isso, o depoimento faz referência ao enfraquecimento urbano intensificado pelas invasões bárbaras (alternativa E).","pq":{"A":"O trecho não fala de religião. Além disso, os reinos germânicos foram se convertendo ao cristianismo, e não o abandonando.","B":"O texto trata de cidades em ruínas e populações dispersas, não de quem era dono das terras. A concentração fundiária não é mencionada.","C":"Anacronismo: os burgos são típicos da Baixa Idade Média, séculos depois de Orósio. No século V não havia burgos medievais para onde a população fosse.","D":"Também anacrônica e com a causa invertida: o renascimento agrícola é da Baixa Idade Média. No século V, o problema era a crise e as invasões, não uma expansão agrícola.","E":"Correta. Os “escombros das grandes cidades” e as “míseras populações” dispersas mostram a decadência urbana agravada pelas invasões germânicas."},"dica":"Fim do Império Romano do Ocidente = crise urbana + ruralização + invasões; burgos e renascimento comercial/agrícola só aparecem na Baixa Idade Média (séc. XI em diante).","dif":"fácil","nota":"","obs":""},{"id":"2024d2-21","n":21,"area":"Ciências Humanas","disc":"História","assunto":"Brasil colonial – economia açucareira e abastecimento","titulo":"Caio Prado Jr.: senhor de engenho recusa plantar mandioca","gab":"B","base":null,"imgs":[{"src":"img/2024d2/q21_1.webp","w":781,"h":1316}],"alt":{"A":"incapacidade dos proprietários rurais em relação ao abastecimento de alimentos na colônia.","B":"preferência dos proprietários pela produção açucareira devido à alta lucratividade de sua exportação.","C":"concentração das preocupações senhoriais na extração do ouro encontrado nas jazidas do interior.","D":"incompreensão da realidade colonial brasileira por parte das autoridades metropolitanas.","E":"expectativa dos colonos de que a mandioca fosse cultivada pelas populações indígenas."},"res":"Ideia-chave: faltava alimento porque os grandes proprietários preferiam produzir para exportar, não por falta de leis ou de capacidade.\n\nPasso 1: o texto mostra que a legislação tentou resolver o problema, obrigando “os proprietários a plantarem mandioca e outros alimentos”.\n\nPasso 2: essas medidas eram “mais ou menos frustradas na prática”. O motivo aparece na fala do senhor de engenho: “Não planto um só pé de mandioca [...] para não cair no absurdo de renunciar à melhor cultura do país pela pior que nele há”.\n\nPasso 3: a “melhor cultura do país”, para um senhor de engenho, é a cana-de-açúcar, produto exportado e muito lucrativo. A mandioca, alimento para o consumo interno, era vista como “a pior”.\n\nLogo, o problema se explica pela preferência dos proprietários pela produção açucareira voltada à exportação (alternativa B).","pq":{"A":"Não era incapacidade, era escolha. O senhor de engenho podia plantar, mas se recusava: “Não planto um só pé de mandioca”.","B":"Correta. O senhor de engenho não queria trocar “a melhor cultura do país” (a cana, lucrativa na exportação) pela “pior” (a mandioca, para o consumo local).","C":"O texto fala de um senhor de engenho e de um problema que existia “desde o princípio da colonização”, antes do ouro. A mineração não é mencionada.","D":"As autoridades entendiam o problema: a legislação “preocupa-se muito com ele” e criava medidas. Quem frustrava as leis eram os proprietários.","E":"Os indígenas não aparecem no texto. As leis obrigavam os próprios proprietários a plantar alimentos, e a recusa vinha deles."},"dica":"Na economia colonial (plantation), terra e mão de obra iam para o produto de exportação; a produção de alimentos para o mercado interno ficava em segundo plano.","dif":"fácil","nota":"","obs":""},{"id":"2024d2-22","n":22,"area":"Ciências Humanas","disc":"História","assunto":"Brasil Império – classe senhorial e construção do Estado","titulo":"Ricardo Salles: classe senhorial escravista como estilo de vida no Império","gab":"D","base":null,"imgs":[{"src":"img/2024d2/q22_1.webp","w":783,"h":1266}],"alt":{"A":"cristalização do arcaísmo aristocrático entre os brasileiros.","B":"imposição do ideal escravista à população brasileira.","C":"difusão de práticas liberais nas camadas sociais brasileiras.","D":"generalização dos interesses senhoriais pelo tecido social brasileiro.","E":"consolidação das demandas políticas da sociedade brasileira."},"res":"Ideia-chave: o texto mostra que a dominação da classe senhorial não veio só pela força; os valores dela se espalharam pela sociedade, inclusive entre os grupos de baixo.\n\nPasso 1: a classe senhorial escravista “estendeu sua dominação sobre todo o território”. Ela se impôs “muitas vezes, pelo emprego direto da força”, mas também “se expandiu como estilo de vida”.\n\nPasso 2: essa expansão significou “a gestação de identidades e valores socialmente compartilhados”, ou seja, valores aceitos e partilhados, e não apenas impostos.\n\nPasso 3: o ponto decisivo é o final: o processo “não se restringiu aos grupos de grandes proprietários e comerciantes escravistas, mas se estendeu a outros grupos sociais subalternos que se espelharam nos primeiros e buscaram aderir a seu estilo de vida”.\n\nSe os subalternos também adotaram o modo de vida e os valores senhoriais, houve uma generalização dos interesses senhoriais pelo tecido social brasileiro (alternativa D).","pq":{"A":"O texto fala de expansão, de valores compartilhados e de práticas “públicas e institucionalizadas” do novo Estado. Não fala de um arcaísmo aristocrático que ficou cristalizado.","B":"É a pegadinha: o texto cita o uso da força, mas destaca que os subalternos “buscaram aderir” ao estilo de vida senhorial. A alternativa reduz tudo a imposição e ignora essa adesão, que é o centro do excerto.","C":"O que se difunde são valores da classe senhorial escravista, e não práticas liberais. O liberalismo não é mencionado no excerto.","D":"Correta. Os valores e o estilo de vida senhoriais se estenderam aos “grupos sociais subalternos”, que “se espelharam” nos senhores; eles se generalizaram pela sociedade.","E":"O texto trata da hegemonia de uma classe dominante, não do atendimento das demandas da sociedade como um todo. Quem tem os interesses consolidados é a classe senhorial."},"dica":"Em textos sobre dominação de classe, procure se ela ocorre só pela força ou também pela adesão dos dominados (valores compartilhados); se há adesão, a resposta fala em difusão/generalização, não em mera imposição.","dif":"média","nota":"","obs":""},{"id":"2024d2-23","n":23,"area":"Ciências Humanas","disc":"História","assunto":"Imperialismo/neocolonialismo na África – missão civilizadora","titulo":"Tintim no Congo (Hergé) e a ideia de missão civilizadora europeia","gab":"C","base":null,"imgs":[{"src":"img/2024d2/q23_1.webp","w":783,"h":1494}],"alt":{"A":"descaracterização da população africana pelos europeus.","B":"reparação histórica devido à exploração colonial europeia.","C":"ideia da tarefa civilizadora da humanidade pensada pelos europeus.","D":"desatenção do clero europeu em relação à possibilidade de melhoria social da África.","E":"crítica à idealização do passado colonial europeu."},"res":"Ideia-chave: o quadrinho mostra, de forma elogiosa, a presença europeia na África como uma missão de “levar a civilização”, justificativa típica do imperialismo.\n\nPasso 1: nos quadrinhos, o missionário apresenta “nossa missão”: “O hospital… a escola agrícola”, “a sala de aula” e “a capela”.\n\nPasso 2: a fala decisiva é “Quando chegamos aqui, há um ano atrás, esse lugar era selva!”. Ela traz a visão de que, antes dos europeus, havia apenas natureza selvagem e de que eles trouxeram o progresso (saúde, educação, religião cristã).\n\nPasso 3: as reações de Tintim e de seu cachorro (“É maravilhoso!”, “Que lugar legal!”, “Missionários são demais!”) mostram que a obra celebra essa ação. Não há crítica.\n\nPasso 4: publicada entre 1930 e 1931, em plena época colonial, a obra reproduz a ideia europeia de que eles tinham o dever de “civilizar” os povos colonizados. Por isso a resposta é a C.","pq":{"A":"Hoje a obra é criticada pelo modo estereotipado como representa os africanos, mas o trecho não retrata, como tema, europeus descaracterizando a população africana. Ele mostra e elogia a obra missionária, ou seja, a ideia de missão civilizadora.","B":"Anacronismo: a ideia de reparação pela exploração colonial é muito posterior. O quadrinho de 1930–31 exalta a presença europeia em vez de reconhecer uma dívida.","C":"Correta. Hospital, escola, sala de aula e capela erguidos onde “era selva” mostram a visão europeia de que sua tarefa era civilizar a África.","D":"É o contrário: o clero aparece construindo hospital, escola agrícola e escola. Ele é mostrado como muito atento à “melhoria” da região.","E":"Não há crítica nenhuma: as falas são de admiração (“É maravilhoso!”, “Missionários são demais!”). Além disso, em 1930 o colonialismo era o presente, e não um passado a ser idealizado."},"dica":"Imperialismo do séc. XIX–XX = discurso da “missão civilizadora” (fardo do homem branco): o europeu se apresenta como quem leva progresso, saúde, escola e religião a terras vistas como “selvagens”.","dif":"fácil","nota":"","obs":""},{"id":"2024d2-24","n":24,"area":"Ciências Humanas","disc":"História","assunto":"Era Vargas – Governo Provisório e Revolução de 1930","titulo":"Governo Provisório de Vargas e a promessa de Assembleia Constituinte","gab":"D","base":null,"imgs":[{"src":"img/2024d2/q24_1.webp","w":783,"h":1191}],"alt":{"A":"coibir a formação de partidos políticos para que o interesse nacional fosse representado.","B":"centralizar a administração nacional para evitar que as elites políticas dirigissem o Estado.","C":"reparar as tensões sociais por meio da dissolução das dissidências políticas nacionais.","D":"consertar os problemas políticos da República conforme o ideal revolucionário de 1930.","E":"emendar a Carta Magna republicana de acordo com os anseios da elite econômica nacional."},"res":"Ideia-chave: a Constituinte prometida serviria para criar uma nova ordem constitucional que corrigisse os vícios da Primeira República, derrubada pela Revolução de 1930.\n\nPasso 1: o texto diz que a concentração de poderes nas mãos de Vargas era uma “situação excepcional”, que duraria “até que fosse eleita uma Assembleia Constituinte”.\n\nPasso 2: a função dessa Constituinte está explícita: ela “estabeleceria uma nova organização constitucional, revendo e corrigindo os males da Constituição de 1891”.\n\nPasso 3: a Constituição de 1891 era a base da República Velha, regime que os revolucionários de 1930 combatiam. Corrigir seus “males” (os problemas políticos daquele regime) era justamente o projeto da Revolução de 1930.\n\nLogo, a promessa buscava consertar os problemas políticos da República conforme o ideal revolucionário de 1930 (alternativa D).","pq":{"A":"O texto não menciona partidos políticos nem proibição de partidos. Ele fala em dissolver órgãos legislativos, o que é outra coisa.","B":"A centralização era a “situação excepcional” do Governo Provisório, que deveria acabar com a Constituinte. A promessa da Constituinte apontava para uma nova organização constitucional, não para centralizar ainda mais.","C":"O que foi dissolvido foram o Congresso e as Câmaras, não “dissidências políticas”. Além disso, uma Constituinte eleita serve para dar representação, não para eliminar opositores.","D":"Correta. O texto diz que a Constituinte viria “revendo e corrigindo os males da Constituição de 1891”, ou seja, consertando os problemas da República Velha, como queria o movimento de 1930.","E":"Duplo erro: o texto fala em “nova organização constitucional”, não em emendar a Carta de 1891. E o objetivo era corrigir os males do regime anterior, não atender às elites econômicas que se beneficiavam dele."},"dica":"Revolução de 1930 = ruptura com a República Velha (Constituição de 1891); o Governo Provisório concentrou poderes e prometeu uma Constituinte para criar uma nova ordem.","dif":"média","nota":"","obs":""},{"id":"2024d2-25","n":25,"area":"Ciências Humanas","disc":"História","assunto":"Stalinismo – repressão na URSS","titulo":"Poema de Mandelstam contra o \"montanhês do Kremlin\" (Stálin)","gab":"B","base":null,"imgs":[{"src":"img/2024d2/q25_1.webp","w":781,"h":1082}],"alt":{"A":"crítica do ideal internacionalista do stalinismo.","B":"denúncia da política repressiva do stalinismo.","C":"caricatura da nova política econômica stalinista.","D":"comparação entre stalinismo e czarismo.","E":"percepção negativa da modernização stalinista."},"res":"Ideia-chave: descobrir quem é o alvo do poema e do que ele é acusado.\nO \"montanhês do Kremlin\" é Stálin, georgiano (região montanhosa do Cáucaso), que governava a URSS a partir do Kremlin, em Moscou. O poema o chama de \"O criminoso e assassino de camponeses\". No verso \"Como morangos, rola na língua execuções\", mandar matar aparece como algo saboroso e banal para ele. Suas palavras são \"decisivas como chumbo\": o chumbo lembra balas e o peso de ordens que ninguém contesta.\nOs primeiros versos mostram o medo da população: \"A dez passos ninguém escuta nossos discursos\". Ninguém ousa falar alto, por medo da vigilância e da delação.\nEm 1933, a URSS vivia a coletivização forçada do campo, com violência contra os camponeses, e o regime perseguia e executava opositores. O poema é, portanto, uma **denúncia da política repressiva do stalinismo**: terror, execuções e silenciamento. Mandelstam foi preso no ano seguinte por causa desses versos.","pq":{"A":"Nada no poema trata de política externa ou de expansão da revolução pelo mundo: o foco é o medo e as execuções dentro do país. Além disso, Stálin defendia o \"socialismo num só país\", e não um projeto internacionalista.","B":"Correta. \"Criminoso e assassino de camponeses\", \"execuções\" e o medo de falar (\"ninguém escuta nossos discursos\") denunciam a repressão do regime de Stálin.","C":"A NEP (Nova Política Econômica) foi criada por Lênin em 1921 e abandonada por Stálin, que a trocou pelos planos quinquenais e pela coletivização. E o que o poema caricatura é a figura de Stálin (\"dedos gordos como vermes\"), não uma política econômica.","D":"Não há nenhuma menção ao czar ou ao período czarista: o poema fala só do \"montanhês do Kremlin\". Uma comparação precisaria de dois termos no texto, e só um aparece.","E":"O poema não discute industrialização nem progresso; seu tema é a violência (\"execuções\", \"assassino\"). A fonte (um livro sobre a modernidade) pode puxar você para a E, mas o objeto da crítica é o terror, não a modernização."},"dica":"Em poema ou charge política, identifique o alvo (quem) e a acusação (o quê): Stálin + execuções + medo de falar = repressão.","dif":"fácil","nota":"","obs":""},{"id":"2024d2-26","n":26,"area":"Ciências Humanas","disc":"Geografia","assunto":"Mídia e conflitos geopolíticos","titulo":"Charge: guerras na TV como gêneros de filme na estante","gab":"E","base":null,"imgs":[{"src":"img/2024d2/q26_1.webp","w":783,"h":1903}],"alt":{"A":"aos interesses dos agentes econômicos em lucrar com as guerras, pois são obtidos ganhos com o comércio de produtos literários especializados sobre o tema.","B":"às ações terroristas em escala global, que refletem a problemática da intolerância cultural, que é reproduzida dos livros para as emissoras de televisão.","C":"ao processo de transformação do espaço mundial, que retrata os movimentos separatistas como se fossem roteiros de diferentes gêneros de filmes.","D":"ao controle espacial dos órgãos de imprensa, que procura assegurar a veiculação de informações sobre os conflitos mundiais em diversas fontes impressas de comunicação.","E":"à disseminação televisionada dos atos de violência, pois as tensões geopolíticas presentes no mundo são, agora, retratadas em tempo real."},"res":"Ideia-chave: perceber a ironia entre as etiquetas da estante e o que aparece nas telas.\nA charge mostra uma estante, como as de locadora ou livraria, com as categorias \"Comédia\", \"Horror\" e \"Drama\". Só que, no lugar de filmes, há televisores exibindo cenas de guerra: um cogumelo de explosão, soldados marchando sob aviões e ataques armados. Todas as telas trazem a faixa \"Breaking News\", que a própria questão traduz como \"notícia de última hora, notícia quente\".\nA crítica tem duas camadas:\n1) as guerras e tensões geopolíticas chegam ao público pela TV, ao vivo, como notícia urgente;\n2) exibidas sem parar, elas viram espetáculo, consumidas como se fossem um gênero de entretenimento escolhido na prateleira.\nPor isso a alternativa E está correta: a charge se refere \"à disseminação televisionada dos atos de violência\", com as tensões geopolíticas \"retratadas em tempo real\".","pq":{"A":"A charge não fala de lucro com venda de livros: os livros são só o cenário da estante, e o destaque está nas TVs com notícias. Não aparece nenhuma referência a \"produtos literários especializados\".","B":"Não há elementos de terrorismo nem de intolerância cultural; as cenas mostram guerra (explosão, tropas, aviões). E a ideia de violência \"reproduzida dos livros para as emissoras\" não tem base: a crítica é sobre a TV transformar a guerra em espetáculo.","C":"As telas não mostram movimentos separatistas, mas guerras e bombardeios em geral. A alternativa usa os rótulos de gêneros de filme para fisgar quem olhou só as etiquetas.","D":"A charge mostra televisores, não \"fontes impressas\", e não trata de \"controle espacial\" da imprensa. O tema é a forma espetacularizada como a TV transmite a violência.","E":"Correta. TVs com \"Breaking News\" mostrando guerras = violência geopolítica disseminada pela televisão em tempo real, tratada como entretenimento."},"dica":"Em charges, procure o contraste irônico: rótulos de entretenimento + notícias de guerra = espetacularização da violência pela mídia.","dif":"fácil","nota":"","obs":""},{"id":"2024d2-27","n":27,"area":"Ciências Humanas","disc":"Geografia","assunto":"Conflitos armados na África Subsaariana","titulo":"Mapa da África Subsaariana: concentração de vítimas de conflitos","gab":"A","base":null,"imgs":[{"src":"img/2024d2/q27_1.webp","w":781,"h":1627}],"alt":{"A":"à quantidade de vítimas fatais em razão dos conflitos armados que acontecem na região.","B":"ao agrupamento de pessoas vivendo abaixo da linha de pobreza, por efeitos de eventos sísmicos extremos.","C":"à epidemia provocada pelo vírus Ebola, em função da inexistência de vacinas para a prevenção da doença.","D":"ao deslocamento provocado pelo êxodo rural, resultado da escassez no abastecimento de alimentos.","E":"ao número de pessoas em situação de refúgio, devido às perseguições contra as minorias sionistas."},"res":"Ideia-chave: ver onde as manchas vermelhas se concentram e lembrar o que acontece nesses lugares.\nAs maiores concentrações de pontos aparecem em:\n- Sahel (Mali, Burkina Faso, Níger): insurgências de grupos jihadistas;\n- Nigéria: ação do Boko Haram e de outros grupos armados;\n- Etiópia: guerra civil recente, como o conflito no Tigré;\n- leste da República Democrática do Congo (DRC), junto a Uganda e Burundi: atuação de milícias.\nTodas são áreas conhecidas por conflitos armados. Os pontos vermelhos estão espalhados de forma pontual, como ocorrências registradas em locais específicos. Um mapa de pobreza, por exemplo, pintaria países ou regiões inteiras.\nAs outras alternativas trazem causas que não batem com esse padrão (terremotos, falta de vacina, êxodo rural, \"minorias sionistas\"). Portanto, o mapa representa \"a quantidade de vítimas fatais em razão dos conflitos armados que acontecem na região\".","pq":{"A":"Correta. As manchas se concentram no Sahel, na Nigéria, na Etiópia e no leste do Congo, focos conhecidos de conflitos armados com muitas mortes.","B":"A África Subsaariana não está entre as grandes zonas de terremotos do planeta, como o Círculo de Fogo do Pacífico. E a pobreza na região é ampla e não se limitaria a esses pontos isolados.","C":"Já existe vacina contra o Ebola, aprovada em 2019, então a justificativa \"inexistência de vacinas\" é falsa. E os grandes surtos ocorreram em Guiné, Serra Leoa, Libéria e na RDC, não no padrão do mapa, que destaca Sahel, Nigéria e Etiópia.","D":"O mapa mostra pontos de ocorrência, e não fluxos (setas) do campo para a cidade, como seria num mapa de êxodo rural. As manchas ficam em zonas de guerra, não necessariamente nas grandes cidades que recebem migrantes.","E":"Sionismo é o movimento nacional judeu ligado à criação de Israel. Não há perseguição a \"minorias sionistas\" como causa de refúgio na África Subsaariana; o termo está ali só para confundir."},"dica":"Em mapa temático, cruze a localização das manchas com o que você sabe da região: Sahel, Nigéria, Etiópia e leste do Congo = conflitos armados.","dif":"média","nota":"","obs":""},{"id":"2024d2-28","n":28,"area":"Ciências Humanas","disc":"Geografia","assunto":"Urbanização brasileira – rede urbana e integração metropolitana","titulo":"Trem Intercidades São Paulo–Campinas e a integração intermetropolitana","gab":"C","base":null,"imgs":[{"src":"img/2024d2/q28_1.webp","w":783,"h":1261}],"alt":{"A":"promove a formação de cinturões verdes, voltados para o abastecimento dessas cidades a partir do incentivo à monocultura de hortifrutis.","B":"favorece a especulação imobiliária nas duas metrópoles, decorrente da substituição do modal rodoviário pelo ferroviário.","C":"dinamiza os fluxos produtivos e de pessoas no espaço intermetropolitano, em decorrência desses investimentos na rede de infraestrutura logística.","D":"consolida a existência de uma megalópole, que é formada pela conurbação entre a metrópole nacional e a cidade de médio porte.","E":"potencializa diariamente a migração intrametropolitana, que é marcada pelo deslocamento do trabalhador da periferia para o centro das grandes cidades."},"res":"Ideia-chave: São Paulo e Campinas são duas metrópoles, e cada uma é sede da sua própria região metropolitana. A ligação entre elas é, portanto, **intermetropolitana**.\nO eixo São Paulo–Jundiaí–Campinas é um dos mais urbanizados e industrializados do país, parte da chamada Macrometrópole Paulista. Pessoas e mercadorias já circulam intensamente por ele, sobretudo pelas rodovias Anhanguera e Bandeirantes. O Trem Intercidades vai ligar as duas cidades num \"trajeto de 101 km\" e também atender \"Jundiaí, Louveira, Vinhedo e Valinhos\", cidades que ficam no caminho.\nInvestir em infraestrutura de transporte reduz o tempo de viagem e facilita o deslocamento diário de trabalhadores e estudantes. Também integra cadeias produtivas, empresas e serviços das duas regiões.\nPor isso, a integração \"dinamiza os fluxos produtivos e de pessoas no espaço intermetropolitano, em decorrência desses investimentos na rede de infraestrutura logística\". Alternativa C.","pq":{"A":"Cinturões verdes são áreas agrícolas no entorno das cidades que produzem hortaliças e frutas de forma diversificada (policultura), não em \"monocultura\". E uma linha de trem de passageiros não tem relação direta com produção agrícola.","B":"O trem não substitui as rodovias: soma-se a elas, e a Anhanguera e a Bandeirantes continuam funcionando. A premissa da \"substituição do modal rodoviário\" é falsa, e a notícia não trata de especulação imobiliária.","C":"Correta. Ligar duas regiões metropolitanas com infraestrutura de transporte intensifica a circulação de pessoas e de atividades produtivas entre elas.","D":"Campinas não é \"cidade de médio porte\": tem mais de 1 milhão de habitantes e é sede de região metropolitana. Além disso, uma megalópole se forma pela união de metrópoles, não de uma metrópole com uma cidade média.","E":"Intrametropolitano é o movimento dentro de uma mesma região metropolitana (periferia → centro). Aqui a ligação é entre duas regiões metropolitanas, ou seja, intermetropolitana. E deslocamento diário para o trabalho é movimento pendular, não migração."},"dica":"Intra = dentro de uma região metropolitana; inter = entre regiões metropolitanas. SP e Campinas são duas metrópoles, então a ligação é intermetropolitana.","dif":"média","nota":"","obs":""},{"id":"2024d2-29","n":29,"area":"Ciências Humanas","disc":"Sociologia","assunto":"Direitos humanos – migrantes e refugiados","titulo":"Migrantes e refugiados na catástrofe do RS: o papel do Clique Cidadania","gab":"D","base":null,"imgs":[{"src":"img/2024d2/q29_1.webp","w":781,"h":1674}],"alt":{"A":"o Brasil, sendo signatário do Tratado de Roma, deve assegurar igualmente o direito, a dignidade e o valor de cada cidadão ou pessoa estrangeira que se encontra desamparada dos benefícios da seguridade social.","B":"os recursos computacionais integram uma rede internacional de informações para garantir o direito à comunicação, acessíveis independentemente das condições de funcionamento dos sistemas locais de telecomunicações.","C":"a adoção de um plano de contingência da crise humanitária restringe a livre inciativa dos organismos internacionais de atuarem no território nacional em favor do direito das pessoas em condições de refúgio.","D":"as ferramentas digitais fornecem informações sobre como acessar programas e benefícios emergenciais e locais de abrigos, a fim de que as pessoas tenham conhecimentos sobre seus direitos.","E":"a utilização dos equipamentos tecnológicos com informações precisas dispensa o poder público local de atender as demandas e os direitos das pessoas em situação de vulnerabilidade."},"res":"Ideia-chave: a resposta está na finalidade das ações, que o próprio texto descreve.\nA mobilização é \"contrária à discriminação que pessoas migrantes e refugiadas têm enfrentado durante a catástrofe socioambiental\". Entre as ações estão a \"atualização do aplicativo Clique Cidadania\" e dos \"materiais informativos\" do ACNUR, \"para que pessoas de diferentes nacionalidades possam acessar e tomar decisões baseadas em informações oficiais atualizadas, fatos reais\".\nNuma emergência, migrantes e refugiados enfrentam barreiras extras: idioma, desinformação e discriminação. Muitas vezes não sabem a que benefícios têm direito, onde há abrigo ou como acessar programas do governo. Ferramentas digitais com informação oficial derrubam essa barreira e permitem que essas pessoas conheçam e reivindiquem seus direitos.\nÉ exatamente o que diz a alternativa D: as ferramentas digitais informam \"como acessar programas e benefícios emergenciais e locais de abrigos, a fim de que as pessoas tenham conhecimentos sobre seus direitos\".","pq":{"A":"O Tratado de Roma (1957) criou a Comunidade Econômica Europeia, e o Brasil não faz parte dele. Mesmo que se pense no Estatuto de Roma, este criou o Tribunal Penal Internacional, que julga crimes como genocídio, e não trata de seguridade social de estrangeiros.","B":"Aplicativos dependem de internet e de redes de telecomunicação, que podem ser afetadas numa catástrofe. Dizer que funcionam \"independentemente\" dos sistemas locais é falso, e o texto não afirma isso.","C":"O texto mostra o oposto de restrição: o governo (MDHC) atua em parceria com organismos internacionais (OIM e ACNUR). Há cooperação, não limitação à atuação deles.","D":"Correta. Repete a finalidade expressa no texto: dar acesso a informações oficiais para que migrantes e refugiados conheçam e exerçam seus direitos.","E":"A tecnologia complementa o poder público, não o substitui. O próprio aplicativo foi criado por um ministério, e o Estado continua obrigado a atender as pessoas vulneráveis."},"dica":"Prefira a alternativa que retoma a finalidade dita no texto (\"para que...\") e desconfie de termos absolutos como \"dispensa\", \"independentemente\" e \"restringe\".","dif":"fácil","nota":"","obs":""},{"id":"2024d2-30","n":30,"area":"Ciências Humanas","disc":"Geografia","assunto":"Circulação atmosférica – ventos alísios e correntes marítimas","titulo":"Barco da Mauritânia ao Pará: as setas de número 1 no mapa","gab":"E","base":null,"imgs":[{"src":"img/2024d2/q30_1.webp","w":783,"h":1668}],"alt":{"A":"das brisas oceânicas.","B":"das monções marítimas.","C":"dos ventos contra-alísios.","D":"da corrente de Humboldt.","E":"dos ventos alísios."},"res":"Ideia-chave: ler a direção das setas roxas (número 1) e lembrar a circulação geral da atmosfera.\nAcima da linha tracejada, as setas roxas vêm de nordeste para sudoeste; abaixo dela, vêm de sudeste para noroeste. Ou seja, convergem para a faixa equatorial. Esse é o padrão dos **ventos alísios**: eles sopram das altas pressões subtropicais (por volta de 30° de latitude) para a baixa pressão equatorial. Por causa da rotação da Terra, são alísios de nordeste no Hemisfério Norte e de sudeste no Hemisfério Sul.\nAs \"duas importantes forças naturais\" do enunciado são, portanto:\n- a Corrente Equatorial Norte (setas amarelas, já identificada na legenda);\n- os ventos alísios (setas roxas), que, aliás, são justamente o que empurra essa corrente para oeste.\nJuntos, vento e corrente levam um barco sem propulsão da costa da Mauritânia ao norte do Brasil, o que explica a travessia \"de sete a quinze dias\".","pq":{"A":"Brisas marítimas são ventos locais e diários que sopram do mar para a terra por diferença de aquecimento, numa faixa estreita do litoral. Não explicam setas que cruzam o Atlântico.","B":"Monções são ventos sazonais que invertem de sentido entre verão e inverno, típicos do Sul e do Sudeste da Ásia (Oceano Índico). O mapa mostra ventos constantes convergindo para o Equador no Atlântico.","C":"Contra-alísios sopram em altitude e no sentido oposto, do Equador para as zonas subtropicais. Lá no alto e na direção contrária, não empurrariam o barco rumo ao Brasil.","D":"A corrente de Humboldt é uma corrente marítima fria do Oceano Pacífico, no litoral do Chile e do Peru: oceano errado. Além disso, a corrente marítima do mapa já está na legenda (setas amarelas: Corrente Equatorial Norte).","E":"Correta. Setas de NE (Hemisfério Norte) e de SE (Hemisfério Sul) convergindo para o Equador são os ventos alísios."},"dica":"Alísios sopram dos trópicos para o Equador (de NE no Hemisfério Norte e de SE no Sul); os contra-alísios fazem o caminho inverso, em altitude.","dif":"média","nota":"","obs":""},{"id":"2024d2-31","n":31,"area":"Ciências Humanas","disc":"Geografia","assunto":"Saneamento básico no Brasil – leitura de gráfico","titulo":"Esgotamento sanitário por região (2000, 2010, 2022): gráfico do IBGE","gab":"A","base":null,"imgs":[{"src":"img/2024d2/q31_1.webp","w":781,"h":1982}],"alt":{"A":"apresentou, em 2022, melhoria em relação aos anos anteriores, porém uma parte do volume produzido é despejado diretamente nos rios, resultando em doenças que podem levar à morte por contaminação, e que poderiam ser evitadas.","B":"mostrou, em 2010, um recuo na região Norte em comparação com os anos 2000, contudo a interligação das comunidades ribeirinhas às redes de coleta de esgoto das grandes cidades melhorou a qualidade de vida da população local.","C":"encerrou, em 2022, o ciclo de expansão nas regiões Sul e Sudeste e, embora os dados sejam condizentes com o grau de urbanização dessas regiões, as áreas rurais continuam descartando seus efluentes em águas fluviais.","D":"reduziu os efeitos históricos do desequilíbrio regional com a expansão da rede de infraestrutura por todo o país, no entanto o processo de despoluição dos cursos onde os efluentes foram despejados permanece sem investimentos.","E":"passou por um processo de universalização em virtude da Lei do Novo Marco Legal do Saneamento, entretanto transferiu para a iniciativa privada a gestão do serviço, ocasionando aumento significativo na taxa de esgoto nos municípios."},"res":"Ideia-chave: o gráfico mostra avanço, mas um avanço incompleto.\n\n1) A legenda \"Brasil\" mostra a evolução nacional: 59,2% (2000) → 64,5% (2010) → 75,7% (2022). Então, em 2022, houve melhoria em relação aos anos anteriores, e essa é a primeira parte de A.\n\n2) Mesmo assim, 100 − 75,7 = 24,3% dos moradores ainda não têm esgoto ligado à rede coletora, à rede pluvial ou a uma fossa séptica. No Norte, só 46,4% têm esse atendimento; no Nordeste, 58,1%. O esgoto dessa população acaba indo para valas, córregos e rios sem tratamento.\n\n3) Esgoto sem tratamento contamina a água e espalha doenças de veiculação hídrica, como diarreias, hepatite A e leptospirose. Essas doenças podem matar, sobretudo crianças, e poderiam ser evitadas com saneamento adequado.\n\nPor isso, A é a única alternativa que junta corretamente o dado do gráfico (melhoria) com o conhecimento sobre o problema (falta de cobertura e contaminação dos rios).","pq":{"A":"Correta. O índice nacional subiu para 75,7% em 2022, mas cerca de um quarto da população ainda fica sem esgotamento adequado, e esse esgoto contamina rios e causa doenças evitáveis.","B":"A primeira parte é verdadeira: no Norte, o índice caiu de 33,5% para 31,1%. O erro está no resto. Não houve ligação de comunidades ribeirinhas às redes das grandes cidades, o que nem seria viável com populações tão dispersas, e o próprio gráfico mostra piora, não melhoria, nesse período.","C":"Nada indica que a expansão tenha terminado. O Sul saltou de 70,4% para 83,9% justamente em 2022, e nem o Sul nem o Sudeste (90,7%) chegaram a 100%.","D":"A desigualdade regional continua grande: em 2022, o Norte tem 46,4% e o Sudeste, 90,7%, o dobro. Além disso, dizer que a despoluição dos rios \"permanece sem investimentos\" é uma generalização absoluta que nem o gráfico nem a realidade sustentam.","E":"Não houve universalização: o Brasil está em 75,7%. O Novo Marco Legal (Lei 14.026/2020) definiu metas para 2033 (90% da população com coleta e tratamento de esgoto) e estimulou concessões por licitação, mas não transferiu toda a gestão para empresas privadas. O gráfico também não diz nada sobre aumento de tarifas."},"dica":"Em alternativas de duas partes (\"apresentou X, porém Y\"), confira as duas metades. Muitas vezes a primeira bate com o gráfico e a segunda é que traz o erro, ou o contrário.","dif":"média","nota":"","obs":""},{"id":"2024d2-32","n":32,"area":"Ciências Humanas","disc":"Geografia","assunto":"Cartografia – escala numérica","titulo":"Percurso de 12 000 km da tocha olímpica em mapa na escala 1:20.000.000","gab":"B","base":null,"imgs":[{"src":"img/2024d2/q32_1.webp","w":783,"h":527}],"alt":{"A":"24 cm.","B":"60 cm.","C":"6 cm.","D":"240 cm.","E":"600 cm."},"res":"Ideia-chave: a escala 1:20.000.000 quer dizer que 1 cm no mapa representa 20.000.000 cm no terreno.\n\n1) Converta a escala para km:\n20.000.000 cm ÷ 100 = 200.000 m\n200.000 m ÷ 1.000 = 200 km\nLogo, 1 cm no mapa = 200 km reais.\n\n2) Divida o percurso real por esse valor:\n12 000 km ÷ 200 km/cm = 60 cm\n\nOutra forma, tudo em centímetros:\n12 000 km = 12 000 × 100 000 cm = 1 200 000 000 cm\n1 200 000 000 ÷ 20 000 000 = 60 cm\n\nA linha no mapa teria, portanto, 60 cm, que é a alternativa B.","pq":{"A":"24 cm equivale a usar 1 cm = 500 km. Esse valor costuma aparecer quando se multiplica 12 por 2 em vez de dividir 12 000 km por 200 km.","B":"Correta: 1 cm = 200 km, então 12 000 ÷ 200 = 60 cm.","C":"6 cm equivale a usar 1 cm = 2 000 km, ou seja, sobrou um zero na conversão da escala (dividir por 2 000 em vez de 200).","D":"240 cm equivale a usar 1 cm = 50 km. É o resultado de multiplicar 12 000 por 2 (em vez de dividir) e ajustar os zeros de qualquer jeito.","E":"600 cm equivale a usar 1 cm = 20 km, ou seja, faltou um zero na conversão (20.000.000 cm são 200 km, não 20 km)."},"dica":"Para converter a escala para km, corte cinco zeros do denominador (cm → km): 1:20.000.000 vira 1 cm = 200 km.","dif":"fácil","nota":"","obs":""},{"id":"2024d2-33","n":33,"area":"Ciências Humanas","disc":"Sociologia","assunto":"Identidade social – perspectivas essencialistas e não-essencialistas","titulo":"Identidade social na perspectiva não-essencialista","gab":"C","base":null,"imgs":[{"src":"img/2024d2/q33_1.webp","w":783,"h":934}],"alt":{"A":"traços sociais estáticos que conservam a memória coletiva de um grupo étnico majoritário.","B":"situações invariáveis, originais e autênticas compartilhadas por todos os membros desse grupo.","C":"componentes dinâmicos, sujeitos a transformações constantes e práticas de construção social.","D":"elementos biológicos, estabelecidos a partir de aspectos naturais como características do corpo.","E":"fatores históricos de um passado comum considerado verdadeiro pelos membros desse grupo."},"res":"Ideia-chave: o essencialismo trata a identidade como uma \"essência\" fixa. O não-essencialismo trata a identidade como algo construído.\n\nO enunciado opõe duas formas de ver a identidade e fala em \"processos de reconhecimento ou construção da identidade social de grupos\":\n\n- Perspectiva essencialista: a identidade seria um núcleo fixo, autêntico e igual para todos os membros do grupo. Esse núcleo viria da biologia (corpo, \"raça\") ou de uma origem histórica tida como verdadeira e imutável.\n- Perspectiva não-essencialista, presente em autores como Stuart Hall e Kathryn Woodward: a identidade é histórica e relacional. Ela é produzida em práticas sociais, discursos e na relação com a diferença (\"nós\" e \"os outros\"), e por isso muda com o tempo.\n\nA alternativa C traduz exatamente essa segunda visão: \"componentes dinâmicos, sujeitos a transformações constantes e práticas de construção social\". As outras descrevem, de formas diferentes, a visão essencialista.","pq":{"A":"Errada. \"Traços estáticos\" é justamente o que o não-essencialismo recusa. Além disso, ligar a identidade a um \"grupo étnico majoritário\" restringe o conceito sem motivo.","B":"Errada. \"Invariáveis, originais e autênticas\" e \"compartilhadas por todos\" é a definição de essência fixa, ou seja, a visão essencialista.","C":"Correta. Para o não-essencialismo, a identidade é construída socialmente e se transforma o tempo todo; não é uma essência dada.","D":"Errada. Basear a identidade em aspectos biológicos e no corpo é o essencialismo biológico, o oposto do que se pede.","E":"Errada. Apoiar a identidade em um passado comum tido como \"verdadeiro\" e fixo é o essencialismo histórico. O não-essencialista vê esse passado como algo reinterpretado e reconstruído no presente."},"dica":"Essencialista = fixo, natural, autêntico, invariável. Não-essencialista = construído, histórico, relacional, em transformação.","dif":"fácil","nota":"","obs":""},{"id":"2024d2-34","n":34,"area":"Ciências Humanas","disc":"Filosofia","assunto":"Materialismo histórico – trabalho e produção da vida material","titulo":"Marx e Engels: o primeiro pressuposto para \"fazer história\"","gab":"E","base":null,"imgs":[{"src":"img/2024d2/q34_1.webp","w":781,"h":963}],"alt":{"A":"à luta de classes que permite estabelecer a ditadura do capital.","B":"ao desenvolvimento das forças produtivas industriais da modernidade.","C":"aos sistemas político e jurídico, assim como aos diversos códigos morais e éticos.","D":"à superação do mercantilismo próprio das relações capitalistas de trabalho.","E":"à produção dos meios para satisfazer necessidades naturais humanas."},"res":"Ideia-chave: para o materialismo histórico, antes de qualquer política, religião ou moral, o ser humano precisa produzir a própria vida material.\n\nO enunciado diz que \"o primeiro pressuposto de toda a existência humana é o de que os indivíduos precisam estar em condições adequadas para viver e 'fazer história'\". Em A Ideologia Alemã, Marx e Engels explicam que, para viver, é preciso antes de tudo comer, beber, morar e se vestir. O primeiro ato histórico é, então, produzir os meios para satisfazer essas necessidades, por meio do trabalho.\n\nIsso combina com a primeira frase do enunciado, que dá ao trabalho \"um papel fundador da realidade social\". A base material (a produção) vem primeiro. Política, direito e moral são construções posteriores, que se erguem sobre essa base.\n\nPor isso, a alternativa E é a correta: as condições para fazer história são a \"produção dos meios para satisfazer necessidades naturais humanas\".","pq":{"A":"Errada. A luta de classes é um motor da história, mas não o pressuposto inicial da existência. E Marx fala em \"ditadura do proletariado\", não em uma luta de classes que serve para estabelecer a \"ditadura do capital\".","B":"Errada. O pressuposto vale para toda a história humana, não só para a indústria moderna. A alternativa prende ao capitalismo industrial algo que é universal.","C":"Errada. Sistemas político e jurídico e códigos morais pertencem à superestrutura, que para Marx depende da base material. Eles não são o primeiro pressuposto.","D":"Errada. A alternativa está historicamente confusa (o mercantilismo não é \"próprio das relações capitalistas de trabalho\") e trata a superação de uma fase específica como se fosse condição de toda a existência humana.","E":"Correta. Para viver e fazer história, os seres humanos precisam primeiro produzir, pelo trabalho, os meios de satisfazer necessidades básicas como alimento, moradia e vestimenta."},"dica":"Em questões sobre materialismo histórico, lembre que a produção da vida material (trabalho para suprir necessidades) vem antes de tudo; política, direito e moral vêm depois.","dif":"média","nota":"","obs":""},{"id":"2024d2-35","n":35,"area":"Ciências Humanas","disc":"Filosofia","assunto":"Escola de Frankfurt – Walter Benjamin e a arte","titulo":"Walter Benjamin e as novas características da produção cultural","gab":"D","base":null,"imgs":[{"src":"img/2024d2/q35_1.webp","w":781,"h":805}],"alt":{"A":"relevância da mais valia na produção cultural.","B":"produção artística das classes populares.","C":"superioridade tecnológica da Arte no século XX.","D":"reprodutibilidade técnica das obras de arte.","E":"beleza transcendente própria das obras de arte."},"res":"Ideia-chave: o ensaio mais conhecido de Walter Benjamin, dos anos 1930, chama-se \"A obra de arte na era de sua reprodutibilidade técnica\".\n\nO enunciado pede a análise que Benjamin faz das \"novas características da produção cultural que surge nas primeiras décadas desse século\". Nesse período se difundem a fotografia e o cinema, que permitem copiar uma obra em série, em escala técnica.\n\nBenjamin mostra que essa reprodutibilidade técnica:\n- faz a obra perder a \"aura\", aquela presença única do original, ligada ao \"aqui e agora\";\n- desloca a arte do valor de culto (objeto raro e ritual) para o valor de exposição (acessível às massas);\n- muda a forma como o público recebe e percebe a arte.\n\nPortanto, a análise focaliza a reprodutibilidade técnica das obras de arte, alternativa D.\n\nCuriosidade útil: o termo \"indústria cultural\" foi cunhado por Adorno e Horkheimer. Benjamin, ligado ao mesmo círculo, olhava a reprodução técnica com uma visão mais ambígua, que reconhecia nela também um potencial de democratizar a arte.","pq":{"A":"Errada. Mais-valia é um conceito econômico de Marx (o trabalho não pago apropriado pelo capitalista). Não é o foco da análise de Benjamin sobre a arte.","B":"Errada. Benjamin não estuda a arte produzida pelas classes populares. Ele estuda como a técnica muda a obra e sua recepção pelas massas.","C":"Errada. Benjamin não defende uma \"superioridade tecnológica\" da arte. Ele analisa como a técnica transforma o estatuto da obra, por exemplo com a perda da aura.","D":"Correta. É o tema central do ensaio \"A obra de arte na era de sua reprodutibilidade técnica\": a cópia técnica em série (fotografia, cinema) e seus efeitos.","E":"Errada. A beleza transcendente e única está ligada justamente à aura, que, segundo Benjamin, entra em declínio com a reprodução técnica. Ele analisa essa perda; não exalta essa beleza."},"dica":"Walter Benjamin = reprodutibilidade técnica + perda da aura. Adorno e Horkheimer = indústria cultural.","dif":"média","nota":"","obs":""},{"id":"2024d2-36","n":36,"area":"Ciências Humanas","disc":"Sociologia","assunto":"Partidos políticos na Constituição de 1988 – Fundo Partidário e cláusula de desempenho","titulo":"Art. 17 da Constituição: condição de acesso ao Fundo Partidário","gab":"A","base":null,"imgs":[{"src":"img/2024d2/q36_1.webp","w":783,"h":1027}],"alt":{"A":"a eleição de pelo menos quinze deputados federais em pelo menos um terço das unidades da Federação.","B":"o recebimento de recursos financeiros de partidos, entidades ou governos estrangeiros.","C":"a atuação parlamentar de acordo com os princípios éticos de decoro e conduta exemplar.","D":"o tempo de propaganda gratuita no rádio e na televisão a ser distribuído entre as candidaturas.","E":"o registro em cartório dos respectivos estatutos com firma reconhecida dos fundadores do partido."},"res":"Ideia-chave: a chamada cláusula de desempenho (ou cláusula de barreira), incluída no art. 17 pela Emenda Constitucional 97/2017.\n\nPelo § 3º do art. 17, só têm direito aos recursos do Fundo Partidário e ao acesso gratuito ao rádio e à TV os partidos que atingirem um desempenho mínimo nas eleições para a Câmara dos Deputados. Há duas formas de cumprir a exigência:\n- obter uma porcentagem mínima dos votos válidos (3%), distribuídos em pelo menos um terço das unidades da Federação; ou\n- eleger pelo menos quinze deputados federais distribuídos em pelo menos um terço das unidades da Federação.\n\nA segunda forma é exatamente a alternativa A. A emenda prevê uma transição gradual: as exigências sobem a cada eleição até chegar a esses números.\n\nO objetivo é limitar a fragmentação partidária. Partidos sem representatividade mínima deixam de receber dinheiro público.\n\nTambém dá para chegar à resposta por eliminação: B é proibido pela própria Constituição, C trata de mandato e não de partido, D é um benefício (e não uma condição) e E se refere à criação do partido.","pq":{"A":"Correta. É a cláusula de desempenho do art. 17, § 3º: eleger ao menos quinze deputados federais em pelo menos um terço das unidades da Federação garante acesso ao Fundo Partidário.","B":"Errada. É o oposto do que a Constituição diz: o art. 17 proíbe partidos de receber recursos de entidades ou governos estrangeiros. Isso é vedação, não condição.","C":"Errada. Decoro parlamentar diz respeito à conduta individual do parlamentar e pode levar à perda do mandato. Não é um requisito do art. 17 para o partido acessar o Fundo Partidário.","D":"Errada. O acesso gratuito ao rádio e à TV não é condição para receber o Fundo; é outro benefício, garantido pela mesma cláusula de desempenho. A alternativa confunde direito com requisito.","E":"Errada. O art. 17 determina que os partidos registrem seus estatutos no Tribunal Superior Eleitoral, depois de adquirirem personalidade jurídica. Isso faz parte da criação do partido, não do desempenho exigido para ter acesso ao Fundo. A \"firma reconhecida dos fundadores\" não aparece no artigo."},"dica":"Fundo Partidário + tempo de rádio e TV = cláusula de desempenho (EC 97/2017): o partido precisa de votos ou de deputados eleitos espalhados por pelo menos 1/3 das unidades da Federação.","dif":"difícil","nota":"","obs":""},{"id":"2024d2-37","n":37,"area":"Ciências Humanas","disc":"Sociologia","assunto":"Direitos sociais e política tributária","titulo":"Paradoxo entre direitos sociais e limites fiscais: taxação progressiva","gab":"A","base":null,"imgs":[{"src":"img/2024d2/q37_1.webp","w":781,"h":1364}],"alt":{"A":"a revisão da política tributária de taxação conforme a renda, sobretudo de grandes fortunas.","B":"o uso de mecanismos fiscais para cálculo proporcional de tributos municipais e estaduais.","C":"a aprovação de normas tributárias de isenção fiscal que incentivem a produção industrial.","D":"a promoção do equilíbrio fiscal por meio de políticas públicas que diminuam os custos sociais.","E":"o incentivo ao não trabalho por meio da implementação de programas de renda mínima."},"res":"Ideia-chave: identificar exatamente qual é o paradoxo e procurar a alternativa que o resolve sem sacrificar os direitos.\n\nDe um lado, a Constituição garante direitos sociais e uma renda básica a \"todo brasileiro em situação de vulnerabilidade social\". De outro, \"políticas fiscais e orçamentárias estabelecem limites para que a proteção à dignidade da pessoa vulnerável se efetive\". Ou seja: o direito existe, mas falta dinheiro (orçamento) para torná-lo real.\n\nPara resolver isso \"em prol da preservação dos direitos sociais\", não se pode cortar o direito; é preciso ampliar a arrecadação de forma justa. A alternativa A propõe exatamente isso: taxar conforme a renda (tributação progressiva — quem ganha mais paga proporcionalmente mais), \"sobretudo de grandes fortunas\". Assim, o Estado obtém recursos para financiar programas de transferência de renda e reduz a desigualdade ao mesmo tempo, sem violar a responsabilidade fiscal.\n\nAs demais alternativas ou não aumentam os recursos, ou diminuem a arrecadação, ou cortam os próprios direitos sociais.","pq":{"A":"Correta. Tributar conforme a renda e as grandes fortunas aumenta a arrecadação de quem tem mais capacidade de pagar, criando recursos para financiar os direitos sociais dentro dos limites orçamentários.","B":"Cálculo proporcional (alíquota igual para todos) não é progressivo: não cobra mais de quem tem mais e não resolve a falta de recursos para os direitos sociais. Além disso, restringe-se a tributos municipais e estaduais, sem enfrentar o problema central.","C":"Isenção fiscal significa o Estado abrir mão de arrecadação. Com menos dinheiro em caixa, os limites orçamentários ficam ainda mais apertados — agrava o paradoxo em vez de resolvê-lo.","D":"\"Diminuir os custos sociais\" é cortar gastos com saúde, educação, assistência etc. Isso até equilibra as contas, mas às custas dos direitos sociais, o oposto de \"preservação dos direitos sociais\".","E":"Parte de um preconceito (renda mínima como estímulo à preguiça) que o texto não sustenta: ele trata a renda básica como direito constitucional. E \"incentivar o não trabalho\" não resolve a falta de recursos para financiá-la."},"dica":"Quando o problema é \"direito garantido x falta de orçamento\", a solução que preserva o direito é aumentar a arrecadação de forma justa (tributação progressiva), não cortar gastos sociais nem conceder isenções.","dif":"média","nota":"","obs":""},{"id":"2024d2-38","n":38,"area":"Ciências Humanas","disc":"Filosofia","assunto":"Platão – justiça e governo na República","titulo":"Justiça política em Platão: o governo do rei-filósofo","gab":"B","base":null,"imgs":[{"src":"img/2024d2/q38_1.webp","w":783,"h":719}],"alt":{"A":"demagogo.","B":"rei-filósofo.","C":"soberano.","D":"sofista.","E":"príncipe."},"res":"Ideia-chave: na cidade ideal de Platão, quem governa é quem tem sabedoria, ou seja, o filósofo.\n\nO texto descreve a divisão da pólis em três grupos: \"os sábios legisladores devem governar\"; os militares defendem a cidade; e a classe econômica assegura a sobrevivência. A justiça política acontece quando cada grupo cumpre a sua função, sob o comando dos sábios.\n\nEsses \"sábios legisladores\" são, na teoria platônica, os filósofos: por conhecerem o Bem e as Ideias, são os únicos capazes de governar com justiça. Daí a figura do rei-filósofo — o governante que é filósofo (ou o rei que se torna filósofo). E esse governante é formado justamente pela educação, que o texto aponta como caminho: \"Como conquistar a justiça política? Pela educação dos cidadãos\".\n\nLogo, a justiça política seria alcançada, entre outros fatores, por meio de um rei-filósofo.","pq":{"A":"O demagogo é quem manipula o povo com discursos e promessas para ganhar poder. Platão o criticava, pois governa pela opinião e pela emoção, não pelo conhecimento.","B":"Correta. Para Platão, devem governar os sábios, isto é, os filósofos, formados pela educação — o rei-filósofo da República.","C":"\"Soberano\" remete à teoria contratualista, especialmente a Hobbes (Leviatã), séculos depois de Platão. Não é o termo da teoria platônica de governo pelos sábios.","D":"Os sofistas eram justamente os adversários de Platão: ensinavam retórica e persuasão em troca de pagamento, sem compromisso com a verdade. Platão jamais os colocaria no governo.","E":"\"Príncipe\" é o governante da obra de Maquiavel (O Príncipe), do Renascimento, focada na conquista e manutenção do poder, não na sabedoria e na educação filosófica."},"dica":"Platão = governo dos sábios: o filósofo governa porque conhece o Bem; associe a República ao rei-filósofo, Hobbes ao soberano e Maquiavel ao príncipe.","dif":"fácil","nota":"","obs":""},{"id":"2024d2-39","n":39,"area":"Ciências Humanas","disc":"Sociologia","assunto":"Antropologia – diversidade cultural","titulo":"Usos das máscaras em diferentes povos, segundo Franz Boas","gab":"C","base":null,"imgs":[{"src":"img/2024d2/q39_1.webp","w":783,"h":1204}],"alt":{"A":"padroniza os comportamentos sociais e culturais em festividades populares.","B":"consolida o relativismo cultural em apresentações teatrais.","C":"revela a diversidade cultural por meio dos diferentes usos que se faz delas.","D":"reforça o etnocentrismo típico do contato entre indivíduos geograficamente isolados.","E":"evidencia os avanços das manifestações e das técnicas artísticas contemporâneas."},"res":"Ideia-chave: o texto mostra que um mesmo objeto (a máscara) ganha significados diferentes em cada cultura.\n\nBoas enumera vários usos distintos:\n1) proteção: \"As máscaras são usadas para enganar os espíritos quanto à identidade daquele que as usa\";\n2) afastar o mal: a máscara \"representa um espírito personificado pelo mascarado, que, dessa forma, afugenta outros espíritos hostis\";\n3) memória: \"Outras máscaras, ainda, são comemorativas\";\n4) teatro: \"empregadas em representações teatrais para ilustrar incidentes mitológicos\".\n\nSe o uso de máscaras aparece \"num grande número de povos\", mas com finalidades tão variadas, a conclusão é que esse costume revela a diversidade cultural: cada povo atribui um sentido próprio a um objeto semelhante. É exatamente isso que afirma a alternativa C.","pq":{"A":"O texto mostra o contrário de padronização: os usos variam (proteção, espíritos, memória, teatro). Além disso, não se fala em \"festividades populares\".","B":"Pegadinha: Boas é ligado ao relativismo cultural, mas o texto não diz que o teatro \"consolida\" esse relativismo. O uso teatral é apenas um entre vários; a alternativa reduz tudo a ele.","C":"Correta. O texto lista diferentes finalidades para as máscaras em vários povos, o que evidencia a diversidade cultural.","D":"Etnocentrismo é julgar outras culturas a partir da própria, tomada como superior. O texto apenas descreve os usos sem hierarquizá-los, e não trata de contato entre povos isolados.","E":"O texto fala de práticas tradicionais e rituais (espíritos, doenças, mortos, mitos), não de técnicas artísticas contemporâneas nem de \"avanços\"."},"dica":"Quando um texto antropológico mostra o mesmo costume com sentidos diferentes em cada povo, a ideia central é diversidade cultural — desconfie de alternativas com \"padroniza\" ou \"etnocentrismo\".","dif":"fácil","nota":"","obs":""},{"id":"2024d2-40","n":40,"area":"Ciências Humanas","disc":"Filosofia","assunto":"Descartes – cogito e dúvida metódica","titulo":"Charge \"Penso, logo existo\": o cogito de Descartes","gab":"C","base":null,"imgs":[{"src":"img/2024d2/q40_1.webp","w":781,"h":1220}],"alt":{"A":"o raciocínio proporciona debates pautados na democracia.","B":"o pensamento possibilita o acesso à vida além da morte corpórea.","C":"a consciência do pensamento decorrente da dúvida é a prova da existência humana.","D":"a razão é consequência do conhecimento adquirido na prática.","E":"a dúvida é um método inseguro para o acesso ao conhecimento."},"res":"Ideia-chave: \"Penso, logo existo\" (cogito, ergo sum) é a primeira certeza a que Descartes chega depois de duvidar de tudo.\n\nNa charge, o personagem à esquerda, que representa Descartes, diz: \"Lembre-se: 'Penso, logo existo'\".\n\nO raciocínio de Descartes é o seguinte:\n1) Ele aplica a dúvida metódica: duvida de tudo o que pode ser posto em dúvida (sentidos, mundo exterior, até o próprio corpo).\n2) Mas, enquanto duvida, percebe que está pensando — e duvidar é uma forma de pensar.\n3) Se pensa, precisa existir para pensar. Essa é uma certeza que nenhuma dúvida consegue derrubar.\n\nPortanto, a consciência de que se está pensando, que surge do próprio ato de duvidar, prova a existência do sujeito. É o que diz a alternativa C.\n\nA fala do personagem da direita (\"Discordo, logo ofendo\") é a crítica humorística ao comportamento nas redes sociais, mas a pergunta pede só a frase de Descartes.","pq":{"A":"Mistura a fala de Descartes com a crítica do outro personagem sobre debates nas redes. O cogito não trata de democracia nem de debate público, e sim da certeza da própria existência.","B":"O cogito prova que o sujeito existe enquanto pensa, aqui e agora; a frase não fala de vida após a morte do corpo.","C":"Correta. Ao duvidar de tudo, Descartes percebe que está pensando, e essa consciência do pensamento é a prova indubitável de que ele existe.","D":"Isso é a tese empirista (conhecimento vindo da experiência/prática), oposta a Descartes, que é racionalista: a certeza do cogito vem da razão, não da prática.","E":"Para Descartes é o contrário: a dúvida metódica é o caminho seguro para chegar a verdades indubitáveis, e foi por meio dela que ele chegou ao \"penso, logo existo\"."},"dica":"Descartes = racionalismo + dúvida metódica: duvidar é pensar, e pensar prova que eu existo (cogito, ergo sum).","dif":"fácil","nota":"","obs":""},{"id":"2024d2-41","n":41,"area":"Ciências Humanas","disc":"Filosofia","assunto":"Nietzsche – super-homem e transvaloração dos valores","titulo":"Super-homem de Nietzsche: abandono dos valores vigentes","gab":"E","base":null,"imgs":[{"src":"img/2024d2/q41_1.webp","w":781,"h":715}],"alt":{"A":"a força conquistada pela religiosidade.","B":"a afirmação do gênero masculino.","C":"a onipresença do poder político.","D":"o incentivo a vivências altruístas.","E":"o abandono dos valores vigentes."},"res":"Ideia-chave: o super-homem (além-do-homem) é aquele que deixa de obedecer aos valores herdados e cria os seus próprios.\n\nO texto afirma que o homem \"deve criar novos valores e pô-los em prática\". Ele contrasta duas figuras:\n1) \"O homem embrutecido tem a espinha curvada diante das ilusões cruéis do sobrenatural\" — ou seja, submete-se aos valores tradicionais, sobretudo os religiosos.\n2) O super-homem \"ama a vida\" e \"cria o sentido da terra\" — ele não busca sentido num além, mas nesta vida, e cria valores próprios.\n\nPara criar novos valores, é preciso romper com os antigos. É o que Nietzsche chama de transvaloração dos valores: deixar para trás os valores vigentes (como a moral tradicional de base religiosa) e afirmar a vida. Por isso, o conceito de super-homem revela o abandono dos valores vigentes — alternativa E.","pq":{"A":"O texto diz o contrário: quem se curva ao \"sobrenatural\" é o \"homem embrutecido\". O super-homem rompe com a religiosidade e busca o \"sentido da terra\".","B":"Pegadinha da palavra \"homem\": em Nietzsche, super-homem (Übermensch) se refere ao ser humano que supera a si mesmo, não ao gênero masculino.","C":"\"Vontade de poder\" não é dominação política; no texto, ela aparece como a força de amar a vida e criar valores. Não há referência a poder político.","D":"O texto não fala em altruísmo. O foco é a criação de valores próprios e a afirmação da vida, e Nietzsche é conhecido justamente por criticar a moral tradicional, não por incentivá-la.","E":"Correta. O super-homem cria \"novos valores\" e deixa de se curvar às \"ilusões cruéis do sobrenatural\", ou seja, abandona os valores estabelecidos."},"dica":"Nietzsche: super-homem = quem supera a moral tradicional e cria os próprios valores (transvaloração), afirmando a vida terrena em vez de um além.","dif":"média","nota":"","obs":""},{"id":"2024d2-42","n":42,"area":"Ciências Humanas","disc":"Sociologia","assunto":"Trabalho infantil e efetividade da lei (ECA)","titulo":"ECA x PNAD: trabalho infantil cresce apesar da proibição legal","gab":"E","base":null,"imgs":[{"src":"img/2024d2/q42_1.webp","w":783,"h":1458}],"alt":{"A":"a necessidade das famílias resulta em oportunidade para crianças e adolescentes de acesso à cidadania.","B":"a permanência escolar por meio de políticas públicas tem reduzido os índices de trabalho infantil.","C":"a inserção no mercado de trabalho é uma forma de inclusão social para a juventude.","D":"a legislação vigente é relutante quanto à absorção das determinações de organizações internacionais.","E":"a efetivação da legislação vigente esbarra em significativos obstáculos sociais e econômicos."},"res":"Ideia-chave: comparar o que a lei manda (Texto 1) com o que a realidade mostra (Texto 2).\n\nTexto 1 (ECA): \"É proibido qualquer trabalho a menores de quatorze anos de idade.\"\n\nTexto 2 (IBGE): \"Em 2022, havia 1,9 milhão de crianças e adolescentes entre 5 e 17 anos em situação de trabalho infantil no país\", o que representa \"4,9% da população nessa faixa etária\". E mais: o número \"vinha caindo desde 2016, no entanto, em 2022, esse contingente cresceu\".\n\nConclusão: existe uma lei clara proibindo o trabalho infantil, mas milhões de crianças e adolescentes continuam trabalhando, e o problema voltou a aumentar. Ou seja, a lei existe, mas não se efetiva plenamente. Isso acontece porque há obstáculos sociais e econômicos (pobreza, necessidade de complementar a renda familiar, desigualdade) que empurram crianças para o trabalho. É o que afirma a alternativa E.","pq":{"A":"Trata o trabalho infantil como \"oportunidade\" de cidadania, quando o Texto 1 o proíbe justamente por violar direitos da criança. A alternativa contradiz a lei.","B":"Contradiz o Texto 2: de 2019 para 2022 o trabalho infantil aumentou (\"em 2022, esse contingente cresceu\"). Além disso, nenhum texto fala de permanência escolar.","C":"Apresenta o trabalho precoce como inclusão social, visão que a lei rejeita ao proibi-lo. Os textos tratam o trabalho infantil como problema, não como solução.","D":"Nenhum dos dois textos menciona organizações internacionais. A alternativa traz informação de fora e ainda acusa a lei de \"relutante\", sem base nos textos.","E":"Correta. A lei proíbe o trabalho infantil, mas 1,9 milhão de crianças e adolescentes ainda trabalham e o número voltou a crescer: a aplicação da lei esbarra em obstáculos sociais e econômicos."},"dica":"Em questões com \"lei x dado estatístico\", a conclusão costuma ser a distância entre a norma e a realidade: a lei existe, mas a efetivação esbarra em problemas sociais.","dif":"fácil","nota":"","obs":""}],"grupos":{}},"2023d1":{"ano":2023,"dia":1,"descricao":"Linguagens (Português, Literatura, Inglês) e Ciências da Natureza (Biologia, Química, Física).","questoes":[{"id":"2023d1-01","n":1,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Interpretação de charge – linguagem verbal e não verbal","titulo":"Charge do Lute: queda do desmatamento e esperança na Amazônia","gab":"D","base":null,"imgs":[{"src":"img/2023d1/q01_1.webp","w":781,"h":1350}],"alt":{"A":"um retrocesso quanto ao desmatamento da Amazônia, onde quase nada sobrou.","B":"uma chance remota de melhora da Amazônia, onde o desmatamento foi de 61%.","C":"um aumento descomunal do desmatamento na Amazônia, já sem vegetação.","D":"uma perspectiva de salvação para a Amazônia, apesar dos descuidos já vividos.","E":"uma esperança para a fauna e a flora da Amazônia, com o fim do desmatamento."},"res":"Ideia-chave: a charge só faz sentido quando você junta as três partes, que são a manchete, o desenho e a fala.\n\n1) Manchete: \"Queda no desmatamento na Amazônia é de 61% em janeiro\". É uma notícia boa, porque o desmatamento diminuiu.\n2) Desenho: um campo cheio de tocos de árvores cortadas mostra o estrago que já foi feito. No meio dele nasce um broto verde.\n3) Fala do pássaro: \"E... com ela... brota um bocado de esperança aqui no meu peito também!\". O \"ela\" retoma a queda do desmatamento da manchete. O verbo \"brota\" é o centro do jogo de sentido: assim como a plantinha brota do chão devastado, a esperança brota no peito do pássaro. O \"também\" liga as duas coisas.\n\nPortanto, o autor mostra que há uma perspectiva de recuperação (\"salvação\") para a floresta. Os tocos ao redor lembram os \"descuidos já vividos\", isto é, a destruição que já aconteceu. A alternativa D junta exatamente esses dois lados, a esperança no presente e o estrago do passado.","pq":{"A":"A manchete fala em queda do desmatamento, então não há retrocesso. Os tocos mostram o estrago acumulado, mas a mensagem da charge é de melhora, simbolizada pelo broto.","B":"Leitura errada do número: 61% é o tamanho da queda do desmatamento, não o desmatamento em si. Além disso, \"brota um bocado de esperança\" indica uma chance real, e não \"remota\".","C":"Diz o oposto da manchete, que fala em queda e não em aumento. A Amazônia também não está \"já sem vegetação\", porque o broto verde é justamente o sinal de vida que renasce.","D":"Correta: a queda do desmatamento e o broto representam esperança de recuperação, e os tocos lembram a devastação que já ocorreu.","E":"Exagera a notícia. Uma queda de 61% não é o \"fim do desmatamento\". A charge mostra uma esperança que começa a brotar, não um problema resolvido."},"dica":"Em charges, leia manchete, imagem e fala juntas e desconfie de alternativas que exageram os dados (queda não é fim; 61% de queda não é 61% de desmatamento).","dif":"fácil","nota":"","obs":""},{"id":"2023d1-02","n":2,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Interpretação de texto – crônica argumentativa","titulo":"Terno e gravata em clima quente na crônica de Pepetela","gab":"E","base":"02-06","imgs":[{"src":"img/2023d1/q02_1.webp","w":783,"h":830}],"alt":{"A":"traz prejuízos ao meio ambiente, pelo uso exagerado de ar-condicionado, uma vez que as pessoas do continente o usam meia hora por dia.","B":"representa desconforto físico incontestável aos homens, sendo, todavia, necessário para as atividades profissionais reguladas pela formalidade de vestuário.","C":"caiu em desuso na África Ocidental e na América Latina, onde o clima mais ameno justificaria a manutenção desse vestuário cotidianamente.","D":"traduz a vontade da sociedade, que se vê cada mais independente de valores estrangeiros e, por isso, decidiu deflagar uma guerra cultural contra a Europa.","E":"vai de encontro às condições climáticas do continente, reportando a uma indesejável herança cultural que denuncia a influência do colonizador."},"res":"Ideia-chave: o narrador critica o terno por dois motivos. Ele não combina com o clima quente e é uma herança da colonização.\n\n1) O terno contraria o clima. O texto fala do hábito de \"se usar fato e gravata, por vezes colete mesmo, nos climas mais tórridos do mundo\", com \"Um calor de morrer, humidade no máximo\" e as pessoas \"a escorrer suor\".\n2) É uma herança indesejável do colonizador: \"Muitos africanos só usam fato e gravata para se parecerem com os europeus que os colonizaram. Nunca foram capazes de ultrapassar esse complexo de inferioridade\".\n\nA alternativa E resume os dois pontos. Atenção à expressão \"ir de encontro a\", que significa chocar-se com, contrariar. É diferente de \"ir ao encontro de\", que significa estar de acordo. O terno \"vai de encontro\" ao clima, ou seja, é incompatível com ele. Já \"reportando a uma indesejável herança cultural\" corresponde ao \"complexo de inferioridade\" diante dos europeus.","pq":{"A":"Distorce o texto. O \"o\" de \"o usam\" retoma o ar-condicionado, e a \"meia hora\" não é um tempo de uso diário: é o tempo que as pessoas, já nas salas refrescadas, levam \"a arrefecer\". O texto até liga o hábito à \"futura miséria do planeta\", mas não fala em uso exagerado de ar-condicionado nem dá essa medida.","B":"O narrador não acha o terno \"necessário\". Ele ironiza quem pensa assim (\"Nem parecia um chefe de serviço\") e chama o costume de hábito ou mania.","C":"O erro está no \"clima mais ameno\": o texto trata de \"climas mais tórridos\", e esses países adotaram \"roupas leves e largas\" justamente para que as pessoas se vestissem de acordo com o calor. Nada no texto diz que o clima justificaria manter o terno no dia a dia.","D":"O texto diz o contrário: muitos africanos ainda imitam os europeus por \"complexo de inferioridade\". Não existe \"guerra cultural contra a Europa\", e a \"luta que hoje é de todos\" tem a ver com vestir-se de acord
