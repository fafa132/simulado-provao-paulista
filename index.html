nces. Mas a cena está atrás de um grande vidro, como num aquário, e em primeiro plano há visitantes observando, apontando e, ao que parece, fotografando.\n\nO que isso critica: a tragédia dos refugiados virou algo comum, que já não choca (naturalização), e passou a ser consumida como imagem, de longe, com a proteção de um vidro, sem que os espectadores se envolvam ou ajam. As vítimas são reduzidas a objetos de contemplação, como peças de uma exposição, e perdem sua condição humana aos olhos de quem vê (desumanização). É exatamente o que afirma a alternativa C.\n\nO elemento “fora do lugar” (o aquário) e a postura de quem observa são as chaves da crítica.","pq":{"A":"A charge não culpa a acolhida de imigrantes pelas crises; ela critica os espectadores que assistem ao naufrágio. Responsabilizar uma “política de portas abertas” seria um discurso anti-imigração, ausente da imagem.","B":"A charge mostra a tragédia como real (pessoas se afogando) e em nenhum momento sugere exagero nem critica organizações internacionais. Chamar a migração forçada de “alarmismo infundado” é o oposto da mensagem.","C":"Correta: o naufrágio exibido como atração de aquário, observado e fotografado por visitantes, denuncia que a tragédia dos refugiados foi naturalizada e virou espetáculo de consumo, sem que as vítimas sejam vistas como seres humanos.","D":"É o distrator mais próximo, mas a charge não mostra redes sociais nem discute uma “crença” sobre seus efeitos. O alvo é a própria postura dos espectadores, que transformam a dor alheia em espetáculo, e não a ideia de que a visibilidade gera empatia automática.","E":"Os refugiados aparecem como vítimas indefesas, caindo e afundando, e não como “protagonistas resilientes”. A charge não retrata nenhuma narrativa de superação."},"dica":"Em charges, identifique o cenário inesperado (aqui, o aquário) e quem está observando: a crítica costuma recair sobre a postura de quem assiste.","dif":"média","nota":"","obs":""},{"id":"2025d2-38","n":38,"area":"Ciências Humanas","disc":"Filosofia","assunto":"Mídia e sociedade do espetáculo (Guy Debord)","titulo":"Charge “Televisão”: a TV que hipnotiza e a sociedade do espetáculo","gab":"A","base":null,"imgs":[{"src":"img/2025d2/q38_1.webp","w":781,"h":1719}],"alt":{"A":"à construção simbólica da realidade pelos meios de comunicação, que substituem o real por representações, como analisado por Guy Debord.","B":"à função pedagógica da mídia na formação do espírito crítico e na promoção da esfera pública racional, como preconizado por Paulo Freire.","C":"à pluralidade de expressões garantida pelos meios de massa, característica valorizada por Jürgen Habermas.","D":"ao papel emancipador da razão técnica, que fortaleceria a autonomia individual, como defendido pela Escola de Frankfurt.","E":"à formação de um espaço público democrático baseado na transparência e no diálogo ético, como propõe Immanuel Kant."},"res":"Ideia-chave: na charge, a televisão hipnotiza o espectador. Isso remete à crítica de Guy Debord à “sociedade do espetáculo”, em que as imagens produzidas pela mídia passam a ocupar o lugar da realidade vivida.\n\nLeitura da imagem: um homem de terno tem uma TV no lugar da cabeça; da tela sai um braço que balança um relógio de bolso, o clássico pêndulo do hipnotizador, diante de uma pessoa afundada na poltrona. A TV está ligada à tomada, e o espectador, passivo, apenas recebe o que lhe é mostrado.\n\nRelação com Debord: em A sociedade do espetáculo (1967), ele afirma que, nas sociedades modernas, tudo o que era vivido diretamente se afasta numa representação; o espetáculo é uma relação social mediada por imagens, que transforma as pessoas em espectadoras passivas da própria vida. A hipnose da charge é a metáfora dessa substituição do real pela representação, que conduz a percepção de quem assiste. Por isso, a alternativa A.","pq":{"A":"Correta: a TV que hipnotiza o espectador ilustra a tese de Debord em A sociedade do espetáculo: as imagens da mídia se interpõem entre as pessoas e o real, substituindo-o por representações e tornando o público passivo.","B":"A charge mostra a TV produzindo passividade, o contrário de espírito crítico; não faria sentido ela “criticar” uma função pedagógica emancipadora. Paulo Freire defendia uma educação dialógica e crítica, e “esfera pública” é um conceito de Habermas, não de Freire.","C":"Habermas não exalta os meios de massa como garantia de pluralidade: em Mudança estrutural da esfera pública, ele critica a comercialização da mídia por enfraquecer o debate público racional. E a charge mostra uma única fonte dominando o espectador, não pluralidade.","D":"A Escola de Frankfurt (Adorno, Horkheimer) fez o oposto: criticou a razão técnica, instrumental, como meio de dominação e analisou a “indústria cultural” como produtora de conformismo. Ela não atribuiu à razão técnica um papel emancipador.","E":"Kant, no texto sobre o Esclarecimento, defendeu que o ser humano saia da menoridade e use a própria razão. A charge mostra justamente o oposto, um espectador conduzido por outro; ela critica a mídia, não um ideal kantiano de espaço público."},"dica":"Debord: espetáculo = imagens que substituem o real; Frankfurt: indústria cultural e razão instrumental; Habermas: esfera pública; Kant: autonomia e esclarecimento.","dif":"média","nota":"","obs":""},{"id":"2025d2-39","n":39,"area":"Ciências Humanas","disc":"Filosofia","assunto":"Empirismo de John Locke – tábula rasa","titulo":"Locke e a mente humana como tábula rasa","gab":"A","base":null,"imgs":[{"src":"img/2025d2/q39_1.webp","w":783,"h":980}],"alt":{"A":"deriva da experiência sensível, pela recepção de ideias simples e sua elaboração reflexiva.","B":"é formado por princípios racionais inatos, acessíveis por meio da introspecção pura.","C":"resulta da iluminação interior, na qual a alma recorda as ideias originárias do intelecto divino.","D":"provém da dedução lógica de verdades absolutas, sem interferência dos sentidos.","E":"decorre da apreensão imediata das ideias universais, já inscritas na razão humana."},"res":"Ideia-chave: “tábula rasa” é uma tábua raspada, sem nada escrito. Para Locke, a mente nasce vazia, sem ideias inatas, e tudo o que conhecemos vem da experiência. Essa é a tese do empirismo.\n\nO texto diz que “todos os nossos pensamentos e todas as nossas noções nada mais são do que um reflexo daquilo que um dia já sentimos ou percebemos através de nossos sentidos”.\n\nComo o conhecimento se forma para Locke (Ensaio sobre o entendimento humano):\n1) Sensação: pelos sentidos, a mente recebe do mundo exterior ideias simples (cores, cheiros, sabores, sons, texturas), como o texto ilustra: “podemos ver o mundo à nossa volta, sentir o cheiro das coisas, seu gosto, podemos tocá-las e ouvi-las”.\n2) Reflexão: a mente percebe as próprias operações (pensar, duvidar, querer), uma espécie de experiência interna que também lhe fornece ideias simples.\n3) Elaboração: a mente trabalha sobre essas ideias simples, comparando-as e combinando-as para formar ideias complexas.\n\nPortanto, o conhecimento deriva da experiência sensível, pela recepção de ideias simples e sua elaboração reflexiva: alternativa A. Note que “reflexiva” não contradiz o empirismo: para Locke, a reflexão também é experiência (a percepção interna do que a mente faz), e a mente só opera sobre o material que a experiência fornece.","pq":{"A":"Correta: para Locke, a mente começa vazia (tábula rasa); as ideias simples chegam pela experiência (sensação e reflexão), e a mente as combina em ideias complexas. Todo conhecimento deriva, assim, da experiência.","B":"Princípios racionais inatos são a tese do racionalismo, como em Descartes. Locke dedicou o início do Ensaio sobre o entendimento humano justamente a combater as ideias inatas, e é isso que a imagem da tábula rasa nega.","C":"Recordar ideias originárias é a reminiscência (anamnese) de Platão, e a iluminação divina do intelecto é uma tese de Santo Agostinho. Ambas supõem que a verdade já está na alma ou vem de Deus, o oposto de uma mente vazia preenchida pelos sentidos.","D":"Dedução lógica sem interferência dos sentidos é o ideal do método racionalista. Para Locke, sem os sentidos não haveria sequer o material (as ideias simples) com que a razão trabalha.","E":"Ideias universais “já inscritas na razão humana” são ideias inatas, que existiriam antes de qualquer experiência. Se algo já estivesse inscrito, a mente não seria uma tábula rasa."},"dica":"Tábula rasa = empirismo (Locke): nada está na mente sem antes passar pela experiência; ideias inatas = racionalismo (Descartes); reminiscência = Platão.","dif":"fácil","nota":"","obs":""},{"id":"2025d2-40","n":40,"area":"Ciências Humanas","disc":"Filosofia","assunto":"Estoicismo – dicotomia do controle","titulo":"Meme “Está tudo bem” e o exagero do estoicismo","gab":"C","base":null,"imgs":[{"src":"img/2025d2/q40_1.webp","w":783,"h":1049}],"alt":{"A":"fuga da vida em sociedade como proteção contra as paixões.","B":"submissão ao sofrimento como forma de purificação moral.","C":"aceitação serena daquilo que não está no controle do indivíduo.","D":"repressão das emoções para alcançar um estado de apatia.","E":"neutralização total dos sentimentos como ideal de sabedoria."},"res":"Ideia-chave: um princípio central da ética estoica, formulado com clareza por Epicteto, é distinguir o que depende de nós do que não depende de nós. Devemos agir sobre o que está ao nosso alcance (nossos juízos, escolhas e atitudes) e aceitar com serenidade o resto.\n\nO meme: um cachorro toma café numa sala em chamas e diz “ESTÁ TUDO BEM.”. Ele exibe uma tranquilidade aparentemente estoica, mas de forma exagerada e distorcida: o incêndio é algo diante do qual ele poderia agir (sair, pedir ajuda), e mesmo assim ele se conforma. O humor nasce dessa caricatura: a aceitação estoica levada ao absurdo vira passividade e negação da realidade.\n\nO estoicismo de verdade (Epicteto, Sêneca, Marco Aurélio) defende a aceitação serena daquilo que não está no controle do indivíduo, e não a inércia diante do que pode ser mudado. Por isso, a alternativa C. O exagero do meme está em estender a aceitação também àquilo que estava, sim, ao alcance do personagem.","pq":{"A":"Afastar-se da vida pública é uma postura associada ao epicurismo (o “viver escondido”), não ao estoicismo. Os estoicos valorizavam o dever e a participação na comunidade; Sêneca foi conselheiro de Nero, e Marco Aurélio foi imperador.","B":"Os estoicos não buscavam o sofrimento nem o viam como purificação; ensinavam a não se deixar perturbar por ele, tratando a dor como algo indiferente para a virtude. A ideia de sofrimento purificador lembra práticas ascéticas religiosas.","C":"Correta: um princípio central da ética estoica, formulado com clareza por Epicteto, é separar o que depende de nós do que não depende e aceitar com serenidade o segundo grupo. O meme exagera esse princípio ao aplicar a aceitação até a um incêndio do qual o cachorro poderia fugir.","D":"É a caricatura que o meme explora, não a doutrina. A apatia (apatheia) estoica é a libertação das paixões perturbadoras pela correção dos juízos, não uma repressão forçada das emoções nem indiferença diante de tudo.","E":"Também é uma caricatura: os estoicos queriam libertar-se das paixões, entendidas como perturbações nascidas de juízos falsos, e não anular todo sentimento; admitiam até afetos bons, como a alegria racional. Não sentir nada não é o ideal do sábio estoico."},"dica":"Estoicismo: aja sobre o que depende de você e aceite com serenidade o que não depende; a apatia estoica é libertar-se das paixões, não virar insensível.","dif":"média","nota":"","obs":""},{"id":"2025d2-41","n":41,"area":"Ciências Humanas","disc":"Filosofia","assunto":"Ética – coerência entre discurso moral e prática","titulo":"Crônica “A cara do Brasil”: o taxista que condena os políticos","gab":"D","base":null,"imgs":[{"src":"img/2025d2/q41_1.webp","w":781,"h":1768}],"alt":{"A":"a falta de fiscalização do transporte público nas grandes cidades.","B":"a impunidade dos agentes políticos em contextos urbanos.","C":"a corrupção institucionalizada em contraste com a honestidade individual.","D":"a incoerência entre o discurso moral e as práticas cotidianas.","E":"a corrupção como um traço exclusivo do meio político."},"res":"Ideia-chave: a crônica vira o jogo: o taxista que condena os políticos pratica, em pequena escala, o mesmo tipo de desonestidade.\n\nO discurso moral do motorista: chama os políticos de “ladrões”, fala “do tanto que eles são asquerosos, corruptos”, e a narradora diz que ele veio “destilando a ira de um trabalhador honesto”.\nAs práticas dele, apontadas pela narradora: “empurrou uma bandeirada, andou acima da velocidade permitida, furou sinal, deu voltas, fingiu que me deu o troco certo e diz que não tem nota fiscal!”.\nA pergunta final resume a crítica: “O senhor acha mesmo que os ladrões são aqueles que estão em Brasília? Que diferença há entre o senhor e eles?”.\n\nO alvo do texto, portanto, é a incoerência entre o que se prega (indignação contra a corrupção) e o que se faz no dia a dia (pequenas trapaças e infrações). O título “A cara do Brasil” sugere que essa contradição não é só do taxista, mas um traço do cotidiano social. Alternativa D.","pq":{"A":"As infrações do taxista aparecem, mas o texto não reclama de fiscalização; usa-as para mostrar que o motorista faz o que condena. O foco é a conduta moral, não a gestão do transporte.","B":"Quem fala da corrupção dos políticos é o taxista; a narradora desloca a crítica para ele: “Que diferença há entre o senhor e eles?”. Impunidade e “contextos urbanos” não são o tema.","C":"O texto não contrasta corrupção institucional com honestidade individual; mostra que o indivíduo que se diz honesto também trapaceia. A suposta honestidade do taxista é justamente o que é desmascarado.","D":"Correta: o taxista condena os políticos com “a ira de um trabalhador honesto”, mas cobra bandeirada indevida, dá voltas, fura sinal e engana no troco. O texto critica essa incoerência entre discurso e prática.","E":"Tratar a corrupção como exclusiva da política é a visão do taxista, que o texto refuta ao perguntar “O senhor acha mesmo que os ladrões são aqueles que estão em Brasília?”. A crônica mostra a desonestidade também no cotidiano comum."},"dica":"Em crônicas com “virada” final, a crítica costuma estar na fala que desmonta o personagem: aqui, “Que diferença há entre o senhor e eles?”.","dif":"fácil","nota":"","obs":""},{"id":"2025d2-42","n":42,"area":"Ciências Humanas","disc":"Filosofia","assunto":"Senso comum e conhecimento científico","titulo":"Mito da manga com leite: senso comum e conhecimento científico","gab":"B","base":null,"imgs":[{"src":"img/2025d2/q42_1.webp","w":783,"h":1049}],"alt":{"A":"da tradição cultural como critério de verdade absoluta.","B":"de superação do senso comum pelo conhecimento científico.","C":"da facilidade em separar tradição e ciência na construção do conhecimento.","D":"de comprovação de crença popular por evidências científicas.","E":"da influência da religiosidade na interpretação do mundo."},"res":"Ideia-chave: o senso comum é um saber transmitido pela tradição, aceito sem verificação; o conhecimento científico testa as afirmações com método e evidências e pode desmentir crenças populares.\n\nNo texto:\nA crença popular: “muitos acreditam que a mistura de manga com leite pode causar efeitos bastante indesejados”.\nA pergunta crítica: “Mas isso é verdade?”.\nA resposta do conhecimento especializado (a nutrição): “essa combinação não apresenta qualquer malefício à saúde”; ao contrário, “A combinação apenas agrega mais ao potencial nutricional do que será preparado”.\n\nA crença tradicional é submetida a exame e desmentida pelo saber científico. Isso é um exemplo de superação do senso comum pelo conhecimento científico: alternativa B. O título da reportagem (“Como a escravidão originou o mito de que manga com leite faz mal?”) ainda chama a crença de “mito”, reforçando que ela não se sustenta.","pq":{"A":"O texto faz o contrário: questiona a tradição (“Mas isso é verdade?”) e a submete à análise de uma especialista, em vez de tomá-la como verdade absoluta.","B":"Correta: uma crença popular (manga com leite faz mal) é examinada e desmentida pelo conhecimento científico da nutrição, segundo o qual a mistura “não apresenta qualquer malefício à saúde”.","C":"O texto não trata da facilidade de separar tradição e ciência. Aliás, a crença persiste (“muitos acreditam”), o que sugere que essa separação não é simples.","D":"A ciência não comprova a crença; ela a desmente: a mistura “não apresenta qualquer malefício à saúde” e ainda “agrega mais ao potencial nutricional”.","E":"Não há nenhum elemento religioso no texto. A crença é de origem popular, e o título da reportagem a liga à história da escravidão, não à religião."},"dica":"Quando uma crença popular é testada e desmentida por especialistas, o tema é a superação do senso comum pelo conhecimento científico.","dif":"fácil","nota":"","obs":""}],"grupos":{}},"2024d1":{"ano":2024,"dia":1,"descricao":"Linguagens (Português, Literatura, Inglês) e Ciências da Natureza (Biologia, Química, Física).","questoes":[{"id":"2024d1-01","n":1,"area":"Linguagens","disc":"Literatura","assunto":"Interpretação de texto – informações explícitas e inferências","titulo":"Baile de Carnaval e o encanto de Yaqub por Lívia em Dois irmãos","gab":"A","base":"01-04","imgs":[{"src":"img/2024d1/q01_1.webp","w":781,"h":817}],"alt":{"A":"o baile dos adultos começava às dez horas, e Yaqub, embora não fosse adulto, queria ficar para a festa, pois estava encantado por Lívia.","B":"o baile dos jovens começaria às dez horas, e Yaqub decidiu ir embora com a sua irmã, porque Lívia o havia tratado com descaso.","C":"o baile dos adultos acontecia depois do baile dos jovens, e Yaqub queria continuar no local com sua irmã para conhecer a família dos Benemou.","D":"o baile dos jovens seria concomitante ao dos adultos, mas Yaqub teve de levar sua irmã para casa e não pôde divertir-se com Lívia.","E":"o baile dos adultos estava começando às dez horas, e Yaqub e Lívia ficaram lá, porque já eram adultos e poderiam se divertir juntos."},"res":"Ideia-chave: conferir no texto três informações: o horário dos bailes, a idade de Yaqub e o motivo de ele querer ficar.\n1) Horário: o baile dos jovens \"havia começado antes do anoitecer\", e \"Às dez horas os adultos entraram fantasiados na sala do casarão\". Logo, a festa dos adultos começava às dez.\n2) Yaqub não era adulto: ele queria \"sentir-se quase adulto como ela\". Quem deseja se sentir \"quase adulto\" ainda não é.\n3) Motivo: \"Yaqub quis ficar até meia-noite, porque uma sobrinha dos Reinoso\" também ia brincar; ele \"Queria ficar para pular abraçado com ela\", e o trecho termina mencionando o \"rosto que admirava\". Isso mostra que ele estava encantado por Lívia.\nA alternativa A reúne corretamente as três informações.","pq":{"A":"Correta: os adultos entraram \"Às dez horas\", Yaqub apenas queria \"sentir-se quase adulto\" e desejava ficar para \"pular abraçado\" com Lívia, a quem admirava.","B":"Tem dois erros. Quem entrou \"Às dez horas\" foram os adultos; o baile dos jovens começou \"antes do anoitecer\". E Yaqub não saiu por descaso de Lívia: saiu por ordem de Zana (\"Leva tua irmã para casa\"), antes mesmo de conseguir se aproximar da moça.","C":"A primeira parte se sustenta (os adultos chegaram depois), mas Yaqub queria ficar por causa de Lívia, e não com a irmã, que ele inclusive levou embora. O texto também não fala em \"conhecer a família dos Benemou\", que eram os donos do casarão onde acontecia a festa.","D":"Os bailes não eram simultâneos: os adultos chegaram \"enxotando a garotada\", ou seja, uma festa tomou o lugar da outra. Além disso, levar a irmã não o impediu de voltar: Zana disse \"Podes voltar depois\", e ele \"voltou correndo ao casarão\".","E":"Yaqub não era adulto: queria apenas \"sentir-se quase adulto\". Além disso, ele não ficou direto na festa, porque teve de levar Rânia para casa antes de voltar. Lívia, \"a menina aloirada\", estava apenas em sua \"primeira noite\" na festa dos adultos."},"dica":"Em questões do tipo \"as informações permitem concluir\", confira cada parte da alternativa no texto: um único detalhe falso (horário, motivo, personagem) já elimina a opção.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-02","n":2,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Figuras de linguagem – hipérbole","titulo":"Hipérbole em trecho de Dois irmãos, de Milton Hatoum","gab":"E","base":"01-04","imgs":[{"src":"img/2024d1/q02_1.webp","w":783,"h":584}],"alt":{"A":"O baile dos jovens havia começado antes do anoitecer.","B":"… ficou trêmulo ao reconhecer o cabelo e o rosto semelhantes…","C":"… os adultos entraram fantasiados na sala do casarão…","D":"Seria a primeira noite de Lívia na festa dos adultos…","E":"A sala fervilhava de foliões, e no meio das tantas cores…"},"res":"Ideia-chave: hipérbole é um exagero intencional, usado para intensificar uma ideia, e não deve ser lido ao pé da letra.\nEm \"A sala fervilhava de foliões\", o verbo fervilhar (ferver, borbulhar) aumenta exageradamente a quantidade e a agitação das pessoas. A sala não ferve de verdade; ela está tão cheia e animada que parece \"borbulhar\" de gente. A expressão \"no meio das tantas cores\" reforça essa impressão de excesso e de multidão.\nAs outras alternativas são relatos literais da narrativa: o horário em que o baile começou, a chegada dos adultos fantasiados, a primeira noite de Lívia na festa e uma reação física de Yaqub. Nenhuma delas amplia a realidade de forma exagerada.","pq":{"A":"É uma informação literal de tempo (o baile começou antes de anoitecer). Não há nenhum exagero.","B":"Ficar trêmulo é uma reação física real e plausível diante de uma emoção forte, como o susto ou o ciúme de Yaqub. É uma descrição, não um exagero.","C":"Apenas narra um fato: os adultos chegaram fantasiados ao casarão. Não há nenhuma ampliação expressiva.","D":"Informa objetivamente que era a estreia de Lívia na festa dos adultos. Não exagera nada.","E":"Correta: \"fervilhava de foliões\" exagera a lotação e a agitação da sala, e \"tantas cores\" reforça a ideia de excesso."},"dica":"Hipérbole é o exagero que não se lê ao pé da letra; desconfie de verbos intensos usados em sentido figurado, como fervilhar, morrer de, chorar rios.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-03","n":3,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Tempos verbais – pretérito mais-que-perfeito x pretérito perfeito","titulo":"Valor temporal de \"havia começado\" e \"entraram\" em Dois irmãos","gab":"B","base":"01-04","imgs":[{"src":"img/2024d1/q03_1.webp","w":783,"h":742}],"alt":{"A":"ambas estão empregadas no mesmo tempo verbal do modo indicativo.","B":"a primeira expressa uma ação que antecede temporalmente a segunda.","C":"a segunda, ao contrário da primeira, expressa uma ação hipotética.","D":"ambas expressam ações cuja realização se dá de forma concomitante.","E":"a primeira expressa uma ação contínua; a segunda, uma ação acabada."},"res":"Ideia-chave: o pretérito mais-que-perfeito expressa uma ação passada que aconteceu antes de outra ação também passada (é o \"passado do passado\").\n\"havia começado\" está no pretérito mais-que-perfeito composto do indicativo (auxiliar haver no imperfeito + particípio) e equivale a \"começara\".\n\"entraram\" está no pretérito perfeito do indicativo.\nNa linha do tempo, primeiro o baile dos jovens começou (\"antes do anoitecer\"); depois, \"Às dez horas\", os adultos entraram. O mais-que-perfeito mostra que, quando os adultos chegaram, o baile dos jovens já tinha começado. Por isso, a primeira forma expressa uma ação anterior à segunda.","pq":{"A":"Os dois verbos estão no indicativo, mas em tempos diferentes: \"havia começado\" é pretérito mais-que-perfeito composto, e \"entraram\" é pretérito perfeito.","B":"Correta: o mais-que-perfeito \"havia começado\" marca uma ação concluída antes de outra ação passada, a entrada dos adultos \"Às dez horas\".","C":"Nenhuma das duas formas é hipotética: ambas estão no indicativo e narram fatos apresentados como reais. Uma hipótese viria no futuro do pretérito (\"entrariam\") ou no subjuntivo (\"entrassem\").","D":"As ações não são simultâneas: uma aconteceu \"antes do anoitecer\" e a outra \"Às dez horas\". A função do mais-que-perfeito é justamente marcar essa anterioridade.","E":"\"havia começado\" não indica ação contínua, e sim uma ação já concluída antes de outra. A ideia de continuidade viria do pretérito imperfeito (\"o baile acontecia\") ou de uma locução com gerúndio (\"estava acontecendo\"). A pegadinha é achar que o auxiliar \"havia\", que está no imperfeito, dá à locução um valor durativo."},"dica":"Mais-que-perfeito (havia feito / fizera) é o \"passado do passado\": indica uma ação anterior a outra ação que também já passou.","dif":"média","nota":"","obs":""},{"id":"2024d1-04","n":4,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Regência verbal, crase e pronomes oblíquos","titulo":"Reescrita na norma-padrão: \"obedeceu à\", \"fê-la\" e \"voltou à\"","gab":"B","base":"01-04","imgs":[{"src":"img/2024d1/q04_1.webp","w":781,"h":900}],"alt":{"A":"Ele obedeceu à mãe. Acompanhou Rânia até o quarto, fez-na dormir e voltou correndo à residência dos Benemou.","B":"Ele obedeceu à mãe. Acompanhou Rânia até o quarto, fê-la dormir e voltou correndo à residência dos Benemou.","C":"Ele obedeceu a mãe. Acompanhou Rânia até o quarto, fez-na dormir e voltou correndo na residência dos Benemou.","D":"Ele obedeceu à mãe. Acompanhou Rânia até o quarto, fez-la dormir e voltou correndo na residência dos Benemou.","E":"Ele obedeceu a mãe. Acompanhou Rânia até o quarto, fê-la dormir e voltou correndo na residência dos Benemou."},"res":"Ideia-chave: a questão cobra três pontos da norma-padrão: a regência de obedecer, a forma do pronome oblíquo depois de verbo terminado em -z e a regência de voltar.\n1) Obedecer é transitivo indireto (obedecer a alguém): obedecer a + a mãe = \"obedeceu à mãe\", com crase.\n2) Quando o verbo termina em r, s ou z e vem seguido do pronome o/a, a consoante final cai e o pronome vira lo/la: fez + a → fe + la → \"fê-la\". A forma \"fê\" leva circunflexo por ser monossílabo tônico de timbre fechado, como em vê-lo e pô-la. As formas no/na só aparecem depois de som nasal (ex.: \"fizeram-na\").\n3) Verbos de movimento, como voltar, pedem a preposição a: voltar a + a residência = \"voltou à residência\". A forma \"voltar na residência\" é coloquial.\nSó a alternativa B acerta os três pontos.","pq":{"A":"Acerta \"à mãe\" e \"à residência\", mas erra o pronome: \"fez-na\" não existe na norma-padrão, porque -na só se usa depois de terminação nasal. Depois de z, o correto é \"fê-la\".","B":"Correta: tem crase em \"obedeceu à mãe\" (obedecer a), usa \"fê-la\" (cai o z e o pronome vira la) e traz \"voltou à residência\" (voltar a).","C":"Tem três erros: falta a crase em \"obedeceu a mãe\" (obedecer exige a preposição a), usa \"fez-na\" e escreve \"voltou correndo na residência\", quando voltar pede a preposição a.","D":"Acerta \"à mãe\", mas \"fez-la\" conserva o z, quando o correto é eliminá-lo e acentuar (\"fê-la\"). Além disso, \"na residência\" fere a regência de voltar.","E":"Acerta \"fê-la\", mas omite a crase em \"obedeceu a mãe\" e usa \"voltou correndo na residência\" em vez de \"à residência\"."},"dica":"Verbo terminado em r, s ou z + o/a: a consoante cai e o pronome vira lo/la (fê-la, vendê-lo). Depois de terminação nasal, o pronome vira no/na (fizeram-na). Obedecer e voltar pedem a preposição a.","dif":"média","nota":"","obs":""},{"id":"2024d1-05","n":5,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Coesão referencial – referente de pronome em tira","titulo":"Referente do pronome \"eles\" na tira do Snoopy cão de guarda","gab":"C","base":"05-06","imgs":[{"src":"img/2024d1/q05_1.webp","w":680,"h":439}],"alt":{"A":"donos do cão, quando o procuram.","B":"amigos, normalmente longe do cão.","C":"perigos a que o cão está exposto.","D":"vizinhos do cão que possam estar perto.","E":"medos do cão, quando o dia começa."},"res":"Ideia-chave: para descobrir a quem o pronome se refere, é preciso usar o contexto verbal e também a imagem.\nSnoopy reflete sobre o trabalho de cão de guarda: \"O SEGREDO, É CLARO, É SE MANTER ALERTA.\" e completa: \"TENTAR VÊ-LOS ANTES QUE ELES…\" / \"… TE VEJAM!\". Os pronomes \"los\" e \"eles\" não têm um nome explícito a que se refiram; retomam aquilo que um cão de guarda vigia: intrusos, ameaças, perigos.\nQuem mostra esses perigos é o último quadro. Na escuridão, aparecem dois olhos observando Snoopy, e ele solta um \"CAIN!\", ganido de cachorro assustado. A ameaça o viu primeiro.\nPortanto, \"eles\" são os perigos a que o cão está exposto e dos quais ele deveria se antecipar.","pq":{"A":"Os donos não são uma ameaça da qual o cão de guarda precise se antecipar; não faz sentido querer \"vê-los antes que eles te vejam\". Nada na tira mostra donos procurando o cão.","B":"Amigos também não são algo que um vigia precise flagrar primeiro. Além disso, o último quadro mostra justamente algo perto e ameaçador, não distante.","C":"Correta: \"eles\" são aquilo que o cão de guarda deve flagrar antes de ser flagrado, ou seja, as ameaças, representadas pelos olhos no escuro do último quadro.","D":"Nenhum vizinho aparece ou é sugerido na tira. A lógica de \"vê-los antes que eles te vejam\" é a de vigiar ameaças, não vizinhos.","E":"Medos são sentimentos, e sentimentos não podem \"ver\" o cão. Também nada na tira indica o começo do dia: o último quadro, aliás, é todo escuro."},"dica":"Para achar o referente de um pronome em tira, olhe também a imagem: muitas vezes o que o texto não nomeia, o desenho mostra.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-06","n":6,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Modalizadores e construção do humor em tira","titulo":"\"Realmente\" e \"é claro\": postura resoluta de Snoopy desmentida no fim","gab":"D","base":"05-06","imgs":[{"src":"img/2024d1/q06_1.webp","w":783,"h":705}],"alt":{"A":"agressiva, a qual se confirma com a cena do último quadro.","B":"receosa, a qual se intensifica com a cena do último quadro.","C":"intrépida, a qual se coaduna com a cena do último quadro.","D":"resoluta, a qual se contrapõe à cena do último quadro.","E":"reticente, a qual se inverte com a cena do último quadro."},"res":"Ideia-chave: \"realmente\" e \"é claro\" são modalizadores de certeza, ou seja, mostram que quem fala tem convicção do que diz.\nEm \"SER CÃO DE GUARDA É REALMENTE MUITO SIMPLES.\" e \"O SEGREDO, É CLARO, É SE MANTER ALERTA.\", Snoopy fala como alguém seguro e decidido sobre sua função de vigia: uma postura resoluta (firme, determinada). No terceiro quadro, a cara séria e o gesto confiante reforçam essa segurança.\nNo último quadro, porém, surgem dois olhos no escuro e Snoopy solta um \"CAIN!\" de susto. Ele foi visto antes de ver, o oposto exato do \"segredo\" que acabara de enunciar. A cena final se contrapõe à confiança inicial, e é dessa quebra de expectativa que nasce o humor da tira.","pq":{"A":"Nada nos dois primeiros quadros mostra agressividade: as expressões indicam certeza, não ataque. E o último quadro não confirma postura nenhuma; mostra o cão assustado.","B":"\"Receosa\" (com medo) é o contrário do que \"realmente\" e \"é claro\" expressam. O medo só aparece no final, como quebra da expectativa, e não intensifica algo que já existia.","C":"\"Intrépida\" (destemida) até descreve a confiança inicial, mas \"se coaduna\" (combina, está em harmonia) está errado, porque o susto do último quadro desmente essa coragem. A pegadinha é ter metade certa e metade errada.","D":"Correta: as expressões de certeza constroem uma postura firme e decidida, que é contrariada pelo susto do último quadro.","E":"\"Reticente\" significa hesitante, reservado, o oposto das expressões de certeza usadas por Snoopy. Não confunda com as reticências que dividem a fala entre o 3º e o 4º quadros: elas apenas criam suspense."},"dica":"Modalizadores como \"realmente\", \"é claro\" e \"certamente\" indicam convicção; em tiras, o humor costuma vir da quebra dessa segurança no último quadro.","dif":"média","nota":"","obs":""},{"id":"2024d1-07","n":7,"area":"Linguagens","disc":"Literatura","assunto":"Interpretação de poema","titulo":"Passado de promessas x presente de dor em “Saudades”, de Álvares de Azevedo","gab":"A","base":"07-09","imgs":[{"src":"img/2024d1/q07_1.webp","w":740,"h":418}],"alt":{"A":"contrapõem-se à dor vivida por ele depois.","B":"são boas lembranças que tem na velhice.","C":"fazem com que o seu sonho vire realidade.","D":"eram ilusões que não o afetavam na época.","E":"confirmam a esperança do seu presente."},"res":"Ideia-chave: o poema opõe um passado de promessas a uma vida de sofrimento, e a conjunção “Contudo” marca essa virada.\n\nNas duas primeiras estrofes, o eu lírico conta o que viveu: consumiu “A flor da mocidade”, afirma “E na idade do amor envelheci!” e diz que derramou os vinte anos “Num abismo de dor e esquecimento…”, concluindo: “não vivi um só momento!”.\n\nNa terceira estrofe ele olha para trás: “Contudo, no passado uma esperança! / Tanto amor e ventura prometia”. Ou seja, houve um tempo em que a vida prometia amor e ventura (felicidade), mas essa promessa não se cumpriu: o que veio foi a dor.\n\nPortanto, o amor e a ventura prometidos no passado se contrapõem à dor que o eu lírico viveu depois. Alternativa A.","pq":{"A":"Correta. A promessa de “Tanto amor e ventura” se opõe ao “abismo de dor e esquecimento” vivido depois; o “Contudo” sinaliza exatamente esse contraste.","B":"O eu lírico não está na velhice: ele fala dos seus “Vinte anos!”, e o “envelheci” é figurado (envelheceu por dentro, ainda jovem). Além disso, o poema não apresenta essas promessas como lembrança tranquila, e sim como esperança frustrada que contrasta com a dor.","C":"O sonho não se realizou: a virgem “Nos sonhos junto a mim adormecia”, isto é, existiu só no sonho. O que o eu lírico viveu de fato foi a dor e a sensação de não ter vivido.","D":"Essas ilusões o afetaram profundamente: foi “num sonho de ventura” que ele consumiu “A flor da mocidade”, e ele diz que “De fogosas visões nutri meu peito”. As exclamações da terceira estrofe também mostram a intensidade dessa esperança.","E":"A esperança está localizada “no passado”, não no presente. O presente do eu lírico é de dor e da sensação de não ter vivido “um só momento”."},"dica":"Conjunções como “contudo”, “mas” e “porém” marcam a virada do texto: compare o que vem antes e depois delas para achar o contraste.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-08","n":8,"area":"Linguagens","disc":"Literatura","assunto":"Romantismo – 2ª geração (ultrarromantismo)","titulo":"Traço ultrarromântico em “Saudades”, de Álvares de Azevedo","gab":"B","base":"07-09","imgs":[{"src":"img/2024d1/q08_1.webp","w":781,"h":458}],"alt":{"A":"a concepção objetiva da mulher.","B":"o exagero sentimental.","C":"a racionalidade do amor.","D":"o caráter mórbido do sentimento.","E":"o uso de tema prosaico."},"res":"Ideia-chave: o ultrarromantismo (2ª geração romântica, a do “mal do século”) se destaca pelo sentimentalismo exagerado, pelo pessimismo e pela idealização da mulher. A pergunta quer o traço que aparece NESTE trecho.\n\nNo poema, o eu lírico amplia a própria dor o tempo todo. Ele diz que envelheceu ainda jovem (“E na idade do amor envelheci!”), que derramou os vinte anos “gota a gota / Num abismo de dor e esquecimento…” e, numa hipérbole, que “não vivi um só momento!”. As exclamações e as reticências repetidas (“Vinte anos!…”, “adormecia!…”) reforçam esse transbordamento emocional.\n\nEsse sofrimento amplificado, cheio de hipérboles e em tom confessional, é o exagero sentimental típico do ultrarromantismo. Alternativa B.","pq":{"A":"A mulher não é vista de forma objetiva, e sim idealizada: “uma virgem tão doce, tão divina”, que só aparece “Nos sonhos”. Idealizar é o oposto de ser objetivo.","B":"Correta. Hipérboles como “não vivi um só momento!” e “na idade do amor envelheci!” mostram o sentimentalismo exagerado típico dessa geração.","C":"No poema o amor é pura emoção, sonho e sofrimento, sem nenhum raciocínio ou equilíbrio. Razão e equilíbrio são valores do Arcadismo, não do Romantismo.","D":"É a pegadinha. A morbidez (atração pela morte, pelo túmulo, pela doença) existe no ultrarromantismo, mas não aparece neste trecho: ele é melancólico e pessimista, mas não fala em morte, doença ou desejo de morrer. O traço que o trecho comprova é o exagero do sentimento.","E":"O tema é elevado e subjetivo (amor idealizado, juventude perdida, sofrimento), não um assunto prosaico, ou seja, banal e do cotidiano."},"dica":"Ultrarromantismo = sentimentalismo exagerado, pessimismo, idealização da mulher e atração pela morte; escolha o traço que o trecho realmente comprova, não só o que a escola tem.","dif":"média","nota":"","obs":""},{"id":"2024d1-09","n":9,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Relações de sentido – preposição e conjunção adversativa","titulo":"Sentido de “por ti” e “Contudo” em poema de Álvares de Azevedo","gab":"E","base":"07-09","imgs":[{"src":"img/2024d1/q09_1.webp","w":781,"h":533}],"alt":{"A":"meio e conclusão.","B":"companhia e explicação.","C":"modo e conclusão.","D":"finalidade e oposição.","E":"causa e oposição."},"res":"Ideia-chave: descubra a relação de sentido trocando cada expressão por um equivalente.\n\n“por ti”: em “Foi por ti que num sonho de ventura / A flor da mocidade consumi”, o “Foi… que” é só uma expressão de realce. Retirando-a, fica: “Por ti consumi a flor da mocidade”. Trocando: “Por causa de ti consumi a flor da mocidade”. O sentido se mantém, então “por ti” indica causa, o motivo de o eu lírico ter gastado a juventude.\n\n“Contudo”: é conjunção coordenativa adversativa, equivalente a “mas”, “porém”, “entretanto”. Ela opõe a terceira estrofe (“no passado uma esperança!”) às anteriores, que falam de dor, de “abismo” e de “não vivi um só momento!”. Então indica oposição.\n\nResultado: causa e oposição. Alternativa E.","pq":{"A":"“por ti” não indica meio (instrumento, “por meio de ti”), e “contudo” não é conclusivo. Conclusão seria “portanto”, “logo”, “por isso”.","B":"Companhia seria “contigo” ou “com você”. E “contudo” não explica nada: explicação seria “pois” ou “porque”.","C":"Modo responde “como?” (ex.: “de forma intensa”), e aqui a pergunta é “por quê?”. Além disso, “contudo” não é conclusivo.","D":"Acerta a oposição, mas “por ti” não indica finalidade (“para quê?”, como em “para te conquistar”): o eu lírico diz o motivo, não o objetivo.","E":"Correta. “Por ti” = por causa de ti (causa); “contudo” = mas, porém (oposição)."},"dica":"Teste a troca: se “por” vira “por causa de”, é causa; se vira “para”, é finalidade. “Contudo” equivale a “mas” (oposição), nunca a conclusão.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-10","n":10,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Coesão referencial – pronome demonstrativo","titulo":"Referente de “Tudo isso” em texto sobre a Amazônia urbana","gab":"C","base":"10-12","imgs":[{"src":"img/2024d1/q10_1.webp","w":783,"h":496}],"alt":{"A":"aos segredos amazônicos.","B":"às capitais Manaus e Belém.","C":"aos biomas amazônicos.","D":"à Amazônia urbana.","E":"à população indígena."},"res":"Ideia-chave: aqui “isso” é um pronome demonstrativo anafórico, ou seja, retoma o que acabou de ser dito antes dele.\n\nA frase anterior descreve “uma rica paisagem natural composta pelos magníficos biomas amazônicos: igapós, terra firme, várzeas, campinas e os majestosos rios.” Logo depois vem: “Tudo isso é real e deve, sim, ser valorizado e preservado.” O “tudo” resume a enumeração (igapós, terra firme, várzeas, campinas, rios), e o “isso” retoma esse conjunto. A ideia de “preservado” também combina com natureza e biomas.\n\nA Amazônia urbana, Manaus, Belém e a população indígena só aparecem depois, introduzidas por “Mas” justamente como o outro lado da região, o lado “pouco conhecido”. Como “Tudo isso” retoma o que já foi dito, não pode apontar para esses elementos.\n\nPortanto, “Tudo isso” refere-se aos biomas amazônicos. Alternativa C.","pq":{"A":"O texto não fala em “segredos” da Amazônia. O mais próximo disso é o “lado da região pouco conhecido”, mas ele vem depois de “Tudo isso” e se refere à Amazônia urbana.","B":"Manaus e Belém só são citadas mais adiante, no parágrafo que começa com “Manaus (AM)”. “Isso”, aqui, retoma o que veio antes, não o que vem depois.","C":"Correta. “Tudo isso” resume a enumeração imediatamente anterior: os “biomas amazônicos: igapós, terra firme, várzeas, campinas e os majestosos rios”.","D":"A Amazônia urbana é apresentada depois, com “Mas há um lado da região pouco conhecido”. Ela é o contraponto dos biomas, não o referente de “Tudo isso”.","E":"A “vasta população indígena moradora dessas cidades” também só aparece no trecho seguinte, ligada à Amazônia urbana, depois do “Mas”."},"dica":"Para achar o referente de “isso”, “esse” ou “tudo isso”, olhe para trás: normalmente é o que foi dito imediatamente antes.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-11","n":11,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Interpretação de texto","titulo":"Estudos sobre urbanismo indígena na Amazônia pré-colonial","gab":"C","base":"10-12","imgs":[{"src":"img/2024d1/q11_1.webp","w":781,"h":959}],"alt":{"A":"era organizada em comunidades urbanas com sinais de urbanismo, que veio a se desenvolver plenamente com o advento das mídias sociais e a valorização local.","B":"dispunha de condições para o amplo desenvolvimento urbano, todavia as políticas relativas à manutenção dos biomas amazônicos coibiram esse processo.","C":"contava com expressivas formas de urbanismo, desfazendo a ideia comumente disseminada de que era composta por aldeias e acampamentos pequenos e temporários.","D":"continha traços de um processo de urbanização antigo, colapsado pelo fato de que as comunidades indígenas têm pouco acesso a seus direitos territoriais.","E":"mantinha formas simples de urbanismo, sobretudo com a população indígena, corroborando a ideia de que o desenvolvimento das cidades é um fenômeno recente."},"res":"Ideia-chave: localize no texto o que os “Estudos recentes sobre a Amazônia pré-colonial” revelam e não acrescente nada além disso.\n\nO texto diz que esses estudos “revelam que comunidades indígenas pré-coloniais já praticavam formas de urbanismo, fazendo das indigeneidades urbanas um fenômeno ancestral”. Essas formas de urbanismo “agora estão sendo vislumbradas como alternativas ao modelo industrial para um futuro mais sustentável”, o que mostra que eram relevantes, expressivas.\n\nNo parágrafo seguinte: “Esses estudos contribuem para uma mudança de paradigmas”, “nos afastando da perspectiva estereotipada condescendente da Amazônia indígena como composta por aldeias e acampamentos pequenos e efêmeros”. Repare: a “perspectiva estereotipada” é a “ideia comumente disseminada”, e “efêmeros” equivale a “temporários”.\n\nA alternativa C junta exatamente essas duas informações: havia formas expressivas de urbanismo, e isso desfaz a ideia estereotipada de aldeias pequenas e temporárias. Alternativa C.","pq":{"A":"Mistura épocas. As mídias sociais aparecem como meio atual de divulgar a experiência de indígenas urbanos (“Atualmente, as mídias sociais estão disseminando…”), e não como algo que completou o urbanismo pré-colonial.","B":"O texto não diz que políticas de preservação dos biomas impediram a urbanização. A defesa da preservação no 1º parágrafo não tem nenhuma relação de causa com o urbanismo indígena.","C":"Correta. Os estudos mostram que “comunidades indígenas pré-coloniais já praticavam formas de urbanismo” e nos afastam da visão de “aldeias e acampamentos pequenos e efêmeros” (= temporários).","D":"O texto não menciona colapso nem “direitos territoriais”. Fala apenas que indígenas urbanos de hoje buscam “reconhecimento e direitos” nas redes, sem ligar isso ao fim do urbanismo antigo.","E":"Diz o contrário do texto: “as cidades amazônicas não são um fenômeno somente do presente” e o urbanismo indígena é “um fenômeno ancestral”. Também não eram formas “simples”, já que hoje são vistas como alternativas ao modelo industrial."},"dica":"Em “conclui-se corretamente”, desconfie de alternativas que misturam épocas diferentes ou criam relações de causa que o texto não estabelece.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-12","n":12,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Vocabulário – sinonímia e substituição de expressões","titulo":"Substituição de “que vem à cabeça” e “condescendente” sem mudar o sentido","gab":"B","base":"10-12","imgs":[{"src":"img/2024d1/q12_1.webp","w":781,"h":667}],"alt":{"A":"impingida à maioria das pessoas; irreconhecível.","B":"evocada pela maioria das pessoas; complacente.","C":"sugerida à maioria das pessoas; harmoniosa.","D":"lembrada pela maioria das pessoas; intolerante.","E":"dissimulada pela maioria das pessoas; indulgente."},"res":"Ideia-chave: a substituição tem de funcionar nas DUAS expressões; basta uma falhar para descartar a alternativa.\n\n1ª expressão: “a primeira imagem que vem à cabeça da maioria das pessoas” é a imagem que as pessoas trazem à mente de forma espontânea. “Evocada pela maioria das pessoas” mantém esse sentido (evocar = trazer à memória, chamar à lembrança). “Lembrada pela” também serviria; já “impingida”, “sugerida” e “dissimulada” mudam o sentido.\n\n2ª expressão: “condescendente” é quem condescende, isto é, se mostra tolerante e benevolente, muitas vezes a partir de uma posição de superioridade. É o caso da visão estereotipada que trata a Amazônia indígena como feita de “aldeias e acampamentos pequenos e efêmeros”. O sinônimo de dicionário é “complacente” (“indulgente” também serviria). “Intolerante” é antônimo, e “irreconhecível” e “harmoniosa” não têm relação com a palavra.\n\nA única alternativa que acerta as duas partes é B: “evocada pela maioria das pessoas; complacente”.","pq":{"A":"“Impingida” significa imposta, empurrada à força, mas no texto a imagem surge espontaneamente na mente. Além disso, “irreconhecível” não tem nada a ver com “condescendente”.","B":"Correta. “Evocada” = trazida à memória (o que “vem à cabeça”); “complacente” é sinônimo de “condescendente”.","C":"“Sugerida à” coloca alguém de fora sugerindo a imagem, o que muda o sentido. E “harmoniosa” (equilibrada, em harmonia) não equivale a “condescendente”.","D":"A primeira parte até funciona (“lembrada pela maioria”), mas “intolerante” é o oposto de “condescendente”, que significa tolerante, complacente.","E":"“Indulgente” até é próximo de “condescendente”, mas “dissimulada” significa disfarçada, escondida, o contrário de uma imagem que vem à mente de imediato."},"dica":"Em substituição com duas expressões, comece pela parte de que você tem mais certeza e elimine: basta uma das duas falhar para descartar a alternativa.","dif":"média","nota":"","obs":""},{"id":"2024d1-13","n":13,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Interpretação de tira – ambiguidade e humor","titulo":"Ambiguidade da palavra \"mapa\" em tira do Armandinho","gab":"A","base":null,"imgs":[{"src":"img/2024d1/q13_1.webp","w":783,"h":1406}],"alt":{"A":"localização.","B":"astrologia.","C":"astronomia.","D":"superstição.","E":"concentração."},"res":"Ideia-chave: o humor da tira nasce da ambiguidade da palavra \"mapa\".\nPasso 1: o pai, que está dirigindo, diz \"ACHO QUE ESTAMOS PERDIDOS...\" e pergunta \"O QUE DIZ O MAPA, FILHO?\". Quem está perdido de carro quer saber onde está e por onde seguir. Ele espera, portanto, uma informação de **localização**, tirada de um mapa rodoviário ou geográfico.\nPasso 2: o filho lê outro tipo de \"mapa\", o mapa astral. A resposta dele, \"JÚPITER EM GÊMEOS TEM INFLUÊNCIA SOBRE VOCÊ QUE TEM ASCENDENTE EM...\", é linguagem de horóscopo.\nPasso 3: a graça está na quebra de expectativa entre o que o pai queria (orientação no caminho) e o que o filho entregou (astrologia).\nAtenção ao enunciado: ele pergunta pela resposta ESPERADA, não pela resposta dada. Por isso a alternativa correta é A.","pq":{"A":"Correta. Perdido na estrada, o pai pede o mapa para saber onde estão e que caminho seguir; a resposta esperada era sobre localização.","B":"É a resposta que o filho DEU, ao ler um mapa astral, e não a que o pai ESPERAVA. A pegadinha é confundir o que gera o humor com a expectativa de quem pergunta.","C":"Astronomia é a ciência que estuda os astros. Júpiter até aparece na fala do filho, mas num contexto de horóscopo (\"ascendente\"), e o pai não queria saber nada sobre astros.","D":"A astrologia pode até ser vista como crença, mas o pai não esperava nada ligado a superstição: ele queria orientação para sair do lugar em que estavam perdidos.","E":"Nada na tira fala de concentração. O pai não pede atenção ao filho, pede a informação que está no mapa."},"dica":"Em tiras, ache a palavra ambígua (aqui, \"mapa\") e separe o sentido que quem pergunta espera do sentido usado na resposta que gera o humor.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-14","n":14,"area":"Linguagens","disc":"Literatura","assunto":"Interpretação de texto literário – foco narrativo e descrição","titulo":"Descrição subjetiva de Gervásio em A confissão de Lúcio, de Sá-Carneiro","gab":"D","base":"14-17","imgs":[{"src":"img/2024d1/q14_1.webp","w":783,"h":809}],"alt":{"A":"argumenta de forma depreciativa sobre a aparência de Gervásio Vila-Nova, julgando que este não merece ser seu companheiro de todas as horas.","B":"relata momentos desagradáveis de convivência com Gervásio Vila-Nova, cuja presença sempre era incômoda, ainda que fosse seu melhor amigo.","C":"relata com objetividade momentos venturosos de Gervásio Vila-Nova, destacando o caráter enigmático da fisionomia, que é consenso entre todos.","D":"descreve de forma subjetiva a pessoa de Gervásio Vila-Nova, alternando perspectivas decorrentes das imagens que este lhe desperta.","E":"descreve o companheiro Gervásio Vila-Nova como um homem pitoresco que, apesar de desdenhar das pessoas, é admirado por elas."},"res":"Ideia-chave: no 2º parágrafo o narrador não conta episódios de convivência. Ele DESCREVE Gervásio a partir das impressões que a figura do amigo provoca nele.\nPasso 1 (subjetividade): a descrição está cheia de juízos e sensações pessoais, como \"Perturbava o seu aspecto físico\", \"coisa bizarra\" e \"corpo de esfinge, talvez, em noites de luar\". O \"talvez\" mostra que se trata de impressão, e não de um dado objetivo.\nPasso 2 (alternância de perspectivas): a mesma característica gera imagens opostas, conforme o ângulo. Os cabelos, \"se lhe descobriam a testa ampla e dura, terrível, evocavam cilícios, abstenções roxas\"; já \"se lhe escondiam a fronte, ondeadamente, eram só ternura\". O mesmo acontece com o rosto: \"Não era enigmático o seu rosto\" quando estava coberto, mas \"no seu corpo havia mistério\".\nPasso 3: a silhueta, embora \"parecesse não se dever salientar notavelmente\", fazia com que ele se destacasse \"em todas as multidões\". É mais um contraste de pontos de vista.\nLogo, o narrador descreve Gervásio de forma subjetiva, alternando perspectivas conforme as imagens que ele lhe desperta: alternativa D.","pq":{"A":"Não há argumentação depreciativa nem julgamento sobre Gervásio merecer a amizade. No 1º parágrafo, o narrador diz que ele \"volveu-se-me o companheiro de todas as horas\", e a descrição oscila entre o \"terrível\" e a \"ternura\". O \"Perturbava\" indica impacto, não desprezo.","B":"O parágrafo não narra momentos de convivência: é uma descrição física e de impressões. \"Perturbava\" se refere ao efeito do aspecto físico, não a uma presença incômoda, e o texto não diz que ele era seu \"melhor amigo\".","C":"Erra em três pontos: o relato não é objetivo (é impressionista), não há \"momentos venturosos\" narrados e o texto afirma que o rosto NÃO era enigmático (\"Não era enigmático o seu rosto\"). O mistério estava no corpo.","D":"Correta. A descrição é carregada de impressões pessoais e alterna imagens opostas (cabelos que evocam penitência ou ternura; rosto sem mistério, corpo de esfinge).","E":"O texto não diz que Gervásio desdenhava das pessoas, apenas que ele era \"olhado, comentado\". O desdém é um acréscimo da alternativa."},"dica":"Em perguntas sobre o narrador, procure marcas de subjetividade (adjetivos avaliativos, \"talvez\", comparações) e estruturas paralelas como \"se...; se...\", que revelam pontos de vista alternados.","dif":"média","nota":"","obs":""},{"id":"2024d1-15","n":15,"area":"Linguagens","disc":"Literatura","assunto":"Figuras de linguagem – sinestesia","titulo":"Sinestesia em A confissão de Lúcio, de Mário de Sá-Carneiro","gab":"A","base":"14-17","imgs":[{"src":"img/2024d1/q15_1.webp","w":783,"h":1101}],"alt":{"A":"Os cabelos compridos […] eram só ternura, perturbadora ternura de espasmos dourados e beijos sutis. (2º parágrafo)","B":"… achei-me estudando Direito na Faculdade de Paris, ou melhor, não estudando. (1º parágrafo)","C":"Curiosa personalidade essa de grande artista falido, ou antes, predestinado para a falência. (1º parágrafo)","D":"Aquela criatura não se nos gravava na memória pelos seus traços fisionômicos, mas sim pelo seu estranho perfil. (2º parágrafo)","E":"Gervásio Vila-Nova era aquele que nós olhamos na rua, dizendo: ali, deve ir alguém. (3º parágrafo)"},"res":"Ideia-chave: sinestesia é a figura que mistura, numa mesma expressão, sensações de sentidos diferentes (visão, tato, audição, olfato, paladar).\nPasso 1: na passagem A, a \"ternura\" (um sentimento) é feita de \"espasmos\" e \"beijos\", que são sensações táteis e corporais. Ao mesmo tempo, os espasmos são \"dourados\", uma cor, portanto uma sensação visual. Dar cor a um espasmo é exatamente a \"sinestesia inusitada\" de que fala Massaud Moisés.\nPasso 2: a passagem também traz associações inesperadas. Os cabelos \"eram só ternura\", a ternura é \"perturbadora\" (quase um paradoxo) e os beijos são \"sutis\".\nPasso 3: as outras alternativas trazem autocorreção, contraste lógico ou uma impressão geral, mas nenhuma delas mistura sentidos.\nPortanto, a alternativa A é a que exemplifica \"as sinestesias mais inusitadas, as associações mais inesperadas\".","pq":{"A":"Correta. \"Espasmos dourados\" junta tato/sensação corporal e cor (visão), e \"perturbadora ternura\" é uma associação inesperada: sinestesia e ousadia expressiva típicas de Sá-Carneiro.","B":"Há uma autocorreção irônica (\"ou melhor, não estudando\"), recurso de humor e de retificação, mas nenhuma mistura de sensações.","C":"Também é uma retificação (\"ou antes\") que intensifica a ideia de fracasso, de \"falido\" para \"predestinado para a falência\". É um jogo de ideias, não uma sinestesia.","D":"Opõe \"traços fisionômicos\" a \"estranho perfil\". É um contraste lógico, em linguagem relativamente direta, sem cruzamento de sentidos.","E":"Expressa, em linguagem simples, a impressão de importância que Gervásio causava nas pessoas. Não há fusão de sensações nem associação inusitada de termos."},"dica":"Sinestesia é cruzamento de sentidos: procure uma palavra de um sentido (cor, som, cheiro, textura) atribuída a algo de outro campo, como \"espasmos dourados\".","dif":"média","nota":"","obs":""},{"id":"2024d1-16","n":16,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Pronomes – valor possessivo do pronome oblíquo","titulo":"Pronome oblíquo com valor possessivo em A confissão de Lúcio","gab":"A","base":"14-17","imgs":[{"src":"img/2024d1/q16_1.webp","w":781,"h":589}],"alt":{"A":"Aquela criatura não se **nos** gravava na memória… (2º parágrafo)","B":"Logo **me** embrenhei por meios mais ou menos artísticos… (1º parágrafo)","C":"… achei-**me** estudando Direito na Faculdade de Paris…(1º parágrafo)","D":"Curiosa personalidade **essa** de grande artista falido… (1º parágrafo)","E":"Em todas as multidões ele **se** destacava… (2º parágrafo)"},"res":"Ideia-chave: os pronomes oblíquos átonos (me, te, se, lhe, nos, vos) às vezes equivalem a um possessivo. Por exemplo, \"tomou-lhe a mão\" significa \"tomou a sua mão\".\nPasso 1: em \"Aquela criatura não se nos gravava na memória\", pergunte: memória de quem? Reescrevendo, temos \"Aquela criatura não se gravava na nossa memória\". O \"nos\" pode ser trocado por \"nossa\" sem mudar o sentido: é o valor possessivo.\nPasso 2: teste a mesma troca nas outras alternativas. Em \"me embrenhei\", não dá para dizer \"embrenhei minha...\", porque o pronome faz parte do verbo \"embrenhar-se\". \"Achei-me\" equivale a \"encontrei a mim mesmo\" (reflexivo). \"Essa\" é demonstrativo. E \"ele se destacava\" faz parte do verbo \"destacar-se\".\nPasso 3: só em A o pronome indica a quem pertence algo (a memória).\nO próprio texto traz outro caso parecido: \"se lhe cobriam a testa os cabelos\", ou seja, cobriam a sua testa.\nResposta: A.","pq":{"A":"Correta. \"Não se nos gravava na memória\" = \"não se gravava na nossa memória\": o \"nos\" indica a quem pertence a memória.","B":"O \"me\" faz parte do verbo pronominal \"embrenhar-se\" (meter-se, enfiar-se) e remete ao próprio narrador. Não há ideia de posse.","C":"\"Achei-me\" = \"encontrei-me\", \"vi-me\": o pronome é reflexivo, objeto do verbo \"achar\", e se refere ao próprio narrador. Não equivale a \"meu\".","D":"\"Essa\" é pronome demonstrativo: retoma a personalidade de Gervásio, mencionada antes (função anafórica). Não indica posse.","E":"O \"se\" integra o verbo pronominal \"destacar-se\" e se refere ao próprio sujeito \"ele\". Não pode ser trocado por \"seu\"."},"dica":"Para achar o pronome oblíquo com valor possessivo, tente trocá-lo por meu/teu/seu/nosso ao lado do substantivo: se a frase mantiver o sentido, é posse.","dif":"média","nota":"","obs":""},{"id":"2024d1-17","n":17,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Concordância nominal e verbal","titulo":"Concordância nominal e verbal em reescritas do texto de Sá-Carneiro","gab":"E","base":"14-17","imgs":[{"src":"img/2024d1/q17_1.webp","w":781,"h":704}],"alt":{"A":"A extensão dos cabelos de Gervásio, que eram longos, não os tornavam escandalosos.","B":"Quando olhava para Gervásio, era comum que me perturbasse os seus traços físicos.","C":"Na época, muitos artistas tinham a disposição de usar chapéus idêntico ao de Gervásio.","D":"Se o chapéu ou os cabelos cobria a testa de Gervásio, não era enigmático o seu rosto.","E":"O rosto não apresentava traços enigmáticos, mas havia mistérios no corpo de Gervásio."},"res":"Ideia-chave: localize o núcleo de cada sujeito e confira cada substantivo com seu adjetivo.\nEm E: \"O rosto não apresentava traços enigmáticos\" tem sujeito \"O rosto\" (singular) e verbo \"apresentava\" (singular), e \"traços enigmáticos\" concordam em gênero e número (masculino plural). Em \"havia mistérios no corpo de Gervásio\", o verbo \"haver\" tem sentido de existir. Nesse caso ele é impessoal e fica no singular, mesmo com complemento no plural (\"havia mistérios\", nunca \"haviam mistérios\"). Tudo correto.\nNas demais:\nA: o núcleo do sujeito é \"extensão\" (singular), então o certo é \"A extensão [...] não os tornava escandalosos\".\nB: o sujeito de \"perturbar\" é \"os seus traços físicos\", então o certo é \"era comum que me perturbassem os seus traços físicos\".\nC: o adjetivo deve concordar com \"chapéus\": \"chapéus idênticos ao de Gervásio\".\nD: com o núcleo plural \"os cabelos\" colado ao verbo, a forma adequada é \"cobriam\", como no próprio texto: \"se lhe cobriam a testa os cabelos ou o chapéu\".\nResposta: E.","pq":{"A":"Erro de concordância verbal: o verbo foi \"atraído\" por \"cabelos\", mas o núcleo do sujeito é \"A extensão\" (singular). O certo é \"não os tornava escandalosos\".","B":"Erro de concordância verbal com sujeito posposto: quem perturba são \"os seus traços físicos\" (plural), então o certo é \"que me perturbassem\". A ordem invertida é a pegadinha.","C":"Erro de concordância nominal: \"idêntico\" deveria ir para o plural para concordar com \"chapéus\": \"chapéus idênticos ao de Gervásio\".","D":"Erro de concordância verbal: no sujeito composto \"o chapéu ou os cabelos\", o núcleo mais próximo do verbo está no plural, e a forma adequada é \"cobriam\". O original traz \"se lhe cobriam a testa os cabelos ou o chapéu\".","E":"Correta. \"O rosto [...] apresentava\" e \"traços enigmáticos\" concordam, e \"havia mistérios\" usa corretamente o \"haver\" impessoal (sentido de existir) no singular."},"dica":"Em concordância, ache o núcleo do sujeito (cuidado com o sujeito posposto e com palavras \"atrativas\" no meio da frase) e lembre que \"haver\" no sentido de existir fica sempre no singular.","dif":"média","nota":"","obs":""},{"id":"2024d1-18","n":18,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Interpretação de charge – crítica social","titulo":"Charge: querer um mundo melhor sem abrir mão do consumismo","gab":"C","base":null,"imgs":[{"src":"img/2024d1/q18_1.webp","w":783,"h":1470}],"alt":{"A":"combatem o consumismo desenfreado e, por essa razão, passam a acreditar na possibilidade de um mundo melhor.","B":"se desencantam com a ideia de um mundo melhor e, consequentemente, partem para o consumismo.","C":"expressam querer um mundo melhor, mas não se dispõem a renunciar às comodidades de que desfrutam.","D":"incitam a busca por um mundo melhor, sem se importar com os impactos que isso pode trazer ao planeta.","E":"se dispõem a deixar de lado seus benefícios para promover ideias falaciosas sobre um mundo melhor."},"res":"Ideia-chave: a charge funciona pelo contraste entre os dois quadros.\nPasso 1: no 1º quadro, o orador pergunta \"QUEM QUER VIVER NUM MUNDO MELHOR E MAIS HARMÔNICO?\", e toda a plateia levanta a mão, entusiasmada.\nPasso 2: no 2º quadro, ele pergunta \"QUEM ESTÁ DISPOSTO A ABANDONAR ESSE MODELO DE CONSUMISMO DESENFREADO PARA ALCANÇAR ISSO?\", e ninguém levanta a mão. O espaço acima da plateia, antes tomado de braços, fica vazio, num silêncio constrangedor.\nPasso 3: a crítica está na contradição. As pessoas dizem desejar um mundo melhor, mas não aceitam abrir mão do consumo, ou seja, das comodidades de que desfrutam, que é justamente o preço para chegar lá.\nResposta: C.","pq":{"A":"Inverte a charge: ninguém se dispõe a combater o consumismo, já que todos baixam a mão no 2º quadro. Além disso, o desejo de um mundo melhor vem antes e não é consequência de combater o consumo.","B":"As pessoas não se desencantam com o mundo melhor: continuam querendo, como mostra o 1º quadro. Elas só se recusam a pagar o preço, e não há uma relação de causa \"desencanto → consumismo\".","C":"Correta. Todos levantam a mão para querer um mundo melhor, mas ninguém a levanta para abandonar o consumismo: o discurso não corresponde à disposição de agir.","D":"Quem incita a busca por um mundo melhor é o orador, e a charge não o critica. Além disso, quem causa impacto no planeta é o consumismo, e não a busca por um mundo melhor.","E":"É o oposto do que a charge mostra: no 2º quadro ninguém se dispõe a deixar de lado seus benefícios. E a charge não trata a ideia de mundo melhor como falaciosa."},"dica":"Em charges com dois quadros, o sentido está no contraste: compare o que muda de um para o outro (aqui, as mãos levantadas) para achar a crítica.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-19","n":19,"area":"Linguagens","disc":"Inglês","assunto":"Compreensão de texto – notícia","titulo":"Simone Biles atrai celebridades nas Olimpíadas de Paris (notícia da BBC)","gab":"D","base":null,"imgs":[{"src":"img/2024d1/q19_1.webp","w":781,"h":1642}],"alt":{"A":"uma atriz que superou um grande bloqueio mental em 2023 e foi para as Olimpíadas.","B":"editora-chefe da revista Vogue que compareceu às Olimpíadas de Paris.","C":"uma medalhista das Olimpíadas que conquistou as passarelas durante a Fashion Week.","D":"um grande nome da ginástica, considerada uma das melhores de todos os tempos.","E":"uma da influenciadora famosa que prestigiou a performance dos EUA na ginástica rítmica."},"res":"Ideia-chave: Simone Biles é a atleta que compete. As celebridades estão na plateia para assisti-la.\n\nO texto deixa isso claro em vários trechos. Ela é chamada de \"The seven-time medallist\" (sete vezes medalhista) e de \"one of the most high profile athletes at the Olympics\" (uma das atletas de maior destaque nas Olimpíadas). Também se diz que \"her stunning performance in the artistic gymnastics\" atraiu os famosos, que estavam \"in the crowd to watch the American gymnast\". Por fim, vem a frase decisiva: \"Biles is considered by many to be the GOAT of women's gymnastics (the greatest of all time)\".\n\nGOAT é a sigla de \"greatest of all time\", ou seja, \"a maior de todos os tempos\". Isso corresponde à alternativa D: um grande nome da ginástica, considerada uma das melhores de todos os tempos.\n\nAs outras alternativas atribuem a Biles papéis que, no texto, pertencem às celebridades da plateia (como Anna Wintour, editora da Vogue) ou que aparecem só como comparação (a Fashion Week).","pq":{"A":"Biles não é atriz, é ginasta (\"the American gymnast\"). Além disso, o texto diz que o bloqueio mental aconteceu \"at the Tokyo Olympics\" e não menciona 2023.","B":"A editora-chefe da Vogue é Anna Wintour, uma das celebridades que estavam \"in the crowd\" para ver Biles. A alternativa troca a atleta por uma espectadora.","C":"A Fashion Week aparece só como comparação: a apresentação dela \"drew celebrities like it was Paris Fashion Week\". Biles é medalhista, mas não desfilou em passarela nenhuma.","D":"Correta. O texto diz que ela é considerada \"the GOAT of women's gymnastics (the greatest of all time)\" e a chama de \"seven-time medallist\".","E":"Biles é a ginasta que se apresentou, não uma influenciadora na plateia. Além disso, a modalidade citada é \"artistic gymnastics\" (ginástica artística), e não ginástica rítmica."},"dica":"Em notícia, identifique primeiro quem faz a ação e quem só assiste. As alternativas erradas costumam trocar os papéis das pessoas citadas.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-20","n":20,"area":"Linguagens","disc":"Inglês","assunto":"Leitura de charge – posicionamento do autor","titulo":"Charge \"Which is worse?\": escudos humanos x bombardeio","gab":"E","base":null,"imgs":[{"src":"img/2024d1/q20_1.webp","w":783,"h":1234}],"alt":{"A":"favorável à guerra, apesar da morte de inocentes.","B":"favorável à guerra, visto que ela movimenta a economia.","C":"crítico aos países que possuem armamentos nucleares.","D":"contrário à guerra, embora a considere lucrativa.","E":"contrário à guerra, uma vez que a violência afeta os mais fracos."},"res":"Ideia-chave: a charge mostra que, dos dois lados da guerra, quem sofre são os civis indefesos.\n\nNa imagem, um homem armado, com o rosto coberto e um lança-foguetes, está agachado junto de uma mulher e duas crianças, usando-os como escudos humanos. Do outro lado, vários mísseis voam na direção deles. A placa pergunta \"WHICH IS WORSE?\" (O que é pior?) e dá duas opções: \"(A) USING HUMAN Shields\" (usar escudos humanos) e \"(B) HITTING them\" (atingi-los).\n\nA pergunta é provocativa: ao colocar as duas atitudes lado a lado, o autor mostra que nenhuma delas é aceitável. Um lado usa civis como proteção e o outro os bombardeia mesmo assim. O foco visual são os rostos assustados da mulher e das crianças, as maiores vítimas.\n\nPor isso, o posicionamento do autor é contrário à guerra, porque a violência atinge os mais fracos (alternativa E).","pq":{"A":"Nada na charge apoia a guerra. A cena das vítimas assustadas e a pergunta provocativa criticam o conflito, não o defendem.","B":"A charge não faz nenhuma referência a economia ou a lucro. O tema é o sofrimento de civis.","C":"Os mísseis não são apresentados como armas nucleares, e a crítica não se dirige a quem tem arsenal nuclear. Ela se dirige ao uso de civis como escudo e ao ataque contra eles.","D":"O começo (\"contrário à guerra\") está certo, mas a ideia de que a guerra seria \"lucrativa\" não aparece em lugar nenhum da charge.","E":"Correta. A charge condena tanto quem usa civis como escudo quanto quem os atinge, mostrando que a violência recai sobre mulheres e crianças."},"dica":"Em charge, observe quem aparece como vítima e o tom da pergunta. Uma pergunta provocativa geralmente critica todas as opções apresentadas.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-21","n":21,"area":"Linguagens","disc":"Inglês","assunto":"Compreensão de texto – notícia","titulo":"Amizade improvável entre a chihuahua Frannie Joy e um carteiro","gab":"B","base":null,"imgs":[{"src":"img/2024d1/q21_1.webp","w":781,"h":805}],"alt":{"A":"as reações amigáveis do chihuahua Larsen.","B":"a amizade peculiar entre um chihuahua e um carteiro.","C":"os seguidores conquistados pelo chihuahua Larsen em seu blog.","D":"o ritual diário de Dan Larsen para receber suas cartas.","E":"as gravações que Frannie Joy fez de seu cão chihuahua."},"res":"Ideia-chave: o próprio título já dá a resposta: \"Dog's unlikely friendship delights the internet\", ou seja, a amizade improvável de um cachorro encanta a internet.\n\nO texto explica quem são os dois amigos: \"A chihuahua named Frannie Joy ran to greet Postman Dan Larsen for the 500th time\". Frannie Joy é a chihuahua, e Dan Larsen é o carteiro (\"Postman\"). Ela correu para recebê-lo pela 500ª vez.\n\nO público on-line se encantou com essa dupla: \"The duo amassed thousands of followers online\", isto é, a dupla acumulou milhares de seguidores depois que \"the dog's owner\" (o dono do cachorro) começou a postar o ritual diário dos dois.\n\n\"Unlikely friendship\" (amizade improvável, inesperada) corresponde a \"amizade peculiar\". Portanto, a resposta é B.","pq":{"A":"Troca os nomes: Larsen é o carteiro (\"Postman Dan Larsen\"). A chihuahua se chama Frannie Joy.","B":"Correta. O título fala em \"unlikely friendship\", e o texto mostra a chihuahua indo receber o carteiro pela 500ª vez.","C":"Erra duas vezes: o chihuahua não se chama Larsen, e o texto não menciona blog. Os seguidores foram conquistados pela dupla, graças às postagens feitas pelo dono do cão.","D":"O \"daily ritual\" é o encontro diário da chihuahua com o carteiro. Larsen entrega as cartas; ele não tem um ritual para recebê-las.","E":"Frannie Joy é a própria chihuahua, então não fez gravação nenhuma. Quem faz as postagens é \"the dog's owner\" (o dono do cachorro)."},"dica":"Antes de responder, monte o mapa de quem é quem no texto (nome → papel). Muitas alternativas erradas só trocam nomes e funções.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-22","n":22,"area":"Linguagens","disc":"Inglês","assunto":"Leitura de charge – humor e inferência","titulo":"Charge: \"ChatGPT misspelled your name\" denuncia trabalho escolar","gab":"A","base":null,"imgs":[{"src":"img/2024d1/q22_1.webp","w":781,"h":1094}],"alt":{"A":"teve seu uso identificado pela professora ao corrigir um trabalho escolar.","B":"soletrou corretamente o nome de um aluno na redação de um trabalho.","C":"acelerou o levantamento de informações e a redação de pesquisas.","D":"agilizou a correção de questões dissertativas em trabalhos escolares.","E":"foi usado pela professora, mas prejudicou o processo de correção."},"res":"Ideia-chave: o humor está em a professora deixar claro que percebeu que o trabalho foi feito pelo ChatGPT.\n\nNa cena, a professora está sentada à mesa, com expressão de tédio, e devolve um trabalho corrigido ao aluno, que já está saindo pela porta. A legenda diz \"By the way, ChatGPT misspelled your name.\" (A propósito, o ChatGPT escreveu seu nome errado.)\n\n\"Misspelled\" significa escreveu (ou soletrou) errado. A fala revela duas coisas: a professora sabe que o texto foi gerado pelo ChatGPT e, ao corrigir, reparou até que o nome do aluno estava escrito errado. A ironia é que o aluno dependeu tanto da IA que nem conferiu o próprio nome.\n\nPortanto, de acordo com a charge, o uso do ChatGPT foi identificado pela professora ao corrigir um trabalho escolar (alternativa A).","pq":{"A":"Correta. A fala da professora ao devolver o trabalho mostra que ela percebeu, na correção, que o texto foi escrito pelo ChatGPT.","B":"Diz o contrário da charge. \"Misspelled\" significa que o nome foi escrito errado, e não corretamente.","C":"A charge não fala em rapidez nem em pesquisa. O foco é que o uso da IA foi descoberto pela professora.","D":"Quem usou o ChatGPT foi o aluno, para fazer o trabalho. A IA não corrigiu nada; a correção foi feita pela professora.","E":"A professora não usou o ChatGPT; ela descobriu que o aluno o usou. A charge também não mostra nenhum prejuízo à correção."},"dica":"Em charges, pergunte-se quem fala, para quem e o que a fala revela. Aqui, \"misspelled\" (escrito errado) é a palavra que sustenta a piada.","dif":"média","nota":"","obs":""},{"id":"2024d1-23","n":23,"area":"Linguagens","disc":"Inglês","assunto":"Compreensão de texto – verbete de dicionário","titulo":"Verbete do Cambridge Dictionary: o verbo \"prompt\" na IA","gab":"C","base":null,"imgs":[{"src":"img/2024d1/q23_1.webp","w":783,"h":1260}],"alt":{"A":"constitui uma ação restrita a profissionais da área de tecnologia.","B":"resulta de códigos gerados por softwares de IAs generativas.","C":"é o ato de inserir um comando para um software ou plataforma de IA.","D":"gera códigos repetidos para uma IA generativa produzir imagens.","E":"está ligado a conteúdos replicados por plataformas de IAs generativas."},"res":"Ideia-chave: basta ler a definição que está no começo do verbete.\n\nO dicionário define \"prompt\" como \"to give an instruction to an artificial intelligence\", ou seja, dar uma instrução a uma inteligência artificial. Em seguida, especifica como isso é feito: \"using natural language rather than computer language\", isto é, usando linguagem natural (a língua do dia a dia) em vez de linguagem de computador.\n\nOs exemplos confirmam esse sentido. Em \"Generative AIs can be prompted to create content\", as IAs generativas recebem um comando para criar conteúdo. Em \"Successfully prompting a text-to-image AI model\", o usuário dá instruções a um modelo que gera imagens a partir de texto.\n\nPortanto, prompt é o ato de inserir um comando, uma instrução, para um software ou plataforma de IA (alternativa C).","pq":{"A":"O verbete diz que o comando é dado \"using natural language rather than computer language\". Por isso qualquer pessoa pode fazer, não só profissionais de tecnologia.","B":"Inverte a relação: o prompt não resulta de códigos gerados pela IA. Ele é a instrução que o usuário dá para a IA gerar algo.","C":"Correta. Corresponde à definição \"to give an instruction to an artificial intelligence\".","D":"O prompt é feito em linguagem natural, não em código, e o texto fala em experimentar \"how to add and order words\" (como acrescentar e ordenar palavras), e não em códigos repetidos.","E":"O exemplo diz que a IA cria conteúdo \"that appears entirely novel\" (que parece totalmente novo), o oposto de conteúdo replicado."},"dica":"Em verbete de dicionário, a resposta costuma estar na primeira linha da definição. Os exemplos servem para confirmar o sentido.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-24","n":24,"area":"Linguagens","disc":"Inglês","assunto":"Gênero cartaz – finalidade comunicativa","titulo":"Cartaz do Transport for London: \"move down inside the carriage\"","gab":"D","base":null,"imgs":[{"src":"img/2024d1/q24_1.webp","w":781,"h":1766}],"alt":{"A":"estabelecer normas de acesso ao espaço público.","B":"evitar que passageiros disputem lugares preferenciais.","C":"autorizar o ingresso de passageiros com sacolas.","D":"facilitar o fluxo de passageiros dentro do vagão ou ônibus.","E":"descontrair o ambiente tenso devido à lotação de pessoas."},"res":"Ideia-chave: o cartaz pede que os passageiros avancem para o interior do vagão e liberem espaço.\n\nA faixa em destaque traz o pedido principal: \"PLEASE MOVE DOWN INSIDE THE CARRIAGE AND MAKE ROOM FOR OTHERS\" (por favor, avance para dentro do vagão e abra espaço para os outros).\n\nO texto rimado do alto reforça a ideia: \"We really don't mean to chide / but try to move along inside, / so fellow travellers won't have to face / an invasion of their personal space\". Ou seja: não queremos dar bronca, mas tente avançar para dentro, para que os outros passageiros não tenham o espaço pessoal invadido.\n\nA imagem mostra um vagão cheio, com vários passageiros em pé. O cartaz é assinado pelo Transport for London, órgão de transporte público, e pelo Mayor of London (prefeito de Londres).\n\nO objetivo, portanto, é organizar a ocupação do vagão para que as pessoas circulem melhor, isto é, facilitar o fluxo de passageiros (alternativa D).","pq":{"A":"O cartaz não trata de regras de entrada no espaço público. É um pedido educado (\"Please\", \"We really don't mean to chide\") sobre como se posicionar dentro do vagão.","B":"O texto não menciona assentos preferenciais nem disputa por lugares. O pedido é avançar para o interior do vagão e abrir espaço.","C":"As sacolas só aparecem no desenho da cena. Nada no texto autoriza ou proíbe passageiros com sacolas.","D":"Correta. \"Move down inside the carriage and make room for others\" pede que as pessoas avancem e liberem espaço, o que melhora a circulação.","E":"O tom leve e rimado é só o jeito de fazer o pedido sem parecer bronca. A finalidade é mudar o comportamento dos passageiros, não relaxar o ambiente."},"dica":"Para achar o objetivo de um cartaz, procure a frase em destaque no imperativo (\"Please move...\", \"Make room...\"). Ela diz o que o autor quer que o leitor faça.","dif":"fácil","nota":"","obs":""},{"id":"2024d1-25","n":25,"area":"Ciências da Natureza","disc":"Física","assunto":"Cinemática – velocidade média e conversão de unidades","titulo":"Tempo mínimo para atravessar o túnel da Imigrantes a 80 km/h","gab":"C","base":null,"imgs":[{"src":"img/2024d1/q25_1.webp","w":783,"h":649}],"alt":{"A":"entre 3 e 4 minutos.","B":"entre 1 e 2 minutos.","C":"entre 2 e 3 minutos.","D":"de mais de 4 minutos.","E":"de menos de 1 minuto."},"res":"**Ideia-chave:** o menor tempo acontece quando a moto anda na maior velocidade permitida, 80 km/h. Basta usar Δt = Δs ÷ v, com as unidades combinando.\n\n1) Converta a velocidade para m/s:\nv = 80 ÷ 3,6 ≈ 22,2 m/s\n\n2) Calcule o tempo:\nΔt = 3 146 ÷ (80/3,6) = 3 146 × 3,6 ÷ 80\nΔt = 11 325,6 ÷ 80 ≈ 141,6 s\n\n3) Passe para minutos:\n141,6 ÷ 60 ≈ 2,36 min (cerca de 2 min e 22 s)\n\nOutro caminho, sem converter para m/s: a 80 km/h, a moto percorre 80 000 m em 60 min, ou seja, ≈ 1 333 m por minuto. Então 3 146 ÷ 1 333 ≈ 2,36 min.\n\nO tempo fica entre 2 e 3 minutos: alternativa C.","pq":{"A":"Esse valor aparece quando você faz 3,146 km ÷ 80 km/h = 0,0393 h e lê isso como 3,93 min, como se 1 hora tivesse 100 minutos. O certo é 0,0393 × 60 ≈ 2,36 min.","B":"É a pegadinha de confundir segundos com minutos: o tempo é 141,6 s, e quem lê isso como \"1,41 min\" cai aqui. Na verdade, 141,6 s equivalem a 2 min e 22 s.","C":"Correta. A 80 km/h ≈ 22,2 m/s, a moto leva 3 146 × 3,6 ÷ 80 ≈ 141,6 s ≈ 2,36 min para atravessar o túnel.","D":"Para passar de 4 minutos, a moto teria de andar abaixo de uns 47 km/h (3,146 km em 4 min). O enunciado pede o MENOR tempo, que corresponde à velocidade máxima, 80 km/h.","E":"Aparece quando você divide 3 146 por 80 sem converter unidades (≈ 39) e trata o resultado como segundos, misturando metros com km/h. Em 1 minuto a moto percorre só cerca de 1 333 m, menos da metade do túnel."},"dica":"Menor tempo = maior velocidade permitida; converta km/h em m/s dividindo por 3,6 e, no final, lembre que 1 min = 60 s (e não 100 s).","dif":"fácil","nota":"","obs":""},{"id":"2024d1-26","n":26,"area":"Ciências da Natureza","disc":"Física","assunto":"Dinâmica
