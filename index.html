<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Simulado Provão Paulista</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Simulado com questões reais do Provão Paulista Seriado (3ª série, 2023, 2024 e 2025), com rabisco e correção comentada.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: caderno de prova + folha de respostas — a questão fica numa folha branca (o recorte original do caderno),
   com a folha de respostas fixa ao lado no computador e numa gaveta no celular. */
:root {
  --bg: #E9EDF3;
  --surface: #FFFFFF;
  --surface-2: #F3F5F9;
  --ink: #16202E;
  --muted: #586377;
  --line: #D1D8E2;
  --accent: #1C4BCB;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1E8FA;
  --ok: #0F7640;
  --ok-bg: #DDF2E5;
  --bad: #BF2629;
  --bad-bg: #FAE3E2;
  --warn: #8F5400;
  --warn-bg: #FCEFD3;
  --ling: #0A6F7B;
  --nat: #367A22;
  --mat: #1F44B0;
  --hum: #82367B;
  --paper: #FFFFFF;
  --paper-edge: #C8D0DC;
  --shadow: 0 1px 2px rgba(18, 28, 48, .06), 0 8px 24px rgba(18, 28, 48, .08);
  --f-display: "Archivo", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
  --topbar: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D121A; --surface: #151C27; --surface-2: #1B2431; --ink: #E4E8EF; --muted: #97A2B5; --line: #2A3445;
    --accent: #89A5FF; --accent-ink: #0D121A; --accent-soft: #1D2946;
    --ok: #57C98D; --ok-bg: #11301F; --bad: #FF8079; --bad-bg: #3A1918; --warn: #F0B44B; --warn-bg: #35280E;
    --ling: #52C3CF; --nat: #84CB6E; --mat: #89A5FF; --hum: #D78ED1;
    --paper: #FFFFFF; --paper-edge: #3A4558;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D121A; --surface: #151C27; --surface-2: #1B2431; --ink: #E4E8EF; --muted: #97A2B5; --line: #2A3445;
  --accent: #89A5FF; --accent-ink: #0D121A; --accent-soft: #1D2946;
  --ok: #57C98D; --ok-bg: #11301F; --bad: #FF8079; --bad-bg: #3A1918; --warn: #F0B44B; --warn-bg: #35280E;
  --ling: #52C3CF; --nat: #84CB6E; --mat: #89A5FF; --hum: #D78ED1;
  --paper: #FFFFFF; --paper-edge: #3A4558;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.55;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.label {
  font-family: var(--f-display); font-stretch: 75%; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 12.5px; color: var(--muted);
}
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-weight: 700; font-size: 15px; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .05s;
}
.btn:hover { border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { min-height: 34px; padding: 0 12px; font-size: 14px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; flex: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px;
  font-size: 12.5px; font-weight: 700; line-height: 1.6; border: 1px solid currentColor; white-space: nowrap;
}
.a-ling { color: var(--ling); } .a-nat { color: var(--nat); } .a-mat { color: var(--mat); } .a-hum { color: var(--hum); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; display: inline-block; flex: none; }

/* ---------- topo ---------- */
.site-head { background: var(--surface); border-bottom: 1px solid var(--line); }
.site-head .wrap { display: flex; align-items: center; gap: 14px; padding-block: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark {
  width: 40px; height: 40px; border-radius: 9px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-stretch: 70%; font-size: 15px; letter-spacing: .02em; flex: none;
}
.brand h1 { font-family: var(--f-display); font-stretch: 80%; font-weight: 800; font-size: 22px; letter-spacing: .01em; line-height: 1.1; }
.brand p { color: var(--muted); font-size: 14px; }
.head-actions { margin-left: auto; display: flex; gap: 8px; }

/* ---------- início ---------- */
.home { padding-block: 28px 120px; display: grid; gap: 36px; }
.step { display: grid; gap: 14px; }
.step-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.step-head h2 { font-family: var(--f-display); font-stretch: 85%; font-weight: 800; font-size: 24px; }
.step-head .num { font-family: var(--f-mono); color: var(--accent); font-weight: 600; font-size: 15px; }
.step-head p { color: var(--muted); font-size: 15px; }
.provas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: auto auto; grid-auto-flow: column; gap: 14px; }
@media (max-width: 980px) { .provas { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; grid-auto-flow: row; } }
@media (max-width: 520px) { .provas { grid-template-columns: minmax(0, 1fr); } }
.prova {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px;
  align-content: start; text-align: left; position: relative; min-width: 0;
}
.prova.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.prova .yr { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.prova .yr b { font-family: var(--f-display); font-stretch: 75%; font-weight: 800; font-size: 30px; line-height: 1; }
.prova .yr span { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.prova .areas { display: flex; flex-wrap: wrap; gap: 6px; }
.prova .meta { color: var(--muted); font-size: 14px; }
.prova .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.resume {
  background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 14px; padding: 14px 16px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.resume p { flex: 1 1 260px; min-width: 0; }
.selbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.selbar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
.selbar input[type=number] { width: 64px; min-height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 0 8px; }
.disc-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.disc-chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13.5px; font-weight: 700; }
.disc-chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.qlist { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.qarea + .qarea { border-top: 1px solid var(--line); }
.qarea-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--surface-2); }
.qarea:first-child .qarea-h { border-radius: 14px 14px 0 0; }
.qarea-h input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.qarea-h h3 { font-family: var(--f-display); font-stretch: 85%; font-weight: 800; font-size: 16px; }
.qarea-h .cnt { margin-left: auto; font-size: 13px; color: var(--muted); }
.qrow { display: grid; grid-template-columns: 22px 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 16px; border-top: 1px solid var(--line); cursor: pointer; }
.qrow:hover { background: var(--surface-2); }
.qrow input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.qrow .qn { font-family: var(--f-mono); font-weight: 600; font-size: 14px; color: var(--muted); }
.qrow .qt { min-width: 0; }
.qrow .qt b { display: block; font-weight: 700; font-size: 15px; line-height: 1.3; }
.qrow .qt span { font-size: 13px; color: var(--muted); }
.qrow .dif { font-size: 12px; color: var(--muted); white-space: nowrap; }
.opts { display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.opt-row { display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; }
.opt-row > .label { min-width: 110px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 700; }
.seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.hint { color: var(--muted); font-size: 14px; }
.check { display: inline-flex; gap: 8px; align-items: center; font-weight: 700; font-size: 15px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.startbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.startbar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.startbar .info { min-width: 0; flex: 1; font-size: 15px; }
.startbar .info b { font-family: var(--f-mono); }
.hist { display: grid; gap: 8px; }
.hist-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.hist-row .score { font-family: var(--f-mono); font-weight: 600; }
.hist-row .when { color: var(--muted); font-size: 14px; }
.hist-row .grow { flex: 1; min-width: 160px; }
.foot { color: var(--muted); font-size: 13.5px; padding-block: 8px 24px; }
.foot p + p { margin-top: 6px; }

/* ---------- prova ---------- */
.exam-top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); border-bottom: 1px solid var(--line);
}
.exam-top .wrap { display: flex; align-items: center; gap: 10px; min-height: var(--topbar); }
.exam-top .title { font-family: var(--f-display); font-stretch: 80%; font-weight: 800; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.timer { font-family: var(--f-mono); font-weight: 600; font-size: 17px; padding: 4px 10px; border-radius: 8px; background: var(--surface-2); white-space: nowrap; }
.timer.low { background: var(--warn-bg); color: var(--warn); }
.exam-top .sp { flex: 1; }
.exam-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; padding-block: 18px 120px; }
@media (max-width: 1000px) { .exam-grid { grid-template-columns: minmax(0, 1fr); } .side { display: none; } }
.qhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.qbadge { background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-stretch: 70%; font-weight: 800; letter-spacing: .05em; font-size: 17px; padding: 3px 12px; border-radius: 4px; }
.qhead .of { color: var(--muted); font-size: 14px; }
.qhead .flag { margin-left: auto; }
.flag.on { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }

.tools {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--topbar)); z-index: 20;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px; margin-bottom: 12px;
}
.tools .grp { display: flex; gap: 4px; align-items: center; }
.tools .div { width: 1px; height: 26px; background: var(--line); margin: 0 2px; }
.tbtn {
  width: 38px; height: 38px; border-radius: 9px; border: 1px solid transparent; background: transparent; display: grid; place-items: center; position: relative;
}
.tbtn:hover { background: var(--surface-2); }
.tbtn.on { background: var(--accent-soft); border-color: var(--accent); }
.tbtn svg { width: 20px; height: 20px; }
.tbtn .sw { position: absolute; bottom: 5px; left: 10px; right: 10px; height: 3px; border-radius: 2px; }
.ink-toggle { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; }
.ink-toggle.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.ink-toggle svg { width: 18px; height: 18px; }
.tools .zoom { margin-left: auto; }
.tools .ztxt { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); min-width: 40px; text-align: center; }
.tools-off .grp.pens { opacity: .45; }
.drawer .tools { top: 0; }

.sheet {
  background: var(--paper); border: 1px solid var(--paper-edge); border-radius: 6px; box-shadow: var(--shadow);
  padding: 14px; margin: 0 auto; max-width: 100%;
}
.base-label { font-family: var(--f-display); font-stretch: 80%; font-weight: 700; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: #5A6476; margin-bottom: 6px; }
.ink-host { position: relative; width: 100%; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.ink-host img { display: block; height: auto; max-width: 100%; -webkit-user-drag: none; user-select: none; pointer-events: none; }
.sheet.anexo { padding: 10px; }
.sheet.anexo img { display: block; width: 100%; height: auto; }
.anexo-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 6px; }
.anexo-hint { display: none; color: var(--muted); font-size: 13.5px; margin-bottom: 8px; }
@media (max-width: 700px) { .anexo-scroll .sheet.anexo { width: 980px; max-width: none; } .anexo-hint { display: block; } }
.ink-host .gap { height: 0; margin-top: 4%; border-top: 1px dashed #C5CCD8; margin-bottom: 3%; }
canvas.ink { position: absolute; left: 0; top: 0; mix-blend-mode: multiply; pointer-events: none; }
canvas.ink-live { pointer-events: auto; touch-action: pan-x pan-y pinch-zoom; }
body.inking canvas.ink-live { touch-action: none; cursor: crosshair; }
body.erasing canvas.ink-live { cursor: cell; }
.readonly canvas.ink-live { pointer-events: none; }

.answers { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.answers .label { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.bubbles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.bub { display: grid; justify-items: center; gap: 4px; }
.bub-btn {
  width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--ink); background: var(--surface);
  font-family: var(--f-display); font-stretch: 85%; font-weight: 800; font-size: 22px; display: grid; place-items: center; position: relative;
}
.bub-btn:hover { background: var(--surface-2); }
.bub-btn.on { background: var(--ink); color: var(--surface); }
.bub-btn.struck { opacity: .38; }
.bub-btn.struck::after { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; height: 2.5px; background: var(--bad); transform: rotate(-35deg); border-radius: 2px; }
.bub-x { border: 0; background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 700; padding: 4px 6px; border-radius: 6px; min-height: 30px; }
.bub-x:hover { background: var(--surface-2); color: var(--ink); }
.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; }

.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--topbar) + 18px); display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.sheet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
.cell {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 0 3px; display: grid; justify-items: center; gap: 0; position: relative; min-height: 46px;
}
.cell .n { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); line-height: 1.2; }
.cell .l { font-family: var(--f-display); font-stretch: 85%; font-weight: 800; font-size: 17px; line-height: 1.2; min-height: 20px; }
.cell.done { background: var(--accent-soft); border-color: var(--accent); }
.cell.cur { outline: 2.5px solid var(--ink); outline-offset: 1px; }
.cell.flagged::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
.legend i { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); display: inline-block; }
.mbar {
  display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.mbar .wrap { display: flex; align-items: center; gap: 8px; padding-block: 8px; }
.mbar .mid { flex: 1; }
@media (max-width: 1000px) { .mbar { display: block; } .exam-top .desk { display: none; } }

/* gavetas e diálogos */
.overlay { position: fixed; inset: 0; z-index: 80; background: rgba(8, 12, 20, .5); display: flex; justify-content: flex-end; }
.drawer {
  background: var(--bg); width: min(560px, 100%); height: 100%; display: flex; flex-direction: column; box-shadow: var(--shadow);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.drawer.wide { width: min(860px, 100%); }
.drawer-h { display: flex; align-items: center; gap: 10px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.drawer-h h3 { font-family: var(--f-display); font-stretch: 85%; font-weight: 800; font-size: 18px; margin-right: auto; }
.drawer-b { overflow: auto; padding: 16px; flex: 1; -webkit-overflow-scrolling: touch; }
.scratch { background-color: #FFFFFF; background-image: linear-gradient(#E3E8F0 1px, transparent 1px), linear-gradient(90deg, #E3E8F0 1px, transparent 1px); background-size: 24px 24px; border: 1px solid var(--paper-edge); border-radius: 6px; }
.scratch .ink-host { height: 2200px; }
.modal-wrap { position: fixed; inset: 0; z-index: 90; background: rgba(8, 12, 20, .55); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 16px; max-width: 460px; width: 100%; padding: 20px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.modal h3 { font-family: var(--f-display); font-stretch: 85%; font-weight: 800; font-size: 21px; }
.modal .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

<script>window.PROVAS = {"2025d1":{"ano":2025,"dia":1,"descricao":"Linguagens (Português, Literatura, Inglês) e Ciências da Natureza (Biologia, Química, Física). Com a classificação periódica do caderno.","questoes":[{"id":"2025d1-01","n":1,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Interpretação de texto – sentido simbólico","titulo":"O que o cavalo Caramelo, ilhado num telhado em Canoas, representa no texto","gab":"A","base":"01-05","imgs":[{"src":"img/2025d1/q01_1.webp","w":783,"h":621}],"alt":{"A":"o enfrentamento de adversidades enquanto se espera por ajuda.","B":"o desamparo e a falta de solidariedade em situações de desastre.","C":"a fragilidade da vida frente à destruição causada por grandes tragédias.","D":"a vitória das forças da natureza sobre o desejo de sobrevivência.","E":"a importância de registrar uma catástrofe nos livros de história."},"res":"Ideia-chave: a pergunta é sobre o que o cavalo simboliza, e o próprio autor responde isso no 2º parágrafo.\n\nPrimeiro, a resistência às adversidades: Caramelo “resistiu por quatro dias e meio no telhado de uma casa completamente inundada”, “sem alimento nem água potável”. O autor diz que ele “materializa o desejo de sobrevivência e a força da vida de milhares de pessoas que enfrentaram as situações mais adversas para encontrar alguma saída diante desta catástrofe”.\n\nSegundo, a espera por socorro: “Caramelo deu sentido ao ato de espera apostando em uma ajuda que chegaria em algum momento, uma espera ativa que aciona evidentemente um pensamento sobre esperança”.\n\nJunte as duas ideias: enfrentar a adversidade + esperar ativamente pela ajuda. É exatamente o que diz a alternativa A. Repare que o título (“a esperança no telhado”) aponta para o mesmo sentido: não é uma espera passiva, é resistência enquanto o resgate não chega.","pq":{"A":"Correta: o texto mostra Caramelo resistindo dias no telhado, sem comida nem água, e apostando “em uma ajuda que chegaria em algum momento” — a “espera ativa”, ou seja, enfrentar a adversidade enquanto se espera socorro.","B":"Inverte o texto: Caramelo “aciona também as energias solidárias de outras milhares de pessoas” que viraram voluntários “para desfazer tantos desamparos”. Ele simboliza a solidariedade que combate o desamparo, não a falta dela.","C":"O texto diz que ali “a vida se fez, de forma comovente, mais forte do que a destruição”. Caramelo representa a força da vida, não sua fragilidade.","D":"É o oposto do texto: a imagem mostra a vida vencendo a destruição causada pela enchente, e o cavalo “materializa o desejo de sobrevivência”, que prevalece sobre a natureza, e não o contrário.","E":"Pegadinha de leitura: o autor diz que a imagem deve ser guardada “mesmo que não fique registrado nos livros de história”. O registro histórico não é o que Caramelo simboliza; para o autor, a lembrança da imagem vale independentemente desse registro."},"dica":"Quando a pergunta é o que algo “representa”, procure as frases em que o autor explicita o símbolo (“materializa”, “é o desenho mais vivo de”) e descarte as alternativas que invertem esse sentido.","dif":"fácil","nota":"","obs":""},{"id":"2025d1-02","n":2,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Conjunções – valor semântico (conclusão e explicação)","titulo":"Valor de “por isso” e “pois” no texto sobre o cavalo Caramelo","gab":"E","base":"01-05","imgs":[{"src":"img/2025d1/q02_1.webp","w":783,"h":810}],"alt":{"A":"uma causa e uma condição.","B":"uma consequência e uma finalidade.","C":"uma conclusão e uma condição.","D":"uma causa e uma finalidade.","E":"uma conclusão e uma explicação."},"res":"Ideia-chave: descubra a relação lógica de cada conector trocando-o por um sinônimo típico.\n\n“Por isso”: o que vem depois é uma conclusão tirada do que veio antes. Premissa: “Caramelo é o desenho mais vivo da esperança”. Conclusão: “seu resgate teve um sentido simbólico”. Teste: “Caramelo é o desenho mais vivo da esperança; portanto, seu resgate teve um sentido simbólico.” O sentido se mantém, então “por isso” é conclusivo.\n\n“Pois”: aqui ele está no início da oração, antes do verbo, e justifica a afirmação anterior. Por que a imagem “capturou com precisão uma correnteza contra a inundação”? Porque “ali a vida se fez, de forma comovente, mais forte do que a destruição”. Teste: troque “pois” por “porque” ou “já que”: funciona. Não dá para trocar por “se/caso” (condição) nem por “para que” (finalidade).\n\nConclusão + explicação = alternativa E.\n\nObservação útil: “pois” anteposto ao verbo é explicativo; deslocado para depois do verbo, entre vírgulas (“É, pois, ...”), vira conclusivo.","pq":{"A":"“Por isso” não introduz causa: a causa (ser o desenho da esperança) vem antes dele, e o que ele introduz é a conclusão. E “pois” não exprime condição, já que não pode ser trocado por “se” ou “caso”.","B":"Chamar o “por isso” de consequência até seria defensável, mas “pois” não indica finalidade: não equivale a “para que” ou “a fim de que”; ele justifica o que foi dito antes.","C":"Acerta o “por isso” (conclusão), mas erra o “pois”: a oração “ali a vida se fez, de forma comovente, mais forte do que a destruição” não é uma hipótese, é a justificativa de um fato já afirmado.","D":"Erra os dois: “por isso” introduz o desfecho lógico, não a causa, e “pois” introduz uma explicação, não um objetivo a ser alcançado.","E":"Correta: “por isso” (= portanto) introduz a conclusão de que o resgate teve sentido simbólico, e “pois” (= porque) explica por que a imagem representou uma “correnteza contra a inundação”."},"dica":"Para identificar o valor de um conector, substitua-o: portanto = conclusão; porque/já que = explicação ou causa; se/caso = condição; para que = finalidade. O que mantiver o sentido revela a relação.","dif":"média","nota":"","obs":""},{"id":"2025d1-03","n":3,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Comparação entre textos – símbolos e sentimentos coletivos","titulo":"Cavalo Caramelo e vira-lata caramelo: o que os dois simbolizam","gab":"A","base":["01-05","03-05"],"imgs":[{"src":"img/2025d1/q03_1.webp","w":781,"h":480}],"alt":{"A":"a sentimentos de alcance coletivo.","B":"à luta em defesa dos animais.","C":"à paixão dos brasileiros por bichos.","D":"à busca por reconhecimento.","E":"a manifestações de nacionalismo."},"res":"Ideia-chave: a resposta precisa valer para OS DOIS textos ao mesmo tempo; procure o ponto comum entre eles.\n\nTexto 1 (cavalo): Caramelo “materializa o desejo de sobrevivência e a força da vida de milhares de pessoas” e “aciona também as energias solidárias de outras milhares de pessoas”. Ele simboliza esperança e solidariedade, sentimentos compartilhados por muita gente.\n\nTexto 2 (cachorro): o vira-lata “é símbolo nacional”, é chamado de “o querido vira-lata caramelo”, uma montagem com ele na nota de R$ 200 “circulou pelas redes sociais” e “até uma campanha foi feita” para que fosse escolhido. Ele simboliza um carinho popular, um “xodó” de muita gente.\n\nO que une os dois: ambos concentram sentimentos (esperança, solidariedade, afeto) que mobilizam coletividades, não uma pessoa só. É a alternativa A.\n\nAs demais alternativas ou não aparecem em nenhum texto (B, D) ou valem só para um deles (C e E cabem, no máximo, no texto do vira-lata).","pq":{"A":"Correta: o cavalo encarna a esperança e a solidariedade de “milhares de pessoas”, e o vira-lata é um “símbolo nacional” querido, que mobilizou as redes sociais e uma campanha; nos dois casos, sentimentos compartilhados por muita gente.","B":"Nenhum dos textos fala de proteção ou de direitos dos animais: o cavalo simboliza a esperança humana diante da tragédia, e o cachorro, um carinho popular que quase o levou à cédula de R$ 200.","C":"Generaliza a partir de um só texto: o artigo sobre o cavalo não trata de amor a bichos, e sim de esperança e sobrevivência humanas projetadas no animal. A ideia de afeição por animais só cabe, em parte, no segundo texto.","D":"Ninguém nos textos busca reconhecimento: o cavalo representa esperança, e a campanha pelo cachorro na nota expressa carinho do público, não uma busca de prestígio associada ao símbolo.","E":"Só o vira-lata é chamado de “símbolo nacional”; o cavalo Caramelo representa esperança e solidariedade numa tragédia, sem relação com patriotismo. A alternativa vale para um texto, não para os dois."},"dica":"Em questões que comparam dois textos, teste cada alternativa nos DOIS: a que só funciona para um deles é a pegadinha.","dif":"média","nota":"","obs":""},{"id":"2025d1-04","n":4,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Linguagem figurada e valorativa em títulos","titulo":"Títulos “a esperança no telhado” e “Um xodó valioso”: tipo de descrição","gab":"D","base":["01-05","03-05"],"imgs":[{"src":"img/2025d1/q04_1.webp","w":783,"h":527}],"alt":{"A":"objetiva e afetiva.","B":"denotativa e subjetiva.","C":"figurada e depreciativa.","D":"metafórica e valorativa.","E":"literal e avaliativa."},"res":"Ideia-chave: compare o que a imagem mostra literalmente com o que o título diz sobre ela.\n\n1º título: “Cavalo Caramelo: a esperança no telhado”. A foto mostra, literalmente, um cavalo em cima de um telhado. O título, porém, chama o cavalo de “a esperança”: transfere para o animal um sentido abstrato, por semelhança. Isso é metáfora, e o texto confirma a leitura ao dizer que “Caramelo é o desenho mais vivo da esperança”. Logo, a descrição não é objetiva, denotativa nem literal.\n\n2º título: “Um xodó valioso”. “Xodó” é o ser querido, objeto de carinho; “valioso” é adjetivo que atribui valor positivo (e ainda brinca com a cédula de R$ 200 que aparece na imagem). Ambas as palavras expressam juízo de valor favorável sobre o cachorro: é uma descrição valorativa, nada depreciativa.\n\nMetafórica + valorativa = alternativa D.","pq":{"A":"O primeiro título não é objetivo: uma descrição objetiva seria algo como “cavalo ilhado num telhado”. Chamar o animal de “a esperança” já é linguagem figurada; o “afetiva” até combina com o segundo, mas a dupla falha no primeiro.","B":"“Denotativa” é o sentido literal, de dicionário; “a esperança no telhado” é conotativo, porque o cavalo não é literalmente a esperança. O erro está no primeiro termo.","C":"“Figurada” serve para o primeiro título, mas “depreciativa” é o oposto do segundo: “xodó” e “valioso” elogiam o cachorro, não o diminuem.","D":"Correta: chamar o cavalo de “a esperança” é metáfora, e “xodó” e “valioso” atribuem valor positivo e afetivo ao vira-lata, uma descrição valorativa.","E":"Literalmente, o que estava no telhado era um cavalo, não “a esperança”; portanto o primeiro título não é literal. “Avaliativa” até se aproxima de “valorativa”, mas a primeira parte derruba a alternativa."},"dica":"Se o título dá a um ser concreto o nome de uma ideia abstrata (“a esperança”), é metáfora; se usa palavras que elogiam ou criticam (“xodó”, “valioso”), é valorativo.","dif":"média","nota":"","obs":""},{"id":"2025d1-05","n":5,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Substantivo próprio x adjetivo de cor – uso da maiúscula","titulo":"“Caramelo” x “caramelo”: por que a maiúscula muda o sentido","gab":"C","base":["01-05","03-05"],"imgs":[{"src":"img/2025d1/q05_1.webp","w":783,"h":1020}],"alt":{"A":"a primeira indica um atributo, estendendo-o a todos os seres de uma mesma espécie, enquanto a segunda denomina um ser a partir de uma característica que o particulariza.","B":"a primeira nomeia um ser a partir de uma característica física que o individualiza, enquanto a segunda realiza a nomeação a partir de elementos comportamentais comuns a uma espécie.","C":"a primeira nomeia um ser, distinguindo-o de outros da mesma espécie, enquanto a segunda caracteriza um conjunto de seres da mesma espécie que têm um atributo comum.","D":"tanto a primeira quanto a segunda nomeiam um ser a partir de uma característica física que permite individualizá-lo, mas a primeira também reporta a um traço de comportamento.","E":"os dois casos indicam um atributo que caracteriza um conjunto de seres da mesma espécie, mas a segunda também nomeia um ser, individualizando-o entre os da mesma espécie."},"res":"Ideia-chave: no meio da frase, a letra maiúscula marca um nome próprio (um indivíduo único); a minúscula marca uma palavra comum, que caracteriza uma classe.\n\n“Caramelo” (maiúscula), no 1º texto: aparece em “o cavalo Caramelo”. É o nome daquele cavalo específico, que ficou no telhado em Canoas. A palavra funciona como substantivo próprio: separa esse animal de todos os outros cavalos.\n\n“caramelo” (minúscula), no 2º texto: aparece em “o querido vira-lata caramelo”. Aqui a palavra funciona como adjetivo: indica a cor da pelagem e, com ela, caracteriza um grupo inteiro de cães — todos os vira-latas dessa cor. Não é o nome de um cachorro: o texto fala genericamente de “um cachorrinho” numa montagem, representando o tipo, que é tratado como “símbolo nacional”.\n\nPortanto: a primeira nomeia um indivíduo; a segunda caracteriza um conjunto de seres com um atributo comum. Alternativa C.","pq":{"A":"Inverte as funções: é a forma minúscula (“caramelo”) que indica um atributo comum a vários cães, e a maiúscula (“Caramelo”) que particulariza um único cavalo.","B":"Erra a segunda parte: em “vira-lata caramelo” a palavra se refere à cor da pelagem, uma característica física, e não a comportamentos da espécie. Além disso, a cor não individualiza o cavalo; o que o individualiza é o uso como nome próprio.","C":"Correta: “Caramelo” é nome próprio do cavalo, distinguindo-o dos demais; “caramelo” caracteriza o grupo de vira-latas que compartilham a mesma cor de pelagem.","D":"Só a primeira nomeia um ser individual; a segunda não é nome de nenhum cachorro específico, e sim uma característica comum a muitos. E o texto não liga o nome do cavalo a nenhum traço de comportamento.","E":"Inverte de novo: quem individualiza é “Caramelo” (o cavalo), não “caramelo”. E o nome do cavalo não caracteriza um conjunto de seres; ele aponta para um animal só."},"dica":"Maiúscula no meio da frase = nome próprio de um indivíduo; a mesma palavra em minúscula é comum e caracteriza uma classe (compare “o cavalo Caramelo” com “um vira-lata caramelo”).","dif":"média","nota":"","obs":""},{"id":"2025d1-06","n":6,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Interpretação de texto – variação linguística (r caipira)","titulo":"Em que consiste o “resgate caipira” na fala paulistana","gab":"B","base":"06-08","imgs":[{"src":"img/2025d1/q06_1.webp","w":748,"h":439}],"alt":{"A":"variação entre o “r tepe” e o “r retroflexo”.","B":"volta do “r retroflexo” após sua substituição.","C":"troca do “r retroflexo” pelo “r tepe”.","D":"introdução do “r retroflexo” por imigrantes italianos.","E":"valorização do “r tepe” por cantores sertanejos."},"res":"Ideia-chave: “resgate” significa recuperar algo que existia e tinha se perdido. Procure no texto essa sequência: existia → foi substituído → voltou.\n\nExistia: sobre o “r caipira”, o texto afirma que “Não é a primeira vez que ele aparece”; a professora Livia Oushiro lembra que “No começo do século XX, aqui era roça”, e o professor Manoel Mourivaldo diz que as primeiras referências do “r retroflexo” “podem remontar ao século XVI”.\n\nFoi substituído: “Só que esse ‘r’ foi substituído, é possível que pela influência da imigração italiana e portuguesa.”\n\nVoltou: “Agora, acontece esse retorno do ‘r retroflexo’”. O 1º parágrafo descreve o mesmo movimento: o modo “italianizado” “vem dando lugar” a um “r” parecido com o do interior.\n\nOu seja, o resgate caipira é a volta do “r retroflexo” depois de ele ter sido substituído. Alternativa B.","pq":{"A":"A coexistência dos dois “r” é o pano de fundo, mas “resgate” implica recuperar algo perdido; a alternativa fala só em variação e deixa de fora a ideia de retorno, que é o centro do texto.","B":"Correta: o texto diz que o “r” caipira existia em São Paulo, “foi substituído” (talvez pela imigração) e que “agora, acontece esse retorno do ‘r retroflexo’”.","C":"Descreve o movimento contrário: a troca do retroflexo pelo tepe foi a substituição que aconteceu no passado; o resgate é justamente o caminho inverso.","D":"O texto diz o oposto: o retroflexo já existia (referências que “podem remontar ao século XVI”), e a imigração italiana e portuguesa é apontada como possível causa de sua substituição, não de sua introdução.","E":"O que ganhou prestígio com a música sertaneja foi o sotaque caipira, com o “r retroflexo”; o “r tepe” é associado no texto aos Jardins e à Faria Lima, não aos sertanejos."},"dica":"Palavras como “resgate”, “retorno” e “volta” pressupõem três momentos (existia, sumiu, voltou); a alternativa certa precisa contemplar essa sequência.","dif":"fácil","nota":"","obs":""},{"id":"2025d1-07","n":7,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Variação linguística – fatores sociais e geográficos","titulo":"Que contrastes determinam o uso do “r tepe” e do “r retroflexo”","gab":"E","base":"06-08","imgs":[{"src":"img/2025d1/q07_1.webp","w":781,"h":479}],"alt":{"A":"histórica e biológica.","B":"artística e científica.","C":"geracional e filosófica.","D":"política e cultural.","E":"social e geográfica."},"res":"Ideia-chave: localize no texto as oposições que separam quem usa um “r” de quem usa o outro.\n\nContraste social: a mudança acontece “principalmente nas periferias”, enquanto o “r tepe” “virou sinônimo do português falado em regiões mais nobres como os Jardins e a Faria Lima”. É uma oposição de classe e de prestígio, reforçada pela fala de Tatit: “Até pouco tempo, esse sotaque não tinha prestígio”.\n\nContraste geográfico: o novo “r” é “mais parecido com os pronunciados no interior” e é chamado de “caipira”, em oposição à fala da capital. Além disso, dentro da própria cidade, o texto opõe lugares: periferias de um lado, Jardins e Faria Lima do outro.\n\nSocial + geográfico = alternativa E.\n\nCuidado com a C: o texto até menciona os jovens (“sobretudo entre os mais jovens”), mas não há nada de “filosófico”, então a alternativa cai na segunda parte.","pq":{"A":"A dimensão histórica existe (substituição no século XX e retorno agora), mas nada é biológico: a língua que “dobra para trás” só descreve como o som é articulado; não é um fator que decide quem usa cada “r”.","B":"Música (rap, sertanejo) e linguistas aparecem como exemplos e fontes do texto, não como contrastes que determinam o uso; “científica” se refere a quem explica o fenômeno, não à sua causa.","C":"O fator geracional até aparece (“sobretudo entre os mais jovens”), mas não há nenhum contraste filosófico; a alternativa falha na segunda metade.","D":"O texto não menciona disputa ou fator político. O elemento cultural (a música sertaneja) explica a mudança de prestígio, mas as oposições que separam os usos são periferia x bairros nobres e interior x capital.","E":"Correta: o texto opõe periferias a “regiões mais nobres como os Jardins e a Faria Lima” (contraste social) e associa o “r” caipira ao “interior” (contraste geográfico)."},"dica":"Em variação linguística, “social” = classe, prestígio, escolaridade; “geográfica” = região, cidade x interior, bairro; ache no texto as palavras que marcam cada oposição.","dif":"média","nota":"","obs":""},{"id":"2025d1-08","n":8,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Variação linguística – posição do “r” na sílaba (tepe x retroflexo)","titulo":"Palavras em que o “r” pode variar entre tepe e retroflexo em São Paulo","gab":"B","base":"06-08","imgs":[{"src":"img/2025d1/q08_1.webp","w":783,"h":554}],"alt":{"A":"xarope, porta, virtude.","B":"carta, amor, certeza.","C":"maré, dor, careta.","D":"arame, coração, urubu.","E":"vidro, cerca, caroço."},"res":"Ideia-chave: observe em que posição da sílaba está o “r” nos exemplos do texto.\n\nExemplos do “r retroflexo”: “sorte”, “orçamento” e “normal”. Separe as sílabas: sor-te, or-ça-men-to, nor-mal. Nos três, o “r” fecha a sílaba, antes de uma consoante (t, ç, m). Essa posição de final de sílaba, chamada coda, inclui também o “r” no fim da palavra, como em “mar” ou “amor”. É nela que o paulistano pode alternar entre o tepe e o retroflexo caipira.\n\nExemplo do “r tepe”: “carambola” (ca-ram-bo-la), com o “r” entre vogais, abrindo a sílaba “ram”. O texto usa essa palavra só para mostrar como o tepe soa; nessa posição o som é o tepe para qualquer falante, sem alternância com o retroflexo.\n\nAgora teste as alternativas procurando três palavras com “r” em final de sílaba:\ncar-ta, a-mor, cer-te-za → em “carta” e “certeza” o “r” vem antes de consoante; em “amor”, no fim da palavra. As três têm “r” em coda. Alternativa B.\n\nNas outras sempre há pelo menos uma palavra com “r” entre vogais (xa-ro-pe, ma-ré, ca-re-ta, a-ra-me, co-ra-ção, u-ru-bu, ca-ro-ço) ou em encontro consonantal (vi-dro), posições em que o “r” é tepe e não entra nessa alternância.","pq":{"A":"“Porta” e “virtude” têm “r” em final de sílaba e admitem as duas pronúncias, mas “xarope” (xa-ro-pe) tem “r” entre vogais, que é sempre tepe, como em “carambola”.","B":"Correta: em car-ta, a-mor e cer-te-za o “r” fecha a sílaba, a mesma posição de “sorte”, “orçamento” e “normal”, onde o paulistano alterna entre tepe e retroflexo.","C":"Só “dor” tem “r” em final de sílaba; “maré” e “careta” têm “r” entre vogais, posição em que o som é sempre o tepe.","D":"Nenhuma das três tem “r” em final de sílaba: em “arame”, “coração” e “urubu” o “r” está entre vogais, exatamente como em “carambola”, sem alternância com o retroflexo.","E":"Só “cerca” (cer-ca) tem “r” fechando a sílaba. Em “vidro” o “r” forma encontro consonantal com o “d” (vi-dro) e em “caroço” está entre vogais; nesses casos não há variação."},"dica":"Na fala paulistana, a alternância entre tepe e retroflexo acontece quando o “r” fecha a sílaba, antes de consoante ou no fim da palavra (por-ta, a-mor); “r” entre vogais (ca-ro) ou em encontro consonantal (vi-dro, pra-to) é tepe e fica fora dessa variação.","dif":"difícil","nota":"","obs":""},{"id":"2025d1-09","n":9,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Pontuação – efeito de sentido das reticências","titulo":"Reticências em campanha contra o feminicídio: “a gente mete a... polícia”","gab":"E","base":"09-10","imgs":[{"src":"img/2025d1/q09_1.webp","w":781,"h":651}],"alt":{"A":"à indicação de uma pausa para sinalizar a conclusão de uma frase.","B":"a um convite para refletir sobre as consequências da violência doméstica.","C":"à inserção de um termo que complementa o sentido de um verbo.","D":"à necessidade de destacar uma informação que repete o senso comum.","E":"a uma quebra de expectativa na reprodução de um discurso predominante."},"res":"Ideia-chave: a campanha parte de um ditado popular muito conhecido e o subverte; as reticências criam o suspense que prepara essa virada.\n\n1) O ditado é “Em briga de marido e mulher, ninguém mete a colher”, que expressa o senso comum de que ninguém deve se intrometer em conflitos de casal.\n2) A campanha começa reproduzindo esse discurso: “EM BRIGA DE MARIDO E MULHER, A GENTE METE A...”. Ao ler “mete a”, o leitor completa mentalmente com “colher”.\n3) As reticências suspendem a frase exatamente nesse ponto, e o termo que vem depois é outro: “POLÍCIA”, destacado em vermelho. A expectativa criada pelo ditado é quebrada.\n4) Essa quebra inverte o discurso predominante: em vez de não se meter, a sociedade deve intervir, como reforça o texto menor: “LIGUE 190 PARA CHAMAR A POLÍCIA”.\n\nPor isso, as reticências servem à quebra de expectativa na reprodução de um discurso predominante. Resposta: E.","pq":{"A":"As reticências não encerram a frase: ela continua logo depois, com “POLÍCIA”. A pausa existe, mas serve para criar suspense no meio do enunciado, não para sinalizar conclusão.","B":"A campanha como um todo leva à reflexão, mas o papel específico das reticências aqui não é deixar o pensamento em aberto: elas interrompem a frase para que a palavra seguinte surpreenda. Reticências “reflexivas” costumam vir no fim do enunciado, sem nada que as complete.","C":"É verdade que “polícia” completa o verbo “mete” (é objeto direto), mas isso é a sintaxe da frase, não a razão da pontuação: sem as reticências o complemento continuaria lá. A pegadinha é confundir a função da palavra com a função do sinal.","D":"É o contrário: o que vem depois das reticências (“POLÍCIA”) contradiz o senso comum, em vez de repeti-lo. A parte que reproduz o ditado é a que vem antes delas.","E":"Correta: as reticências suspendem o ditado “ninguém mete a colher” no ponto em que o leitor espera “colher” e abrem espaço para “POLÍCIA”, quebrando a expectativa e subvertendo o discurso predominante."},"dica":"Quando um texto publicitário começa um ditado conhecido e usa reticências, espere uma subversão: o que vem depois do “...” costuma ser a quebra de expectativa.","dif":"fácil","nota":"","obs":""},{"id":"2025d1-10","n":10,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Conjunções – valor condicional de “caso”","titulo":"Reescrita da oração introduzida por “caso” na campanha do Ligue 190","gab":"D","base":"09-10","imgs":[{"src":"img/2025d1/q10_1.webp","w":784,"h":535}],"alt":{"A":"“assim que uma mulher estiver em perigo imediato”.","B":"“porque uma mulher está em perigo imediato”.","C":"“embora uma mulher esteja em perigo imediato”.","D":"“se uma mulher estiver em perigo imediato”.","E":"“apesar de uma mulher estar em perigo imediato”."},"res":"Ideia-chave: “caso” é conjunção subordinativa condicional; ela apresenta uma hipótese, uma condição para que algo aconteça.\n\n1) No texto: “LIGUE 190 PARA CHAMAR A POLÍCIA CASO UMA MULHER ESTEJA EM PERIGO IMEDIATO.” A orientação de ligar vale sob uma condição: haver uma mulher em perigo.\n2) A conjunção condicional mais comum é “se”. A troca exige ajustar o tempo verbal: “caso” pede presente do subjuntivo (“esteja”); “se”, numa hipótese voltada ao futuro, pede futuro do subjuntivo (“estiver”).\n3) Conferência: “Ligue 190 para chamar a polícia se uma mulher estiver em perigo imediato.” O sentido de hipótese se mantém, sem acrescentar ideia de tempo, causa ou concessão.\n\nAs demais opções mudam a relação lógica: “assim que” é temporal, “porque” é causal, “embora” e “apesar de” são concessivas. Resposta: D.","pq":{"A":"“Assim que” é locução temporal (equivale a “logo que”): marca o momento em que algo ocorre e trata o perigo como fato esperado, não como hipótese. A relação passa de condição para tempo.","B":"“Porque” é conjunção causal e, com o indicativo “está”, afirma que a mulher já está em perigo como causa da ligação. A campanha não afirma um fato; levanta uma possibilidade.","C":"“Embora” é concessiva: diria que se liga para a polícia apesar de a mulher estar em perigo, como se o perigo fosse um obstáculo à ligação. O sentido fica absurdo.","D":"Correta: “se” é a conjunção condicional típica, e “se uma mulher estiver em perigo imediato” mantém a ideia de hipótese de “caso uma mulher esteja em perigo imediato”, apenas com o ajuste para o futuro do subjuntivo.","E":"“Apesar de” também é concessiva, como “embora”: o perigo passaria a ser algo que se contraria, e não a condição para ligar 190."},"dica":"“Caso” = “se” (condição). Na troca, ajuste o verbo: caso esteja → se estiver; caso possa → se puder.","dif":"fácil","nota":"","obs":""},{"id":"2025d1-11","n":11,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Interpretação de texto – tese do autor","titulo":"Tese de Marcos Bagno sobre “obrigado” e expressões preconceituosas","gab":"A","base":"11-12","imgs":[{"src":"img/2025d1/q11_1.webp","w":781,"h":627}],"alt":{"A":"evitar termos que são empregados como formas de discriminação.","B":"preservar fórmulas idiomáticas introduzidas na língua há muito tempo.","C":"utilizar expressões de agradecimento apropriadas aos dias atuais.","D":"denunciar tentativas de reformar a língua por meio da exclusão de palavras.","E":"recuperar palavras e expressões enraizadas na cultura dos povos."},"res":"Ideia-chave: o texto tem duas partes, e a expressão “isso sim” marca onde está a tese do autor.\n\n1) No 1º parágrafo, Bagno critica quem troca “obrigado” por “gratidão”: seria “uma tentativa inútil de ‘reformar’ a língua”. Ou seja, ele descarta essa preocupação.\n2) No 2º parágrafo, diz o que realmente importa: “Temos de combater, isso sim, o emprego de palavras e expressões que veiculam posturas racistas, sexistas, homofóbicas, preconceituosas em geral.”\n3) Dá exemplos (“trabalho de índio” e “mulherzinha” como termo pejorativo) e justifica: são expressões que “exercem violência simbólica (muitas vezes acompanhada de violência física) contra os mais diferentes grupos sociais”.\n\nPortanto, o que o autor defende ser necessário é evitar e combater termos empregados como formas de discriminação. Resposta: A.","pq":{"A":"Correta: é a tese marcada por “Temos de combater, isso sim, o emprego de palavras e expressões que veiculam posturas racistas, sexistas, homofóbicas, preconceituosas em geral”.","B":"O autor constata que fórmulas enraizadas “muito dificilmente deixarão de ser usadas”, mas isso é um argumento para mostrar que trocar “obrigado” por “gratidão” é inútil, e não uma defesa de preservar o que é antigo. Tanto que ele quer combater expressões também antigas, que revelam opressões sofridas “há tanto tempo”.","C":"Essa é a postura de quem troca “obrigado” por “gratidão”, que o autor chama de “tentativa inútil de ‘reformar’ a língua”. Ele não defende novas fórmulas de agradecimento.","D":"A pegadinha: o autor critica, sim, a troca de “obrigado” por “gratidão”, mas apenas a chama de “tentativa inútil”, fadada ao fracasso, sem pedir que seja denunciada. E ele próprio defende abandonar certas palavras (as preconceituosas); o verbo “denunciar” aparece no texto, mas aplicado justamente a essas expressões discriminatórias.","E":"O texto não fala em recuperar palavras esquecidas: “obrigado” nunca saiu de uso. E expressões enraizadas como “trabalho de índio” são justamente as que ele quer combater."},"dica":"Em texto argumentativo, procure marcadores como “isso sim”, “o que deve, sim”, “na verdade”: eles costumam introduzir a tese do autor depois que ele descarta uma ideia.","dif":"média","nota":"","obs":""},{"id":"2025d1-12","n":12,"area":"Linguagens","disc":"Língua Portuguesa","assunto":"Recursos gráficos e efeito de sentido","titulo":"Termos tachados no texto de Marcos Bagno: “trabalho de índio” e “mulherzinha”","gab":"C","base":"11-12","imgs":[{"src":"img/2025d1/q12_1.webp","w":781,"h":555}],"alt":{"A":"separados por barra, como em obrigado/obrigada.","B":"entre aspas, como em “macho”.","C":"tachados, como em mulherzinha [palavra riscada no original].","D":"entre parênteses, como em (muitas vezes acompanhada de violência física).","E":"realçados, como em obrigada [palavra em negrito no original]."},"res":"Ideia-chave: a pergunta quer o recurso gráfico que reforça a opinião do autor sobre como agir diante de certas expressões. E essa opinião é: combatê-las.\n\n1) O autor afirma: “O que deve, sim, ser posto em xeque e combatido é o hábito de chamar alguma coisa ruim ou malfeita de ‘trabalho de índio’, é usar ‘mulherzinha’ como termo pejorativo”.\n2) Justamente essas duas expressões aparecem tachadas (riscadas) no texto. O risco é o gesto visual de cancelar uma palavra, como quem a apaga de um rascunho.\n3) Assim, a forma gráfica encena o que o conteúdo defende: essas expressões devem ser riscadas do nosso vocabulário. O recurso reforça a posição do autor de que elas precisam ser abandonadas.\n\nOs outros recursos (barra, aspas, parênteses, negrito) têm funções de organização ou destaque e não expressam essa atitude de rejeição. Resposta: C.","pq":{"A":"A barra em “obrigado/obrigada” apenas registra as formas masculina e feminina da palavra; é um recurso de organização, sem julgamento sobre como agir.","B":"As aspas em “macho” marcam distanciamento de um estereótipo, mas o texto também usa aspas em termos neutros (“obrigação”, “gratidão”, “reformar”). Além disso, os próprios termos combatidos estão entre aspas e tachados: o que expressa a atitude do autor é o risco.","C":"Correta: “trabalho de índio” e “mulherzinha” aparecem riscados, encenando visualmente o que o autor defende: que essas expressões sejam combatidas e eliminadas do uso.","D":"Os parênteses em “(muitas vezes acompanhada de violência física)” trazem uma informação complementar sobre a violência simbólica; é um aparte explicativo, não uma indicação de como agir diante das expressões.","E":"O negrito em “obrigada” só destaca a palavra que está sendo discutida (uso metalinguístico). E é justamente uma palavra que o autor quer manter, não combater."},"dica":"Em questões sobre recursos gráficos, pergunte: o formato faz o mesmo que o texto diz? Tachar uma palavra é mostrar que ela deve ser cancelada.","dif":"fácil","nota":"","obs":""},{"id":"2025d1-13","n":13,"area":"Linguagens","disc":"Literatura","assunto":"Barroco – figuras de linguagem (paradoxo)","titulo":"Paradoxos em soneto barroco de Gregório de Matos","gab":"E","base":null,"imgs":[{"src":"img/2025d1/q13_1.webp","w":783,"h":812}],"alt":{"A":"de eufemismos.","B":"de pleonasmos.","C":"da ironia.","D":"da personificação.","E":"de paradoxos."},"res":"Ideia-chave: o Barroco expressa o conflito do homem dividido (fé × prazer, espírito × matéria) unindo, numa mesma imagem, elementos que se excluem. Isso é o paradoxo.\n\n1) “Incêndio em mares de água disfarçado!”: fogo existindo dentro da água, algo logicamente impossível.\n2) “Rio de neve em fogo convertido!”: neve transformada em fogo, outra fusão de contrários.\n3) O “Ardor” (paixão, agitação) nasce num “coração firme”, e o “Pranto” vem de “belos olhos”, unindo beleza e sofrimento.\n\nNão se trata apenas de pôr ideias opostas lado a lado (antítese), mas de afirmar que os opostos convivem no mesmo ser: o sentimento é, ao mesmo tempo, fogo e água, ardor e pranto. Esse choque de contrários materializa as contradições e angústias do homem barroco. Resposta: E.","pq":{"A":"Eufemismo suaviza uma ideia dura ou desagradável. Os versos fazem o contrário: intensificam o sentimento com exclamações e imagens extremas, como “Incêndio”.","B":"A pegadinha é “mares de água”, que soa redundante. Mas uma redundância pontual não expressa contradição; o que domina a estrofe é a fusão de fogo e água, ardor e neve.","C":"Ironia é dizer o contrário do que se pensa, com intenção crítica ou zombeteira. O tom da estrofe é sério e passional: os contrários são afirmados de verdade, não ironizados (o título do livro, Poemas satíricos, pode confundir).","D":"Personificação atribui características humanas a seres não humanos. Aqui “coração”, “olhos” e “pranto” são humanos de fato, e o centro das imagens é o choque fogo × água, não a humanização da natureza.","E":"Correta: os versos unem contrários num mesmo ser, como fogo na água (“Incêndio em mares de água disfarçado!”) e neve virando fogo (“Rio de neve em fogo convertido!”), o que materializa o conflito barroco."},"dica":"Barroco = conflito; procure os contrários: lado a lado é antítese; fundidos numa mesma afirmação, aparentemente absurda, é paradoxo.","dif":"fácil","nota":"","obs":""},{"id":"2025d1-14","n":14,"area":"Linguagens","disc":"Literatura","assunto":"Modernismo – Drummond e a poesia do cotidiano","titulo":"“Poema do jornal”, de Drummond: cenas comuns e linguagem antirretórica","gab":"C","base":null,"imgs":[{"src":"img/2025d1/q14_1.webp","w":783,"h":1122}],"alt":{"A":"a reação intolerante às imposições sociais.","B":"a anulação da esperança e da crença no homem.","C":"as cenas comuns da vida, o antirretórico.","D":"os conflitos existenciais do homem moderno.","E":"o culto do lirismo pela reinvenção da palavra."},"res":"Ideia-chave: em Alguma poesia, seu livro de estreia, Drummond herda do Modernismo de 1922 a valorização do cotidiano e a linguagem simples, sem enfeites: a poesia antirretórica.\n\n1) Tema: o poema registra a rotina de uma redação de jornal: “O fato ainda não acabou de acontecer / e já a mão nervosa do repórter / o transforma em notícia.”\n2) Os versos seguintes imitam manchetes, com frases curtas e diretas: “O marido está matando a mulher.”, “Ladrões arrombam o cofre.”, “A polícia dissolve o meeting.”\n3) Linguagem: vocabulário comum, sem rimas nem métrica fixa, sem um eu lírico expondo sentimentos. É o oposto do “falar bonito” grandiloquente.\n4) O fecho, “Vem da sala de linotipos a doce música mecânica.”, encontra até doçura no barulho das máquinas que compunham as linhas de texto do jornal: poesia extraída do banal.\n\nLogo, o poema exemplifica a vertente voltada para as cenas comuns da vida, o antirretórico. Resposta: C.","pq":{"A":"O poema não reage nem se revolta contra imposições sociais; apenas registra fatos em tom de reportagem, sem comentário. Até a cena da polícia dissolvendo o “meeting” aparece como mais uma notícia, sem protesto do eu lírico.","B":"Não há tom pessimista nem descrença no homem: os crimes são listados de forma neutra, como notícias, e o verso final ainda vê “doce música” nas máquinas do jornal.","C":"Correta: o poema transforma em poesia a rotina banal de uma redação, com frases curtas e diretas de manchete, sem ornamentos: é a vertente do cotidiano e do antirretórico.","D":"Conflitos existenciais pediriam reflexão do eu lírico sobre si, a vida ou o mundo, como em outros poemas de Drummond. Aqui não há introspecção, só o registro objetivo de fatos.","E":"A linguagem é a mais simples possível, imitando frases de jornal; não há jogos de palavras, neologismos nem lirismo cultivado. O tom é prosaico, de notícia, e não de culto ao lirismo."},"dica":"Drummond de Alguma poesia = herança de 22: cotidiano, humor, linguagem coloquial e direta. Se o poema parece “prosa de jornal”, pense em antirretórico.","dif":"média","nota":"","obs":""},{"id":"2025d1-15","n":15,"area":"Linguagens","disc":"Literatura","assunto":"Romantismo – contexto histórico e características","titulo":"Romantismo: contexto histórico e marcas na literatura","gab":"D","base":null,"imgs":[{"src":"img/2025d1/q15_1.webp","w":781,"h":477}],"alt":{"A":"análise psicológica e crítica das personagens.","B":"oposição ao individualismo e à subjetividade.","C":"excessivo rigor formal na poesia e na prosa.","D":"ideias libertárias e exaltação da pátria.","E":"contestação social e defesa de teorias materialistas."},"res":"Ideia-chave: o Romantismo nasce no contexto das revoluções liberais e da ascensão da burguesia (a Revolução Francesa e seus ideais de liberdade) e, no Brasil, ganha força após a Independência (1822), quando havia o desejo de construir uma identidade nacional.\n\n1) Dos ideais revolucionários vem o espírito libertário: valorização da liberdade individual, política e também artística (o escritor se liberta das regras clássicas).\n2) Do momento de formação das nações vem o nacionalismo: exaltação da pátria, da natureza local, da história e de figuras-símbolo, como o indígena idealizado do indianismo (José de Alencar, Gonçalves Dias).\n3) Outros traços românticos, como subjetividade, sentimentalismo e idealização, ajudam a eliminar as alternativas que descrevem outros movimentos.\n\nPortanto, o contexto do Romantismo se expressou na literatura por meio de ideias libertárias e da exaltação da pátria. Resposta: D.","pq":{"A":"Análise psicológica e crítica das personagens é marca do Realismo (como em Machado de Assis), que reage justamente à idealização romântica.","B":"É o inverso: o Romantismo é o movimento do individualismo e da subjetividade, do “eu” que expressa as próprias emoções.","C":"Excessivo rigor formal é marca do Parnasianismo (e, antes, das estéticas clássicas). Os românticos buscavam justamente liberdade de criação e de forma.","D":"Correta: os ideais de liberdade das revoluções liberais e o desejo de afirmar a nação recém-independente resultaram em ideias libertárias e na exaltação da pátria, visíveis no nacionalismo e no indianismo.","E":"Contestação social baseada em teorias materialistas e científicas (determinismo, positivismo, evolucionismo) caracteriza o Realismo/Naturalismo, da segunda metade do século XIX."},"dica":"Romantismo = eu (subjetividade) + pátria (nacionalismo) + liberdade. Análise psicológica e ciência são Realismo/Naturalismo; rigor formal é Parnasianismo.","dif":"fácil","nota":"","obs":""},{"id":"2025d1-16","n":16,"area":"Linguagens","disc":"Literatura","assunto":"Modernismo – Mário de Andrade e o folclore","titulo":"Mário de Andrade e o folclore: a lenda do guaraná em Macunaíma","gab":"B","base":null,"imgs":[{"src":"img/2025d1/q16_1.webp","w":781,"h":1192}],"alt":{"A":"Meu Deus como ela era branca!… / Como era parecida com a neve… / Porém não sei como é a neve / Eu nunca vi a neve, / Eu não gosto da neve! / E eu não gostava dela…","B":"No outro dia, quando foi […] visitar o túmulo do filho viu que nascera do corpo uma plantinha. Trataram dela com muito cuidado e foi o guaraná. Com as frutinhas piladas dessa planta é que a gente cura muita doença e se refresca durante os calorões de Vei, a Sol.","C":"A aritmética nunca foi propícia aos brasileiros. Nós não somamos coisa nenhuma. Das quatro operações, unicamente uma nos atrai, a multiplicação, justo a que mais raro frequenta os sucessos deste mundo vagarento.","D":"Abancado à escrivaninha em São Paulo / Na minha casa da rua Lopes Chaves / De supetão senti um friúme por dentro / Fiquei trêmulo, muito comovido / Com o livro palerma olhando para mim.","E":"Comprou-se o peru, fez-se o peru, etc. E depois de uma Missa do Galo bem mal rezada, se deu o nosso mais maravilhoso Natal. Fora engraçado: assim que me lembrara de que finalmente ia fazer mamãe comer peru, não fizera outra coisa que pensar nela…"},"res":"Ideia-chave: procure, entre os trechos, aquele que reconta uma lenda, um mito ou uma tradição popular brasileira, matéria das pesquisas folclóricas de Mário de Andrade.\n\n1) O trecho B narra a origem mítica de uma planta: no túmulo do filho, “nascera do corpo uma plantinha. Trataram dela com muito cuidado e foi o guaraná”. É a lenda indígena da origem do guaraná, contada com tom de narrativa oral (“é que a gente cura muita doença”).\n2) Aparece ainda “Vei, a Sol”, entidade mítica que é personagem de Macunaíma, a rapsódia em que Mário reuniu lendas, mitos, falares e costumes de várias regiões do Brasil.\n3) Os demais trechos tratam de lirismo amoroso (A), reflexão irônica sobre os brasileiros (C), experiência pessoal do poeta em casa (D) e memória familiar de Natal (E): nenhum recria material folclórico.\n\nResposta: B.","pq":{"A":"É um poema lírico sobre uma mulher e a recusa do eu lírico (“Eu não gosto da neve! / E eu não gostava dela…”). Há um jogo de imagens com a neve, elemento estrangeiro, mas nenhuma lenda ou tradição popular.","B":"Correta: reconta a lenda indígena da origem do guaraná, com linguagem de narrativa oral e a entidade mítica “Vei, a Sol”, de Macunaíma, obra construída a partir das pesquisas de Mário sobre o folclore.","C":"É uma reflexão bem-humorada e crítica sobre o comportamento dos brasileiros, usando a aritmética como metáfora. Fala de caráter nacional, mas não reconta mitos, lendas ou costumes populares.","D":"É um poema de experiência pessoal e urbana: o poeta, “Abancado à escrivaninha em São Paulo”, em sua casa “da rua Lopes Chaves”, sente uma comoção repentina. O vocabulário coloquial (“friúme”, “palerma”) não basta para caracterizar folclore.","E":"É do conto “O peru de Natal”: memória familiar (o Natal, o peru, a mãe), com foco psicológico e afetivo. A Missa do Galo é citada de passagem, e não há lenda ou tradição popular recriada."},"dica":"Mário de Andrade + folclore = Macunaíma: lendas indígenas, entidades míticas (como Vei, a Sol) e linguagem que imita a fala popular.","dif":"média","nota":"","obs":""},{"id":"2025d1-17","n":17,"area":"Linguagens","disc":"Literatura","assunto":"Fernando Pessoa – Mensagem e diálogo com Os Lusíadas","titulo":"“Mar português”, de Fernando Pessoa: orgulho e dor das navegações","gab":"D","base":null,"imgs":[{"src":"img/2025d1/q17_1.webp","w":783,"h":1619}],"alt":{"A":"critica a ânsia dos portugueses pelas aventuras por mar em busca de riquezas, porque os abismos do oceano oferecem perigo.","B":"recusa-se a apoiar a empreitada portuguesa por mar, pois a ganância acabou por superar a grandeza do povo.","C":"reconhece que o mar que devora vidas é o mesmo que alimenta o povo lusitano e confere grandeza à alma da coletividade.","D":"representa o espírito de orgulho do povo português, pelas conquistas marítimas, mas não deixa de mencionar as dores que causaram.","E":"lamenta a perda de muitas vidas dos que se aventuraram pelo mar, expressando sua decepção com uma aventura que, para ele, não valeu a pena."},"res":"Ideia-chave: como Os Lusíadas, “Mar português” celebra as navegações, mas equilibra orgulho e sofrimento: a glória teve um preço alto, e esse preço valeu a pena.\n\n1) A dor está na 1ª estrofe: “quanto do teu sal / São lágrimas de Portugal!”, “quantas mães choraram”, “Quantas noivas ficaram por casar”.\n2) O orgulho aparece na finalidade do sacrifício: “Para que fosses nosso, ó mar!”. O mar conquistado passa a pertencer a Portugal.\n3) Na 2ª estrofe, o eu lírico pergunta e responde: “Valeu a pena? Tudo vale a pena / Se a alma não é pequena.” Para uma alma grande, o sacrifício se justifica. E ainda: “Quem quer passar além do Bojador / Tem de passar além da dor” (o Cabo Bojador era um ponto temido da costa africana).\n4) Fecho: “Deus ao mar o perigo e o abismo deu, / Mas nele é que espelhou o céu.” O perigo existe, mas o mar também reflete a grandeza, o divino.\n\nAssim, o eu lírico representa o orgulho pelas conquistas marítimas sem deixar de mencionar as dores que causaram. Resposta: D.","pq":{"A":"O eu lírico não critica as navegações: afirma que “Tudo vale a pena / Se a alma não é pequena”. Além disso, o poema não fala em busca de riquezas; o perigo do abismo é reconhecido, mas compensado pelo céu espelhado no mar.","B":"Não há recusa nem menção à ganância. Ao contrário, o poema apoia a empreitada e associa a conquista à grandeza da alma, e não à sua derrota pela cobiça.","C":"O poema não diz que o mar alimenta o povo; diz que nele Deus “espelhou o céu”, isto é, que ele reflete glória e transcendência. E a grandeza da alma é condição para que valha a pena (“Se a alma não é pequena”), não algo que o mar confere.","D":"Correta: o eu lírico exalta a conquista (“Para que fosses nosso, ó mar!”, “Tudo vale a pena”) sem esconder o custo humano (“quanto do teu sal / São lágrimas de Portugal!”, mães que choraram, noivas que ficaram por casar).","E":"O lamento existe na 1ª estrofe, mas a conclusão é a oposta: à pergunta “Valeu a pena?” o eu lírico responde “Tudo vale a pena / Se a alma não é pequena”. Não há decepção."},"dica":"Em poemas com pergunta e resposta (“Valeu a pena? Tudo vale a pena”), a resposta revela a posição do eu lírico; desconfie de alternativas que param só no lamento.","dif":"média","nota":"","obs":""},{"id":"2025d1-18","n":18,"area":"Linguagens","disc":"Literatura","assunto":"Romantismo – indianismo (1ª geração)","titulo":"Indianismo em Os Timbiras, de Gonçalves Dias","gab":"E","base":null,"imgs":[{"src":"img/2025d1/q18_1.webp","w":781,"h":1169}],"alt":{"A":"a visão heroica dos sertões e de seus desbravadores.","B":"a lírica sentimental expressa na fuga da realidade.","C":"a poesia condoreira, em manifesto contra o tráfico dos negros.","D":"o sentimento da dor e da morte, expresso no egotismo.","E":"a valorização do elemento nacional, na figura do indígena."},"res":"Ideia-chave: Gonçalves Dias é o grande nome do indianismo, vertente da 1ª geração romântica que elegeu o indígena como herói nacional, símbolo de uma identidade brasileira própria.\n\nPasso 1 – Observe o tema: os versos apresentam o chefe de uma tribo, “Dos Timbiras o chefe”, e exaltam suas qualidades guerreiras: “Itajubá, o valente, o destemido / Acoçador das feras, o guerreiro / Fabricador das incansáveis lutas”.\n\nPasso 2 – Veja a idealização: o pai, “o Jaguar”, tinha fama de ser quase invulnerável, pois seus “musculosos membros repeliam / A flecha sibilante” e seu crânio “Da maça aos tesos golpes não cedia”. O indígena aparece como herói épico, forte e nobre, à maneira dos cavaleiros das narrativas medievais europeias.\n\nPasso 3 – Conclua: exaltar o nativo da terra como herói foi a forma que o Romantismo encontrou para valorizar o que é nacional nas décadas seguintes à Independência. É exatamente o que diz a alternativa E.\n\nVocabulário útil: “sítio escuso” = lugar retirado; “anoso” = antigo; “acoçador” = perseguidor; “maça” = clava, arma de guerra.","pq":{"A":"Há heroísmo nos versos, mas não é o dos sertões nem o de “desbravadores” (bandeirantes, colonizadores): o herói é um chefe indígena. A exaltação do sertão e do sertanejo pertence à vertente regionalista do Romantismo.","B":"A lírica sentimental e escapista (amor, saudade, evasão) é a de um eu lírico que fala de si. Aqui não há confissão amorosa nem fuga da realidade: há uma narração, em 3ª pessoa, dos feitos de um guerreiro.","C":"A poesia condoreira é da 3ª geração (Castro Alves) e denuncia a escravidão. Os versos não falam de negros, de tráfico nem de abolição; falam de um chefe timbira.","D":"Dor, morte e egotismo (o eu voltado para si mesmo) caracterizam o ultrarromantismo, a 2ª geração. O texto não tem eu lírico sofredor: ele descreve, de fora, a força e a coragem de Itajubá e de seu pai.","E":"Correta: o poema exalta o indígena como herói valente e quase invencível, marca do indianismo, a forma romântica de valorizar o elemento nacional."},"dica":"Poesia romântica em três gerações: 1ª = nacionalismo e indianismo (Gonçalves Dias); 2ª = ultrarromantismo, dor e morte (Álvares de Azevedo); 3ª = condoreirismo social e abolicionista (Castro Alves).","dif":"fácil","nota":"","obs":""},{"id":"2025d1-19","n":19,"area":"Linguagens","disc":"Inglês","assunto":"Compreensão global do texto","titulo":"Tema de notícia da CNN sobre estudo do MIT: efeitos da IA no cérebro","gab":"A","base":"19-21","imgs":[{"src":"img/2025d1/q19_1.webp","w":783,"h":621}],"alt":{"A":"um estudo do MIT sobre o impacto de IAs generativas nas atividades cerebrais e na memória.","B":"uma entrevista dada por um especialista da CNN ao MIT sobre o uso de IAs generativas no jornalismo.","C":"a transcrição de um estudo sobre a visão do jornalista Omar Jimenez acerca do uso de IAs generativas.","D":"uma conversa entre a jornalista Nataliya Kosmyna e o pesquisador Omar Jimenez, responsável pelo estudo do MIT.","E":"a preocupação excessiva que diferentes mídias, como a CNN, têm demonstrado acerca das IAs."},"res":"Ideia-chave: para achar o tema, leia o título e o parágrafo de abertura, que funciona como resumo da notícia.\n\nO título já anuncia: “AI’s Effects On The Brain” (Os efeitos da IA no cérebro). O primeiro parágrafo confirma: “MIT’s Dr. Nataliya Kosmyna shared findings from a new study showing that relying solely on AI for tasks like writing can reduce brain activity and memory” (a Dra. Nataliya Kosmyna, do MIT, compartilhou resultados de um novo estudo mostrando que depender apenas da IA para tarefas como escrever pode reduzir a atividade cerebral e a memória).\n\nNa transcrição, o jornalista Omar Jimenez reforça: “a new study from MIT is raising the alarm about how AI impacts learning” (um novo estudo do MIT está acendendo um alerta sobre como a IA impacta a aprendizagem). A ferramenta dada como exemplo é o ChatGPT, uma IA generativa.\n\nOu seja: o assunto é um estudo do MIT sobre o impacto das IAs generativas na atividade cerebral e na memória. Alternativa A.","pq":{"A":"Correta: o título e o resumo falam de um estudo do MIT mostrando que depender só de IA pode reduzir “brain activity and memory” (atividade cerebral e memória).","B":"Inverte os papéis e muda o tema: quem é entrevistada é a pesquisadora do MIT, pela CNN; e o assunto é aprendizagem e cérebro, não o uso de IA no jornalismo.","C":"“Transcript” é a transcrição da entrevista, não de um estudo; e o estudo não investiga a opinião de Omar Jimenez, que é apenas o jornalista que conduz a conversa.","D":"Troca as funções: Omar Jimenez é o jornalista que apresenta a convidada (“Joining me now is...”, Junta-se a mim agora...), e Nataliya Kosmyna é a pesquisadora, “lead author on the study” (autora principal do estudo).","E":"O texto não critica a mídia nem fala em preocupação “excessiva”; o alerta vem do próprio estudo: “a new study from MIT is raising the alarm” (um novo estudo do MIT está acendendo o alerta)."},"dica":"Em questões de tema, título + primeiro parágrafo resolvem quase tudo; desconfie de alternativas que trocam quem fez o quê.","dif":"fácil","nota":"","obs":""},{"id":"2025d1-20","n":20,"area":"Linguagens","disc":"Inglês","assunto":"Referência pronominal (coesão)","titulo":"Referente do pronome it em notícia sobre IA e cérebro","gab":"B","base":"19-21","imgs":[{"src":"img/2025d1/q20_1.webp","w":781,"h":527}],"alt":{"A":"aos usuários do ChatGPT e das demais plataformas generativas.","B":"à dependência crescente em inteligências artificiais generativas.","C":"ao cérebro e sua plasticidade em desenvolvimento.","D":"à praticidade na execução de tarefas por meio de inteligências artificiais.","E":"ao estudo realizado pela CNN sobre as ferramentas digitais."},"res":"Ideia-chave: um pronome retoma algo dito antes; procure, na própria frase, a ideia singular que ele resume.\n\nA frase completa é: “Now, as students and workers become more and more dependent on tools like ChatGPT, it does raise a lot of questions about the future of how we think.” Tradução: Agora, à medida que estudantes e trabalhadores se tornam cada vez mais dependentes de ferramentas como o ChatGPT, isso realmente levanta muitas perguntas sobre o futuro do nosso modo de pensar.\n\nPasso 1 – “it” é singular, então não pode retomar “students and workers” (estudantes e trabalhadores), que é plural; para isso o texto usaria “they” (eles).\nPasso 2 – O que levanta perguntas sobre o futuro do pensamento? O fato descrito logo antes, na oração com “as” (à medida que): estudantes e trabalhadores ficando “more and more dependent” (cada vez mais dependentes) de ferramentas como o ChatGPT.\nPasso 3 – Logo, “it” resume a dependência crescente de IAs generativas. O “does” antes de “raise” só dá ênfase (realmente levanta).\n\nAlternativa B.","pq":{"A":"“it” é singular e não retoma pessoas; para falar de “students and workers” (estudantes e trabalhadores) o texto usaria “they” (eles). Além disso, as perguntas surgem da dependência, não dos usuários em si.","B":"Correta: “it” retoma o fato expresso na oração anterior, estudantes e trabalhadores “more and more dependent on tools like ChatGPT” (cada vez mais dependentes de ferramentas como o ChatGPT).","C":"O cérebro (“your brain”, seu cérebro) aparece no parágrafo anterior, não nesta frase, e o texto não fala em plasticidade cerebral: a alternativa traz uma informação que não existe no texto.","D":"A praticidade (“convenience”, conveniência) é citada no parágrafo anterior, mas a frase do “it” trata de outra ideia: a dependência que cresce. É a pegadinha de pegar uma palavra próxima em vez do referente da própria oração.","E":"O estudo é do MIT, não da CNN (a CNN só fez a entrevista), e ele não é a ideia retomada nessa frase, que fala da dependência de ferramentas como o ChatGPT."},"dica":"Para achar o referente de it, they ou this, confira o número (singular/plural) e procure a ideia na mesma frase ou na imediatamente anterior.","dif":"média","nota":"","obs":""},{"id":"2025d1-21","n":21,"area":"Linguagens","disc":"Inglês","assunto":"Localização de informação explícita","titulo":"Grupo com maior atividade cerebral no estudo do MIT sobre IA","gab":"D","base":"19-21","imgs":[{"src":"img/2025d1/q21_1.webp","w":781,"h":416}],"alt":{"A":"ferramentas de busca juntamente com IA.","B":"reformulações dos resultados de IA.","C":"ferramentas diversificadas de busca.","D":"apenas o cérebro.","E":"apenas IA."},"res":"Ideia-chave: é uma questão de localizar informação; encontre no texto a comparação entre os grupos.\n\nO jornalista explica: “The study looked at essay writing across three groups, people using AI, a search engine, or just their own brain power.” (O estudo analisou a escrita de redações em três grupos: pessoas usando IA, um mecanismo de busca ou apenas a própria capacidade cerebral.)\n\nEm seguida: “That last group, no tools at all, showed the strongest brain activity plus better memory recall.” (Esse último grupo, sem ferramenta nenhuma, mostrou a atividade cerebral mais forte, além de melhor capacidade de recordação.) “That last group” (esse último grupo) é o último citado na lista: “just their own brain power” (apenas a própria capacidade cerebral).\n\nO ranking completo fica:\n1º apenas o cérebro;\n2º “the search engine users” (os usuários de mecanismo de busca);\n3º “in last place, people relying on AI” (em último lugar, quem dependia de IA).\n\nPortanto, a melhor atividade cerebral foi a do grupo que usou apenas o cérebro. Alternativa D.","pq":{"A":"Não houve grupo que combinasse busca e IA: eram três grupos separados (IA, mecanismo de busca ou só o cérebro).","B":"O texto não menciona ninguém reformulando resultados da IA; e o grupo que usou IA ficou “in last place” (em último lugar).","C":"O grupo do mecanismo de busca ficou em 2º lugar (“They were followed by the search engine users”, Eles foram seguidos pelos usuários de mecanismo de busca), e o texto fala em “a search engine” (um mecanismo de busca), não em ferramentas diversificadas.","D":"Correta: “That last group, no tools at all, showed the strongest brain activity” (esse último grupo, sem ferramenta nenhuma, mostrou a atividade cerebral mais forte) refere-se ao grupo que usou apenas o próprio cérebro.","E":"É o oposto: quem dependia só de IA ficou “in last place” (em último lugar), com a menor atividade cerebral."},"dica":"Em comparações, procure superlativos (strongest =
