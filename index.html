 de 224 filmes sobre 3 276, cerca de 6,8%. O trecho sobe visivelmente no gráfico, mas a base já é grande.","C":"Em 2019 o aumento foi de apenas 100 filmes sobre 2 000, ou seja, 5%.","D":"2021 teve o mesmo aumento absoluto de 2020 (525 filmes), mas sobre uma base maior: 525/2 625 = 20%, menor que 25%. É a pegadinha de comparar o salto em número de filmes em vez do percentual.","E":"Em 2022 o aumento foi de 126 filmes sobre 3 150, apenas 4%, o menor de todos."},"dica":"Variação percentual sempre se divide pelo valor antigo; o mesmo aumento absoluto vale menos, em porcentagem, quando a base é maior.","dif":"média","nota":"","obs":""},{"id":"2025d2-09","n":9,"area":"Matemática","disc":"Matemática","assunto":"Problema aritmético – custo total","titulo":"Lanchonete: gasto com 100 bebidas sendo exatamente 20 sucos","gab":"B","base":null,"imgs":[{"src":"img/2025d2/q09_1.webp","w":781,"h":716}],"alt":{"A":"R$ 300,00.","B":"R$ 380,00.","C":"R$ 320,00.","D":"R$ 340,00.","E":"R$ 360,00."},"res":"Ideia-chave: das 100 bebidas, 20 são sucos; logo as outras 100 − 20 = 80 são refrigerantes. Multiplique cada quantidade pelo seu preço e some.\n\nSucos: 20 × R$ 3,00 = R$ 60,00\nRefrigerantes: 80 × R$ 4,00 = R$ 320,00\nTotal: 60 + 320 = R$ 380,00\n\nConferência por outro caminho: se as 100 bebidas fossem refrigerantes, o gasto seria 100 × 4 = R$ 400,00. Cada suco no lugar de um refrigerante economiza R$ 1,00, então com 20 sucos: 400 − 20 × 1 = R$ 380,00.\n\nEm geral, com s sucos o gasto é 3s + 4(100 − s) = 400 − s, o que ajuda a entender de onde vêm as outras alternativas.","pq":{"A":"R$ 300,00 = 100 × 3, como se todas as 100 bebidas fossem sucos. Pela fórmula 400 − s, corresponde a s = 100 sucos.","B":"Correta: 20 × 3 + 80 × 4 = 60 + 320 = R$ 380,00.","C":"R$ 320,00 é só o gasto com os 80 refrigerantes, esquecendo os R$ 60,00 dos sucos. Também aparece se os preços forem trocados: 20 × 4 + 80 × 3 = 80 + 240 = 320.","D":"R$ 340,00 aparece se você partir de 100 refrigerantes (R$ 400,00) e descontar o preço inteiro dos sucos (20 × 3 = 60), em vez de só a diferença de R$ 1,00 por bebida: 400 − 60 = 340. Equivaleria a comprar 60 sucos e 40 refrigerantes.","E":"R$ 360,00 seria o gasto com 40 sucos e 60 refrigerantes (120 + 240), o dobro dos sucos pedidos; com 20 sucos o total é 400 − 20 = 380."},"dica":"Em problemas com total fixo, descubra primeiro quantos são do outro tipo (100 − 20 = 80) e só depois multiplique pelos preços.","dif":"fácil","nota":"","obs":""},{"id":"2025d2-10","n":10,"area":"Matemática","disc":"Matemática","assunto":"Sistema de equações do 1º grau","titulo":"Festa junina: quantas bolas e molas comprar com R$ 610,00","gab":"A","base":null,"imgs":[{"src":"img/2025d2/q10_1.webp","w":783,"h":581}],"alt":{"A":"55 molas e 45 bolas.","B":"60 molas e 40 bolas.","C":"45 molas e 55 bolas.","D":"50 molas e 50 bolas.","E":"40 molas e 60 bolas."},"res":"Ideia-chave: há duas condições (quantidade total e valor total), então monte um sistema com duas incógnitas.\n\nSeja b o número de bolas e m o de molas:\nb + m = 100\n5b + 7m = 610\n\nDa primeira, b = 100 − m. Substituindo na segunda:\n5(100 − m) + 7m = 610\n500 − 5m + 7m = 610\n2m = 110\nm = 55\nb = 100 − 55 = 45\n\nConferência: 55 × 7 = 385 e 45 × 5 = 225; 385 + 225 = 610 reais, com 55 + 45 = 100 prendas. Portanto, 55 molas e 45 bolas.\n\nAtalho: se as 100 prendas fossem bolas, o gasto seria 100 × 5 = 500 reais. Sobram 610 − 500 = 110 reais, e cada bola trocada por mola custa 2 reais a mais: 110 ÷ 2 = 55 molas.","pq":{"A":"Correta: 55 × 7 + 45 × 5 = 385 + 225 = 610 reais, com 55 + 45 = 100 prendas, atendendo às duas condições ao mesmo tempo.","B":"A quantidade fecha em 100, mas o custo dá 60 × 7 + 40 × 5 = 420 + 200 = 620 reais, R$ 10,00 acima do dinheiro disponível.","C":"É a resposta certa com os nomes trocados: 45 molas e 55 bolas custam 45 × 7 + 55 × 5 = 315 + 275 = 590 reais, e não 610. Cuidado ao voltar das letras m e b para os nomes dos objetos.","D":"Divide as 100 prendas ao meio sem usar a informação do dinheiro: 50 × 7 + 50 × 5 = 350 + 250 = 600 reais, sobrando R$ 10,00.","E":"O custo seria 40 × 7 + 60 × 5 = 280 + 300 = 580 reais, R$ 30,00 abaixo do valor disponível, então não satisfaz a equação do dinheiro."},"dica":"Problemas com quantidade total e valor total viram um sistema (soma das quantidades e soma dos valores); no fim, confira substituindo na conta do dinheiro.","dif":"fácil","nota":"","obs":""},{"id":"2025d2-11","n":11,"area":"Matemática","disc":"Matemática","assunto":"Volume do cubo e massa (densidade)","titulo":"Escultura: cubo de 30 cm sem 8 cubinhos de 10 cm, massa final","gab":"D","base":null,"imgs":[{"src":"img/2025d2/q11_1.webp","w":783,"h":1191}],"alt":{"A":"95,0 kg.","B":"2,3 kg.","C":"1,9 kg.","D":"9,5 kg.","E":"19,0 kg."},"res":"Ideia-chave: volume da escultura = volume do cubo grande − volume dos 8 cubinhos retirados; depois multiplique pela massa de cada cm³ e converta gramas em quilogramas.\n\nCubo grande: 30³ = 30 × 30 × 30 = 27.000 cm³\nCada cubinho: 10³ = 1.000 cm³\n8 cubinhos: 8 × 1.000 = 8.000 cm³\nEscultura: 27.000 − 8.000 = 19.000 cm³\n\nMassa: 19.000 × 0,5 g = 9.500 g\nConversão: 9.500 g ÷ 1.000 = 9,5 kg\n\nConferência pela figura: o cubo de 30 cm equivale a 3 × 3 × 3 = 27 cubinhos de 10 cm. Tirando os 8 dos cantos, sobram 27 − 8 = 19 cubinhos de 1.000 cm³, e cada um tem 1.000 × 0,5 = 500 g = 0,5 kg. Logo, 19 × 0,5 kg = 9,5 kg.","pq":{"A":"95,0 kg aparece se você converter 9.500 g dividindo por 100 em vez de 1.000. Lembre: 1 kg = 1.000 g, então 9.500 g = 9,5 kg.","B":"Não sai de uma conta coerente com os dados. Para conferir: só os 8 cubinhos retirados já pesariam 8.000 × 0,5 = 4.000 g = 4 kg, e a escultura tem mais madeira do que eles (19.000 cm³), então não pode pesar 2,3 kg.","C":"Parece o volume 19.000 cm³ com a vírgula fora do lugar e sem o fator 0,5. A escultura tem 19.000 cm³ a 0,5 g cada, ou seja, 9.500 g, e não 1.900 g.","D":"Correta: 27.000 − 8.000 = 19.000 cm³; 19.000 × 0,5 g = 9.500 g = 9,5 kg.","E":"19,0 kg é o que se obtém esquecendo de multiplicar por 0,5, como se cada cm³ tivesse 1 g: 19.000 g = 19 kg. Mas cada cm³ tem só meio grama."},"dica":"Sólido com partes retiradas: calcule o volume do todo e subtraia as partes; depois aplique a massa por cm³ e converta g em kg dividindo por 1.000.","dif":"fácil","nota":"","obs":""},{"id":"2025d2-12","n":12,"area":"Matemática","disc":"Matemática","assunto":"Área total do paralelepípedo e rendimento de tinta","titulo":"Caixas pintadas: quantas latas de 900 mL para 40 pequenas e 20 médias","gab":"B","base":null,"imgs":[{"src":"img/2025d2/q12_1.webp","w":1575,"h":761}],"alt":{"A":"1 lata.","B":"4 latas.","C":"2 latas.","D":"3 latas.","E":"5 latas."},"res":"Ideia-chave: a área total de um paralelepípedo de arestas a, b e c é 2(ab + ac + bc). Some as áreas de todas as caixas, converta para m², calcule os litros de tinta e só no final arredonde o número de latas para cima.\n\nCaixa pequena (15 × 20 × 5):\n2(15·20 + 15·5 + 20·5) = 2(300 + 75 + 100) = 2 · 475 = 950 cm²\n40 caixas: 40 × 950 = 38.000 cm²\n\nCaixa média (20 × 20 × 10):\n2(20·20 + 20·10 + 20·10) = 2(400 + 200 + 200) = 2 · 800 = 1.600 cm²\n20 caixas: 20 × 1.600 = 32.000 cm²\n\nTotal: 38.000 + 32.000 = 70.000 cm² = 7 m² (1 m² = 10.000 cm²)\nTinta: 7 ÷ 2 = 3,5 L = 3.500 mL\nLatas: 3.500 ÷ 900 ≈ 3,89\n\nNão se compra fração de lata: 3 latas dão 2.700 mL (não bastam) e 4 latas dão 3.600 mL (bastam). A menor quantidade é 4 latas.","pq":{"A":"1 lata aparece se você esquecer de multiplicar pelas 40 e 20 caixas: uma caixa de cada tamanho soma 950 + 1.600 = 2.550 cm² ≈ 0,26 m², que gasta só cerca de 0,13 L. A encomenda inteira tem 7 m² e pede 3,5 L, mas 1 lata (0,9 L) cobre apenas 1,8 m².","B":"Correta: 70.000 cm² = 7 m² exigem 7 ÷ 2 = 3,5 L = 3.500 mL; 3 latas dão só 2.700 mL e 4 latas dão 3.600 mL, o mínimo suficiente.","C":"2 latas aparecem se você contar só 3 faces de cada caixa, esquecendo o fator 2 da área total: 3,5 m² → 1,75 L → 1.750 ÷ 900 ≈ 1,94 → 2 latas. Mas as 6 faces externas são pintadas.","D":"Vem de arredondar 3,89 para baixo. Com 3 latas há 2.700 mL, e faltam 800 mL para os 3.500 mL necessários; em compra de material, arredonda-se sempre para cima.","E":"5 latas (4.500 mL) pintam tudo, mas sobram 1.000 mL, então não é a menor quantidade. Costuma surgir quando se arredonda duas vezes: 3,5 L → 4 L e depois 4.000 ÷ 900 ≈ 4,4 → 5."},"dica":"Área total do paralelepípedo = 2(ab + ac + bc); converta cm² para m² dividindo por 10.000 e arredonde o número de latas para cima só no último passo.","dif":"média","nota":"","obs":""},{"id":"2025d2-13","n":13,"area":"Matemática","disc":"Matemática","assunto":"Razão entre grandezas – leitura de tabela","titulo":"Brasileiros na Europa: Portugal é quantas vezes o Reino Unido","gab":"E","base":null,"imgs":[{"src":"img/2025d2/q13_1.webp","w":1575,"h":908}],"alt":{"A":"2,55","B":"1,85","C":"0,44","D":"1,53","E":"2,23"},"res":"Ideia-chave: “o número de A corresponde a quantas vezes o número de B” é a razão A ÷ B, com A (Portugal) no numerador.\n\nDa tabela (que o enunciado chama de “gráfico”): Portugal = 513.000 e Reino Unido = 230.000.\n\n513.000 ÷ 230.000 = 513 ÷ 230\n230 × 2 = 460, e sobram 513 − 460 = 53\n53 ÷ 230 ≈ 0,23\nLogo, 513 ÷ 230 ≈ 2 + 0,23 = 2,23\n\nConferência: 230.000 × 2,23 = 512.900 ≈ 513.000.\n\nEstimativa rápida para eliminar alternativas: 230 × 2 = 460 e 230 × 2,5 = 575. Como 513 fica entre esses dois valores, a resposta está entre 2 e 2,5, e a única opção nesse intervalo é 2,23.","pq":{"A":"Alto demais: 230.000 × 2,55 = 586.500, bem acima dos 513.000 brasileiros em Portugal.","B":"Baixo demais: 230.000 × 1,85 = 425.500, abaixo dos 513.000 de Portugal. Portugal tem mais que o dobro do Reino Unido (2 × 230.000 = 460.000).","C":"É a razão invertida, Reino Unido ÷ Portugal: 230.000 ÷ 513.000 ≈ 0,448 (a alternativa trunca para 0,44). Um número menor que 1 diria que há menos brasileiros em Portugal, o contrário do que a tabela mostra.","D":"Baixo demais: 230.000 × 1,53 = 351.900, muito abaixo de 513.000. Como Portugal tem mais que o dobro, a razão precisa passar de 2.","E":"Correta: 513.000 ÷ 230.000 ≈ 2,23, e 230.000 × 2,23 = 512.900 ≈ 513.000."},"dica":"“A é quantas vezes B” = A ÷ B; antes de calcular, estime (A passa do dobro de B?) para eliminar alternativas rapidamente.","dif":"fácil","nota":"","obs":""},{"id":"2025d2-14","n":14,"area":"Matemática","disc":"Matemática","assunto":"Média aritmética – divisão igualitária de despesas","titulo":"Cinema dividido em três: quanto Cíntia transfere para Ana e Bianca","gab":"C","base":null,"imgs":[{"src":"img/2025d2/q14_1.webp","w":781,"h":966}],"alt":{"A":"R$ 42,00 para Ana e R$ 18,00 para Bianca.","B":"R$ 18,00 para Ana e R$ 24,00 para Bianca.","C":"R$ 18,00 para Ana e R$ 3,00 para Bianca.","D":"R$ 21,00 para Ana e R$ 3,00 para Bianca.","E":"R$ 3,00 para Ana e R$ 42,00 para Bianca."},"res":"Ideia-chave: some todos os gastos, divida por 3 para achar a cota de cada uma e compare essa cota com o que cada uma já pagou.\n\nTotal: 60 + 45 + 21 = 126 reais\nCota de cada uma: 126 ÷ 3 = 42 reais\n\nSaldo de cada uma (pagou − cota):\nAna: 60 − 42 = +18 (tem 18 a receber)\nBianca: 45 − 42 = +3 (tem 3 a receber)\nCíntia: 21 − 42 = −21 (deve 21)\n\nCíntia paga os 21 reais que deve: 18 para Ana e 3 para Bianca.\n\nConferência: Ana fica com gasto de 60 − 18 = 42; Bianca, 45 − 3 = 42; Cíntia, 21 + 18 + 3 = 42. Todas gastam R$ 42,00.\n\nAtalho para eliminar alternativas: o total transferido por Cíntia tem de ser 42 − 21 = 21 reais, e só a opção C soma 21 (18 + 3).","pq":{"A":"Usa a cota de 42 como se fosse a transferência para Ana. Cíntia repassaria 42 + 18 = 60 reais e acabaria gastando 21 + 60 = 81, muito mais que as outras.","B":"Os 18 para Ana estão certos, mas 24 = 45 − 21 é a diferença entre o gasto de Bianca e o de Cíntia, e não o que Bianca tem a receber (45 − 42 = 3). Cíntia gastaria 21 + 42 = 63.","C":"Correta: a cota é 126 ÷ 3 = 42; Ana pagou 18 a mais, Bianca 3 a mais, e Cíntia, que pagou 21 a menos, cobre exatamente 18 + 3 = 21.","D":"21 é o que a própria Cíntia gastou, não o crédito de Ana. Com essa divisão Cíntia gastaria 21 + 24 = 45 e Ana só 60 − 21 = 39, então os custos não ficam iguais.","E":"Troca os papéis e usa a cota como transferência: Ana tem 18 a receber (não 3) e Bianca só 3 (não 42). Cíntia repassaria 45 reais e gastaria 66 no total."},"dica":"Em divisão igual de contas, calcule a cota (total ÷ número de pessoas) e o saldo de cada um (pagou − cota); quem está devendo transfere exatamente o que falta para a cota.","dif":"fácil","nota":"","obs":""},{"id":"2025d2-15","n":15,"area":"Matemática","disc":"Matemática","assunto":"Regra de três composta","titulo":"Equipe de memes: quantos funcionários a mais para 48 memes em 8 dias","gab":"C","base":null,"imgs":[{"src":"img/2025d2/q15_1.webp","w":783,"h":802}],"alt":{"A":"15","B":"21","C":"9","D":"13","E":"10"},"res":"Ideia-chave: descubra quanto 1 pessoa produz por dia, calcule quantas pessoas a nova meta exige e, no fim, desconte as 3 que já estão na equipe.\n\nSituação atual: 3 pessoas fazem 9 memes em 6 dias.\nTrabalho disponível: 3 × 6 = 18 pessoas·dia\nRendimento: 9 ÷ 18 = 0,5 meme por pessoa por dia\n\nNova meta: 48 memes em 8 dias\nProdução diária necessária: 48 ÷ 8 = 6 memes por dia\nPessoas necessárias: 6 ÷ 0,5 = 12 pessoas\nFuncionários a mais: 12 − 3 = 9\n\nConferência pela regra de três composta: o número de pessoas é diretamente proporcional ao de memes e inversamente proporcional ao de dias:\nx = 3 × (48/9) × (6/8) = 3 × (16/3) × (3/4) = 12 pessoas\n12 − 3 = 9 funcionários a mais.","pq":{"A":"15 = 12 + 3: o total de 12 pessoas está certo, mas você somou a equipe atual em vez de subtraí-la. A pergunta pede quantos funcionários a mais.","B":"21 aparece se você tratar os dias como diretamente proporcionais: 3 × (48/9) × (8/6) ≈ 21,3. Só que, com mais dias de prazo, são necessárias menos pessoas (proporção inversa), e ainda faltaria descontar os 3 atuais.","C":"Correta: a meta exige 6 memes por dia; a 0,5 meme por pessoa por dia, são 12 pessoas no total, ou seja, 12 − 3 = 9 a mais.","D":"13 = 16 − 3, em que 16 = 3 × 48/9 leva em conta só o aumento de memes e ignora que o prazo passou de 6 para 8 dias.","E":"10 aparece se você descontar só os 9 memes originais (48 − 9 = 39) e dividir pelos 4 memes que cada pessoa faz em 8 dias: 39 ÷ 4 ≈ 9,75 → 10. Mas em 8 dias a equipe atual faz 3 × 4 = 12 memes, e (48 − 12) ÷ 4 = 9."},"dica":"Em regra de três composta, reduza à unidade (1 pessoa, 1 dia) ou classifique cada grandeza como direta ou inversa; e leia se a pergunta quer o total ou só o acréscimo.","dif":"média","nota":"","obs":""},{"id":"2025d2-16","n":16,"area":"Matemática","disc":"Matemática","assunto":"Sequência definida por recorrência","titulo":"Sequência de Amanda (+5 nos pares, ×2 nos ímpares): valor de x₉","gab":"D","base":null,"imgs":[{"src":"img/2025d2/q16_1.webp","w":781,"h":1064}],"alt":{"A":"x₉ = 110","B":"x₉ = 140","C":"x₉ = 75","D":"x₉ = 230","E":"x₉ = 55"},"res":"Ideia-chave: não há fórmula pronta; aplique a regra termo a termo, olhando se o índice n do termo que você está calculando é par (soma 5 ao anterior) ou ímpar (dobra o anterior).\n\nx₁ = 5\nx₂ (n par) = x₁ + 5 = 10\nx₃ (n ímpar) = 2 · x₂ = 20\nx₄ (n par) = x₃ + 5 = 25\nx₅ (n ímpar) = 2 · x₄ = 50\nx₆ (n par) = x₅ + 5 = 55\nx₇ (n ímpar) = 2 · x₆ = 110\nx₈ (n par) = x₇ + 5 = 115\nx₉ (n ímpar) = 2 · x₈ = 230\n\nConferência: os termos de índice ímpar (5, 20, 50, 110, 230) obedecem a xₙ₊₂ = 2 · (xₙ + 5). De fato: 2 · (5 + 5) = 20, 2 · (20 + 5) = 50, 2 · (50 + 5) = 110 e 2 · (110 + 5) = 230.","pq":{"A":"110 é o x₇: você parou dois termos antes. Faltaram x₈ = 110 + 5 = 115 e x₉ = 2 · 115 = 230.","B":"140 não é termo da sequência (5, 10, 20, 25, 50, 55, 110, 115, 230): fica entre x₈ = 115 e x₉ = 230, sinal de que alguma regra foi aplicada errado no caminho. Refaça anotando o índice de cada termo.","C":"75 não é termo da sequência: ela pula de x₆ = 55 para x₇ = 110. Chegar a 75 indica que a alternância entre somar 5 e dobrar foi quebrada em algum passo.","D":"Correta: seguindo as regras, x₈ = 115 e, como 9 é ímpar, x₉ = 2 · 115 = 230.","E":"55 é o x₆; você parou três posições antes do nono termo."},"dica":"Em sequências por recorrência, escreva o índice ao lado de cada termo e confira a regra (par ou ímpar) a cada passo; errar a contagem das posições é a armadilha mais comum.","dif":"fácil","nota":"","obs":""},{"id":"2025d2-17","n":17,"area":"Matemática","disc":"Matemática","assunto":"Princípio fundamental da contagem","titulo":"Brasão comemorativo: combinações de cor, filtro e tamanho","gab":"D","base":null,"imgs":[{"src":"img/2025d2/q17_1.webp","w":781,"h":940}],"alt":{"A":"48","B":"24","C":"12","D":"60","E":"120"},"res":"Ideia-chave: o brasão é montado em etapas independentes (escolher a cor, escolher o filtro, escolher o tamanho). Pelo princípio multiplicativo, multiplicam-se as opções de cada etapa.\n\nO texto diz que as 5 cores, os 3 filtros e os 4 tamanhos são “todos diferentes do brasão original”, então nenhuma opção precisa ser descartada.\n\nCor: 5 opções\nFiltro: 3 opções\nTamanho: 4 opções\n\nTotal: 5 × 3 × 4 = 60 maneiras.\n\nConferência: para cada uma das 5 cores há 3 × 4 = 12 combinações de filtro e tamanho; 5 × 12 = 60.","pq":{"A":"48 = 4 × 3 × 4 aparece se você descartar uma das cores como se fosse a original; mas o texto garante que as 5 cores já são diferentes da original.","B":"24 = 4 × 2 × 3 surge quando se tira uma opção de cada lista, achando que em cada uma está a do brasão original; o enunciado diz que todas as opções já são novas.","C":"12 = 5 + 3 + 4: você somou as opções em vez de multiplicar (ou fez só 3 × 4, esquecendo as cores). Somar vale para escolher uma coisa OU outra; aqui se escolhe cor E filtro E tamanho.","D":"Correta: escolhas independentes se multiplicam: 5 × 3 × 4 = 60.","E":"120 = 6 × 4 × 5 aparece se você acrescentar a cada lista a opção do brasão original (6 cores, 4 filtros e 5 tamanhos). Mas a cor, o filtro e o tamanho precisam mudar, e as 5, 3 e 4 opções dadas já são as novas, então o original não entra na conta."},"dica":"Escolhas em etapas independentes (isto E aquilo) se multiplicam; só se soma quando é uma escolha OU outra.","dif":"fácil","nota":"","obs":""},{"id":"2025d2-18","n":18,"area":"Matemática","disc":"Matemática","assunto":"Probabilidade – eventos sucessivos sem reposição","titulo":"Sorteio de sorvetes: chance de Marcos e Lara terem o mesmo sabor","gab":"A","base":null,"imgs":[{"src":"img/2025d2/q18_1.webp","w":783,"h":1172}],"alt":{"A":"11/21","B":"2/3","C":"1/2","D":"5/9","E":"5/21"},"res":"Ideia-chave: “mesmo sabor” = ambos chocolate OU ambos morango. Como os 15 sorvetes são entregues um a um, depois do sorvete de Marcos sobram 14 para o sorteio de Lara (sem reposição).\n\nAmbos chocolate:\nP(CC) = 10/15 × 9/14 = 90/210\n\nAmbos morango:\nP(MM) = 5/15 × 4/14 = 20/210\n\nMesmo sabor:\nP = 90/210 + 20/210 = 110/210 = 11/21\n\nConferência pelo complementar (sabores diferentes, em qualquer ordem):\n10/15 × 5/14 + 5/15 × 10/14 = 50/210 + 50/210 = 100/210 = 10/21\n1 − 10/21 = 11/21\n\nOutra conferência, por combinações: [C(10,2) + C(5,2)] ÷ C(15,2) = (45 + 10) ÷ 105 = 55/105 = 11/21.","pq":{"A":"Correta: P(CC) + P(MM) = 90/210 + 20/210 = 110/210 = 11/21, lembrando que após o primeiro sorvete sobram 14.","B":"2/3 = 10/15 é só a chance de Marcos receber chocolate; não considera o sorteio de Lara nem o caso de ambos ganharem morango.","C":"1/2 vem de supor que “mesmo sabor” e “sabores diferentes” são igualmente prováveis, ignorando que há o dobro de sorvetes de chocolate.","D":"5/9 = (2/3)² + (1/3)² = 4/9 + 1/9 é o cálculo com reposição, como se o sorvete de Marcos voltasse para o sorteio; mas depois da primeira entrega sobram só 14 sorvetes.","E":"5/21 = 10/15 × 5/14 = 50/210 é a chance de uma ordem específica de sabores diferentes (Marcos chocolate e Lara morango), justamente o contrário do que se pede."},"dica":"Em “mesmo resultado” em dois sorteios, some os casos iguais (CC + MM); se o item sorteado não volta, o denominador diminui no segundo sorteio.","dif":"média","nota":"","obs":""},{"id":"2025d2-19","n":19,"area":"Ciências Humanas","disc":"História","assunto":"Roma Antiga – Lei das Doze Tábuas","titulo":"Lei das Doze Tábuas e o princípio da lei escrita em Roma","gab":"B","base":null,"imgs":[{"src":"img/2025d2/q19_1.webp","w":781,"h":1367}],"alt":{"A":"liberdade de casamento entre plebeus e patrícios, pois era interesse da elite romana fazer circular a riqueza dos patrícios por meio do matrimônio.","B":"lei escrita, pois todos poderiam recorrer a um texto público e conhecido para reclamar direitos sem depender da boa vontade dos poderosos.","C":"representação política dos plebeus, pois estes poderiam eleger os seus representantes no Senado em igual proporção aos patrícios.","D":"abolição da escravidão por dívida, pois os romanos não poderiam mais serem escravizados, condição reservada aos povos conquistados.","E":"reforma agrária, pois a plebe rural do interior lutava pelo acesso a grande parte das terras conquistadas de outros povos nas guerras de expansão."},"res":"Ideia-chave: a grande novidade das Doze Tábuas foi a forma da lei, não o seu conteúdo: o direito passou a estar escrito e exposto publicamente.\n\nAntes delas, as normas romanas eram costumeiras e orais, e sua interpretação ficava nas mãos dos patrícios. Um plebeu não tinha como saber com precisão qual era a regra nem como contestar uma decisão arbitrária. O texto mostra que a lei nasceu da “luta pelos direitos civis dos plebeus”, unidos contra o patriciado “na luta pela cidadania”.\n\nO enunciado faz uma ressalva importante: o código era conservador, pois apenas transformou em texto a “legislação tradicional, que previa grande poder aos patriarcas”. Mesmo assim, ao fixar as regras por escrito, criou um referencial público e conhecido, ao qual qualquer cidadão podia recorrer. É exatamente o que diz a alternativa B: reclamar direitos “sem depender da boa vontade dos poderosos”.\n\nConferência: as alternativas A, C, D e E descrevem conquistas plebeias posteriores ou que não ocorreram desse modo; só a B corresponde ao princípio estabelecido pelas Doze Tábuas.","pq":{"A":"As Doze Tábuas não liberaram o casamento entre patrícios e plebeus; ao contrário, mantiveram a proibição, que só caiu depois, com a Lei Canuleia. E a justificativa é inverossímil: a elite patrícia queria preservar sua exclusividade, não “fazer circular” sua riqueza entre os plebeus.","B":"Correta: a lei escrita e pública tirou dos patrícios o monopólio de conhecer e interpretar as normas, permitindo que qualquer cidadão reclamasse direitos com base num texto conhecido.","C":"As Doze Tábuas não criaram representação plebeia no Senado, órgão aristocrático que não era eleito pelo povo. A grande conquista política plebeia foi outra: os tribunos da plebe, magistrados próprios com poder de veto.","D":"A escravidão por dívidas não foi abolida pelas Doze Tábuas, que, aliás, mantiveram regras duras contra devedores. Ela só foi extinta mais tarde, no século IV a.C., pela Lei Poetélia Papíria.","E":"Reforma agrária não fez parte das Doze Tábuas. Em meados do século V a.C., Roma ainda nem dominava a península Itálica; a disputa pelas terras conquistadas teve seu ponto alto bem depois, com as propostas de reforma agrária dos irmãos Graco, no século II a.C."},"dica":"Lei das Doze Tábuas = primeira lei escrita de Roma: o avanço está na publicidade da lei (todos podem conhecê-la), não num conteúdo igualitário.","dif":"fácil","nota":"","obs":""},{"id":"2025d2-20","n":20,"area":"Ciências Humanas","disc":"História","assunto":"Idade Média – renascimento comercial e urbano","titulo":"Cidade medieval em Le Goff e as transformações da Baixa Idade Média","gab":"E","base":null,"imgs":[{"src":"img/2025d2/q20_1.webp","w":783,"h":1562}],"alt":{"A":"aos deslocamentos dos povos germânicos, logo após a crise da sociedade romana, quando as cidades começaram a receber fluxos de povos de diferentes origens.","B":"ao batismo de Clóvis, quando as cidades se tornaram um símbolo da subordinação da Igreja Católica ao poder dos reis germânicos, colocando sob ameaça o domínio católico.","C":"à crise social e econômica decorrente da peste, quando as cidades foram esvaziadas, especialmente aquelas localizadas em regiões de intensas relações comerciais.","D":"a um período de diminuição das heresias em relação à Igreja Católica que acabaria resultando na Contrarreforma, quando as cidades se tornaram importantes centros religiosos.","E":"às transformações da Baixa Idade Média, quando as cidades passaram a ter grande centralidade comercial e surgiram os primeiros banqueiros que emprestavam a juros."},"res":"Ideia-chave: reconhecer no texto as marcas do renascimento comercial e urbano da Baixa Idade Média.\n\nLe Goff descreve a cidade medieval como “um lugar de produção e de trocas em que se mesclam o artesanato e o comércio alimentados por uma economia monetária” e como berço de valores ligados ao “gosto pelo negócio e pelo dinheiro”. Essas características eram raras na Alta Idade Média, período de ruralização, economia pouco monetarizada e cidades esvaziadas. Elas aparecem com a reativação das rotas comerciais e das feiras, o crescimento dos burgos, das corporações de ofício e da burguesia.\n\nNesse ambiente surgiram também cambistas e banqueiros, sobretudo nas cidades italianas, que trocavam moedas e emprestavam dinheiro a juros, apesar da condenação da usura pela Igreja. Por isso, a alternativa E descreve exatamente o contexto: cidades com “grande centralidade comercial” e os primeiros banqueiros.\n\nConferência: o texto fala em “sociedade abundante”, o que descarta contextos de crise (invasões germânicas, peste) e de outra época (Contrarreforma).","pq":{"A":"Os deslocamentos germânicos ligados à crise do Império Romano do Ocidente marcam o início da Alta Idade Média, quando ocorreu o contrário do texto: ruralização, declínio do comércio e esvaziamento das cidades. Não havia ali a cidade “abundante”, de trocas e economia monetária.","B":"O batismo de Clóvis (por volta do ano 500) selou uma aliança entre os francos e a Igreja Católica que fortaleceu o catolicismo, e não uma subordinação que o ameaçasse. Além disso, é um episódio da Alta Idade Média, época de cidades enfraquecidas.","C":"A Peste Negra, em meados do século XIV, trouxe mortes em massa e crise, o oposto da cidade “abundante” e dinâmica descrita por Le Goff. A questão pede o contexto em que a cidade medieval floresceu, não o de seu esvaziamento.","D":"Há anacronismo e inversão: a Contrarreforma é do século XVI, já na Idade Moderna, e foi a reação católica à Reforma Protestante, isto é, a um aumento (não a uma diminuição) das contestações à Igreja. E o texto apresenta as cidades como centros de produção e trocas, não como centros religiosos.","E":"Correta: o renascimento comercial e urbano da Baixa Idade Média fez das cidades centros de artesanato, comércio e economia monetária, ambiente em que surgiram os banqueiros que emprestavam a juros."},"dica":"Cidade medieval com comércio, moeda, artesanato e burguesia = Baixa Idade Média (renascimento comercial e urbano); Alta Idade Média = ruralização.","dif":"média","nota":"","obs":""},{"id":"2025d2-21","n":21,"area":"Ciências Humanas","disc":"História","assunto":"Primeira Guerra Mundial – propaganda e esforço de guerra","titulo":"Cartaz “War Gardens” e a propaganda dos EUA na Primeira Guerra","gab":"D","base":null,"imgs":[{"src":"img/2025d2/q21_1.webp","w":781,"h":1938}],"alt":{"A":"a baixa industrialização dos EUA à época da guerra, devido ao fracasso do país na segunda revolução industrial.","B":"o desinteresse dos EUA nas disputas imperialistas do período, já que o país não possuía territórios coloniais.","C":"a dificuldade dos EUA em lidar com a guerra, por terem sido surpreendidos pelos ataques alemães em 1914.","D":"a importância da propaganda nacionalista dos EUA, que buscava mobilizar a população para o esforço de guerra.","E":"a crise em que os EUA mergulharam em função da guerra, provocando grave retração econômica do país."},"res":"Ideia-chave: cartazes oficiais em tempo de guerra são instrumentos de propaganda para mobilizar a população civil.\n\nO cartaz traz o título “War Gardens over the top”, a bandeira dos EUA ao fundo e o lema “As sementes da vitória garantem os frutos da paz”. Ele associa um gesto cotidiano, plantar uma horta, à vitória militar: cada cidadão que produz alimento em casa libera recursos para as tropas. O próprio enunciado diz que a campanha buscava “incentivar os estadunidenses a cultivarem mais alimentos e recursos para as necessidades militares”.\n\nIsso é típico da guerra total do século XX: o conflito envolvia não só os soldados, mas toda a sociedade, incluindo a economia, a produção de alimentos e a opinião pública. O tom patriótico (bandeira, “vitória”) e o humor do desenho (vegetais fugindo da pessoa com a enxada) servem para engajar as pessoas de forma simpática. Por isso, a campanha evidencia a importância da propaganda nacionalista para mobilizar a população para o esforço de guerra, alternativa D.\n\nConferência: nada no cartaz indica fraqueza industrial, crise econômica ou desinteresse; ele mostra engajamento.","pq":{"A":"No início do século XX, os EUA já estavam entre as maiores potências industriais do mundo e foram protagonistas da Segunda Revolução Industrial (eletricidade, petróleo, aço, produção em série). Incentivar hortas não indica atraso industrial, e sim mobilização de todos os recursos, inclusive alimentares.","B":"Os EUA participavam das disputas imperialistas: após a guerra contra a Espanha (1898), passaram a controlar territórios como Porto Rico e Filipinas, e intervinham com frequência na América Central e no Caribe. Além disso, o cartaz mostra engajamento na guerra, não desinteresse.","C":"Erro de fato e de data: os EUA permaneceram neutros no início do conflito e só entraram na guerra em 1917, sobretudo por causa da guerra submarina alemã. Não foram “surpreendidos pelos ataques alemães em 1914”.","D":"Correta: a campanha das hortas é propaganda patriótica que transforma o cidadão comum em participante do esforço de guerra, produzindo alimentos para liberar recursos às tropas.","E":"Foi o contrário: a guerra impulsionou a economia dos EUA, que venderam alimentos, armas e créditos aos Aliados e saíram do conflito como grande potência credora. A grande crise norte-americana só viria em 1929."},"dica":"Cartaz de guerra = guerra total: propaganda para mobilizar civis a produzir, economizar, alistar-se e apoiar o país.","dif":"fácil","nota":"","obs":""},{"id":"2025d2-22","n":22,"area":"Ciências Humanas","disc":"História","assunto":"Imperialismo e descolonização – Canal de Suez","titulo":"Canal de Suez: construção imperialista e estatização por Nasser","gab":"E","base":null,"imgs":[{"src":"img/2025d2/q22_1.webp","w":783,"h":1235}],"alt":{"A":"dos cercamentos de terras e da luta palestina.","B":"do Império Napoleônico e do Tratado de Versalhes.","C":"de República de Cromwell e da expansão muçulmana.","D":"do Bloqueio Continental e da Segunda Guerra.","E":"do imperialismo e das lutas anticoloniais."},"res":"Ideia-chave: localizar no tempo os dois momentos (construção na segunda metade do século XIX e estatização em 1956) e associar cada um ao seu contexto.\n\nConstrução: o canal foi aberto na segunda metade do século XIX (inaugurado em 1869), época do imperialismo, ou neocolonialismo, europeu sobre a África e a Ásia. O texto lembra que ele era chamado de “Estrada do Império Britânico” e que encurtou a rota “entre a Inglaterra e a Índia”, então a principal colônia britânica. O canal servia, portanto, aos interesses das potências imperialistas, e o próprio Egito acabou ocupado pelos britânicos.\n\nEstatização: em 1956, Nasser nacionalizou o canal em nome do nacionalismo árabe, para que os árabes pudessem “viver com dignidade”. A medida se insere no pós-Segunda Guerra, período das lutas anticoloniais e da descolonização da Ásia e da África, em que ex-colônias buscavam controlar seus próprios recursos. O “horror na Europa” confirma o choque: Reino Unido e França, ao lado de Israel, chegaram a intervir militarmente na chamada Crise de Suez. (O texto data o anúncio em outubro, mas Nasser o fez em julho de 1956; foi no fim de outubro que começou essa intervenção militar. O mês não altera a resposta.)\n\nLogo: imperialismo e lutas anticoloniais, alternativa E.","pq":{"A":"Os cercamentos foram o fechamento das terras comunais na Inglaterra a partir do século XVI, ligado à expulsão de camponeses e às origens da Revolução Industrial, sem relação com o canal. E a luta palestina refere-se ao conflito com Israel, não à nacionalização feita pelo Egito.","B":"Anacronismo nos dois termos: o Império de Napoleão Bonaparte (1804–1815) é anterior à construção do canal, e o Tratado de Versalhes (1919) encerrou a Primeira Guerra Mundial, décadas antes da estatização de 1956.","C":"Anacronismo: a República de Cromwell pertence à Inglaterra do século XVII, e a expansão muçulmana ocorreu nos séculos VII e VIII. Nenhum dos dois contextos coincide com a segunda metade do século XIX ou com 1956.","D":"O Bloqueio Continental (1806) foi a tentativa de Napoleão de isolar economicamente a Inglaterra, muito antes do canal. E a estatização de 1956 ocorreu depois da Segunda Guerra (1939–1945), no contexto da descolonização e da Guerra Fria, não durante ela.","E":"Correta: o canal foi construído em pleno imperialismo europeu do século XIX e estatizado por Nasser como afirmação do nacionalismo árabe, no contexto das lutas anticoloniais do pós-guerra."},"dica":"Monte a linha do tempo: segunda metade do século XIX = imperialismo/neocolonialismo; pós-1945 = descolonização e nacionalismos afro-asiáticos.","dif":"fácil","nota":"","obs":""},{"id":"2025d2-23","n":23,"area":"Ciências Humanas","disc":"História","assunto":"Brasil Colônia – alianças com povos indígenas","titulo":"Cerco de Piratininga (1562) e as alianças com grupos indígenas","gab":"C","base":null,"imgs":[{"src":"img/2025d2/q23_1.webp","w":781,"h":1387}],"alt":{"A":"a intensidade do processo de catequização dos povos indígenas na sua aproximação com a Igreja Católica.","B":"a utilização da mão de obra indígena livre na produção de recursos e mantimentos para o sustento da vila.","C":"o sucesso ou insucesso decorrente de alianças firmadas entre os colonizadores e grupos indígenas locais.","D":"a dominância portuguesa nas armas e no controle do exército contra grupos indígenas desprovidos de armamentos.","E":"a aceitação da ordem da Coroa Portuguesa que não permitia a convivência entre colonos e indígenas na mesma vila."},"res":"Ideia-chave: o texto mostra que a sobrevivência da vila dependeu das alianças com grupos indígenas, e não da força isolada dos portugueses.\n\nSegundo o texto, o Cerco de Piratininga foi “uma guerra entre povos indígenas”, opondo “aqueles que haviam firmado alianças com os portugueses colonizadores e aqueles que eram contrários a esses acordos”. De um lado, guarulhos, guaianás e carijós; de outro, “a aliança formada pelo grupo liderado pelo tupiniquim Tibiriçá e os padres jesuítas”.\n\nOu seja, a vila resistiu porque contava com aliados indígenas que lutaram em sua defesa; se a aliança falhasse, o núcleo colonial poderia ser destruído. Isso revela algo mais amplo sobre os primeiros tempos da colonização: os portugueses eram poucos e dependiam de acordos com povos locais (para a guerra, a obtenção de alimentos, o conhecimento do território), ao mesmo tempo em que exploravam as rivalidades entre os próprios indígenas. Daí a alternativa C: a permanência do núcleo dependia do “sucesso ou insucesso” das alianças.\n\nConferência: as demais alternativas trazem fatores que o texto não menciona (catequese, mão de obra) ou que ele contradiz (superioridade militar portuguesa, proibição de convivência).","pq":{"A":"A catequese existia (os jesuítas estavam ali), mas o texto não a apresenta como fator decisivo. O que define o episódio é a guerra entre indígenas aliados e contrários aos portugueses; até os jesuítas aparecem como parte de uma aliança política e militar com o grupo de Tibiriçá.","B":"O texto não trata de trabalho nem de produção de mantimentos, e sim de guerra e alianças. Além disso, a exploração da mão de obra indígena na capitania esteve frequentemente ligada à escravização, e não a um trabalho “livre”.","C":"Correta: o episódio mostra que a vila sobreviveu graças à aliança com o grupo de Tibiriçá; o destino dos núcleos coloniais dependia do sucesso ou do fracasso dessas alianças.","D":"O texto contradiz essa ideia: a defesa da vila dependeu dos guerreiros de Tibiriçá, isto é, de aliados indígenas. Os povos inimigos tinham armas próprias (arcos, flechas, bordunas) e conheciam o terreno; não eram “desprovidos de armamentos”.","E":"O texto não menciona nenhuma ordem desse tipo e mostra o contrário: indígenas aliados e jesuítas atuando juntos no planalto, em defesa da vila. A vila de São Paulo nasceu justamente da presença jesuíta junto a grupos indígenas."},"dica":"No início da colonização, os portugueses eram poucos: alianças com povos indígenas e a exploração das rivalidades entre eles foram decisivas para a sobrevivência dos núcleos coloniais.","dif":"fácil","nota":"","obs":""},{"id":"2025d2-24","n":24,"area":"Ciências Humanas","disc":"História","assunto":"Brasil Império – Indianismo romântico","titulo":"Iracema na tela de José Maria de Medeiros e o Indianismo romântico","gab":"A","base":null,"imgs":[{"src":"img/2025d2/q24_1.webp","w":783,"h":2067}],"alt":{"A":"como convinha à representação oficial dos indígenas, uma figura passiva e idealizada que deveria morrer para que a nação vingasse.","B":"como uma mulher que abandona o seu modo de vida indígena, deixando para trás os seus instrumentos, artefatos e adornos.","C":"como uma indígena guerreira, reconhecida por sua bravura e coragem, que teria resistido intensamente à presença portuguesa.","D":"em uma atmosfera próxima ao universo religioso católico, com referências à sua santificação e à sua conversão ao cristianismo.","E":"de forma crítica, evidenciando os seus traços rudes, grosseiros e primitivos que remetem à ideia de selvagem bárbaro e inculto."},"res":"Ideia-chave: o Indianismo romântico idealizou o indígena como herói passivo, que se sacrifica diante da civilização branca, e a tela segue essa mesma visão.\n\nO texto afirma que os indígenas das obras românticas estavam “mais próximos da ideia do bom selvagem que sucumbe diante da civilização” e que o Brasil seria “a terra do índio bom, que preferia morrer a se opor aos princípios da civilização branca e católica”. No romance de Alencar, Iracema se apaixona pelo português Martim, deixa sua tribo e morre depois de dar à luz Moacir, filho dos dois; sua morte simboliza o nascimento de um povo mestiço, a nação brasileira.\n\nNa pintura, Iracema aparece sozinha numa praia deserta, de cabeça baixa e mão no peito, olhando para uma flecha enfeitada com um ramo, cravada na areia: postura melancólica, contemplativa e passiva. O corpo é idealizado e delicado, em harmonia com a paisagem, sem sinal de conflito. Isso corresponde à alternativa A: uma figura “passiva e idealizada”, condizente com a imagem oficial do indígena construída no século XIX.\n\nConferência: não há na tela armas em punho, símbolos cristãos ou traços caricatos.","pq":{"A":"Correta: a tela mostra uma Iracema solitária, melancólica e idealizada, coerente com o “bom selvagem” romântico que sucumbe diante da civilização para que a nação mestiça surja.","B":"Nada na tela indica abandono da cultura indígena: Iracema está no ambiente natural, com tanga indígena, e há uma flecha cravada a seu lado. A ideia de deixar para trás “instrumentos, artefatos e adornos” não tem base na imagem.","C":"A postura é de recolhimento e tristeza (cabeça baixa, mão no peito), não de combate; ela não empunha armas. E o texto lembra que o indígena romântico “preferia morrer a se opor” à civilização, o contrário de uma heroína da resistência aos portugueses.","D":"Não há cruz, auréola, igreja ou qualquer símbolo cristão: o cenário é só natureza (praia, mar, mata). A idealização da tela é romântica, ligada à paisagem, e não uma cena de santificação ou conversão.","E":"O quadro não é crítico nem caricatural: o corpo é delicado e idealizado, segundo os padrões da pintura acadêmica. A visão do indígena como “bárbaro e inculto” é o oposto da idealização romântica descrita no texto."},"dica":"Indianismo romântico (Alencar, Gonçalves Dias) = indígena idealizado à moda do “bom selvagem”, herói nacional distante dos indígenas reais e de seus direitos.","dif":"média","nota":"","obs":""},{"id":"2025d2-25","n":25,"area":"Ciências Humanas","disc":"História","assunto":"Era Vargas – queremismo e trabalhismo","titulo":"Queremismo (1945) e o temor de perder a legislação trabalhista","gab":"B","base":null,"imgs":[{"src":"img/2025d2/q25_1.webp","w":781,"h":1484}],"alt":{"A":"a política anticomunista, que levou o Partido Comunista a romper com Vargas em 1945.","B":"a legislação trabalhista, que conferiu diversos direitos aos trabalhadores desde 1930.","C":"a política econômica liberal, que caracterizou a maior parte da Era Vargas.","D":"as liberdades democráticas e eleições livres, que marcaram o período do Estado Novo.","E":"as medidas que fizeram com que Vargas rompesse com os EUA em meio à Segunda Guerra."},"res":"Ideia-chave: o queremismo (de “Queremos Getúlio”, frase das faixas da foto) foi um movimento de trabalhadores, em 1945, pela permanência de Vargas, por medo de perder os direitos trabalhistas associados a ele.\n\nCom o fim da Segunda Guerra e a derrota dos regimes nazifascistas, o Estado Novo entrou em crise e a oposição liberal pressionava pela saída de Vargas. Muitos trabalhadores, porém, identificavam Getúlio com as conquistas obtidas desde 1930: criação do Ministério do Trabalho, carteira de trabalho, jornada de oito horas, férias, salário mínimo e, em 1943, a Consolidação das Leis do Trabalho (CLT). A propaganda oficial reforçava a imagem de Vargas como “pai dos pobres”.\n\nOs opositores, reunidos sobretudo na UDN e ligados a setores liberais, eram vistos como ameaça a essas garantias. Daí a palavra de ordem por uma Constituinte com Getúlio no poder. A alternativa B traduz esse temor: o fim da legislação trabalhista.\n\nConferência: Vargas acabou deposto em outubro de 1945, mas voltou eleito em 1950, em grande parte graças ao apoio dos trabalhadores.","pq":{"A":"Os trabalhadores não temiam o fim do anticomunismo, e o dado histórico está trocado: em 1945, após a anistia, o Partido Comunista, liderado por Luís Carlos Prestes, aproximou-se de Vargas e apoiou a proposta de Constituinte com Getúlio, em vez de romper com ele.","B":"Correta: o queremismo nasceu do medo de que a saída de Vargas levasse à perda dos direitos trabalhistas conquistados desde 1930 e reunidos na CLT, em 1943.","C":"A política econômica da Era Vargas foi nacionalista e intervencionista, com o Estado regulando o trabalho e criando empresas como a Companhia Siderúrgica Nacional e a Vale do Rio Doce. Liberais eram justamente muitos dos opositores de Vargas.","D":"O Estado Novo (1937–1945) foi uma ditadura: Congresso fechado, censura pelo DIP, perseguição a opositores e nenhuma eleição presidencial. Não havia liberdades democráticas a perder com a saída de Vargas; essa era, aliás, a bandeira de seus adversários.","E":"Vargas não rompeu com os EUA: em 1942, o Brasil rompeu relações com o Eixo, entrou na guerra ao lado dos Aliados e depois enviou a FEB à Itália, aproximando-se dos norte-americanos."},"dica":"Queremismo (1945) = trabalhadores pedindo a permanência de Vargas para garantir as leis trabalhistas; é a base popular do trabalhismo.","dif":"fácil","nota":"","obs":""},{"id":"2025d2-26","n":26,"area":"Ciências Humanas","disc":"Geografia","assunto":"Geopolítica da África – União Africana","titulo":"União Africana e o protocolo de livre circulação de pessoas","gab":"C","base":null,"imgs":[{"src":"img/2025d2/q26_1.webp","w":783,"h":1439}],"alt":{"A":"uma agência da Organização das Nações Unidas (ONU) que planeja ações econômicas e sociais para limitar as correntes emigratórias.","B":"uma aliança de cooperação diplomática que pretende estimular as relações unilaterais com o propósito de disseminar os princípios democráticos no continente.","C":"uma organização supranacional que busca fortalecer a paz, a soberania e o desenvolvimento socioeconômico no continente.","D":"um bloco econômico que estabelece relações de cooperação para eliminar as fronteiras nacionais para formar uma só África.","E":"um acordo de cooperação militar que permite manter a paz e a estabilidade política com o apoio de investimentos humanitários internacionais."},"res":"Ideia-chave: a União Africana (UA) reúne os países do continente para promover integração, paz, segurança e desenvolvimento, preservando a soberania de cada Estado.\n\nA UA foi criada em 2002, substituindo a Organização da Unidade Africana (OUA), fundada em 1963 no contexto da descolonização. Seus objetivos incluem a unidade e a solidariedade entre os países africanos, a defesa da soberania e da integridade territorial dos membros, a promoção da paz e da segurança e o desenvolvimento econômico e social. A notícia mostra uma de suas frentes de integração: a Zona de Comércio Livre Continental Africana e o protocolo de “Livre Circulação de Pessoas”, pensado para permitir “o fluxo de mão de obra, competências e serviços através das fronteiras africanas”.\n\nRepare que o protocolo só entra em vigor com ratificações nacionais (são necessárias ao menos 15, e só 4 países ratificaram): cada Estado decide se adere. Ou seja, a integração avança respeitando a soberania dos membros. Isso corresponde à alternativa C: uma organização de alcance supranacional voltada à paz, à soberania e ao desenvolvimento socioeconômico.","pq":{"A":"A UA não é agência da ONU: é uma organização própria dos Estados africanos, com sede em Adis Abeba. E o protocolo citado busca ampliar a circulação de pessoas, não “limitar as correntes emigratórias”.","B":"“Relações unilaterais” é o oposto de integração: a UA é multilateral e toma decisões conjuntas entre os países do continente. A promoção da democracia está entre seus princípios, mas não por meio de relações de mão única.","C":"Correta: a UA é uma organização continental que articula os países africanos em torno da paz, da segurança, da soberania e do desenvolvimento socioeconômico, como mostra a iniciativa de livre circulação.","D":"A UA vai além de um bloco econômico (a zona de livre comércio é só uma de suas frentes) e não pretende eliminar fronteiras nacionais: ela defende a soberania e a integridade territorial dos Estados. Livre circulação de pessoas não significa apagar fronteiras e fundir os países numa “só África”.","E":"A UA atua em segurança, com um Conselho de Paz e Segurança e missões de paz, mas não é um acordo militar: seus objetivos abrangem integração política, econômica e social, como mostra a própria notícia sobre comércio e circulação de pessoas."},"dica":"União Africana (2002, sucessora da OUA) = organização continental de integração política, econômica e de segurança, que respeita a soberania dos membros; não confunda com bloco apenas comercial.","dif":"média","nota":"","obs":""},{"id":"2025d2-27","n":27,"area":"Ciências Humanas","disc":"Geografia","assunto":"Economia brasileira – evolução do PIB","titulo":"Gráfico do PIB do Brasil (2012–2024) e a instabilidade econômica","gab":"A","base":null,"imgs":[{"src":"img/2025d2/q27_1.webp","w":1574,"h":1836}],"alt":{"A":"instabilidade, fruto da variação entre oferta e demanda de bens de consumo, capital e serviço e da combinação de fatores sociais e políticos que afetam o sistema produtivo.","B":"estagnação, assinalada pelo baixo crescimento da renda e da produtividade financeira e pela falta de investimentos consistentes em infraestrutura essenciais ao comércio e à logística.","C":"fragilidade, em virtude da dependência de investimentos financeiros e tecnológicos do mercado internacional e do baixo potencial produtivo dos setores primário e secundário.","D":"desequilíbrio, marcado pela política de substituição das importações de manufaturas e pela menor participação do setor primário na geração de emprego e renda.","E":"incerteza, resultado da elevação do índice de inflação nas atividades do terceiro setor e do aumento das importações de commodities agropecuárias para abastecer o mercado interno."},"res":"Ideia-chave: ler a forma do gráfico, que sobe e desce sem padrão estável, e lembrar o que provocou as quedas.\n\nOs valores oscilam fortemente: 1,9% (2012), 3% (2013) e 0,5% (2014); depois, duas quedas seguidas, −3,5% (2015) e −3,3% (2016); recuperação fraca de 1,3%, 1,8% e 1,2% (2017 a 2019); nova queda de −3,3% em 2020 e salto para 4,8% em 2021; por fim, 3%, 3,2% e 3,4% (2022 a 2024).\n\nA amplitude é grande: do pior resultado ao melhor há 4,8 − (−3,5) = 8,3 pontos percentuais. Isso caracteriza instabilidade. As causas combinam fatores econômicos (queda do consumo e do investimento, isto é, desequilíbrios entre oferta e demanda) com fatores sociais e políticos: a recessão de 2015-2016 ocorreu em meio a grave crise política, e a queda de 2020 decorreu da pandemia de covid-19, que paralisou atividades produtivas. Como o PIB soma consumo, investimentos, gastos do governo e exportações líquidas, qualquer choque nesses componentes aparece no gráfico.\n\nPortanto, a alternativa A descreve corretamente o comportamento do PIB.","pq":{"A":"Correta: o gráfico alterna recessões (−3,5%, −3,3%) e altas (até 4,8%), resultado de variações de oferta e demanda somadas a choques políticos e sociais, como a crise de 2015-2016 e a pandemia de 2020.","B":"Estagnação seria crescimento próximo de zero por um longo período, mas o gráfico mostra quedas fortes e altas expressivas (4,8% em 2021 e 3% ou mais de 2022 a 2024). Além disso, a alternativa traz explicações, como “produtividade financeira”, que o gráfico não permite sustentar.","C":"O Brasil não tem “baixo potencial produtivo” nos setores primário e secundário: é um dos maiores produtores e exportadores mundiais de alimentos e minérios e possui parque industrial diversificado. A oscilação do gráfico não se explica por isso.","D":"A política de substituição de importações marcou a industrialização brasileira entre as décadas de 1930 e 1970, não o período de 2012 a 2024. E o setor primário (agropecuária e mineração) continua com grande peso nas exportações brasileiras.","E":"O gráfico não traz dados de inflação, e o Brasil é grande exportador, e não importador, de commodities agropecuárias como soja, carnes, açúcar e café. A alternativa inverte a realidade do comércio exterior brasileiro."},"dica":"PIB que alterna crescimento e recessão = instabilidade; associe as quedas a choques concretos (crise econômica e política de 2015-2016, pandemia de 2020).","dif":"média","nota":"","obs":""},{"id":"2025d2-28","n":28,"area":"Ciências Humanas","disc":"Geografia","assunto":"Geopolítica – BRICS e hegemonia do dólar","titulo":"Ameaça de Trump aos BRICS e a influência financeira da China","gab":"D","base":null,"imgs":[{"src":"img/2025d2/q28_1.webp","w":781,"h":1935}],"alt":{"A":"pela possibilidade da substituição do modelo de paridade padrão ouro-dólar pelos BRICS, que comprometeria a confiança do mercado especulativo nos investimentos de longo prazo.","B":"pela capacidade de articulação dos BRICS como um bloco econômico supranacional em virtude da criação de linhas de créditos pelo Novo Banco de Desenvolvimento (NBD).","C":"pela dificuldade de manter as sanções econômicas impostas pela Organização do Tratado do Atlântico Norte (Otan) sobre a Rússia em virtude da invasão à Ucrânia.","D":"pelo aumento da influência da China sobre o sistema financeiro e o comércio internacional por meio da ampliação de investimentos chineses entre os países parceiros.","E":"pelo declínio do poder do dólar americano sobre a balança de pagamentos e recebimentos dos países, o que abriria espaço para o Euro se tornar uma nova moeda hegemônica."},"res":"Ideia-chave: o dólar é a principal moeda do comércio e das reservas internacionais, o que dá enorme poder aos EUA; uma alternativa monetária dos BRICS beneficiaria sobretudo a China, principal rival econômica dos norte-americanos.\n\nTrump ameaça com “100% de tarifas” os países que criarem ou apoiarem uma moeda “para substituir o poderoso dólar americano”. Por trás disso está a disputa geopolítica com a China: maior economia do grupo e maior parceira comercial de muitos países, inclusive do Brasil, ela amplia sua influência com investimentos em infraestrutura no exterior, empréstimos e acordos comerciais liquidados em moedas locais, como o yuan. Reduzir o uso do dólar nessas trocas, a chamada desdolarização, enfraqueceria um dos pilares do poder dos EUA e abriria espaço para a moeda e o sistema financeiro chineses.\n\nA cédula simbólica, com as bandeiras de China, Rússia, Índia, Brasil e África do Sul, ilustra essa ideia de alternativa ao dólar, embora não exista moeda comum dos BRICS. Assim, a alternativa D identifica a preocupação de fundo: o aumento da influência chinesa sobre as finanças e o comércio mundiais.","pq":{"A":"Anacronismo: o padrão ouro-dólar de Bretton Woods acabou em 1971, quando os EUA deixaram de converter dólares em ouro. Hoje o dólar não tem lastro em ouro, então não existe esse modelo de paridade para os BRICS substituírem.","B":"Os BRICS não são um bloco econômico supranacional: não têm união aduaneira, tarifa comum nem instituições acima dos governos; funcionam como um fórum de coordenação. O Novo Banco de Desenvolvimento existe, mas é um banco de fomento e não é o alvo da ameaça, que trata da substituição do dólar.","C":"As sanções à Rússia foram impostas por países como os EUA e os membros da União Europeia, não pela Otan, que é uma aliança militar. Além disso, a fala de Trump trata de moeda e comércio, não das sanções ligadas à guerra na Ucrânia.","D":"Correta: a desdolarização defendida no âmbito dos BRICS favoreceria sobretudo a China, que já amplia sua presença financeira e comercial por meio de investimentos e acordos com países parceiros.","E":"A alternativa ao dólar em discussão viria dos BRICS (moedas locais, como o yuan, ou uma moeda do grupo), e não do euro, moeda da União Europeia, que não integra os BRICS."},"dica":"Disputa monetária é disputa geopolítica: a hegemonia do dólar sustenta o poder dos EUA, e a China é a principal interessada em reduzir essa dependência.","dif":"difícil","nota":"","obs":""},{"id":"2025d2-29","n":29,"area":"Ciências Humanas","disc":"Geografia","assunto":"Espaço agrário – fronteira agrícola do Matopiba","titulo":"Matopiba e a formação do complexo agroindustrial no Cerrado","gab":"E","base":null,"imgs":[{"src":"img/2025d2/q29_1.webp","w":783,"h":1420}],"alt":{"A":"a parceria público-privada no processo produtivo para assegurar a utilização de sementes crioulas no plantio.","B":"o potencial da agricultura de precisão para fomentar o mercado de trabalho dependente da mão de obra braçal.","C":"a consolidação de uma região agrícola policultora para consorciar com as Unidades de Conservação do cerrado.","D":"o desenvolvimento virtuoso de um ciclo econômico agropecuário para preservar a forma de produzir das plantations.","E":"a formação de um complexo agroindustrial para atender às demandas de consumo do mercado externo e interno."},"res":"Ideia-chave: o Matopiba é a expansão do agronegócio moderno sobre o Cerrado, com forte apoio do Estado e voltada à produção de commodities.\n\nO texto aponta o “avanço da soja, milho, algodão, cana, eucalipto e pecuária”, a produção de “commodities”, “grandes obras de infraestrutura”, “incentivos fiscais e creditícios” e ajustes nas normas para “atrair investidores”. Esse é o retrato do complexo agroindustrial: a agropecuária integrada à indústria antes da porteira (máquinas, sementes, fertilizantes, crédito) e depois dela (processamento, armazenagem, transporte, comercialização).\n\nCommodities como soja, milho e algodão são, em grande parte, exportadas, mas também abastecem o mercado interno (rações, óleos, indústria têxtil, etanol). Por isso, a alternativa E sintetiza o processo: a formação de um complexo agroindustrial para atender às demandas externas e internas.\n\nConferência: as outras alternativas falam de sementes crioulas, trabalho braçal, policultura e conservação, o contrário do modelo descrito, que é de monocultura mecanizada em larga escala e avanço sobre a vegetação nativa.","pq":{"A":"Sementes crioulas são variedades tradicionais, guardadas e trocadas por agricultores familiares e comunidades tradicionais. O agronegócio do Matopiba usa sementes comerciais melhoradas, muitas transgênicas, e o texto não fala em parceria para garantir crioulas.","B":"A agricultura de precisão (GPS, sensores, drones, máquinas automatizadas) reduz a necessidade de trabalho braçal, em vez de fomentá-lo. A modernização do campo tende a gerar poucos empregos, e mais qualificados.","C":"O texto descreve monoculturas em grande escala (soja, milho, algodão), não policultura. E a expansão avança “sobre áreas do Cerrado”, ou seja, substitui a vegetação nativa em vez de se consorciar com Unidades de Conservação.","D":"O modelo não busca “preservar” as plantations coloniais, baseadas na mão de obra escravizada: é uma agricultura capitalista, mecanizada e tecnificada, ainda que mantenha traços como grande propriedade, monocultura e exportação. E chamar o processo de “virtuoso” ignora os impactos ambientais e os conflitos por terra dessa fronteira.","E":"Correta: infraestrutura, crédito, incentivos fiscais e produção de commodities caracterizam a formação de um complexo agroindustrial voltado aos mercados externo e interno."},"dica":"Fronteira agrícola + commodities + infraestrutura + incentivo estatal = complexo agroindustrial (agronegócio integrado à indústria e ao mercado).","dif":"fácil","nota":"","obs":""},{"id":"2025d2-30","n":30,"area":"Ciências Humanas","disc":"Geografia","assunto":"Geopolítica do Oriente Médio – questão curda","titulo":"Dissolução do PKK e o objetivo da questão curda","gab":"B","base":null,"imgs":[{"src":"img/2025d2/q30_1.webp","w":781,"h":1433}],"alt":{"A":"à emancipação política e administrativa da província iraquiana do Curdistão para integrar o território turco.","B":"à independência política e territorial do Irã, do Iraque, da Síria e da Turquia para formar um Estado-Nação autônomo.","C":"à alteração da condição de Estado Observador para Estado Pleno na Organização das Nações Unidas (ONU).","D":"ao exercício do direito político e civil da etnia curda em situação de refúgio nos países do Oriente Médio.","E":"à livre participação e manifestação dos partidos e dos políticos curdos nos parlamentos do Iraque, da Síria e da Turquia."},"res":"Ideia-chave: a questão curda é a luta de uma nação sem Estado pela autodeterminação, isto é, pela formação de um Curdistão independente.\n\nO texto informa que os curdos somam “entre 30 e 45 milhões”, vivem “há séculos” em áreas da Turquia, do Iraque, do Irã e da Síria e têm “aspirações de autodeterminação” que esbarraram na perseguição dos governos, os quais os pressionaram “a aceitar a integração”. Com a partilha do Império Otomano após a Primeira Guerra Mundial, não se criou um Estado curdo, e os curdos ficaram divididos como minorias entre vários países.\n\nO PKK abandonou a luta armada, mas o horizonte histórico do movimento curdo permanece: o direito de decidir o próprio destino como nação, expresso no projeto de um Estado curdo formado com territórios hoje pertencentes a Irã, Iraque, Síria e Turquia. É isso que a alternativa B quer dizer; leia “independência política e territorial do Irã, do Iraque...” como independência em relação a esses países.\n\nConferência: as demais alternativas propõem integração aos Estados atuais (A, E), tratam os curdos como refugiados (D) ou os confundem com o caso palestino na ONU (C).","pq":{"A":"Inverte o objetivo: os curdos buscam autodeterminação, não ser anexados à Turquia, justamente o Estado contra o qual o PKK lutou por mais de 40 anos. Além disso, o Curdistão iraquiano já tem uma região autônoma, sem projeto de integração ao território turco.","B":"Correta: o objetivo histórico da questão curda é a autodeterminação, com a formação de um Estado-Nação curdo independente a partir das áreas curdas da Turquia, do Iraque, do Irã e da Síria.","C":"Confusão com o caso palestino: a Palestina é que tem status de Estado observador não membro na ONU. O Curdistão não é um Estado reconhecido nem possui esse status; o objetivo curdo é conquistar um Estado próprio, não mudar de categoria na ONU.","D":"Os curdos não são, em geral, refugiados: o texto diz que habitam a região “há séculos”, em seu território ancestral. Existem curdos refugiados por causa de guerras, mas a questão curda é a de um povo nativo dividido entre Estados, que busca autodeterminação.","E":"Participar dos parlamentos de Iraque, Síria e Turquia seria aceitar a integração aos Estados atuais, exatamente o que, segundo o texto, os governos pressionaram os curdos a aceitar. Direitos políticos são uma pauta, mas não definem o objetivo central da questão curda (e a alternativa ainda omite o Irã)."},"dica":"Curdos = maior nação sem Estado, dividida entre Turquia, Iraque, Irã e Síria; o núcleo da questão curda é a autodeterminação (um Curdistão independente).","dif":"média","nota":"","obs":""},{"id":"2025d2-31","n":31,"area":"Ciências Humanas","disc":"Geografia","assunto":"Poluição plástica e desequilíbrio do ecossistema marinho","titulo":"Charge: sacola plástica no topo da cadeia alimentar marinha","gab":"C","base":null,"imgs":[{"src":"img/2025d2/q31_1.webp","w":783,"h":1273}],"alt":{"A":"à economia circular que visa a um posicionamento global sobre o consumo exacerbado dos recursos marinhos.","B":"ao instinto predador dos peixes na cadeia alimentar e que compromete a sustentabilidade da vida marinha.","C":"a ações degradantes sofridas pelos peixes e que fomentam o desequilíbrio do ecossistema marinho.","D":"à atividade extrativista da psicultura alinhada às boas práticas sustentáveis definidas pelo Tratado de Alto Mar.","E":"ao conjunto de ações ambientais para a defesa e o bem-estar da vida marinha sem prejuízo à extinção de espécies."},"res":"Ideia-chave: a charge usa a imagem da cadeia alimentar (o “peixe grande come peixe pequeno”) para mostrar quem está, de fato, no topo dela: a poluição produzida pelos seres humanos.\n\nLeitura da imagem: um peixe pequeno engole um ser menor, um peixe maior engole esse peixe e, por fim, uma sacola plástica de compras (com o desenho de um carrinho de supermercado) engole o peixe maior. A sacola ocupa o lugar do “predador final”.\n\nO que isso critica: o plástico descartado do consumo cotidiano chega ao mar e atinge os peixes, que ficam presos nele ou o ingerem. Os peixes sofrem, portanto, uma ação degradante de origem humana, e como toda a cadeia alimentar é afetada, o ecossistema marinho entra em desequilíbrio. É exatamente o que diz a alternativa C.\n\nRepare que a predação entre os peixes é natural e aparece só como moldura. O elemento estranho, que quebra a lógica da natureza, é a sacola.","pq":{"A":"Economia circular é um modelo de produção que reaproveita materiais para evitar o descarte, ou seja, seria uma solução, não o alvo da crítica. A charge denuncia o lixo plástico do consumo chegando ao mar, e não um “posicionamento global” sobre recursos marinhos.","B":"A predação entre peixes é natural e não ameaça a sustentabilidade do oceano; na charge, ela é só a moldura. O que quebra a lógica é a sacola plástica, de origem humana, ocupando o topo da cadeia.","C":"Correta: a sacola plástica que engole o peixe maior representa a poluição humana agredindo os peixes e, com eles, toda a cadeia alimentar, o que gera desequilíbrio no ecossistema marinho.","D":"Piscicultura (escrita “psicultura” na alternativa) é a criação de peixes em cativeiro, não uma atividade extrativista, e ela não aparece na charge. Além disso, a imagem denuncia um dano; não elogia “boas práticas sustentáveis” de tratado algum.","E":"A charge mostra o contrário de proteção: a vida marinha sendo engolida pelo plástico. Ela denuncia uma ameaça, não um conjunto de ações de defesa e bem-estar."},"dica":"Em charges ambientais, procure o elemento humano “fora do lugar” na natureza (aqui, a sacola no topo da cadeia alimentar): é ele que carrega a crítica.","dif":"fácil","nota":"","obs":""},{"id":"2025d2-32","n":32,"area":"Ciências Humanas","disc":"Geografia","assunto":"Cartografia – tipos de mapas temáticos","titulo":"Mapa de rios e cidades da região Norte: tipo de mapa temático","gab":"A","base":null,"imgs":[{"src":"img/2025d2/q32_1.webp","w":783,"h":1469}],"alt":{"A":"quantitativo.","B":"anamorfose.","C":"qualitativo.","D":"dinâmico.","E":"hipsométrico."},"res":"Ideia-chave: quando um mapa usa uma escala de tonalidades ordenada (do mais claro ao mais escuro) para indicar mais ou menos de um fenômeno, ele é um mapa temático quantitativo.\n\nObserve a legenda: “Vilas e Cidades” aparecem numa faixa de cor que vai do bege/amarelo-claro ao roxo-escuro, com uma seta apontando para o lado mais escuro. A seta mostra que a cor funciona como gradação: quanto mais escuro, maior a intensidade da ocupação urbana (mais vilas e cidades concentradas). No mapa, as manchas mais escuras acompanham as linhas dos rios e se adensam na porção leste da região, revelando que a rede urbana do Norte segue a rede hidrográfica.\n\nComo a variação de tom expressa uma ordem de grandeza (menos → mais), e não apenas tipos diferentes de coisa, o mapa é quantitativo: alternativa A. Um mapa qualitativo usaria cores distintas, sem hierarquia entre elas, só para separar categorias.","pq":{"A":"Correta: a legenda de “Vilas e Cidades” é uma escala de tons ordenada (do claro ao escuro, com seta), que expressa mais ou menos ocupação urbana. Representar gradação de grandeza é a característica do mapa quantitativo.","B":"Anamorfose é o mapa em que o tamanho dos territórios é deformado proporcionalmente a um dado (por exemplo, a população). Aqui o contorno da região Norte está preservado; só as cores variam.","C":"Mapa qualitativo distingue tipos ou categorias sem hierarquia, com cores diferentes para coisas diferentes (como tipos de vegetação). É a pegadinha: o mapa até separa água de cidades, mas o que o enunciado destaca são as “diferentes tonalidades” das áreas urbanas, que seguem uma ordem crescente, ou seja, indicam quantidade.","D":"Mapa dinâmico representa fluxos e movimentos (migrações, circulação de mercadorias), em geral com setas ou linhas de fluxo sobre o território. A seta da legenda só indica o sentido da escala de cor, não um deslocamento.","E":"Mapa hipsométrico representa as altitudes do relevo por faixas de cores. As cores deste mapa representam áreas urbanas, não altitude."},"dica":"Tons ordenados de uma mesma escala (claro → escuro) = quantitativo; cores diferentes sem hierarquia = qualitativo; setas de fluxo = dinâmico; território deformado = anamorfose; altitude em cores = hipsométrico.","dif":"média","nota":"","obs":""},{"id":"2025d2-33","n":33,"area":"Ciências Humanas","disc":"Sociologia","assunto":"Gênero – masculinidade e machismo","titulo":"Masculinidade e machismo na canção de Gonzaguinha “Um homem também chora”","gab":"C","base":null,"imgs":[{"src":"img/2025d2/q33_1.webp","w":783,"h":1427}],"alt":{"A":"a repressão emocional como parte da maturidade afetiva do homem.","B":"a valorização da força e do silêncio como virtudes naturais do homem.","C":"o sofrimento masculino causado pelas imposições do machismo.","D":"a perda do espaço masculino diante das conquistas femininas.","E":"o fim do patriarcado por meio do acolhimento familiar."},"res":"Ideia-chave: a canção desmonta o estereótipo de que “homem não chora” e mostra o peso que as cobranças sociais sobre a masculinidade colocam nos ombros do homem.\n\nVeja os versos:\n“Um homem também chora / Menina morena / Também deseja colo / Palavras amenas”: o homem aparece vulnerável, carente de afeto, contrariando a imagem do macho durão.\n“Guerreiro menino / Com a barra de seu tempo / Por sobre seus ombros”: ele é cobrado a ser “guerreiro” (forte, provedor, invencível), embora também seja “menino”; a “barra de seu tempo” é o fardo das exigências da sua época.\n“Eu vejo que ele berra / Eu vejo que ele sangra / A dor que tem no peito”: há sofrimento real.\n“Não dá pra ser feliz”: o resultado dessas imposições é a infelicidade.\n\nEssas cobranças (ser sempre forte, não demonstrar fragilidade) são justamente imposições do machismo, que também fazem os homens sofrerem. Por isso, a alternativa C.","pq":{"A":"A canção afirma o oposto: “Um homem também chora” e “Também deseja colo”. Ela legitima a expressão da emoção, em vez de tratar a repressão como sinal de maturidade.","B":"O homem da canção “berra”, “sangra” e chora; não é retratado como forte e silencioso. E o peso que ele carrega vem da “barra de seu tempo”, algo social e histórico, não uma virtude “natural”.","C":"Correta: a canção mostra um homem que sofre (“A dor que tem no peito”) por ser cobrado a ser “Guerreiro” e carregar “a barra de seu tempo”, isto é, as imposições do machismo, que o impedem de “ser feliz”.","D":"Não há nos versos nenhuma menção a conquistas femininas ou disputa de espaço. A “Menina morena” é a interlocutora do eu lírico, não uma rival, e a dor do homem vem das exigências feitas a ele.","E":"A canção termina com “Não dá pra ser feliz”, sem qualquer solução. O desejo de “colo” é uma carência, não a descrição do fim do patriarcado."},"dica":"“Homem não chora” é um estereótipo de gênero: textos que mostram o peso dessas cobranças sobre os homens tratam o machismo como algo que também os faz sofrer.","dif":"fácil","nota":"","obs":""},{"id":"2025d2-34","n":34,"area":"Ciências Humanas","disc":"Sociologia","assunto":"Max Weber – ação social","titulo":"Ação social de Max Weber nos atos do Dia Internacional da Mulher","gab":"B","base":null,"imgs":[{"src":"img/2025d2/q34_1.webp","w":781,"h":1075}],"alt":{"A":"mostram um comportamento imposto pelas condições materiais da vida.","B":"atribuem um sentido à sua ação e agem em relação a outras pessoas.","C":"protestam sem motivo definido e sem ligação com a realidade social.","D":"repetem um costume coletivo sem depender da consciência individual.","E":"agem de modo automático diante de pressões externas da sociedade."},"res":"Ideia-chave: para Max Weber, ação social é toda conduta à qual o indivíduo atribui um sentido (um significado subjetivo) e que está orientada pelo comportamento de outras pessoas.\n\nAplicando ao texto: as manifestantes foram às ruas “para reivindicar direitos, denunciar retrocessos e reforçar a luta pela igualdade de gênero”. Há, portanto, um sentido claro atribuído à ação; os motivos estão explícitos, como “a luta contra o feminicídio” no Brasil. Além disso, a ação se dirige a outros: à sociedade, ao poder público e às demais mulheres com quem se manifestam. Esses dois elementos, sentido + orientação para o outro, formam exatamente a definição weberiana, como diz a alternativa B.\n\nWeber constrói uma sociologia compreensiva: o sociólogo deve compreender o sentido que os próprios agentes dão às suas ações, em vez de tratá-las como efeito mecânico de forças externas. Por isso, alternativas que falam em comportamento “imposto”, “automático” ou “sem depender da consciência individual” se afastam dele.","pq":{"A":"Explicar o comportamento pelas condições materiais de vida é a perspectiva de Karl Marx (materialismo histórico), não a de Weber, que parte do sentido que o próprio indivíduo dá à sua ação.","B":"Correta: é a definição weberiana de ação social, conduta dotada de sentido para quem age e orientada pelo comportamento de outras pessoas, como as manifestantes que protestam por direitos dirigindo-se à sociedade.","C":"O texto deixa os motivos explícitos (“reivindicar direitos”, “luta contra o feminicídio”). E uma ação sem sentido nem seria ação social para Weber, já que o sentido é justamente o seu elemento central.","D":"Algo coletivo que existe independentemente da consciência individual lembra o fato social de Émile Durkheim (exterior, geral e coercitivo). Weber até fala em ação tradicional, movida pelo costume, mas o protesto descrito é deliberado e tem objetivos; não é repetição de hábito.","E":"Comportamento automático, sem um sentido atribuído por quem age, não é o que Weber chama de ação social. E reagir ao mesmo estímulo que os outros também não basta: em Economia e sociedade, ele cita pessoas que abrem o guarda-chuva ao mesmo tempo quando começa a chover, cada uma reagindo à chuva sem se orientar pelas demais. Já a pressão externa que molda o indivíduo remete à coerção do fato social de Durkheim."},"dica":"Weber = ação social com sentido e orientada para o outro; Durkheim = fato social exterior e coercitivo; Marx = comportamento explicado pelas condições materiais.","dif":"média","nota":"","obs":""},{"id":"2025d2-35","n":35,"area":"Ciências Humanas","disc":"Sociologia","assunto":"Desigualdade de gênero no mercado de trabalho","titulo":"Influenciadores digitais: mulheres são maioria, mas homens ganham mais","gab":"D","base":null,"imgs":[{"src":"img/2025d2/q35_1.webp","w":784,"h":1262}],"alt":{"A":"a tendência de superação das desigualdades de gênero nas faixas de entrada do mercado digital.","B":"a equivalência entre homens e mulheres nas faixas de menor renda.","C":"a projeção de igualdade econômica à medida que o número de influenciadoras cresce.","D":"a persistência das desigualdades estruturais que beneficiam os homens no topo da renda.","E":"a presença masculina mais expressiva nas faixas intermediárias de rendimento."},"res":"Ideia-chave: compare homens e mulheres faixa por faixa e veja para que lado a vantagem pende conforme a renda sobe.\n\nAté R$ 2 mil: mulheres 21,46% × homens 12,6% (elas mais concentradas na renda mais baixa).\nDe R$ 2 mil a R$ 5 mil: mulheres 31,42% × homens 28,4%.\nA partir de R$ 5 mil: homens 33,7% × mulheres 27,59%.\nAcima de R$ 50 mil: homens 3,2% × mulheres 1%.\n\nConferência: 3,2 ÷ 1 = 3,2, ou seja, na faixa mais alta a proporção de homens é mais que o triplo da de mulheres.\n\nEmbora as mulheres representem “70% dos criadores de conteúdo”, quanto maior a renda, maior a vantagem masculina: “os homens ainda concentram os maiores rendimentos”, e “a diferença se acentua” no topo. A palavra “ainda” indica continuidade: a desigualdade de gênero do mundo do trabalho se reproduz até num mercado novo e majoritariamente feminino. Isso caracteriza uma desigualdade estrutural que beneficia os homens no topo da renda: alternativa D.","pq":{"A":"Nas faixas de entrada as mulheres estão mais concentradas (21,46% ganham até R$ 2 mil, contra 12,6% dos homens). Isso não é superação da desigualdade; é a própria desigualdade aparecendo, com elas acumuladas nas rendas mais baixas.","B":"Não há equivalência: na faixa até R$ 2 mil, a proporção de mulheres (21,46%) é “quase o dobro” da de homens (12,6%).","C":"O texto mostra o contrário: mesmo sendo 70% dos criadores de conteúdo, as mulheres ganham menos. A maioria numérica não se converte em igualdade de renda, e os dados não fazem nenhuma projeção de futuro.","D":"Correta: quanto mais alta a faixa, maior a vantagem masculina (33,7% × 27,59% a partir de R$ 5 mil; 3,2% × 1% acima de R$ 50 mil), mesmo com as mulheres sendo maioria no setor, o que indica desigualdade estrutural.","E":"Na faixa intermediária (R$ 2 mil a R$ 5 mil), quem é maioria são as mulheres (31,42% contra 28,4%). A vantagem masculina só aparece a partir de R$ 5 mil, nas faixas mais altas."},"dica":"Em dados por faixa de renda, compare grupo a grupo e veja quem predomina no topo: é ali que a desigualdade estrutural costuma aparecer.","dif":"fácil","nota":"","obs":""},{"id":"2025d2-36","n":36,"area":"Ciências Humanas","disc":"Geografia","assunto":"Mudanças climáticas e economia – El Niño e produção de cacau","titulo":"El Niño, preço do cacau e consumo de chocolate","gab":"E","base":null,"imgs":[{"src":"img/2025d2/q36_1.webp","w":781,"h":1305}],"alt":{"A":"o crescimento do setor agrícola devido à valorização do cacau.","B":"o aumento do consumo de chocolate em períodos de calor.","C":"a intervenção dos governos para regular o preço do cacau.","D":"a expansão do cultivo de cacau para reduzir os efeitos da inflação.","E":"a relação entre crises ambientais e os impactos na produção e no consumo."},"res":"Ideia-chave: o texto encadeia causa e efeito, do clima até o bolso do consumidor.\n\nSiga a cadeia:\n1) Crise ambiental: “O fenômeno El Niño (...) causou um clima mais quente e mudanças nos padrões de chuva”, e os cacaueiros “são sensíveis às mudanças climáticas”.\n2) Impacto na produção: isso provoca “choques do lado da oferta”, isto é, colheitas menores.\n3) Impacto no consumo: como a demanda pelo cacau é “inelástica” no curto prazo (o mundo continua comprando mesmo com o preço mais alto), a oferta menor resulta “em picos de preços”. Daí a abertura do texto: “Os consumidores do chocolate em todo o mundo estão sendo atingidos pelos preços mais altos do cacau”.\n\nO excerto, portanto, mostra a relação entre uma crise ambiental e seus efeitos na produção e no consumo, como afirma a alternativa E. O próprio título da matéria reforça isso: “uma razão para se preocupar com as mudanças climáticas”.","pq":{"A":"O texto não fala em crescimento do setor; ao contrário, fala em “choques do lado da oferta”, isto é, queda na produção. O cacau ficou mais caro por escassez, não por expansão agrícola.","B":"O calor afeta os cacaueiros (a produção), não aumenta o consumo de chocolate. Os consumidores aparecem no texto como “atingidos pelos preços mais altos”, e não comprando mais.","C":"Não há qualquer menção a governos regulando preços. Quem explica a alta é um economista, apontando a combinação de oferta menor com demanda inelástica.","D":"O texto não menciona expansão do cultivo. A inflação aparece como um problema que os consumidores “já sofrem”, agravado pela alta do cacau, e não como algo que o plantio de cacau ajudaria a reduzir.","E":"Correta: o excerto liga a crise climática (El Niño, calor, chuvas irregulares) à queda da oferta de cacau e, em consequência, aos preços mais altos pagos pelos consumidores."},"dica":"Em textos de causa e consequência, monte a cadeia (clima → produção → preço → consumidor) e escolha a alternativa que resume a cadeia inteira.","dif":"fácil","nota":"","obs":""},{"id":"2025d2-37","n":37,"area":"Ciências Humanas","disc":"Sociologia","assunto":"Refugiados e espetacularização da tragédia","titulo":"Charge de Alireza Pakdel: naufrágio de refugiados exibido como aquário","gab":"C","base":null,"imgs":[{"src":"img/2025d2/q37_1.webp","w":783,"h":1777}],"alt":{"A":"a política internacional de portas abertas, apontada como responsável pelo agravamento das crises fronteiriças.","B":"o alarmismo infundado em torno da migração forçada, frequentemente alimentado por organizações internacionais com interesses ideológicos.","C":"a naturalização da tragédia dos refugiados e sua transformação em objeto de consumo estético e desumanizado.","D":"a crença de que a visibilidade conferida pelas redes sociais aos dramas migratórios gera automaticamente empatia e mobilização política.","E":"a narrativa humanitária que retrata refugiados como protagonistas resilientes, desconsiderando as estruturas de exclusão que os cercam."},"res":"Ideia-chave: a charge transforma um naufrágio de refugiados em atração de aquário para denunciar a indiferença de quem assiste à tragédia como se fosse um espetáculo.\n\nLeitura da imagem: um barco de madeira superlotado vira, e as pessoas afundam na água junto com seus perte
